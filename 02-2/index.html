<title>規管型國家 Part 2</title>

<style>
/* Layout: mobile-first full-screen lesson player — one idea per screen, Continue pinned to the bottom; a course path is home. */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --ink:#141A26; --muted:#5D6779; --line:#D9DEE8; --soft:#E9ECF3;
  --accent:#4B4FD9; --accent-ink:#FFFFFF; --accent-soft:#E6E7FB;
  --good:#1F9D62; --good-soft:#DFF4EA; --bad:#D2423A; --bad-soft:#FBE6E4; --warn:#B7790A;
  --cs:#4B4FD9; --cc:#E5A800; --aa:#D2423A;
  --f:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --card:#181E2A; --ink:#EAEDF4; --muted:#9AA4B6; --line:#2B3446; --soft:#202838;
  --accent:#8C90FF; --accent-ink:#0F131B; --accent-soft:#272B52; --good:#4FCB8D; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3A1F1D; --warn:#E9B949;
  --cs:#8C90FF; --cc:#E9B949; --aa:#F2766D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --card:#181E2A; --ink:#EAEDF4; --muted:#9AA4B6; --line:#2B3446; --soft:#202838;
  --accent:#8C90FF; --accent-ink:#0F131B; --accent-soft:#272B52; --good:#4FCB8D; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3A1F1D; --warn:#E9B949;
  --cs:#8C90FF; --cc:#E9B949; --aa:#F2766D; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{overflow:hidden;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mine{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle}

/* ---------- home / path ---------- */
.home{flex:1;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:.02em}
.pills{display:flex;gap:8px}
.pill{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.course{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line);margin-bottom:22px}
.course h1{font-size:24px;line-height:1.3;margin:4px 0 6px;font-weight:900;text-wrap:balance}
.course p{margin:0}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:10px 0 20px}
.path svg.line{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:220px}
.node:nth-child(odd){transform:translateX(-60px)} .node:nth-child(even){transform:translateX(60px)}
.dot{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;background:var(--soft);color:var(--muted);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.node.open .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.node.done .dot{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 6px 0 color-mix(in srgb,var(--good) 60%,#000)}
.node.open .dot{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.node .nm{font-weight:700;text-align:center;font-size:15.5px;line-height:1.35}
.node .sub{font-size:13px;color:var(--muted);text-align:center}
.node.locked{opacity:.55}
.review-btn{width:100%;margin-top:6px;background:var(--card);border:1.5px dashed var(--accent);color:var(--accent);border-radius:16px;padding:14px;font-weight:700}

/* ---------- lesson player ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .35s}
.xp{font-weight:900;font-size:15px;color:var(--warn);min-width:52px;text-align:right}
.screen{flex:1;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.screen h2{font-size:23px;line-height:1.35;margin:4px 0 0;font-weight:900;text-wrap:balance}
.screen p{margin:0}
.lead{font-size:17.5px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.big{font-size:44px;line-height:1}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:6px;animation:in .2s ease}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.hint{background:var(--accent-soft)}
.fb b.t{font-size:17px}
.src{font-size:12.5px;color:var(--muted)}
.foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;border-top:1px solid var(--line);background:var(--bg)}
.cta{flex:1;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:15px;font-weight:900;font-size:17px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.cta:disabled{background:var(--soft);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.cta.go{background:var(--good);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.deep{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0 14px;font-weight:700;font-size:14px;color:var(--muted);box-shadow:0 5px 0 var(--line)}
/* drawer */
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;max-height:78%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 8px;font-size:19px}
.sheet .nb{display:grid;gap:8px;font-size:15.5px}.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px}
/* widgets */
.wid{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.barrow{display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center;font-size:14.5px}
.barrow .track{height:22px;background:var(--soft);border-radius:8px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:8px;transition:width .2s}
.chart{width:100%;height:auto;display:block}
.task{font-weight:700;color:var(--accent);font-size:15px;display:flex;gap:8px;align-items:center}
.task.ok{color:var(--good)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--soft);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.nums b{display:block;font-family:var(--mono);font-size:19px;color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.tog{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.tog button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.flips{display:grid;gap:10px}
.flip{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 4px 0 var(--line);display:grid;gap:4px}
.flip .h{font-weight:900}.flip .b{color:var(--muted);font-size:15px}
.flip.open{border-color:var(--accent)}
.flip.open .b{color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;font-size:15px;text-align:left;box-shadow:0 4px 0 var(--line)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--good);background:var(--good-soft);opacity:.8}
.mt.err{animation:shake .3s;border-color:var(--bad)}
.rcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;min-height:210px;display:grid;align-content:center;gap:10px;box-shadow:0 5px 0 var(--line);text-align:left}
.rcard .q{font-size:21px;font-weight:900;line-height:1.4}
.rcard blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 10px;font-size:14px;color:var(--muted);font-style:italic}
/* complete */
.done-screen{flex:1;display:grid;place-items:center;text-align:center;padding:24px;gap:10px}
.done-screen .trophy{font-size:72px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.stat3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700}
.stat3 b{display:block;font-size:24px}
.take{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:6px;max-width:520px}
.take ul{margin:0;padding-left:20px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
/* sort screen */
.sortl{display:grid;gap:12px}
.si{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.si.done{border-color:var(--good)}
.si .st{font-weight:700}
.si .sc{display:flex;flex-wrap:wrap;gap:8px}
.sb{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14.5px;background:var(--bg);min-height:44px}
.sb.right{border-color:var(--good);background:var(--good-soft)}
.sb.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.si.done .sb:not(.right){opacity:.4}
.okline{color:var(--good);font-weight:700;font-size:14.5px}
.hintline{color:var(--accent);font-weight:700;font-size:14.5px}
.grp{z-index:1;font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.06em;background:var(--bg);padding:2px 10px;border-radius:8px}
button.pill{cursor:pointer}
/* sub pages (reading notes, cards, visuals, map) */
.pg{--surface:var(--card);--surface2:var(--soft);--area-cs:var(--cs);--area-c:var(--cc);--area-a:var(--aa);--f-display:var(--f);--r:16px}
.pg h2{font-size:22px;line-height:1.35;margin:4px 0;font-weight:900;text-wrap:balance}
.pg h3{font-size:18px;margin:0;line-height:1.35}
.pg p{margin:0}
.pg .lvhead{display:grid;gap:8px;margin-bottom:14px}
.pg .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.pg .stack{display:flex;flex-direction:column;gap:12px}
.pg .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pg .tabs{display:flex;flex-wrap:wrap;gap:6px}
.pg .tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700;min-height:36px}
.pg .tab.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pg .chip{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px;background:var(--card)}
.pg .chip.ok{color:var(--good);border-color:var(--good)}
.pg .links{gap:8px;margin-top:6px}
.pg .nbody{display:grid;gap:8px;font-size:16px}
.pg .nbody ul{margin:0;padding-left:20px;display:grid;gap:6px}
.pg .readchk{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.pg .readchk input{width:22px;height:22px}
.pg .tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--soft)}
.pg .btn{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.pg .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pg .btn.ghost{border-color:var(--line)}
.pg .btn.sm{padding:5px 12px;font-size:13.5px;min-height:36px}
.pg .progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.pg .progress i{display:block;height:100%;background:var(--good)}
.pg .fcard{min-height:240px;border:2px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:22px 18px;display:grid;align-items:center;cursor:pointer;margin-top:10px}
.pg .fcard.flip{border-color:var(--accent)}
.pg .fcard.done{cursor:default;text-align:center}
.pg .ff,.pg .fcard .fb{display:grid;gap:12px;background:none;padding:0;animation:none;border-radius:0}
.pg .fq{font-size:21px;font-weight:900;line-height:1.4}
.pg .fa{font-size:16.5px;font-weight:600}
.pg .fcard blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 10px;font-size:14px;color:var(--muted);font-style:italic}
.pg .vis{width:100%;height:auto;display:block;font-family:var(--f)}
.pg .viswrap{overflow-x:auto;margin-top:8px}
.pg .viswrap .vis{min-width:560px}
.pg .fo{font-size:12.5px;line-height:1.45;color:var(--ink);display:grid;gap:4px}
.pg .fo p{margin:0}.pg .fo.c{text-align:center}
.pg .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
.pg table.map{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.pg table.map th{text-align:left;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line)}
.pg table.map td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.pg table.map td.c{text-align:center}
.pg table.map tr.nh td{background:var(--soft)}
.pg table.map a{color:var(--ink)}
.pg .okb{font-size:12px;font-weight:700;color:var(--good);border:1.5px solid var(--good);border-radius:5px;padding:0 6px}
.pg .mono{font-family:var(--mono)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px">
 <form id="gf" style="display:grid;gap:12px;max-width:320px;width:100%;text-align:center">
  <div style="font-size:30px;font-weight:900">規管型國家 · 2</div>
  <label for="gp" class="muted">輸入密碼</label>
  <input id="gp" type="password" inputmode="numeric" autocomplete="current-password" style="font-size:22px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)">
  <button class="cta go" type="submit">入去</button>
  <p id="ge" style="color:var(--bad);min-height:1.4em"></p>
 </form></div>
<script>(function(){const H='d83036ffb5b49a153bc391fd12b4a10df06bbb200f39fed97c331b03b6833ce7',K='reglab-ok',g=document.getElementById('gate');
 try{if(localStorage.getItem(K)===H){g.remove();return;}}catch(e){}
 document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();
  const v=document.getElementById('gp').value.trim();
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const x=[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('');
  if(x===H){try{localStorage.setItem(K,H)}catch(e){} g.remove();} else document.getElementById('ge').textContent='密碼唔啱，再試一次';});
})();</script>

<script>
const CARDS_DATA=[{"id": 100, "n": "04", "s": 1, "t": "conceptual", "f": "規管型國家靠乜嘢方式運作，同干預型國家相反？", "b": "Majone 認為規管型國家依賴將權力大量授出畀獨立機構", "q": "the regulatory state relies on extensive delegation of powers to independent institutions", "loc": "Majone1999 p.1"}, {"id": 101, "n": "04", "s": 1, "t": "definition", "f": "「非多數決機構」係乜？", "b": "Majone 將非多數決機構界定為做公共職能、但唔直接向選民或民選代表負責嘅機構", "q": "institutions which fulfil public functions but are not directly accountable to the voters or to their elected representatives", "loc": "Majone1999 p.3"}, {"id": 102, "n": "04", "s": 1, "t": "cause", "f": "點解歐盟差唔多係一個純粹嘅規管型國家？", "b": "Majone 認為歐盟因為冇獨立收稅使錢嘅權力，冇得揀只能發展成差唔多純粹嘅規管型國家", "q": "lacking an independent power to tax and spend, the EC/EU had no alternative but to develop as an almost pure type of regulatory state", "loc": "Majone1999 p.2"}, {"id": 103, "n": "04", "s": 1, "t": "normative", "f": "獨立機構嘅民主正當性問題，Majone 主張點解決？", "b": "Majone 主張獨立監管機構嘅民主正當性問題，應該靠加強問責結構解決，而唔係靠限制監管者嘅獨立性", "q": "This article argues that such problems should be tackled not by limiting the independence of the regulators, but rather by strengthening the accountability structure.", "loc": "Majone1999 p.1"}, {"id": 104, "n": "04", "s": 2, "t": "evaluation", "f": "「政客唔夠專業」解唔解釋到點解要授權？", "b": "Majone 認為單靠認知因素（政客唔夠專業）解釋唔到點解要授權", "q": "Thus, delegation cannot be explained by cognitive factors alone.", "loc": "Majone1999 p.3"}, {"id": 105, "n": "04", "s": 2, "t": "cause", "f": "廣泛授權點樣幫立法者卸責？", "b": "Fiorina 認為廣泛授權令立法者唔單止避開做具體決定嘅麻煩，仲可以避開或者遮掩自己對最終決定後果嘅責任", "q": "legislators not only avoid the time and trouble of making specific decisions, they avoid or at best disguise their responsibility for the consequences of the decisions ultimately made", "loc": "Fiorina, in Majone1999 p.4"}, {"id": 106, "n": "04", "s": 2, "t": "cause", "f": "今日授權畀非多數決機構最主要嘅原因係乜？", "b": "Majone 認為今日將政策權授出畀非多數決機構最主要嘅原因，係需要作出可信嘅政策承諾", "q": "the need to achieve credible policy commitments", "loc": "Majone1999 p.4"}, {"id": 107, "n": "04", "s": 2, "t": "cause", "f": "點解公共政策天生缺乏可信性？", "b": "Majone 認為因為一屆立法機關或執政聯盟綁唔住下一屆，公共政策永遠可能被推翻，所以缺乏可信性", "q": "because a legislature or a majority coalition cannot bind a subsequent legislature or another coalition, public policies are always vulnerable to reneging and hence lack credibility", "loc": "Majone1999 p.4"}, {"id": 108, "n": "04", "s": 2, "t": "cause", "f": "冇可信嘅監管承諾，公用事業公司會點？", "b": "Majone 認為冇可信嘅監管承諾，公用事業公司就會拒絕投資，或者投資唔夠去滿足需求同維持現有基建", "q": "Hence, without a credible regulatory commitment, companies will refuse to invest, or will not invest enough to satisfy demand and to maintain the existing infrastructure.", "loc": "Majone1999 p.5"}, {"id": 109, "n": "04", "s": 2, "t": "cause", "f": "將監管權交畀歐盟委員會，對嚴格規例有乜影響？", "b": "Majone 認為將監管權授出畀歐盟委員會，會提高嚴格規例嘅可信性", "q": "Hence the delegation of regulatory powers to the European Commission will increase the credibility of stringent regulations.", "loc": "Majone1999 p.6"}, {"id": 110, "n": "04", "s": 3, "t": "conceptual", "f": "代理理論最關鍵嘅洞見係乜？", "b": "Majone 認為代理理論嘅關鍵洞見，係控制好大程度上係好制度設計嘅問題", "q": "the key insight of agency theory is that control is to a large extent a question of good institutional design", "loc": "Majone1999 p.7"}, {"id": 111, "n": "04", "s": 3, "t": "evaluation", "f": "民選委託人授權時，有乜嘢轉移唔到？點解咁重要？", "b": "Majone 認為民選委託人轉移唔到自己嘅正當性，而呢個正當性損失可以係最重要嘅代理成本", "q": "they cannot transfer their own legitimacy. This loss of legitimacy can be an important, in some cases the most important, 'agency cost'.", "loc": "Majone1999 p.7"}, {"id": 112, "n": "04", "s": 3, "t": "normative", "f": "歐盟超國家機構嘅正當性，可唔可以靠成員國代理得到？", "b": "Majone 認為歐盟嘅超國家機構唔可以靠成員國代理得到正當性，必須建立自己嘅自主正當性", "q": "the supranational institutions of the Union cannot be legitimated by proxy, but must establish their own autonomous legitimacy", "loc": "Majone1999 p.9"}, {"id": 113, "n": "04", "s": 4, "t": "evaluation", "f": "機構嘅獨立，Majone 點樣睇？", "b": "Majone 認為某程度獨立於直接政治或官僚控制係有用甚至必要，但唔應該喺理論上誇大現實中嘅獨立程度", "q": "a certain amount of independence from direct political or bureaucratic controls is useful, even necessary. However, it is important not to overstate in theory the degree of independence that exists in practice.", "loc": "Majone1999 p.9"}, {"id": 114, "n": "04", "s": 4, "t": "evaluation", "f": "美國監管者嘅獨立係咪教條式嘅？", "b": "Majone 認為美國監管者嘅獨立唔係教條，一直以各種方式受到約束同控制", "q": "the independence of American regulators, far from being a dogma, has always been constrained and controlled in various ways", "loc": "Majone1999 p.10"}, {"id": 115, "n": "04", "s": 4, "t": "conceptual", "f": "獨立於直接政治控制，等唔等於獨立於公共問責？", "b": "Majone 認為獨立於直接政治控制，唔等於獨立於公共問責", "q": "Thus, independence from direct political control does not mean independence from public accountability.", "loc": "Majone1999 p.11"}, {"id": 116, "n": "04", "s": 4, "t": "fact", "f": "歐洲監管機構同美國比，獨立性同問責點？", "b": "Majone 指出歐洲監管機構事實上同通常法律上嘅獨立性都低過美國機構，而且受較寬鬆嘅公共問責制度約束", "q": "European agencies have less independence, de facto and generally also de jure, than American agencies. At the same time, they are subject to a less stringent regime of public accountability.", "loc": "Majone1999 p.11"}, {"id": 117, "n": "04", "s": 4, "t": "fact", "f": "法國競爭委員會有乜權力缺陷？", "b": "Majone 指出法國競爭委員會（Conseil de la Concurrence）唔可以自行展開調查", "q": "The competition authority (Conseil de la Concurrence), for example, cannot initiate investigations", "loc": "Majone1999 p.11"}, {"id": 118, "n": "04", "s": 4, "t": "evaluation", "f": "機構獨立程度偏低，通常伴隨乜？", "b": "Majone 認為機構獨立程度偏低，通常伴隨住界定唔清楚嘅問責結構", "q": "a relatively low level of agency independence is generally accompanied by a poorly-specified structure of accountability", "loc": "Majone1999 p.12"}, {"id": 119, "n": "04", "s": 5, "t": "conceptual", "f": "Horn 嘅問責設計，第一個變數係乜？", "b": "Horn 嘅代理理論將「決定授出畀獨立代理人定由委託人自己做」列為問責設計嘅第一個變數", "q": "The extent to which decisions are delegated to an independent agent rather than taken by the principal himself", "loc": "Horn, in Majone1999 p.13"}, {"id": 120, "n": "04", "s": 5, "t": "normative", "f": "點樣令獨立同問責互補，而唔係對立？", "b": "Majone 認為按任務同制度環境明智咁揀設計變數嘅值，可以確保獨立同問責係互補而唔係對立嘅價值", "q": "will go a long way toward ensuring that independence and accountability are indeed complementary and mutually supporting, rather than antithetical, values", "loc": "Majone1999 p.14"}, {"id": 121, "n": "04", "s": 5, "t": "normative", "f": "改善透明同問責最簡單最有效嘅方法係乜？", "b": "Majone 認為改善透明度同問責最簡單最有效嘅方法，係要求監管者為決定說明理由", "q": "The simplest and most effective way of improving transparency and accountability is to require that regulators give reasons for their decisions.", "loc": "Majone1999 p.14"}, {"id": 122, "n": "04", "s": 5, "t": "normative", "f": "說理要求同公共問責係乜關係？", "b": "Majone 認為說理要求係公共問責嘅必要條件", "q": "Thus, the reason-giving requirement is a necessary condition for public accountability.", "loc": "Majone1999 p.14"}, {"id": 123, "n": "04", "s": 5, "t": "normative", "f": "點解要嚴格承諾特定政策目標？", "b": "Majone 認為嚴格承諾特定政策目標，係按結果問責所必需，而按結果問責係非多數決機構主要嘅正當性來源之一", "q": "A strict commitment to specific policy objectives is necessary in order to enforce accountability by results, which is one of the main sources of legitimation for non-majoritarian institutions.", "loc": "Majone1999 p.15"}, {"id": 124, "n": "04", "s": 6, "t": "normative", "f": "機構決定溢出效應重大時，價值衝突應該由邊個解決？", "b": "Majone 認為機構決定嘅溢出效應重大時，所引起嘅價值衝突只應該由要向選民負責嘅決策者解決", "q": "When such spillovers are significant, value conflicts ensue which only electorally accountable policy-makers should resolve.", "loc": "Majone1999 p.15"}, {"id": 125, "n": "04", "s": 6, "t": "normative", "f": "政治決定要唔理機構結論，要點樣做？", "b": "Majone 認為唔理會機構結論嘅政治決定，必須以透明方式、跟清楚界定而公開嘅程序作出", "q": "the political decision to disregard the conclusions of the agency must be taken in a transparent way, following well-defined and generally known procedures", "loc": "Majone1999 p.15"}, {"id": 126, "n": "04", "s": 6, "t": "normative", "f": "推翻機構決定太易或者太難，各有乜問題？", "b": "Majone 認為干預機構決定嘅代價太低會令機構唔獨立、提升唔到可信性，但政治干預太難就會嚴重損失正當性", "q": "If interference with agency decisions entails only negligible costs, the agency is not independent, and delegating powers to it cannot increase policy credibility; but if political intervention is too difficult there may be a serious loss of legitimacy.", "loc": "Majone1999 p.15"}, {"id": 127, "n": "04", "s": 6, "t": "fact", "f": "點解德國經濟部長好少推翻聯邦卡特爾局？", "b": "Majone 指出因為程序要求嚴格，德國經濟部長好少推翻聯邦卡特爾局嘅決定", "q": "Because of these strict procedural requirements, the Minister overrides the decisions of the Cartel Office only on rare occasions.", "loc": "Majone1999 p.15"}, {"id": 128, "n": "04", "s": 6, "t": "fact", "f": "民選政客點樣先推翻到歐洲央行嘅政策？", "b": "Majone 指出民選政客只能夠經一個極之艱難嘅程序推翻歐洲央行嘅政策", "q": "Thus electorally accountable politicians can override ECB's policies only through an extremely demanding procedure.", "loc": "Majone1999 p.16"}, {"id": 129, "n": "04", "s": 7, "t": "conceptual", "f": "Majone 點樣將歐盟民主赤字嘅論點分組？", "b": "Majone 按背後嘅正當性標準，將關於歐盟民主赤字嘅論點分成四組", "q": "It is analytically convenient to classify arguments about the democratic deficit into four groups according to the standards of legitimacy on which they rely", "loc": "Majone1999 p.17"}, {"id": 130, "n": "04", "s": 7, "t": "normative", "f": "為「全能國家」發展嘅正當性標準，可唔可以直接套用喺歐盟？", "b": "Majone 認為為控制可以無限收稅使錢嘅全能國家而發展出嚟嘅正當性同問責標準，唔可以直接套用喺權限同資源有限嘅歐盟", "q": "standards of legitimacy and accountability, historically developed to control an omnicompetent state with virtually unlimited powers to tax and spend, cannot be directly applied to a system of limited competences and resources such as the EU", "loc": "Majone1999 p.19"}, {"id": 131, "n": "04", "s": 7, "t": "conceptual", "f": "歐盟咁多非多數決特徵，最好點理解？", "b": "Majone 認為歐盟制度嘅非多數決特徵，最好理解為管理深層社會分歧嘅機制", "q": "Such features are best understood as mechanisms of cleavage management.", "loc": "Majone1999 p.19"}, {"id": 132, "n": "04", "s": 7, "t": "evaluation", "f": "字面意思嘅歐盟民主赤字，Majone 點評價？", "b": "Majone 認為字面意思嘅歐盟民主赤字本身係有民主理據嘅", "q": "we can only conclude that the democratic deficit, in the literal sense, is democratically justified", "loc": "Majone1999 p.21"}, {"id": 133, "n": "04", "s": 7, "t": "definition", "f": "較闊意思嘅民主赤字指乜？", "b": "Majone 將較闊意思嘅民主赤字界定為公共決策嘅缺陷：唔透明、參與不足、唔肯說理、濫用技術或行政酌情權、控制同問責機制不足", "q": "refers to such defects of public decision making as lack of transparency, insufficient public participation, unwillingness to give reasons, abuse of technical or administrative discretion, inadequate mechanisms of control and accountability", "loc": "Majone1999 p.21"}, {"id": 134, "n": "04", "s": 7, "t": "evaluation", "f": "用程序同實質標準量度，歐共體機構表現點？", "b": "Majone 認為用程序同實質標準量度，歐共體機構比國家層面嘅非多數決機構做得好", "q": "By such criteria, Community institutions compare favourably", "loc": "Majone1999 p.21"}, {"id": 135, "n": "04", "s": 7, "t": "normative", "f": "Majone 建議歐盟訂乜法？有乜好處？", "b": "Majone 認為為歐盟制定一部《行政程序法》，會畀歐共體一個獨特機會決定邊類規則最能令決策理性化", "q": "The enactment of an Administrative Procedure Act for the EU would provide the Community with a unique opportunity to decide what kind of rules are more likely to rationalise decision making", "loc": "Majone1999 p.22"}, {"id": 136, "n": "04", "s": 7, "t": "conceptual", "f": "非多數決機構嘅正當性，最終取決於乜？", "b": "Majone 認為非多數決機構嘅正當性，取決於佢哋能否令人相信並持續相信佢哋係最適合履行被託付職能嘅機構", "q": "the legitimacy of non-majoritarian institutions depends on their capacity to engender and maintain the belief that they are the most appropriate ones for the functions entrusted to them", "loc": "Majone1999 p.22"}, {"id": 137, "n": "05", "s": 1, "t": "fact", "f": "「競爭主管機關應該獨立」喺今日競爭法評論入面係乜地位？", "b": "Townley 指出競爭主管機關應該獨立，喺今日嘅競爭法評論入面已經係公認智慧", "q": "Many fervently believe in the independence of competition authorities; in fact, today it is received wisdom in competition law commentary.", "loc": "Townley2018Ch3 p.95"}, {"id": 138, "n": "05", "s": 1, "t": "cause", "f": "交畀獨立 NCA 嘅權力越多，有乜後果？", "b": "Townley 認為交畀獨立競爭主管機關嘅權力越多，政客、政府同最終消費者就越難左右佢嘅工作方式", "q": "The more power that we give to independent NCAs in relation to competition policy, the less ability politicians, governments and ultimately consumers have to steer the way in which they work.", "loc": "Townley2018Ch3 p.95"}, {"id": 139, "n": "05", "s": 1, "t": "evaluation", "f": "獨立會唔會改善 NCA 嘅效能或效率？", "b": "Townley 認為冇乜證據顯示獨立會改善競爭主管機關嘅效能或效率", "q": "it finds little evidence that independence improves NCA effectiveness or efficiency", "loc": "Townley2018Ch3 p.98"}, {"id": 140, "n": "05", "s": 1, "t": "evaluation", "f": "點解獨立可能威脅 NCA 工作嘅正當性？", "b": "Townley 認為因為競爭法高度涉及再分配，獨立可能嚴重威脅競爭主管機關工作嘅正當性", "q": "given the highly re-distributive nature of this area of law, independence can seriously threaten the legitimacy of an NCA’s work", "loc": "Townley2018Ch3 p.98"}, {"id": 141, "n": "05", "s": 1, "t": "normative", "f": "Townley 個人點睇 NCA 獨立？", "b": "Townley 個人唔贊成咁高程度嘅競爭主管機關獨立，連競爭法執法都包括在內", "q": "Personally, I am not in favour of so much NCA independence (even in competition enforcement).", "loc": "Townley2018Ch3 p.98"}, {"id": 142, "n": "05", "s": 2, "t": "definition", "f": "Townley 點樣界定 NCA 嘅獨立？", "b": "Townley 將競爭主管機關嘅獨立界定為佢喺授權範圍內履行角色時免受外來干預嘅自由", "q": "Freedom from outside interference that affects the NCA, when undertaking roles within the limits of its mandate.", "loc": "Townley2018Ch3 p.99"}, {"id": 143, "n": "05", "s": 2, "t": "conceptual", "f": "研究上點樣區分兩種獨立？", "b": "Townley 指出研究上會區分正式獨立同實際獨立", "q": "We sometimes distinguish between formal and actual independence", "loc": "Townley2018Ch3 p.101"}, {"id": 144, "n": "05", "s": 2, "t": "conceptual", "f": "Ottow 列嘅 NCA 第四同第五個角色係乜？", "b": "Ottow 將預防（處理併購）同壓制（執行競爭規則）列為競爭主管機關五個角色嘅第四同第五個", "q": "The fourth and fifth roles are prevention (applying the merger rules) and repressive (enforcing the competition rules, eg, Articles 101 and 102 TFEU).", "loc": "Ottow, in Townley2018Ch3 p.99"}, {"id": 145, "n": "05", "s": 2, "t": "conceptual", "f": "NCA 將競爭規則用落個案時，只係執法者嗎？", "b": "Guidi 認為歐盟委員會或競爭機關每次將歐盟競爭規則用落個案，都係政策制定者而唔止係執法者", "q": "Commission or competition agencies apply EU competition rules to a single case, they act as policy-makers, not just policy-enforcers", "loc": "Guidi, in Townley2018Ch3 p.100"}, {"id": 146, "n": "05", "s": 2, "t": "conceptual", "f": "NCA 每個角色有乜共通點？", "b": "Townley 認為競爭主管機關每個角色都有重大再分配成分，所作嘅選擇會產生贏家同輸家", "q": "Each NCA role has a major re-distributive element; the choices made produce winners and losers.", "loc": "Townley2018Ch3 p.101"}, {"id": 147, "n": "05", "s": 2, "t": "evaluation", "f": "同大企業比，消費者對 NCA 有幾大影響力？", "b": "Townley 認為同大企業比，消費者（往往係競爭法原本嘅受益人）對競爭主管機關冇乜權力同影響力", "q": "relative to large, powerful firms, consumers (often the intended beneficiaries of competition law) have little power and influence", "loc": "Townley2018Ch3 p.104"}, {"id": 148, "n": "05", "s": 2, "t": "evaluation", "f": "政策網絡係咪中性？", "b": "Townley 認為政策網絡雖然成日被描述成中性，其實係偏袒某啲世界觀同利益、排斥外人嘅政治結構", "q": "Policy networks are often portrayed neutrally, but they are political structures, privileging certain worldviews and interests over others and disempowering outsiders", "loc": "Townley2018Ch3 p.105"}, {"id": 149, "n": "05", "s": 3, "t": "normative", "f": "民主國家對高度再分配政策嘅標準立場係乜？", "b": "Townley 指出民主國家嘅標準立場係：高度再分配嘅政策（包括競爭政策同執法）需要多數決控制", "q": "The standard position in democracies is that highly re-distributive policies (of which competition policy and enforcement is an example – see above) require majoritarian control.", "loc": "Townley2018Ch3 p.106"}, {"id": 150, "n": "05", "s": 3, "t": "normative", "f": "Shapiro 話要正當化非民主決策機構需要乜？", "b": "Shapiro 認為要向民主國家公民證明非民主決策機構合理，需要極之特殊嘅情況", "q": "It takes extremely exceptional circumstances to justify non-democratic policy-making agencies to the citizens of democratic polities.", "loc": "Shapiro, in Townley2018Ch3 p.106"}, {"id": 151, "n": "05", "s": 3, "t": "evaluation", "f": "用自由民主定審議民主模式睇，獨立 NCA 對民主問責有乜影響？", "b": "Townley 認為無論用自由民主定審議民主模式睇，獨立競爭主管機關都會削弱民主問責", "q": "Independent competition authorities undermine democratic accountability under both democratic models.", "loc": "Townley2018Ch3 p.109"}, {"id": 152, "n": "05", "s": 3, "t": "evaluation", "f": "喺歐盟層面統一定同執行嘅競爭政策，有乜問題？", "b": "Townley 認為喺歐盟層面定、用越嚟越統一嘅程序同機構執行嘅競爭政策，好難反映各成員國不同嘅偏好", "q": "So, a uniform competition policy set at the EU level and enforced by increasingly uniform procedural rules and institutional structures (see Chapter 9) seems unlikely to reflect myriad national preferences.", "loc": "Townley2018Ch3 p.110"}, {"id": 153, "n": "05", "s": 3, "t": "conceptual", "f": "如果經濟制度內部協調對表現重要，對 NCA 獨立程度有乜含意？", "b": "Townley 認為如果經濟制度內部協調對經濟表現重要，咁唔同程度嘅競爭主管機關獨立可能係有價值嘅", "q": "If system coherence is important for enhanced economic performance, then varying degrees of independence may be valuable.", "loc": "Townley2018Ch3 p.112"}, {"id": 154, "n": "05", "s": 3, "t": "conceptual", "f": "點解一種（同一個份量嘅）獨立唔會適合所有國家？", "b": "Townley 認為授權係政治行為，所以一種同一個份量嘅獨立唔會適合所有國家", "q": "After all, delegation is a political act, and so it is unlikely that one type (and amount) of independence fits all.", "loc": "Townley2018Ch3 p.145"}, {"id": 155, "n": "05", "s": 4, "t": "normative", "f": "Majone（1996）話效率政策靠乜取得正當性？", "b": "Majone（1996）認為效率政策基本上靠佢達到嘅結果取得正當性", "q": "efficient policies are basically legitimated by the results they achieve", "loc": "Majone, in Townley2018Ch3 p.116"}, {"id": 156, "n": "05", "s": 4, "t": "normative", "f": "管治結構為我哋利益做事，係咪足以令佢正當？", "b": "Townley 認為管治結構為我哋嘅利益做事，唔足以令佢被視為正當", "q": "It is not enough that governance structures act in our interests for them to be considered legitimate.", "loc": "Townley2018Ch3 p.117"}, {"id": 157, "n": "05", "s": 4, "t": "evaluation", "f": "競爭案件嘅輸家，會唔會同意結果係帕累托效率？", "b": "Townley 認為競爭案件同決定入面嘅輸家唔會同意結果係帕累托效率嘅", "q": "The losers in competition cases and decisions will not agree it is Pareto-efficient.", "loc": "Townley2018Ch3 p.118"}, {"id": 158, "n": "05", "s": 4, "t": "evaluation", "f": "競爭政策嘅產出容唔容易量度？", "b": "Townley 認為競爭政策嘅產出好難有信心咁量度", "q": "it is hard to measure the outputs of competition policy with any confidence", "loc": "Townley2018Ch3 p.118"}, {"id": 159, "n": "05", "s": 4, "t": "evaluation", "f": "Townley 點評價 Majone 嘅「產出正當性已經足夠」論點？", "b": "Townley 認為 Majone「產出正當性對競爭政策同執法已經足夠」嘅論點，唔獲佢自己嘅理論框架支持", "q": "To my mind, Majone’s argument that output legitimacy is sufficient for competition policy and enforcement is not supported by the theoretical framework he provides.", "loc": "Townley2018Ch3 p.119"}, {"id": 160, "n": "05", "s": 4, "t": "fact", "f": "歐盟競爭法有冇清晰目標？", "b": "Townley 認為歐盟競爭法冇清晰目標", "q": "Unfortunately, EU competition law has no clear goals.", "loc": "Townley2018Ch3 p.124"}, {"id": 161, "n": "05", "s": 4, "t": "conceptual", "f": "目標唔清晰時，問責會點樣變？", "b": "Townley 認為目標唔清晰時，問責會由確保競爭主管機關做政客想做嘅嘢，變成要佢解釋同證明自己嘅行為，等政客明白同評估", "q": "accountability may become less about ensuring that the NCA does what politicians want and more about getting the NCA to explain and justify its behaviour, so that politicians can better understand and evaluate its work", "loc": "Townley2018Ch3 p.124"}, {"id": 162, "n": "05", "s": 4, "t": "evaluation", "f": "「執法只需要透明加法院監督」點解唔符合政治學文獻？", "b": "Townley 認為「執法只需要透明同法院監督」嘅講法唔符合政治學文獻，因為文獻仲要求狹窄目標同制裁不當行使酌情權嘅能力", "q": "As far as EU law is concerned, this is not in line with the political science literature, which also demands narrow goals and an ability to sanction the inappropriate use of discretion.", "loc": "Townley2018Ch3 p.126"}, {"id": 163, "n": "05", "s": 4, "t": "normative", "f": "Townley 認為問責要有乜先夠？", "b": "Townley 認為問責雖然重要，但需要政治制裁", "q": "Accountability is important, but it demands political sanctions.", "loc": "Townley2018Ch3 p.129"}, {"id": 164, "n": "05", "s": 5, "t": "fact", "f": "Hanretty 同 Koop 發現獨立同問責對監管決策質素有乜影響？", "b": "Hanretty 同 Koop 用 GCR 評分研究 OECD 國家，發現獨立同問責對監管決策質素有正面而顯著嘅影響", "q": "our findings so far indicate that independence and accountability have a positive and significant effect on the quality of regulatory policy-making", "loc": "Hanretty and Koop, in Townley2018Ch3 p.133"}, {"id": 165, "n": "05", "s": 5, "t": "fact", "f": "Guidi 發現 NCA 獨立對外來直接投資同物價有乜影響？", "b": "Guidi 發現競爭主管機關嘅獨立對外來直接投資或消費物價指數冇顯著影響", "q": "the independence of NCAs does not have a significant impact on either foreign direct investment or consumer price index", "loc": "Guidi, in Townley2018Ch3 p.133"}, {"id": 166, "n": "05", "s": 5, "t": "evaluation", "f": "效能同正式獨立之間嘅實證關係點？", "b": "Townley 認為效能同正式獨立之間關係嘅實證證據最多只係含糊", "q": "The empirical evidence on the relationship between effectiveness and formal independence is, at best, ambiguous.", "loc": "Townley2018Ch3 p.133"}, {"id": 167, "n": "05", "s": 5, "t": "evaluation", "f": "喺競爭政策綁住自己，對企業投資決定有幾重要？", "b": "Townley 認為好難相信政客喺競爭政策上綁住自己，對企業嘅投資決定特別重要", "q": "it is hard to believe that tying their hands in relation to competition policy is particularly important for firms’ investment decisions", "loc": "Townley2018Ch3 p.135"}, {"id": 168, "n": "05", "s": 5, "t": "cause", "f": "獨立於政治，會唔會仍然出現勾結？", "b": "Guidi 認為獨立於政治，仍然可以產生監管者同被監管者之間嘅勾結", "q": "independence from politics can still produce collusion between regulator and regulate", "loc": "Guidi, in Townley2018Ch3 p.136"}, {"id": 169, "n": "05", "s": 5, "t": "fact", "f": "Gilardi 發現邊類監管者獲得最多正式獨立？", "b": "Gilardi 發現公用事業監管者獲得嘅正式獨立多過其他經濟監管者，而其他經濟監管者又多過社會監管者", "q": "utility regulators were given more independence than other economic regulators, who in turn had more independence than social regulators", "loc": "Gilardi, in Townley2018Ch3 p.137"}, {"id": 170, "n": "05", "s": 5, "t": "evaluation", "f": "Monti 點樣回應「競爭機關只睇競爭效果先有比較優勢」？", "b": "Monti 認為如果競爭主管機關基於非競爭理由嘅選擇有充分理由並同政府政策一致，就冇理由話佢只睇競爭效果先有比較優勢", "q": "then there is no reason to conclude that a competition authority has a comparative advantage in looking exclusively at the effects on competition", "loc": "Monti, in Townley2018Ch3 p.140"}, {"id": 171, "n": "05", "s": 6, "t": "evaluation", "f": "NCA 工作嘅價值取向同再分配含意，切唔切割得出嚟？", "b": "Townley 認為競爭主管機關工作嘅價值取向同再分配含意係切割唔出嚟嘅", "q": "The value-laden nature of the NCA’s task (although it may reduce it a bit) or its re-distributive implications cannot be carved out.", "loc": "Townley2018Ch3 p.141"}, {"id": 172, "n": "05", "s": 6, "t": "cause", "f": "完全自主嘅競爭機關做倡議有乜困難？", "b": "Kovacic 同 Winerman 認為一個完全自主嘅競爭機關，好難建立做有效倡議者所需嘅政治關係", "q": "A completely autonomous competition agency is unlikely to build the political relationships needed to serve as an effective advocate", "loc": "Kovacic and Winerman, in Townley2018Ch3 p.142"}, {"id": 173, "n": "05", "s": 6, "t": "evaluation", "f": "同一個獨立代理人可唔可以有真正嘅審議？", "b": "Townley 認為同一個獨立嘅代理人似乎冇可能有真正嘅審議", "q": "It does not seem possible to have true deliberation with an independent agent", "loc": "Townley2018Ch3 p.143"}, {"id": 174, "n": "05", "s": 7, "t": "normative", "f": "Townley 最終主張點樣處理 NCA 獨立？", "b": "Townley 主張大幅減少競爭主管機關嘅獨立，連競爭執法都包括在內", "q": "I favour significantly reducing NCA independence, even in competition enforcement.", "loc": "Townley2018Ch3 p.129"}, {"id": 175, "n": "05", "s": 7, "t": "action", "f": "Townley 建議 NCA 做乜評估？要記住乜？", "b": "Townley 建議由競爭主管機關做「純」競爭評估，並承認呢啲評估本身仍然係再分配", "q": "An effective way of doing this is for NCAs to produce ‘pure’ competition assessments – remembering that these are still re-distributive", "loc": "Townley2018Ch3 p.129"}, {"id": 176, "n": "05", "s": 7, "t": "evaluation", "f": "Townley 批評而家點樣處理再分配問題？", "b": "Townley 認為而家有人用技術官僚嘅外衣隱藏同遮掩再分配問題", "q": "The need for this is currently undermined by efforts to hide and disguise re-distributive issues under a technocratic cloak.", "loc": "Townley2018Ch3 p.129"}, {"id": 177, "n": "05", "s": 7, "t": "evaluation", "f": "喺競爭法同政策，產出正當性補唔補到輸入正當性？", "b": "Townley 認為喺競爭法同政策，好難用產出正當性彌補輸入正當性嘅不足", "q": "To my mind, it is hard to recover from a lack of input legitimacy through output legitimacy here.", "loc": "Townley2018Ch3 p.146"}, {"id": 208, "n": "07", "s": 1, "t": "evaluation", "f": "歐洲授權嘅特徵，淨係靠政客面對嘅壓力同好處解釋得晒嗎？", "b": "Thatcher 認為歐洲授權畀獨立監管機構嘅好多特徵，唔可以淨係靠民選政客面對嘅壓力同機構帶畀佢哋嘅好處去解釋", "q": "many features of delegation to IRAs cannot be explained by a simple analysis of pressures on elected policy makers and the advantageous functions that agencies performed for them", "loc": "Thatcher2002 p.125"}, {"id": 209, "n": "07", "s": 1, "t": "definition", "f": "Thatcher 對獨立監管機構嘅三個最低要求係乜？", "b": "Thatcher 對獨立監管機構嘅三個最低要求，係有公法下嘅權責、組織上同部門分開、唔係直選亦唔由民選官員管理", "q": "the agency has its own powers and responsibilities under public law; it is organisationally separated from ministries; it is neither directly elected nor managed by elected officials", "loc": "Thatcher2002 p.127"}, {"id": 210, "n": "07", "s": 1, "t": "conceptual", "f": "Thatcher 嘅第一類獨立監管機構係乜？", "b": "Thatcher 將獨立監管機構分為兩類，第一類係監管市場運作嘅機構", "q": "Two broad groups can be distinguished. The first are agencies regulating the operation of markets.", "loc": "Thatcher2002 p.126"}, {"id": 211, "n": "07", "s": 1, "t": "conceptual", "f": "Thatcher 嘅第二類獨立監管機構係乜？", "b": "Thatcher 嘅第二類獨立監管機構，係推動競爭以外公共利益目標嘅機構", "q": "The second group is responsible for promoting ‘public interest’ goals other than competition.", "loc": "Thatcher2002 p.126"}, {"id": 212, "n": "07", "s": 1, "t": "fact", "f": "英、法、德、意四國之中，邊類監管機構擴散得較廣？", "b": "Thatcher 發現喺英、法、德、意四國，市場監管機構擴散得廣過公共利益監管機構", "q": "market regulation agencies have spread more widely than public interest regulators", "loc": "Thatcher2002 p.127"}, {"id": 213, "n": "07", "s": 1, "t": "conceptual", "f": "點解獨立監管機構極難定義？", "b": "Thatcher 認為因為機構差異大，獨立監管機構極難定義", "q": "Defining an ‘independent regulatory agency’ is exceedingly difficult, given the diversity of agencies.", "loc": "Thatcher2002 p.126"}, {"id": 214, "n": "07", "s": 1, "t": "fact", "f": "所謂獨立監管機構，係咪全部都完全獨立？", "b": "Thatcher 指出所謂獨立監管機構，包括好多對議會同政府只係半獨立嘅機構", "q": "Thus ‘independent’ agencies include many bodies which are ‘semi-independent’ from legislatures and governments", "loc": "Thatcher2002 p.129"}, {"id": 215, "n": "07", "s": 2, "t": "cause", "f": "委託代理模型認為獨立監管機構最重要嘅功能係乜？", "b": "委託代理模型認為獨立監管機構最重要嘅功能係加強可信承諾", "q": "The most important function of agencies is to enhance credible commitment.", "loc": "principal–agent models, in Thatcher2002 p.130"}, {"id": 216, "n": "07", "s": 2, "t": "cause", "f": "獨立監管機構點樣幫政客處理唔受歡迎嘅決定？", "b": "Thatcher 認為獨立監管機構令民選政客可以將唔受歡迎決定嘅責任推開", "q": "IRAs allowed them to shift blame for decisions.", "loc": "Thatcher2002 p.131"}, {"id": 217, "n": "07", "s": 2, "t": "cause", "f": "監管技術化點樣推動授權？", "b": "Thatcher 認為監管技術化令民選政客更願意將技術性政策制定同執行交畀機構", "q": "Delegation to agencies of ‘unsexy’ technical policy making and implementation functions became more attractive to elected politicians (and their generalist civil servants).", "loc": "Thatcher2002 p.132"}, {"id": 218, "n": "07", "s": 2, "t": "fact", "f": "私有化同設立獨立監管機構有乜關係？", "b": "Thatcher 指出差唔多所有私有化都伴隨設立獨立監管機構，令政府對投資者嘅承諾更可信、賣盤收入更高", "q": "Almost all privatisations have been accompanied by the creation of IRAs, allowing government to provide more credible commitments to investors and hence boost their revenues from the sales.", "loc": "Thatcher2002 p.132"}, {"id": 219, "n": "07", "s": 2, "t": "cause", "f": "面對歐盟要求，獨立監管機構幫到各國政府乜？", "b": "Thatcher 認為面對歐盟要求，授權畀獨立監管機構令各國政府可以卸走爭議、甩走難搞嘅執行決定，同提供對布魯塞爾嘅對口", "q": "Faced with EU demands, delegation to IRAs has had many advantages for national governments, notably offloading controversy, shedding difficult implementation decisions and ensuring an interlocutor for Brussels.", "loc": "Thatcher2002 p.133"}, {"id": 220, "n": "07", "s": 2, "t": "evaluation", "f": "喺種族同性別平等等領域，授權有乜特點？", "b": "Thatcher 認為喺種族同性別平等等領域，立法機關可能只係想卸責，授權因此可能比較象徵式", "q": "Here legislatures may have wished to shift blame and hence delegation may have been more symbolic", "loc": "Thatcher2002 p.134"}, {"id": 221, "n": "07", "s": 3, "t": "evaluation", "f": "功能優勢夠唔夠解釋 1980、90 年代西歐獨立監管機構嘅格局？", "b": "Thatcher 認為授權嘅功能優勢唔夠解釋 1980、90 年代西歐獨立監管機構嘅格局", "q": "Nevertheless, they are insufficient to explain the patterns seen in Western Europe in the 1980s and 1990s.", "loc": "Thatcher2002 p.134"}, {"id": 222, "n": "07", "s": 3, "t": "conceptual", "f": "民選官員面對嘅功能壓力，一定要靠授權畀獨立機構應付嗎？", "b": "Thatcher 認為民選官員面對嘅好多功能壓力，本來可以用授權畀獨立監管機構以外嘅制度改革應付", "q": "several of the functional pressures on elected officials could have been met through institutional reforms other than delegation to IRAs", "loc": "Thatcher2002 p.134"}, {"id": 223, "n": "07", "s": 3, "t": "fact", "f": "法國同意大利嘅可信承諾問題同授權程度，有乜矛盾？", "b": "Thatcher 發現法國同意大利嘅可信承諾問題大過英國同德國，但授權畀行業監管者嘅權力反而更少", "q": "although France and Italy faced more significant problems of credible commitment than Britain and Germany given their traditions of political intervention and instability, they have delegated fewer powers to their sectoral regulators", "loc": "Thatcher2002 p.135"}, {"id": 224, "n": "07", "s": 3, "t": "fact", "f": "有冇單一嘅歐洲獨立監管機構模式？", "b": "Thatcher 發現獨立監管機構嘅人數同揀人程序各國唔同，冇單一歐洲模式", "q": "there is no one ‘European model’", "loc": "Thatcher2002 p.135"}, {"id": 225, "n": "07", "s": 3, "t": "evaluation", "f": "功能優勢同設立獨立監管機構之間，有冇自動連繫？", "b": "Thatcher 認為授權嘅功能優勢同設立獨立監管機構之間冇自動嘅連繫", "q": "there is no automatic link between functional advantages of delegation and the creation of IRAs", "loc": "Thatcher2002 p.136"}, {"id": 226, "n": "07", "s": 3, "t": "normative", "f": "「揀授權畀獨立機構」呢個回應，應該點樣對待？", "b": "Thatcher 認為揀授權畀獨立監管機構呢個回應要解釋，唔可以當咗係理所當然", "q": "the choice of delegation as a response must be explained rather than assumed", "loc": "Thatcher2002 p.136"}, {"id": 227, "n": "07", "s": 4, "t": "conceptual", "f": "Thatcher 用邊四個脈絡因素解釋授權差異？", "b": "Thatcher 用四個脈絡因素解釋授權差異：政策學習同制度同形、國家傳統同結構、政治領導、西歐國家更廣嘅制度脈絡", "q": "Four factors are examined here: policy learning and institutional isomorphism; state traditions and structures in regulation; political leadership; the broader institutional context of West European states.", "loc": "Thatcher2002 p.136"}, {"id": 228, "n": "07", "s": 4, "t": "fact", "f": "一個獨立監管機構模式，會唔會被抄去功能理由好唔同嘅行業？", "b": "Thatcher 發現就算行業特徵同授權嘅功能理由差好遠，獨立監管機構嘅模式都照被抄去其他行業", "q": "Copying took place despite considerable contrasts in the features of the sectors and hence functional reasons for delegation to IRAs.", "loc": "Thatcher2002 p.136"}, {"id": 229, "n": "07", "s": 4, "t": "cause", "f": "法國點解長期懷疑獨立機構？", "b": "Thatcher 認為法國長期懷疑獨立機構，怕佢哋唔係真獨立或者會分裂國家嘅統一", "q": "In France there existed a long-standing suspicion of ‘independent’ agencies that would either not be properly independent or which fragmented the unity of the state", "loc": "Thatcher2002 p.137"}, {"id": 230, "n": "07", "s": 4, "t": "cause", "f": "多黨制同多個否決點，令國家揀乜機構形式？", "b": "Thatcher 認為多黨制同多個否決點令大部分國家揀一種令幾個政黨同角色都有代表嘅機構形式", "q": "multi-partyism and multiple veto points (for instance, between heads of governments and presidents, or between the two legislative chambers) have encouraged an agency form that ensures representation for several parties and players", "loc": "Thatcher2002 p.138"}, {"id": 231, "n": "07", "s": 4, "t": "cause", "f": "新公共管理同設立獨立監管機構有乜關係？", "b": "Thatcher 認為新公共管理教條傳播得越廣，設立嘅獨立監管機構就越多", "q": "the greater the spread of new public management doctrines, the more agencies were created", "loc": "Thatcher2002 p.139"}, {"id": 232, "n": "07", "s": 5, "t": "fact", "f": "對獨立監管機構嘅正式事後控制用得多唔多？", "b": "Thatcher 發現對獨立監管機構嘅正式事後控制好少用，尤其係競爭監管機構", "q": "Ex post formal controls have rarely been used, especially in agencies regulating competition", "loc": "Thatcher2002 p.139"}, {"id": 233, "n": "07", "s": 5, "t": "fact", "f": "政府同議會實際上點樣控制獨立監管機構？", "b": "Thatcher 發現政府同議會控制獨立監管機構，通常靠較非正式嘅影響網絡同連繫", "q": "less formal networks of influence and linkages are the usual means whereby governments and legislatures have sought to control their agents", "loc": "Thatcher2002 p.139"}, {"id": 234, "n": "07", "s": 5, "t": "fact", "f": "獨立監管機構嘅權力隨時間點樣變？", "b": "Thatcher 發現獨立監管機構隨時間傾向獲得更多權力同重要性", "q": "Agencies have tended to gain power and importance.", "loc": "Thatcher2002 p.140"}, {"id": 235, "n": "07", "s": 5, "t": "fact", "f": "Oftel 原本點樣設計？結果點？", "b": "Thatcher 指出英國電訊監管機構 Oftel 原本設計成臨時安排，17 年後仍然運作良好", "q": "Thus the British telecommunications regulator Oftel was designed as a temporary measure to ‘hold the fort’ until competition arrived; 17 years later it is still going strong.", "loc": "Thatcher2002 p.140"}, {"id": 236, "n": "07", "s": 5, "t": "fact", "f": "推動競爭喺 Oftel 等機構嘅職責入面點樣變？", "b": "Thatcher 指出英國法例原本只將推動競爭列為 Oftel 等機構嘅次要職責，但機構將佢變成首要目標", "q": "in the original statutes, advancing competition was only a secondary duty in legislation creating agencies such as Oftel; yet they made it their primary aim", "loc": "Thatcher2002 p.141"}, {"id": 237, "n": "07", "s": 6, "t": "evaluation", "f": "有自己政策權力嘅獨立機構，對傳統西歐問責模式有乜挑戰？", "b": "Thatcher 認為有自己政策權力嘅獨立機構，對以議會為中心嘅傳統西歐問責模式構成問題", "q": "Independent agencies with their own policy making powers pose problems for traditional West European models of accountability centred on legislatures that can be held to account by the electorate.", "loc": "Thatcher2002 p.141"}, {"id": 238, "n": "07", "s": 6, "t": "normative", "f": "評價獨立監管機構嘅問責，應該同乜比較？", "b": "Thatcher 認為評價獨立監管機構嘅問責，要同之前嘅制度安排比較", "q": "the new institutional arrangements need to be compared with their predecessors", "loc": "Thatcher2002 p.141"}, {"id": 239, "n": "07", "s": 6, "t": "evaluation", "f": "授權發生嘅時候，議會問責模式本身係點？", "b": "Thatcher 認為授權畀獨立監管機構嘅時候，議會問責模式本身已經近乎虛構多過現實", "q": "Thus delegation to IRAs took place in a situation in which legislative models of accountability were closer to fiction than reality.", "loc": "Thatcher2002 p.142"}, {"id": 240, "n": "07", "s": 6, "t": "fact", "f": "獨立監管機構發展出嚟嘅問責之中，邊樣最重要？", "b": "Thatcher 認為獨立監管機構發展出嚟嘅問責之中，答責最重要", "q": "More important has been ‘answerability’.", "loc": "Thatcher2002 p.142"}, {"id": 241, "n": "07", "s": 6, "t": "definition", "f": "「答責」即係乜？", "b": "Thatcher 所講嘅答責，係機構要解釋自己嘅行動同面對質詢", "q": "Agencies have explained their actions and been obliged to face questioning for them.", "loc": "Thatcher2002 p.142"}, {"id": 242, "n": "07", "s": 6, "t": "fact", "f": "授權之後，透過司法控制嘅問責點樣變？", "b": "Thatcher 發現授權之後透過司法控制嘅問責增加咗", "q": "Accountability via judicial control has increased", "loc": "Thatcher2002 p.142"}, {"id": 243, "n": "08", "s": 1, "t": "fact", "f": "而家邊個係 TFEU 第 101、102 條嘅主要公共執法者？", "b": "Wils 指出各成員國競爭主管機關已成為執行 TFEU 第 101 同 102 條嘅主要公共執法者，作出超過九成決定", "q": "The competition authorities of the EU Member States have thus in quantitative terms become the primary public enforcers of Articles 101 and 102 TFEU, adopting more than 90% of all decisions.", "loc": "Wils2019 p.151"}, {"id": 244, "n": "08", "s": 1, "t": "fact", "f": "德國聯邦卡特爾局喺諮詢中講咗乜事？", "b": "德國聯邦卡特爾局喺諮詢中話知道有大成員國嘅 NCA 首長，據報因政府唔同意佢嘅決定而被提早撤職", "q": "aware of several cases where the president of the NCA of a larger EU Member State was dismissed ahead of the normal end of the term, reportedly because the respective Member State’s government did not agree with decisions taken by the authority", "loc": "Bundeskartellamt, in Wils2019 p.153"}, {"id": 245, "n": "08", "s": 1, "t": "fact", "f": "ECN+ 指令第 4(1) 條要求 NCA 點樣行使權力？", "b": "ECN+ 指令第 4(1) 條要求 NCA 公正咁、為有效同一致執行競爭規則而行使權力，並受相稱嘅問責要求約束", "q": "perform their duties and exercise their powers impartially and in the interests of the effective and uniform application of those provisions, subject to proportionate accountability requirements", "loc": "Directive (EU) 2019/1, Art 4(1), in Wils2019 p.154"}, {"id": 246, "n": "08", "s": 1, "t": "fact", "f": "ECN+ 指令第 4(2)(b) 條禁止 NCA 決策者做乜？", "b": "ECN+ 指令第 4(2)(b) 條要求 NCA 決策者唔可以尋求或接受政府或其他公私實體嘅指示", "q": "neither seek nor take any instructions from government or any other public or private entity", "loc": "Directive (EU) 2019/1, Art 4(2)(b), in Wils2019 p.154"}, {"id": 247, "n": "08", "s": 1, "t": "fact", "f": "ECN+ 指令第 4(3) 條保障 NCA 決策者乜？", "b": "ECN+ 指令第 4(3) 條規定 NCA 決策者唔可以因為正當履行職責而被撤職", "q": "shall not be dismissed from such authorities for reasons related to the proper performance of their duties", "loc": "Directive (EU) 2019/1, Art 4(3), in Wils2019 p.154"}, {"id": 248, "n": "08", "s": 2, "t": "evaluation", "f": "將獨立理解為唔受任何控制、想點就點，有乜問題？", "b": "Wils 認為將獨立理解為唔受任何控制、想點就點，從公眾利益角度唔係好事", "q": "is not a desirable state of affairs, at least not from the perspective of the general interest", "loc": "Wils2019 p.155"}, {"id": 249, "n": "08", "s": 2, "t": "normative", "f": "獨立唔應該成為乜嘢嘅牌照？", "b": "Wils 認為獨立唔應該成為懶惰、低效、失職、唔透明、任意、自肥、貪污同濫權嘅牌照", "q": "Independence should not be a licence for laziness, inefficiency, dereliction of duty, intransparency, arbitrariness, self-dealing, corruption, abuse of powers", "loc": "Wils2019 p.155"}, {"id": 250, "n": "08", "s": 2, "t": "normative", "f": "獨立同問責嘅關係係點？", "b": "Wils 指出一般都接受獨立應該同問責一齊行", "q": "For this reason, it is generally accepted that independence should go hand in hand with accountability.", "loc": "Wils2019 p.155"}, {"id": 251, "n": "08", "s": 2, "t": "conceptual", "f": "競爭主管機關獨立嘅關鍵問題係乜？", "b": "Wils 認為競爭主管機關獨立嘅關鍵問題，係分清邊啲控制、干預或影響唔適當、邊啲適當", "q": "the crucial issue is to determine which types of controls, interference or influence are inappropriate and which are appropriate to ensure that competition authorities fulfil their task", "loc": "Wils2019 p.158"}, {"id": 252, "n": "08", "s": 2, "t": "definition", "f": "歐盟法院喺 Wilson 案點樣界定獨立？", "b": "歐盟法院喺 Wilson 案認為獨立即係受保護、免受可能危害成員獨立判斷嘅外來干預或壓力", "q": "is protected against external intervention or pressure liable to jeopardise the independent judgment of its members as regards the proceedings before them", "loc": "CJEU, Wilson C-506/04, in Wils2019 p.156"}, {"id": 253, "n": "08", "s": 2, "t": "evaluation", "f": "「可能危害」呢個限定點解有用？", "b": "Wils 認為「可能危害」呢個限定好有用，因為反映咗要分適當同唔適當嘅控制", "q": "is a useful one, as it reflects the need to distinguish between appropriate and inappropriate controls", "loc": "Wils2019 p.157"}, {"id": 254, "n": "08", "s": 3, "t": "normative", "f": "歐盟法院話冇扭曲嘅競爭制度，要靠乜先保證到？", "b": "歐盟法院認為條約下冇扭曲嘅競爭制度，要確保各經濟經營者機會平等先保證到", "q": "a system of undistorted competition, as laid down in the Treaty, can be guaranteed only if equality of opportunity is secured between the various economic operators", "loc": "CJEU, France v Commission C-202/88, in Wils2019 p.159"}, {"id": 255, "n": "08", "s": 3, "t": "normative", "f": "點解競爭主管機關要獨立於所有公私經濟經營者？", "b": "Wils 認為因為權力覆蓋全經濟，競爭主管機關要獨立於所有公私經濟經營者", "q": "The same reason justifies requiring that competition authorities, whose duties and powers affect all sectors of the economy, are independent of all public and private economic operators.", "loc": "Wils2019 p.159"}, {"id": 256, "n": "08", "s": 3, "t": "cause", "f": "獨立於經濟經營者，除咗防止唔平等對待，仲防止乜？", "b": "Wils 認為獨立於經濟經營者除咗防止唔平等對待，亦防止商界嘅監管俘虜", "q": "Independence from economic operators is not only necessary to prevent unequal treatment between different economic operators, but also to prevent regulatory capture by business interests.", "loc": "Wils2019 p.160"}, {"id": 257, "n": "08", "s": 3, "t": "definition", "f": "乜嘢係監管俘虜？", "b": "監管俘虜係指受託為公眾利益監管嘅機構最後認同被監管企業、維護佢哋而唔係公眾利益", "q": "Regulatory capture is the phenomenon where an authority entrusted with a regulatory task in the general interest ends up identifying with the businesses it regulates and defending the interests of those businesses rather than the public interest.", "loc": "Schouten & de Moor-van Vugt; Carpenter & Moss, in Wils2019 p.160"}, {"id": 258, "n": "08", "s": 3, "t": "conceptual", "f": "John Kay 認為最常見嘅俘虜係乜？", "b": "John Kay 認為最常見嘅俘虜係老實嘅知性俘虜", "q": "the most common form of capture is honest and may be characterized as intellectual capture", "loc": "John Kay, in Wils2019 p.160"}, {"id": 259, "n": "08", "s": 3, "t": "cause", "f": "競爭主管機關職員可能點樣被知性俘虜？", "b": "Wils 認為競爭主管機關職員可能最後覺得要向一個結構上偏向大企業嘅競爭專家社群負責", "q": "end up feeling accountable to a competition expert community that is structurally biased towards the outlook and interests of big business", "loc": "Wils2019 p.160"}, {"id": 260, "n": "08", "s": 4, "t": "normative", "f": "平等對待嘅理由，對 NCA 同本國政府嘅關係有乜要求？", "b": "Wils 認為防止唔平等對待嘅理由，同樣要求競爭主管機關獨立於本國政府同政治干預", "q": "also justifies their independence from national governments and from political interference", "loc": "Wils2019 p.161"}, {"id": 261, "n": "08", "s": 4, "t": "normative", "f": "政府同民選政客，可唔可以參與 NCA 個別案件嘅決定？", "b": "Wils 認為要將政府、其他公共機構同民選政客排除喺競爭主管機關個別案件嘅決定之外", "q": "The need to avoid unequal treatment justifies keeping governments, other public bodies or elected politicians out of competition authorities’ decisions in individual cases.", "loc": "Wils2019 p.162"}, {"id": 262, "n": "08", "s": 4, "t": "normative", "f": "獨立機構可唔可以向政府或議會問責？點樣？", "b": "Wils 認為獨立機構就一般活動、尤其透過年報向政府或議會負責係正常嘅", "q": "On the other hand, it is normal for independent authorities to be accountable to their governments and/or parliaments for their general activities, in particular through annual reports.", "loc": "Wils2019 p.162"}, {"id": 263, "n": "08", "s": 5, "t": "evaluation", "f": "NCA 唔完全獨立於歐盟委員會，有冇問題？", "b": "Wils 認為 NCA 唔完全獨立於歐盟委員會冇問題", "q": "This lack of full independence of NCAs vis-à-vis the European Commission is however unproblematic.", "loc": "Wils2019 p.164"}, {"id": 264, "n": "08", "s": 5, "t": "cause", "f": "NCA 喺本國受政治壓力時可以點？", "b": "Wils 認為 NCA 喺本國受政治壓力時，可以借助歐盟委員會嘅權威", "q": "as NCAs may be able to call upon the Commission’s authority when put under pressure in their Member State", "loc": "Wils2019 p.164"}, {"id": 265, "n": "08", "s": 5, "t": "evaluation", "f": "點解 ECN 冇大企業知性俘虜嘅同樣風險？", "b": "Wils 認為只有競爭主管機關嘅歐洲競爭網絡，冇大企業知性俘虜嘅同樣風險", "q": "does not present the same risk of intellectual capture by big business interests", "loc": "Wils2019 p.164"}, {"id": 266, "n": "08", "s": 5, "t": "evaluation", "f": "司法覆核會唔會限制 NCA 嘅獨立？", "b": "Wils 認為司法覆核唔會限制正確理解下嘅 NCA 獨立", "q": "Indeed, judicial review does not limit the NCAs’ independence, as properly understood.", "loc": "Wils2019 p.165"}, {"id": 267, "n": "08", "s": 5, "t": "evaluation", "f": "司法覆核對 NCA 獨立有乜正面作用？", "b": "Wils 認為司法覆核反而加強 NCA 嘅獨立", "q": "To the contrary, it strengthens their independence.", "loc": "Wils2019 p.165"}, {"id": 268, "n": "08", "s": 5, "t": "cause", "f": "投訴人可以申請司法覆核，保護 NCA 唔受乜壓力？", "b": "Wils 認為投訴人可以申請司法覆核，保護 NCA 唔受「唔好查政治上受寵企業」嘅壓力", "q": "The possibility for complainants to seek judicial review protects an NCA against political pressure not to act on complaints against politically favoured companies.", "loc": "Wils2019 p.165"}, {"id": 269, "n": "08", "s": 6, "t": "conceptual", "f": "競爭主管機關嘅法律上獨立同實際獨立，係咪一致？", "b": "Wils 指出競爭主管機關嘅法律上獨立同實際獨立唔一定完全一致", "q": "there is not necessarily a full correspondence between legal (formal, de jure) independence and de facto (actual, real) independence of competition authorities", "loc": "Wils2019 p.165"}, {"id": 270, "n": "08", "s": 6, "t": "normative", "f": "兩種獨立之間有落差，係唔係唔立法保障獨立嘅理由？", "b": "Wils 認為法律上同實際獨立之間有落差，唔係唔立法保障獨立嘅理由", "q": "The divergence between formal and de facto independence does however not justify abstaining from legislating for independence.", "loc": "Wils2019 p.166"}, {"id": 271, "n": "08", "s": 6, "t": "evaluation", "f": "David Currie 對保障獨立嘅機制有乜提醒？", "b": "David Currie 認為喺一種文化有助獨立嘅機制，喺另一種文化可能變成顛覆獨立嘅工具", "q": "mechanisms that in one culture may be benign and help to foster independence may in other cultures become a device for subverting independence", "loc": "David Currie, in Wils2019 p.166"}, {"id": 272, "n": "08", "s": 6, "t": "evaluation", "f": "以「唔係優先」拒絕投訴嘅權力，喺乜情況下可能削弱獨立？", "b": "Wils 認為喺冇其他足夠獨立保障時，以唔係優先為由拒絕投訴嘅權力可能削弱競爭主管機關嘅獨立", "q": "It could even be argued that having the power to reject complaints for lack of priority might weaken a competition authority’s independence, in the absence of sufficient other independence guarantees.", "loc": "Wils2019 p.168"}, {"id": 273, "n": "08", "s": 6, "t": "fact", "f": "冇投訴人權利嘅德國，聯邦卡特爾局獨唔獨立？", "b": "Wils 指出德國制度冇投訴人權利，但聯邦卡特爾局仍然係最獨立嘅 NCA 之一", "q": "the absence of complainant rights in the German system has not prevented the Bundeskartellamt from being one of the most independent, if not the most independent of all NCAs", "loc": "Wils2019 p.169"}, {"id": 386, "n": "13", "s": 1, "t": "normative", "f": "Townley 對統一同多元嘅總結論係乜？", "b": "Townley 認為統一解釋歐盟競爭法有好多好處，但多元都有好處（特別係照顧各國偏好同鼓勵創新同實驗），所以應該鼓勵多啲而唔係少啲多元", "q": "It argues that while uniformity has many benefits, so does diversity (particularly as regards national preferences and encouraging innovation and experimentation – see below); as such, more diversity should be encouraged rather than less.", "loc": "Townley2018Ch2 PDF p.1"}, {"id": 387, "n": "13", "s": 1, "t": "fact", "f": "歐盟競爭法圈子支持統一，理由講得清唔清楚？", "b": "Townley 指出歐盟競爭法圈子支持統一解釋競爭法，但好少明確講理由，好多時當咗係理所當然", "q": "Explicit reasons are rarely given to justify this support; it is often considered obvious.", "loc": "Townley2018Ch2 PDF p.3"}, {"id": 388, "n": "13", "s": 1, "t": "conceptual", "f": "de Visser 同 Waelbroeck 認為歐洲競爭法嘅真正問題係乜？", "b": "de Visser 同 Waelbroeck 認為法律條文冇可能被統一解釋，所以歐洲競爭法嘅真正問題係要幾多多元先係理想", "q": "Legal provisions cannot be interpreted uniformly, so the real question is how much diversity is desirable.", "loc": "de Visser; Waelbroeck (n 5), in Townley2018Ch2 PDF p.2"}, {"id": 389, "n": "13", "s": 2, "t": "normative", "f": "單一市場好處同健康等公共政策點取捨，有冇客觀答案？", "b": "Townley 認為單一市場好處同健康等其他公共政策之間點樣取捨冇客觀答案，取決於偏好", "q": "There is no objective answer to what is best; it depends on preferences.", "loc": "Townley2018Ch2 PDF p.6"}, {"id": 390, "n": "13", "s": 2, "t": "evaluation", "f": "統一解釋為企業慳到嘅成本有幾大？", "b": "Townley 認為統一解釋歐盟競爭法為企業慳到嘅成本，可能冇第一眼睇咁大", "q": "the cost savings from uniformity might not be as great as they seem at first sight.", "loc": "Townley2018Ch2 PDF p.7"}, {"id": 391, "n": "13", "s": 2, "t": "evaluation", "f": "查核同遵守唔同解釋嘅成本，同交易價值比點？", "b": "Townley 認為同觸發歐盟競爭規則嘅交易價值比，查核同遵守唔同歐盟競爭法解釋嘅成本應該唔大", "q": "the costs of checking and complying with diverse EU competition law interpretations is unlikely to be large compared to the value of any business deal that triggers the EU competition rules", "loc": "Townley2018Ch2 PDF p.7"}, {"id": 392, "n": "13", "s": 2, "t": "evaluation", "f": "企業有冇權喺全歐盟得到相同對待？", "b": "Townley 認為唔清楚企業有冇權喺全歐盟得到相同對待，因為歐盟條約容許成員國製造唔同嘅競爭條件", "q": "However, it is unclear whether such a right to equality exists in this sense. The EU Treaties allow the Member States to create different conditions of competition.", "loc": "Townley2018Ch2 PDF p.8"}, {"id": 393, "n": "13", "s": 2, "t": "normative", "f": "歐洲融合同保持各國多元身份之間，要點處理？", "b": "Townley 認為歐洲融合帶嚟嘅好處同保持各國多元身份之間，要搵一個微妙平衡", "q": "There is a delicate balance to be found between that achieved through integration and maintaining our diverse identities.", "loc": "Townley2018Ch2 PDF p.10"}, {"id": 394, "n": "13", "s": 3, "t": "fact", "f": "《消費者合約不公平條款指令》顯示咗乜？", "b": "Townley 指出成員國草擬《消費者合約不公平條款指令》時明確揀咗多元，就算統一規則會更有效保護消費者同促進競爭；佢認為競爭政策同執法都可能出現同樣情況", "q": "We have seen an example of diversity being explicitly valued, even when it undermines consumer protection and competition. This could happen in competition policy and enforcement too.", "loc": "Townley2018Ch2 PDF p.11"}, {"id": 395, "n": "13", "s": 3, "t": "cause", "f": "跟 Scharpf，如果歐盟層面重組唔到保障，會點？", "b": "Townley 跟從 Scharpf 認為，如果因為成員國共識不足或者冇管轄權而唔能夠喺歐盟層面重組保障，歐盟同成員國嘅正當性都可能受影響", "q": "Where this is not possible (perhaps there is insufficient agreement between Member States or a lack of jurisdiction), then the legitimacy of both the EU and the Member States may be affected.", "loc": "Scharpf (n 52), in Townley2018Ch2 PDF p.13"}, {"id": 396, "n": "13", "s": 4, "t": "definition", "f": "Oates 嘅分權定理講乜？", "b": "Oates 嘅分權定理指出，對於一種公共財，由地方政府為各自轄區提供帕累托有效嘅產出，一定至少同由中央政府喺所有轄區提供一個統一水平一樣有效率", "q": "it will always be more efficient (or at least as efficient) for local governments to provide the Pareto-efficient levels of output for their respective jurisdictions than for the central government to provide any specific and uniform level of output across all jurisdictions.", "loc": "Oates (n 71), in Townley2018Ch2 PDF p.17"}, {"id": 397, "n": "13", "s": 4, "t": "cause", "f": "喺乜情況下，分權嘅好處最明顯？", "b": "Townley 認為各成員國對某種公共財嘅渴求越唔同、越強烈，而每國之內公民嘅渴求越一致，分權嘅好處就越明顯", "q": "The benefits of decentralisation are more pronounced the more diverse (and strong) each Member State’s desire is for the public good in question, and the more homogeneous those desires are in the citizens within each Member State.", "loc": "Townley2018Ch2 PDF p.18"}, {"id": 398, "n": "13", "s": 4, "t": "evaluation", "f": "將競爭執法集中到歐盟層面，點解唔係萬應靈丹？", "b": "Townley 認為將競爭執法集中到歐盟層面唔係萬應靈丹，因為管轄範圍大過受影響範圍時，中央化本身都會製造外部性", "q": "In any event, centralisation is not a panacea.", "loc": "Townley2018Ch2 PDF p.20"}, {"id": 399, "n": "13", "s": 5, "t": "cause", "f": "競爭性聯邦主義點樣支持多元？", "b": "Townley 認為喺競爭性聯邦主義嘅思路下，容許競爭主管機關之間有多元會鼓勵佢哋好多都去實驗同創新", "q": "In this mindset, enabling diversity between competition authorities encourages many of them to experiment and innovate.", "loc": "Townley2018Ch2 PDF p.23"}, {"id": 400, "n": "13", "s": 5, "t": "conceptual", "f": "喺 Deakin 嘅反身協調框架入面，多元有乜地位？", "b": "喺 Townley 採用嘅 Deakin 反身協調框架之下，各國制度嘅多元本身就係一個目標，因為多元係互相學習嘅材料", "q": "Under this framework, diversity of national systems is an objective in its own right.", "loc": "Deakin (n 117), in Townley2018Ch2 PDF p.25"}, {"id": 401, "n": "13", "s": 6, "t": "evaluation", "f": "公民德性嘅論據喺競爭法範疇有冇說服力？", "b": "Townley 認為公民德性嘅論據喺競爭法範疇唔算有說服力、亦唔太相關", "q": "In conclusion, I do not find the arguments on civic virtue particularly convincing or relevant in the competition law arena.", "loc": "Townley2018Ch2 PDF p.29"}, {"id": 402, "n": "13", "s": 6, "t": "fact", "f": "歐洲競爭主管機關對公民嘅政治問責有幾多？", "b": "Townley 指出喺冇相反證據嘅情況下，歐洲嘅競爭主管機關（委員會同各國 NCA）對公民嘅政治問責似乎好少", "q": "However, in the absence of evidence to the contrary, there seems to be very little political accountability from competition authorities to citizens in Europe.", "loc": "Townley2018Ch2 PDF p.38"}, {"id": 403, "n": "13", "s": 6, "t": "fact", "f": "歐洲競爭主管機關點樣運作，令問責成疑？", "b": "Townley 指出歐洲嘅競爭主管機關執行措辭寬鬆嘅競爭條文，好多時自己揀目標同方法，除咗法院之外冇乜監督，而呢個範疇高度涉及再分配", "q": "They implement very openly worded competition provisions, often selecting their own goals and methods with little oversight (except from the courts), in what is a highly re-distributive area.", "loc": "Townley2018Ch2 PDF p.38"}, {"id": 404, "n": "13", "s": 7, "t": "evaluation", "f": "競爭政策只交畀歐盟，對正當性有乜影響？", "b": "Townley 認為如果競爭政策呢類監管活動只交畀歐盟，歐盟同成員國嘅正當性都可能減少", "q": "If regulatory activity, such as competition policy, is solely transferred to the EU, both it and the Member States may also end up with less legitimacy (see Chapter 3).", "loc": "Townley2018Ch2 PDF p.40"}, {"id": 405, "n": "13", "s": 7, "t": "cause", "f": "競爭執法嘅多元點樣減低犯錯嘅代價？", "b": "Townley 認為競爭執法嘅多元減低犯錯嘅代價，因為錯誤選擇主要影響有關成員國，而唔係全歐盟嘅企業同消費者", "q": "The cost of mistakes is also reduced. Bad choices mainly affect the Member State concerned rather than undertakings (and consumers) throughout the whole EU.", "loc": "Townley2018Ch2 PDF p.40"}, {"id": 406, "n": "13", "s": 7, "t": "normative", "f": "理想嘅歐洲競爭制度應該點？", "b": "Townley 認為理想嘅歐洲競爭制度要夠靈活，喺唔同議題同脈絡兼顧統一同多元", "q": "Thus, an optimal system needs to be flexible enough to take account of both, in different issues and contexts.", "loc": "Townley2018Ch2 PDF p.41"}, {"id": 422, "n": "15", "s": 1, "t": "evaluation", "f": "Wilks 點樣睇 Regulation 1/2003 嘅「分權」？", "b": "Wilks 認為 Regulation 1/2003 嘅現代化改革表面上承諾將歐盟競爭執法下放畀各國競爭主管機關，但深入分析顯示歐盟委員會嘅中央權力反而增加", "q": "While they appear to promise decentralization to national competition authorities, more sophisticated analysis points to an increase in the centralized power of the Commission.", "loc": "Wilks2005 p.431"}, {"id": 423, "n": "15", "s": 1, "t": "fact", "f": "Regulation 1/2003 取代咗乜？形成乜制度？", "b": "歐盟理事會廢除 Regulation 17、以 Regulation 1/2003 取代，直接賦予各國競爭主管機關執行歐盟競爭規則嘅權，形成 25 個平行國家管轄區嘅制度", "q": "the Council repealed Regulation 17 and substituted Regulation 1/2003, which gives directly to the National Competition Authorities (the NCAs) the right to apply the competition rules in a system now consisting of 25 parallel national jurisdictions.", "loc": "Wilks2005 p.432"}, {"id": 424, "n": "15", "s": 2, "t": "fact", "f": "Regulation 1/2003 喺執法模式上改咗乜？", "b": "Wilks 指出 Regulation 1/2003 捨棄 Regulation 17 嘅德國通知豁免模式、改用法國嘅自我評估模式，並放棄歐盟委員會批出豁免嘅壟斷", "q": "The reforms, and especially Regulation 1, rewrote history by dropping the German model in favor of the French model and by giving up the Commission’s monopoly over the granting of exemptions.", "loc": "Wilks2005 p.435"}, {"id": 425, "n": "15", "s": 2, "t": "cause", "f": "向成員國提出嘅競爭現代化正統理由係乜？", "b": "Wilks 指出向成員國提出嘅歐盟競爭現代化正統理由，係現行制度超負荷，加上歐盟擴大會帶嚟更多負荷而需要簡化", "q": "The orthodox rationale, presented to the member state principals, was a combination of overload in the present system and a need for simplification in the face of additional overload from EU enlargement.", "loc": "Wilks2005 p.435"}, {"id": 426, "n": "15", "s": 3, "t": "conceptual", "f": "第一種解讀點樣睇競爭現代化？", "b": "Wilks 指出第一種解讀將歐盟競爭現代化睇成重新談判授權，由作為委託人嘅成員國從歐盟委員會收返更多權力", "q": "This first reading, therefore, sees modernization simply as a renegotiation of delegated powers in which the principals have chosen to take back a greater degree of authority.", "loc": "Wilks2005 p.437"}, {"id": 427, "n": "15", "s": 3, "t": "conceptual", "f": "第二種解讀點解話 DG Competition 變咗受託人？", "b": "Wilks 指出第二種解讀認為成員國畀咗咁闊、咁冇邊界嘅權力，令 DG Competition 喺歐洲市場治理中變成受託人而唔再係代理人", "q": "The member states have created such broad, open-ended authority that DG Competition has become a “trustee” in the governance of the European market rather than an agent.", "loc": "Wilks2005 p.437"}, {"id": 428, "n": "15", "s": 3, "t": "evaluation", "f": "第二種解讀點樣形容委員會嘅做法？", "b": "Wilks 指出第二種解讀認為歐盟委員會搞咗一場政變，並用行政功能同法律必要嘅門面掩飾", "q": "The Commission has engineered a coup, which it has concealed behind a facade of administrative functionality and legal necessity.", "loc": "Wilks2005 p.437"}, {"id": 429, "n": "15", "s": 3, "t": "cause", "f": "Majone 認為自視為跨國網絡一份子嘅監管機構會點？", "b": "Majone 認為自視為跨國同類機構網絡一份子、而唔只係國家機構嘅監管機構，更有動機捍衛自己嘅政策承諾同專業標準、抵抗外來影響", "q": "a regulatory agency that sees itself as part of a transnational network of similar institutions, rather than as a merely national body, is more motivated to defend its policy commitments and professional standards against external influences", "loc": "Majone (2002), in Wilks2005 p.438"}, {"id": 430, "n": "15", "s": 4, "t": "evaluation", "f": "Regulation 1/2003 第 3 條對國家競爭法有乜影響？", "b": "Wilks 認為 Regulation 1/2003 第 3 條要求各國競爭主管機關對屬其範圍嘅協議適用歐盟競爭法，令國家限制性做法法律被邊緣化，並喺較細嘅成員國實際上以歐盟法取代國家法", "q": "This provision marginalizes national law on restrictive practices and will effectively substitute European law for national law in the smaller member states.", "loc": "Wilks2005 p.439"}, {"id": 431, "n": "15", "s": 4, "t": "fact", "f": "Regulation 1/2003 第 11(6) 條設立咗乜制度？", "b": "Wilks 指出 Regulation 1/2003 設立監督控制制度，要求各國競爭主管機關所有決定都經 DG Competition 審閱，而 DG Competition 可以根據第 11(6) 條取代國家機關、改由自己進行程序", "q": "the Regulation sets up a system of supervision and control by requiring that all decisions by NCAs be vetted by DG Competition, which can displace the national authorities and substitute its own proceedings (Article 11(6)).", "loc": "Wilks2005 p.439"}, {"id": 432, "n": "15", "s": 4, "t": "evaluation", "f": "點解委員會唔再怕委託代理關係嘅最終制裁？", "b": "Wilks 認為歐盟委員會以近乎平等嘅地位同成員國交涉，已經唔再受「廢除」呢個委託代理關係嘅最終制裁威脅", "q": "The Commission engages with member states from a position of virtual equality and is no longer vulnerable to the ultimate principal–agent sanction, that of abolition.", "loc": "Wilks2005 p.439"}, {"id": 433, "n": "15", "s": 4, "t": "conceptual", "f": "Majone 承認委託代理理論解釋唔到乜？", "b": "Majone 承認委託代理理論未能令人滿意咁解釋歐盟委員會基於條約嘅獨立", "q": "cannot satisfactorily explain the treaty-based independence of the Commission", "loc": "Majone (2001), in Wilks2005 p.439"}, {"id": 434, "n": "15", "s": 5, "t": "fact", "f": "歐洲競爭網絡有乜奇怪之處？", "b": "Wilks 指出歐洲競爭網絡係一個政府間系統，會傳送大量高度機密資料、主要以電子方式運作，但冇法律地位", "q": "The Network is very much an intergovernmental system that will transmit large amounts of highly confidential information and will operate largely electronically but has no legal status", "loc": "Wilks2005 p.442"}, {"id": 435, "n": "15", "s": 5, "t": "evaluation", "f": "ECN 模糊問責渠道有乜後果？", "b": "Wilks 認為歐洲競爭網絡越係模糊問責渠道，歐盟競爭執法嘅非多數決兩難就越尖銳", "q": "To the extent that it clouds the avenues of accountability the nonmajoritarian dilemma is sharpened.", "loc": "Wilks2005 p.443"}, {"id": 436, "n": "15", "s": 5, "t": "definition", "f": "Wilks 點樣界定 ECN？", "b": "Wilks 將歐洲競爭網絡界定為將 26 個非多數決機構焊埋一齊嘅「超非多數決機構」，其問責係雙重唔清楚", "q": "welds together 26 nonmajoritarian institutions into a form of “supra-nonmajoritarian institution” whose accountability is doubly unclear.", "loc": "Wilks2005 p.449"}, {"id": 437, "n": "15", "s": 6, "t": "evaluation", "f": "NCA 直接管轄本國大型企業之後，獨立程度會點？", "b": "Wilks 認為各國競爭主管機關直接管轄本國大型企業之後，佢哋嘅獨立程度可能受損", "q": "The level of independence of the NCAs may be prejudiced when they take on more direct control of major national enterprises.", "loc": "Wilks2005 p.446"}, {"id": 438, "n": "15", "s": 6, "t": "cause", "f": "支持競爭現代化嘅論據點樣被推動？", "b": "Wilks 認為支持歐盟競爭現代化嘅論據由法律專家、以法律話語提出，並由一個知識社群一致而集體咁推動", "q": "The arguments for modernization were advanced by legal specialists, in a legal discourse, and mobilized coherently and collectively by an “epistemic community.”", "loc": "Wilks2005 p.447"}, {"id": 439, "n": "15", "s": 6, "t": "normative", "f": "Wilks 對法律化嘅歐盟競爭法有乜警告？", "b": "Wilks 警告法律化嘅歐盟競爭法可能要求競爭主管機關以違背就業、社會福利、技術發展或產業選址等國家利益嘅方式行事", "q": "The law may require competition authorities to act in ways incompatible with national interests in employment, social welfare, technological development, or the location of industrial activity.", "loc": "Wilks2005 p.450"}];
