{k:'04-1',t:'權力交咗畀「非多數決機構」',lv:[],vis:['v-why'],b:`<p>干預型國家將行政同決策集中喺中央；規管型國家倒轉，靠<b>大量將權力授出畀獨立機構</b>：監管機構、委員會，仲有越嚟越積極嘅法院。</p>
 <p>統稱<b>「非多數決機構」</b>：做緊公共職能，但唔直接向選民或者民選代表負責。</p>
 <p>歐盟係極端版本：佢冇自己收稅使錢嘅權力，只能靠立規則擴大影響力，結果差唔多變成一個<b>純粹嘅規管型國家</b>。</p>
 <p>成篇主旨：民主正當性嘅問題，應該靠<b>加強問責結構</b>解決，而唔係靠限制監管者嘅獨立性。</p>`},
{k:'04-2',t:'點解授權：可信承諾最主要',lv:[],vis:['v-why'],b:`<ul><li><b>認知（唔夠）：</b>政客喺稅務呢類技術範疇都識自己寫好細嘅政策，又可以請顧問，所以單靠「政客唔夠專業」解釋唔到授權。</li>
 <li><b>決策成本：</b>法例寫得越細越難達成共識，交畀機構慳時間。</li>
 <li><b>卸責：</b>Fiorina 話廣泛授權令立法者唔單止慳返做具體決定嘅麻煩，仲可以避開或遮掩自己對後果嘅責任。</li>
 <li><b>可信承諾（最主要）：</b>頭兩個解釋解唔到點解歐洲以前好少授權、而家咁流行。民主係「暫時嘅政府」，一屆國會或執政聯盟綁唔住下一屆，所以公共政策永遠可能被推翻。</li></ul>
 <p>公用事業特別要緊：電網、水管投資落咗搬唔走，政客有誘因用監管將價格壓低過長期成本（變相充公）；冇可信承諾，公司就唔投資或投資唔夠。歐盟層面：成員國互不信任，未必認真檢控本國污染企業，所以交畀歐盟委員會會提高嚴格規例嘅可信性。</p>
 <p class="muted">筆記嘅例子：公司話「明年唔加價」冇人信；將定價權交畀唔聽老闆話嘅外部委員會，客先會信。</p>`},
{k:'04-3',t:'代理成本：正當性轉移唔到',lv:[],vis:[],b:`<p>委託人–代理人理論：代理人未必同委託人目標一致，所以有揀人、監察、獎懲等<b>代理成本</b>。最重要嘅洞見係：<b>控制好大程度上係好制度設計嘅問題</b>，而唔係由某一個固定位置發號施令。</p>
 <p>但政治組織同經濟組織唔同：民選委託人可以將政策權交出去，但<b>交唔到自己嘅正當性</b>；呢個損失可以係最重要嘅代理成本。</p>
 <p>歐盟層面更尖銳：各國民主可以為跨政府部分（歐洲理事會、部長理事會）提供正當性；但超國家機構要保護條約賦予公民嘅權利，有時要對抗成員國多數，所以唔可以靠「代理」，要建立<b>自主正當性</b>。</p>`},
{k:'04-4',t:'獨立有幾獨立：美國同歐洲',lv:[],vis:[],b:`<p>獨立機構有好多用處（可信承諾、結合專業同規則制定、方便公眾參與、靈活、將爭議帶入公眾討論），所以某程度獨立有用甚至必要；但<b>唔好喺理論上誇大現實中嘅獨立</b>。</p>
 <p><b>美國</b>：獨立從來唔係教條。機構由國會立法設立、官員由民選官員委任、權力同目標寫喺法例、仲有越嚟越嚴嘅程序要求同司法覆核。結論：<b>獨立於直接政治控制 ≠ 獨立於公共問責</b>。</p>
 <p><b>歐洲</b>兩樣都差啲：獨立性（事實上同通常法律上）低過美國，問責制度亦冇咁嚴。例：法國競爭委員會連自己開展調查都唔得。機構獨立程度偏低，通常伴隨一個<b>界定唔清楚嘅問責結構</b>，英國最清楚。</p>
 <p class="muted">筆記連到：Thatcher 見到各國唔跟功能需要走（第 2 課）；Koop 同 Hanretty 發現法律上越獨立，質素評分越高（Part 3）。</p>`},
{k:'04-5',t:'問責係設計問題：設計變數同說理',lv:[],vis:[],b:`<p>Horn 嘅六個設計變數：授權幾多、管治結構同委任方法、決策程序、委託人推翻決定嘅程序、資源分配、事後監察。第一個變數係決定由獨立代理人做定委託人自己做。按任務同政治環境<b>明智咁揀每個變數嘅值</b>，獨立同問責就可以互補、互相支持。</p>
 <p>最簡單又最有效嘅工具：<b>要求監管者說明理由</b>。說理會帶動公眾參與、同行評審、投訴程序同司法覆核，所以係公共問責嘅<b>必要條件</b>。</p>
 <p>另外，職權範圍窄、<b>嚴格承諾特定政策目標</b>，先可以「按結果問責」，呢個係非多數決機構最主要嘅正當性來源之一。</p>`},
{k:'04-6',t:'推翻機構決定：唔太易、唔太難',lv:[],vis:['v-override'],b:`<p>民主之下冇可能完全排除政客推翻。決定成日溢出窄窄嘅範圍（環保影響就業、併購影響產業政策）；溢出重大時嘅<b>價值衝突，只應該由要向選民負責嘅人解決</b>。但要用<b>透明方式、跟清楚而公開嘅程序</b>。</p>
 <p>干預代價太低：機構唔算獨立，授權提升唔到可信性；干預太難：嚴重損失正當性。</p>
 <ul><li><b>德國（啱啱好）：</b>企業想推翻聯邦卡特爾局禁止嘅併購，要向經濟部長申請，部長要權衡整體經濟好處，仲要攞壟斷委員會意見；程序咁嚴，部長好少推翻。</li>
 <li><b>歐洲央行（另一極端）：</b>獨立寫喺條約，改要全體成員國一致同意，所以只能經一個極之艱難嘅程序推翻。</li></ul>
 <p class="muted">筆記嘅例子：足球 VAR，教練唔可以一叫就改判，但有清楚、人人睇到嘅覆核程序。</p>`},
{k:'04-7',t:'民主赤字：一個問題定兩個',lv:[],vis:[],b:`<p>Majone 將民主赤字論點按背後嘅正當性標準分四組：同國家機構類比、純多數決（「西敏寺」）模式、其實係不滿社會政策、由成員國衍生嘅正當性。</p>
 <p>回應：歐盟權限同資源有限；為控制<b>「全能」國家</b>（可以無限收稅使錢）發展嘅標準唔可以直接搬去歐盟。歐盟有語言、地理、經濟、意識形態、大國細國之間嘅深層分歧，非多數決特徵最好理解為<b>「分歧管理」</b>機制。</p>
 <p>拆兩個意思：<b>字面意思</b>（缺少議會民主制度）係因為選民支持經濟整合、唔支持政治整合，所以本身有民主理據；<b>較闊意思</b>係公共決策嘅毛病（唔透明、參與不足、唔肯說理、濫用酌情、控制問責不足），所有非多數決機構都有，用程序同實質標準量度，歐共體機構甚至比得上國家層面。</p>
 <p>建議：為歐盟訂一部<b>《行政程序法》</b>。歸根究底，正當性在於能唔能夠令人相信、並持續相信，佢哋係<b>最適合</b>做被託付職能嘅機構。</p>`},
{k:'07-1',t:'委託代理理論解釋唔解釋到？',lv:[],vis:['v-context'],b:`<p>Thatcher 研究英、法、德、意。結論一開始講明：授權好多特徵，<b>唔可以淨係靠政客面對嘅壓力同機構帶畀佢哋嘅好處</b>去解釋。</p>
 <p>IRA 好難定義，佢用三個最低要求：有自己喺公法下嘅權力同責任；組織上同部門分開；唔係直選、亦唔由民選官員管理。好多所謂獨立機構其實只係<b>「半獨立」</b>。</p>
 <p>兩類：<b>市場監管</b>（公用事業、競爭、金融）同<b>公共利益監管</b>（環境、安全、種族同性別平等）。市場監管機構擴散得較廣。</p>`},
{k:'07-2',t:'功能理由：四種壓力',lv:[],vis:['v-why'],b:`<p>委託代理模型：機構最重要功能係加強<b>可信承諾</b>。Thatcher 列出 1980、90 年代四種壓力：</p>
 <ul><li><b>卸責：</b>政策必要但唔受歡迎，政客可以將責任推開（私有化後公用事業加價，監管者分擔罵名）。</li>
 <li><b>技術化：</b>監管好技術，部長同議員難有效參與，將「唔性感」嘅技術工作交出去更吸引。</li>
 <li><b>可信承諾：</b>差唔多每次私有化都伴隨設立 IRA，令對投資者嘅承諾更可信、賣國企收入更高。</li>
 <li><b>歐盟壓力：</b>卸走爭議、甩走難搞嘅執行決定、提供同布魯塞爾打交道嘅對口。</li></ul>
 <p>種族、性別平等領域：壓力主要係唔受歡迎，授權可能比較<b>「象徵式」</b>。</p>`},
{k:'07-3',t:'功能解釋嘅極限',lv:[],vis:['v-context'],b:`<p>功能優勢係好起點，但唔夠解釋西歐嘅格局。三個理由：好多壓力早就存在但之前冇導致授權；各國時間唔同；好多壓力<b>可以用授權以外嘅改革應付</b>（加強部門、用憲法鞏固承諾、畀多啲權歐盟）。</p>
 <p>最明顯嘅反例：法國同意大利因為政治干預同不穩嘅傳統，可信承諾問題<b>大過</b>英德，但授權畀行業監管者嘅權力反而<b>更少</b>，仲保留更多提名同匯報控制。人數、揀人程序都五花八門，<b>冇一個歐洲模式</b>。</p>
 <p>所以功能優勢同設立 IRA 之間<b>冇自動連繫</b>；揀授權呢個回應要解釋，唔可以當咗理所當然。</p>`},
{k:'07-4',t:'四個脈絡因素',lv:[],vis:['v-context'],b:`<ol><li><b>學習同制度同形：</b>一國之內，睇落成功嘅機構會被抄去其他行業（英國 Oftel 被抄去水、電、煤氣），就算行業特徵同功能理由差好遠。</li>
 <li><b>國家傳統同結構：</b>英國十九世紀已有監管委員會，最易；法國長期懷疑獨立機構，怕唔係真獨立或者會分裂國家統一；德國靠自我監管加聯邦卡特爾局。</li>
 <li><b>政治領導同否決點：</b>英國單一政黨多數，改革快，可以由部長委任單一人監管者；其他國家多黨、多否決點，傾向設計令幾個政黨同角色都有代表嘅機構。</li>
 <li><b>國家改革：</b>私有化、自由化同新公共管理（NPM）；NPM 傳播得越廣，機構越多。</li></ol>
 <p class="muted">筆記嘅例子：四間學校面對同一壓力，一間即刻開獨立委員會，一間唔信獨立委員會，一間交畀家長會自我管理，一間校董內鬥拖咗幾年。</p>`},
{k:'07-5',t:'授權之後：非正式控制、機構坐大',lv:[],vis:[],b:`<p>委託代理理論關心點樣用正式設計減低「代理損失」。但實際上<b>正式嘅事後控制好少用</b>，尤其競爭監管機構；政府同議會靠<b>非正式嘅影響網絡同連繫</b>。</p>
 <p>隨時間，機構權力同重要性都增加，好多結果係意料之外：Oftel 本來只係「頂住先」等競爭嚟到嘅臨時安排，17 年後仲好好哋；法例原本只將推動競爭列為次要職責，機構將佢變成<b>首要目標</b>。</p>`},
{k:'07-6',t:'問責：要同以前比，唔好同理想比',lv:[],vis:[],b:`<p>有自己政策權力嘅獨立機構，對以議會為中心嘅傳統西歐問責模式構成問題（同 Majone 一致）。但新安排要<b>同之前嘅比較</b>：以前行政強勢、議會多數守紀律，議會控制近乎<b>虛構多過現實</b>。</p>
 <p>授權之後最重要嘅問責係<b>「答責」</b>（answerability）：機構要解釋自己嘅行動、面對質詢——向議會交年報、出席委員會，向被監管者同消費者發諮詢文件、開聽證會、公開理由同數據。<b>司法控制亦增加</b>，因為公開咗多咗資料同理由，覆核更易。</p>`},
{k:'05-1',t:'獨立已經變咗「常識」',lv:[],vis:['v-townley'],b:`<p>競爭主管機關（NCA）應該獨立，喺競爭法評論已經係<b>「公認智慧」</b>。但呢件事關乎權力分配：交畀獨立 NCA 嘅權力越多，政客、政府、最終消費者就越難影響佢點做嘢。</p>
 <p>初步答案：好似中央銀行嘅研究咁，<b>搵唔到乜證據</b>顯示獨立改善效能或效率；而因為競爭法<b>高度再分配</b>，獨立反而可能嚴重威脅正當性。Townley 個人唔贊成咁多獨立，連執法都唔例外。</p>`},
{k:'05-2',t:'獨立係乜、NCA 做咩、邊個想影響佢',lv:[],vis:[],b:`<p>定義：NCA 喺授權範圍內履行角色時，<b>免受外來干預嘅自由</b>。要分「正式獨立」同「實際獨立」。</p>
 <p>Ottow 嘅五個角色：倡議、反思（搵市場問題、推修例）、諮詢、<b>預防</b>（處理併購）、<b>壓制</b>（執行競爭規則）。好多人話執法好似法院最需要獨立；但 Guidi 話每次將規則用落一宗案，都係<b>政策制定者</b>，唔止執法者。所以五個角色都有重大再分配成分，<b>每個選擇都有贏家同輸家</b>。</p>
 <p>邊個想影響：政客、大細企業、消費者同 NGO、其他競爭機關（例如 ECN）、競爭法「知識社群」。影響力唔平均：同大企業比，<b>消費者</b>（往往係原本要保護嘅人）冇乜權力。政策網絡唔中性，係偏袒某啲世界觀同利益、排斥外人嘅政治結構。</p>
 <p class="muted">筆記連到：Wils 都擔心專家社群偏向大企業，但佢由此推出要<b>加強</b>獨立（第 6 課）。</p>`},
{k:'05-3',t:'正當性：反對獨立嘅論據',lv:[],vis:[],b:`<p>起點：民主國家嘅標準立場係<b>高度再分配嘅政策需要多數決控制</b>（競爭政策就係例子）。Shapiro：要向民主國家公民交代非民主決策機構，需要極之特殊嘅情況。</p>
 <p>用自由民主（選代表）定審議民主（受影響嘅人平等參與）睇，獨立 NCA 都會<b>削弱民主問責</b>。搬上歐盟層面又唔得：歐盟本身有民主赤字，各國偏好唔同，一套統一嘅競爭政策好難反映。</p>
 <p>各國差異：憲政傳統、「資本主義類型」（LME、CME、MME）、對授權嘅睇法、社會覺得獨立機構正唔正當。如果制度內部協調對表現重要，唔同程度嘅獨立可能有價值。授權係<b>政治行為</b>，一種（同一個份量嘅）獨立唔會適合晒所有人。</p>`},
{k:'05-4',t:'支持獨立嘅兩個論據點樣被拆',lv:[],vis:['v-townley'],b:`<p><b>論據一（Majone 1996）：效率政策靠結果就有正當性。</b> Townley 四點反駁：</p>
 <ol><li>正當性唔止係結果：仁慈獨裁者都唔會被接受；為我哋利益做事唔足以令佢正當。</li>
 <li>Majone 冇提出點樣檢查係咪真係人人得益。</li>
 <li>競爭政策唔係帕累托效率：<b>輸咗嘅一方唔會同意</b>。</li>
 <li>競爭政策嘅產出好難有信心咁量度。</li></ol>
 <p>結論：Majone 嘅理論框架並唔支持「產出正當性已經足夠」。</p>
 <p><b>論據二：有問責就夠。</b> 酌情權消除唔到，而且<b>歐盟競爭法冇清晰目標</b>，咁問責就由「確保 NCA 做政客想做嘅嘢」變成「要 NCA 解釋同證明自己」。Kovacic 同 Winerman 話透明加法院監督就夠；Townley 話唔符合政治學文獻，因為文獻仲要求<b>狹窄目標</b>同<b>制裁不當酌情</b>嘅能力。一句：問責重要，但需要<b>政治制裁</b>。</p>`},
{k:'05-5',t:'效能：專業、可信承諾、比較優勢',lv:[],vis:['v-townley'],b:`<ul><li><b>專業：</b>Hanretty 同 Koop（GCR 評分、OECD）發現獨立同問責對決策質素有正面顯著影響；Guidi 較新、以歐洲為主嘅研究發現對外來直接投資或消費物價冇顯著影響。所以實證最多只係<b>含糊</b>。</li>
 <li><b>可信承諾：</b>Townley 列七個理論問題，例如除非政客喺所有監管工具都綁住自己，否則好難相信喺競爭政策綁手對投資特別重要。Guidi：獨立於政治仍然可以有<b>監管者同被監管者勾結</b>。Gilardi（17 國 7 行業）：公用事業監管者正式獨立最多、其他經濟監管者次之、社會監管者最少，可能支持可信承諾論，但只量度正式獨立。</li>
 <li><b>比較優勢：</b>Vickers 話競爭機關擅長推動競爭；Townley 同意 Monti：如果基於非競爭理由嘅選擇有充分理由、又同政府其他政策一致，就冇理由話只睇競爭先有比較優勢。</li></ul>`},
{k:'05-6',t:'孤立嘅代價',lv:[],vis:[],b:`<p>競爭法覆蓋面好闊，成日影響環境、文化等政策。「NCA 淨係做競爭、其他交畀人哋」唔得：工作嘅<b>價值取向同再分配含意切割唔出嚟</b>。</p>
 <p>獨立亦可能令 NCA 冇咁有效：Kovacic 同 Winerman 話完全自主嘅機關好難建立做<b>有效倡議者</b>所需嘅政治關係。參與同審議可以令輸家都接受結果，但同一個獨立代理人似乎<b>冇可能有真正嘅審議</b>。</p>`},
{k:'05-7',t:'Townley 嘅結論同建議',lv:[],vis:['v-townley'],b:`<p>立場：<b>大幅減少 NCA 嘅獨立</b>，連競爭執法都包括。</p>
 <p>建議：政客更精確咁揀競爭目標、逐步收窄專家酌情、NCA 行使酌情時講清楚取捨同理由；有效做法係由 NCA 做<b>「純」競爭評估</b>（記住呢啲評估本身仍然係再分配），再由<b>政治機構作最後決定</b>、整合其他目標。長遠要提高競爭政策嘅政治關注、令消費者更直接參與；而家被人用<b>技術官僚外衣</b>遮掩再分配問題所拖累。</p>
 <p>總結：好難用<b>產出正當性</b>彌補<b>輸入正當性</b>嘅不足；但唔同成員國會唔同咁權衡，所以亦係保留<b>多元</b>嘅理由。</p>
 <p class="muted">筆記亦記低：Guidi、Tavares 同 Townley（2022）將同一套質疑搬上國際競爭網絡（ICN）。原章 p.146 之後嘅部分冇喺手。</p>`},
{k:'13-1',t:'個個撐統一，但好少人講點解',lv:[],vis:['v-oates'],b:`<p>委員會、各國 NCA、律師、經濟學家同學者好多都想統一解釋同應用第 101、102 條；但實體規則、程序同機構其實有大量分歧。Townley 嘅論點：統一有好多好處，多元都有（特別係<b>照顧各國偏好</b>同<b>鼓勵創新同實驗</b>），所以應該<b>鼓勵多啲多元</b>。</p>
 <p>支持統一嘅人<b>好少明確講理由</b>，當咗理所當然（少數講嘅係佐審官 Kokott：平等競爭條件、一致保護消費者）。de Visser 同 Waelbroeck：法律條文冇可能被統一解釋，真正問題係<b>要幾多多元先係理想</b>。</p>
 <p>三個前設：唔討論點樣實現；唔受現行法律同憲制框架限制；假設每國入面嘅參與者係一個整體（第 3 章先拆開）。</p>`},
{k:'13-2',t:'支持統一（一）：單一市場嘅好處',lv:[],vis:['v-oates'],b:`<p><b>經濟：</b>各國用唔同方法追同一目標會打斷貿易。例：減少酗酒，A 國訂酒精最低單價、B 國禁止 50% 以上飲品、C 國用另一門檻、D 國鼓勵酒商協議最低價。OECD 推論監管負擔「高過必要」；Townley 話行得太遠：點衡量健康同單一市場好處<b>冇客觀答案，取決於偏好</b>。</p>
 <p>慳成本：法國公司 Bertie SA 想將特許經營制度搬去德國，統一就只畀一套法律意見費。但慳到嘅<b>冇第一眼咁大</b>：同一機關唔同小組都會解釋唔同；公司法、消費者法、稅法仍然唔同；同一協議喺唔同脈絡意思唔同；同交易價值比，查核同遵守嘅成本唔大。</p>
 <p>平等對待：de Visser 話企業有權「相同情況相同對待」；Townley 話<b>唔清楚有冇呢種權</b>，因為條約容許成員國製造唔同競爭條件。</p>
 <p><b>政治：</b>單一市場可以建立歐洲「共同體」感（Weber）；但歐洲嘅豐富來自各國差異，融合同保持多元身份之間要搵<b>微妙平衡</b>。</p>`},
{k:'13-3',t:'支持統一（二）：消費者、全球資本、判例',lv:[],vis:[],b:`<ul><li><b>一致保護消費者：</b>反例係《消費者合約不公平條款指令》：成員國明知統一更有效，但因分歧只訂最低保護、容許各國加。即係曾經<b>明確揀咗多元</b>，就算削弱消費者保護同競爭；競爭政策都可能咁。</li>
 <li><b>控制全球資本（Scharpf）：</b>資本全球化、民主仍然係國家層面；較大制度控制污染、收入不均嘅能力較強，聯手亦增加議價能力。如果因共識不足或冇管轄權做唔到，歐盟同成員國嘅<b>正當性都可能受影響</b>。</li>
 <li><b>累積判例：</b>Townley 三點回應：要建基於「啱」嘅原則，而各地對「啱」睇法唔同；各國判決難取得、語言唔同；可以喺有共識處互相建基、有分歧處各自探索，係一個中間位置。</li></ul>`},
{k:'13-4',t:'支持多元（一）：偏好同 Oates 定理',lv:[],vis:['v-oates'],b:`<p>民主之下立法者要反映公民偏好；考慮到歐盟民主赤字同各國傳統，正當單位仍然係成員國。偏好喺幾方面唔同：保護邊種競爭、程序同機構（例如 NCA 獨立）、公共政策價值（健康、環保、文化）嘅權重。例：揀「社會平等同團結」做重點，葡萄牙 65%、德國 57%、意大利 27%。</p>
 <p><b>Oates 分權定理：</b>對一種公共財，由地方為自己轄區提供帕累托有效嘅產出，一定<b>至少同</b>中央喺所有轄區提供統一水平一樣有效率（前提：冇規模經濟）。三個限制：</p>
 <ol><li><b>同質性：</b>各國渴求越唔同、越強烈，而國內越一致，分權好處越明顯（荷蘭重視環境可持續、英國強烈反對）。</li>
 <li><b>外部性：</b>管轄範圍同影響範圍唔一致（<i>Wouters</i>：荷蘭律師嘅安排影響荷蘭以外）。集中可以內部化，但<b>唔係萬應靈丹</b>：管轄大過影響範圍，中央化本身都製造外部性（多層管治）。</li>
 <li><b>規模經濟：</b>指引、培訓固定成本高、多重申報交易成本高，傾向集中；但交易成本高唔等於要中央化，只係一宗交易由一個機關用一套規則處理。</li></ol>
 <p class="muted">筆記嘅例子：屋苑 A 座想冷氣 26 度、B 座想 22 度，一刀切 24 度兩座都唔滿意；但噪音滋擾（外部性）或一齊買平好多（規模經濟）就要再諗。</p>`},
{k:'13-5',t:'支持多元（二）：實驗、創新、學習',lv:[],vis:[],b:`<p>要幾多競爭先最利創新，經濟學家意見分歧（中等程度往往最好，但 Motta 話好難由此揀「啱」嘅水平）；荷蘭 NCA 問各國點重視創新，冇共識。</p>
 <ul><li><b>競爭性聯邦主義：</b>制度之間競爭，逼機構提升效率同創新；容許多元會鼓勵好多機構去實驗。</li>
 <li><b>Deakin 嘅反身協調：</b>競爭係發現過程；Hayek 同 Popper 強調知識有限，冇人事先知道最好嘅規則；中央揀錯就冇其他制度可以對照糾正。所以<b>多元本身就係目標</b>，大家先可以觀察、比較、互相學習。</li></ul>`},
{k:'13-6',t:'支持多元（三）（四）：公民德性、地方資訊、問責',lv:[],vis:[],b:`<p><b>公民德性：</b>de Tocqueville 話參與公共事務令人少啲自私。但 1998 年委員會得 153 人、各國 NCA 1,222 人做競爭執法，相對人口好少；Townley 話呢個論據<b>唔算有說服力、唔太相關</b>。</p>
 <p><b>地方資訊同問責：</b>世界銀行話地方領袖更了解選民、更易被追究。Townley 話證據好少；NCA 同委員會都有強嘅調查權同寬大政策，委員會亦可叫 NCA 代收資料。Seabright：中央化會減弱對個別地區嘅問責。但冇相反證據下，歐洲競爭主管機關對公民嘅<b>政治問責似乎好少</b>：職位唔係選出嚟，執行措辭寬鬆嘅條文，好多時<b>自己揀目標同方法</b>，除咗法院冇乜監督，而範疇高度再分配。</p>
 <p class="muted">筆記對照：Majone（1994）將隔絕於短期政治壓力當成歐盟監管嘅優勢；Townley 將缺乏政治問責列為問題。</p>`},
{k:'13-7',t:'結論：要夠靈活',lv:[],vis:['v-oates'],b:`<p>統一有經濟同政治好處（接近公平競爭環境、減少揀法院），但部分可能被誇大；促進內部貿易唔係唯一價值。競爭政策呢類監管只交畀歐盟，<b>歐盟同成員國嘅正當性都可能減少</b>。</p>
 <p>多元令規則更易訂（唔使人人同意），亦<b>減低犯錯代價</b>：錯誤選擇主要影響有關成員國，而唔係全歐盟。條約前言：深化團結，同時尊重各國歷史、文化同傳統。</p>
 <p>好難一般而永久咁講統一同多元各要幾多，所以理想制度要<b>夠靈活</b>，喺唔同議題同脈絡兼顧兩者。預告第 3 章：好多制度入面 NCA 需要更多、而唔係更少政治參與。</p>`},
{k:'15-1',t:'謎題：代理人點解肯「交返」權力',lv:[],vis:['v-wilks'],b:`<p>Wilks 一開頭落結論：改革<b>表面承諾分權</b>畀各國競爭主管機關，深入分析見到嘅係<b>委員會中央權力增加</b>。</p>
 <p>法律內容：理事會廢除 Regulation 17，換上 <b>Regulation 1/2003</b>，直接畀 NCA 權執行競爭規則，變成 25 個平行國家管轄區。謎題：一個非多數決嘅代理人（委員會）點解主動將權力「交返」？Wilks 比較「分權」同「支配」，支持<b>支配</b>。</p>
 <p>兩套理論：委託代理理論係主力，但要行出呢個框架，先評估到委員會已經「走甩」代理人嘅約束，成為某種經濟制度嘅<b>「受託人」</b>，即標題嘅 agency escape。</p>`},
{k:'15-2',t:'Regulation 17 嘅德國模式同改革',lv:[],vis:[],b:`<p>1962 年 Regulation 17 畀委員會廣泛程序權力，最重要係對批出豁免有<b>「壟斷」</b>管轄權，令 DG IV（今日 DG Competition）成為歐盟最早、亦有人最憎嘅非多數決機構之一。</p>
 <p><b>德國模式：</b>企業協議一律當違法，直至通知委員會並得到「否定清關」或豁免先算；<b>法國模式</b>：企業自己評估，委員會事後先挑戰。揀德國模式即時造成<b>行政超負荷</b>。但委員會唔敢改，怕一修訂成員國乘機收窄佢權力（「潘朵拉嘅盒」）。1999 年終於打開，Regulation 1/2003 喺 2004 年 5 月生效：<b>捨德取法</b>，放棄豁免壟斷。</p>
 <p>正統理由：<b>超負荷加擴大</b>。白皮書指 1988–1998 年只有 13% 新案係委員會主動開；仲多十個成員國，中央審批會頂唔順。但 Wilks 強調委員會唔係回應民意壓力，而係<b>追自己議程</b>；用字都由「分權」變成「合作同協調」。</p>`},
{k:'15-3',t:'兩種解讀：重新談判，定「政變」',lv:[],vis:['v-wilks'],b:`<p>兩種都可以用委託代理理論講：委員會係代理人，成員國係委託人，現代化規例係<b>重新談判授權</b>。（委託人設代理人：解決承諾問題、發展專業、提高立規效率、避免捱罵。）</p>
 <p><b>第一種：委託人收返權。</b> DG Competition 同成員國一直有「動態授權」，權力穩步擴大；現代化只係最新一輪，成員國可以透過 NCA 喺網絡入面更直接控制佢。</p>
 <p><b>第二種：委員會搞咗場政變。</b> 唔係分權，而係將各國制度<b>「歐洲化」</b>；授權咁闊、咁冇邊界，DG Competition 變咗<b>受託人</b>而唔係代理人；成員國唔係自願、甚至唔係有意識咁畀，政變被<b>行政功能同法律必要嘅門面</b>掩飾。</p>
 <p>社會學制度主義：委託代理分析遮住授權背後嘅<b>政治目標</b>（推動新自由主義、將競爭置於就業同社會福利之上）。各國 NCA 以 DG Competition 為藍本（制度同形），串成跨國網絡；Majone（2002）話自視為跨國網絡一份子嘅機構，更有動機頂住外來影響。結果：競爭領域出現等同<b>歐洲央行加歐洲中央銀行體系</b>嘅安排。</p>`},
{k:'15-4',t:'支配嘅證據：四方面集中權力',lv:[],vis:['v-wilks'],b:`<p>Wilks 沿用 Majone「政策企業家」傳統，話委員會搞咗場大膽政變：擴權、邊緣化國家競爭法、圍住國家機關。Riley：「政治傑作」，仲認為通知負擔冇講得咁重。「法律唔一致、競爭法重新國家化」嘅陰影，令委員會設計出一份喺四方面集中權力嘅規例：</p>
 <ol><li><b>第 3 條：</b>處理影響成員國之間貿易嘅協議，NCA 一定要適用歐盟法；國家法被邊緣化，細國實際上以歐盟法取代國家法。</li>
 <li><b>第 11(6) 條：</b>所有 NCA 決定都要經 DG Competition 審閱，佢可以取代國家機關、改由自己處理。</li>
 <li><b>ECN：</b>Riley 話係「加強監督同干預嘅紅肉，加上合作嘅金蔥」。</li>
 <li><b>委員會直接權力加強：</b>調查權、程序罰款上限、談判有約束力承諾。</li></ol>
 <p>委託代理語言：典型控制問題，代理人用專業、資訊不對稱同既有地位爭到額外授權，NCA 似乎起碼默許。社會學制度主義再推前：委員會係核心機構，同成員國<b>近乎平等</b>，唔再怕「廢除」呢個最終制裁；連 Majone 都承認委託代理解釋唔到委員會<b>基於條約嘅獨立</b>。現代化即係逼 NCA 跟從歐洲競爭法入面嘅<b>自由市場邏輯</b>。</p>
 <p class="muted">筆記嘅例子：總公司話「放權」畀分店批折扣，但分店每個決定要交總部睇、總部隨時接手、要跟總部價格手冊、總部查數權力仲大咗。筆記對照：Wils 認為 NCA 唔完全獨立於委員會冇問題（第 6 課）。</p>`},
{k:'15-5',t:'ECN：冇法律地位嘅「機械降神」',lv:[],vis:[],b:`<p>規例第四章只講要「緊密合作」，確保合作嘅裝置就係 ECN（「機械降神」）。規例只喺序言第 15–18 段提到網絡，具體安排（分案、交換資料、確保一致）寫喺委員會之後嘅通告。ECN 係政府間系統，傳大量高度機密資料、主要電子運作，但<b>冇法律地位</b>。</p>
 <p>問責係最大問題：直接向國家或布魯塞爾嘅問責線會<b>變模糊</b>。DG Competition、英國 OFT 向邊個問責答得到；ECN 向邊個問責，要先搞清楚佢係乜。越模糊，<b>非多數決兩難越尖銳</b>。佢係一隻怪獸：成員由法例界定、委員會支持，透過近乎「軟法」嘅通告運作，又有政策網絡嘅非正式特徵。各國 NCA 政治獨立程度亦唔同。</p>
 <p>結論：ECN 將 26 個非多數決機構焊埋一齊，成為<b>「超非多數決機構」</b>，問責<b>雙重唔清楚</b>。</p>`},
{k:'15-6',t:'風險同法律化',lv:[],vis:[],b:`<p><b>如果真係分權</b>，六個風險：技術同程序（監督負擔追上以前嘅通知負擔）；國家主義（成員國優先照顧自己目標）；更易被游說（NCA 直接管本國大企業後，<b>獨立可能受損</b>）；部分 NCA 能力不足；行政、法律、經濟文化差異；企業反應（包括揀法院）。</p>
 <p><b>如果係委員會支配</b>（帝國式擴張）：兩個風險：較大較強嘅 NCA 反彈；同埋<b>法律化</b>（juridification），可能成為規管歐洲經濟嘅破壞力量。</p>
 <p>法律化亦解答謎題：成員國點解肯通過？因為論據由法律專家、用法律話語、透過<b>知識社群</b>（委員會、NCA、法院、私人執業律師）一致推動，成員國官員同部長被論據嘅份量同一致性說服。法律化即法律同法律程序影響力增加；難題係技術官僚式嘅法律程序點樣顧及社會優先次序。</p>
 <p>結論：委託代理理論可以解釋 Regulation 17，但解釋唔到 Regulation 1/2003。警告：法律可能要求機關以違背<b>就業、社會福利、技術發展、產業選址</b>等國家利益嘅方式行事，甚至違反合理經濟分析，引來反彈。</p>`},
{k:'08-1',t:'NCA 做咗九成執法；ECN+ 指令第 4 條',lv:[],vis:['v-wils'],b:`<p>自 2004 年 Regulation 1/2003 生效，各國 NCA 成為執行 TFEU 第 101、102 條嘅主力，作出<b>超過九成決定</b>，所以佢哋獨唔獨立好重要。</p>
 <p>諮詢反映問題：聯邦卡特爾局話知道有大成員國嘅 NCA 首長，據報因為政府唔同意佢嘅決定而<b>被提早撤職</b>。</p>
 <p>ECN+ 指令（Directive (EU) 2019/1）第 4 條：</p>
 <ul><li>4(1)：<b>公正</b>咁、為有效同一致執行而行使權力，受<b>相稱嘅問責</b>要求約束；</li>
 <li>4(2)(b)：決策者唔可以尋求或接受政府或其他公私實體嘅<b>指示</b>；</li>
 <li>4(3)：唔可以因為正當履職而被<b>撤職</b>。</li></ul>`},
{k:'08-2',t:'獨立唔係想點就點',lv:[],vis:['v-wils'],b:`<p>字典話「獨立」即係唔受任何人控制、想點就點；Wils 話從公眾利益角度<b>唔係好事</b>。獨立唔應該係懶惰、低效、失職、唔透明、任意、自肥、貪污、濫權嘅<b>牌照</b>；所以一般接受獨立同問責要<b>一齊行</b>。</p>
 <p>既然獨立＝冇控制、問責＝有控制，關鍵係分清<b>邊啲控制唔適當、邊啲適當</b>。歐盟法院喺 <i>Wilson</i> 案講法院獨立：要受保護，免受<b>「可能危害」</b>成員獨立判斷嘅外來干預或壓力。Wils 話呢個限定好有用，正正反映要分適當同唔適當控制。</p>`},
{k:'08-3',t:'點解要獨立：平等對待同防止俘虜',lv:[],vis:['v-wils'],b:`<p>Wils 嘅理據唔係專業或可信承諾，而係<b>平等對待</b>：歐盟法院話冇扭曲嘅競爭制度，要確保各經營者<b>機會平等</b>先保證到。同一理由要求權力覆蓋全經濟嘅競爭機關，獨立於<b>所有公私經濟經營者</b>。</p>
 <p>第二個作用：防止<b>監管俘虜</b>，即受託為公眾利益監管嘅機構，最後認同被監管企業、替佢哋說話。John Kay：最常見係「老實」嘅<b>知性俘虜</b>。Wils 話會喺職員覺得要向一個<b>結構上偏向大企業</b>嘅競爭專家社群負責時出現：主導企業係律師最大嘅客，好多學者兼做執業者，而得益者（消費者、細企）分散、冇組織。</p>
 <p class="muted">筆記對照：Townley 同樣話知識社群偏袒某啲利益，但兩人結論唔同：Townley 要減少獨立，Wils 要加強獨立。</p>`},
{k:'08-4',t:'獨立於政府：個案唔准插手',lv:[],vis:['v-wils'],b:`<p>防止唔平等對待嘅同一理由，亦要求獨立於<b>本國政府同政治干預</b>：唔應該有企業因為有政治支持而被優待（例如國企）。所以要將政府、其他公共機構同民選政客<b>排除喺個別案件</b>之外。</p>
 <p>但獨立機構就<b>一般活動</b>向政府或議會負責（尤其透過<b>年報</b>）係正常嘅。指令亦反映呢條界線：政府可以發一般政策規則，但唔可以涉及具體案件。</p>`},
{k:'08-5',t:'委員會、ECN 同司法覆核',lv:[],vis:['v-wils'],b:`<p>NCA 唔完全獨立於委員會：委員會開案，NCA 就失去管轄權。Wils 話<b>冇問題</b>：條約將定義歐盟競爭政策方向嘅責任交咗畀委員會；而且 NCA 喺本國受壓時可以<b>搬委員會嘅權威出嚟</b>。ECN 只有競爭機關，冇大企業知性俘虜嘅同樣風險。</p>
 <p><b>司法覆核</b>唔會限制（正確理解下嘅）獨立，反而<b>加強</b>：例如政治壓力要求罰外國卡特爾成員重過本國成員，法院可以糾正，壓力就冇用；投訴人可以申請覆核，保護 NCA 唔受「唔好查政治上受寵企業」嘅壓力。</p>
 <p class="muted">筆記對照：Wilks 將第 11(6) 條取代權列為委員會集中權力嘅證據；Scott 話司法覆核有時會壓過其他問責渠道（Part 3）。</p>`},
{k:'08-6',t:'法律上同實際獨立；訂優先次序',lv:[],vis:[],b:`<p>法律上（de jure）同實際（de facto）獨立<b>唔一定一致</b>，實際獨立視乎政治同行政文化、機構歷史同首長性格。但落差<b>唔係唔立法保障獨立嘅理由</b>。David Currie：喺一種文化有助獨立嘅機制，喺另一種文化可能變成<b>顛覆獨立嘅工具</b>；所以歐盟只應立最基本嘅最低要求。</p>
 <p><b>訂優先次序：</b>第 4(5) 條畀 NCA 權決定執法優先次序，可以「唔係優先」為由拒絕投訴。只有「獨立咁訂優先次序、政府唔插手個案」真係關乎獨立。冇其他足夠保障時，呢個權反而可能<b>削弱獨立</b>：例如首長想連任、決定權喺部長手、投訴又涉及部長嘅國企。相反，德國<b>冇投訴人權利</b>，但聯邦卡特爾局照樣係最獨立嘅 NCA 之一。</p>`}
];

/* ===================== FLASHCARDS ===================== */
const TYPE_ZH={fact:'事實',definition:'定義',conceptual:'概念',cause:'因果',evaluation:'評價',normative:'主張'};
function cardsPage(arg){
  const [note,sec]=(arg||'').split('-');
  const pool=CARDS_DATA.filter(c=>(!note||c.n===note)&&(!sec||c.s===+sec));
  let mode='unknown', order=[], idx=0, flipped=false;
  function build(){
    const known=store.get().known||{};
    order=pool.filter(c=>mode==='all'||!known[c.id]).map(c=>c.id);
    idx=0; flipped=false;
  }
  function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;flipped=false;render();}
  function render(){
    const known=store.get().known||{};
    const kn=pool.filter(c=>known[c.id]).length;
    const scope=note?`${note} ${NOTES_META[note].t}${sec?` · §${sec} ${NOTES.find(x=>x.k===note+'-'+sec).t}`:''}`:'全部筆記';
    let card='';
    if(!order.length){ card=`<div class="fcard done"><div><h3>呢副卡你已經全部識晒 🎉</h3><p class="muted">轉「全部卡」可以再溫一次。</p></div></div>`; }
    else{
      const c=CARDS[order[idx]];
      card=`<div class="fcard ${flipped?'flip':''}" id="fc" tabindex="0" role="button" aria-label="撳一下反卡">
        ${!flipped?`<div class="ff"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fq">${c.f}</div><span class="muted" style="font-size:13px">撳一下（或者按空白鍵）睇答案</span></div>`
        :`<div class="fb"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fa">${c.b}</div><blockquote>“${c.q}”</blockquote><span class="src">原文出處：${c.loc}</span></div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" id="bad">✗ 未識，等陣再嚟</button><button class="btn primary" id="good">✓ 識咗</button></div>`;
    }
    app.innerHTML=`<div class="lvhead"><span class="eyebrow">快速卡 · ${scope}</span>
      <div class="tabs"><button class="tab ${!note?'on':''}" data-n="">全部</button>${NOTE_ORDER.map(n=>`<button class="tab ${n===note?'on':''}" data-n="${n}">${n} ${NOTES_META[n].t}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="muted">呢副 ${pool.length} 張 · 識咗 ${kn} · 呢輪剩 ${order.length?order.length-idx:0}</span>
      <div class="row"><button class="btn ghost sm" id="mode">${mode==='all'?'只溫未識':'全部卡'}</button><button class="btn ghost sm" id="shuf">洗牌</button><button class="btn ghost sm" id="reset">清除「識咗」</button></div></div>
      <div class="progress"><i style="width:${pool.length?kn/pool.length*100:0}%"></i></div></div>
      ${card}
      <p class="muted" style="margin-top:14px;font-size:13.5px">卡面係我寫嘅問題；卡背係筆記入面嘅原子命題（中文）同原文英文引文，一字不改。卡背會出現人名，你唔使記，專心睇論點就得。</p>`;
    app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.n?'cards-'+b.dataset.n:'cards';});
    $('#mode').onclick=()=>{mode=mode==='all'?'unknown':'all';build();render();};
    $('#shuf').onclick=shuffle;
    $('#reset').onclick=()=>{const k=store.get().known||{};pool.forEach(c=>delete k[c.id]);store.set('known',k);build();render();};
    const fc=$('#fc'); if(fc){ fc.onclick=()=>{flipped=!flipped;render();$('#fc')&&$('#fc').focus();}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click();}}; }
    const g=$('#good'), b=$('#bad');
    if(g) g.onclick=()=>{const k=store.get().known||{};k[order[idx]]=true;store.set('known',k);next(true);};
    if(b) b.onclick=()=>next(false);
  }
  function next(ok){ if(!ok){ order.push(order[idx]); } idx++; flipped=false; if(idx>=order.length){ build(); } render(); }
  build(); render();
}

const mo=new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.classList&&n.classList.contains('en'))return; scan(n);}));});
