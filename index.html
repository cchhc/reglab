<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<title>監管實驗室</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+HK:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a regulator's desk — hub of four "case files"; each opens a playable level. Stamps deliver verdicts. */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface2:#F6F8F4; --ink:#16233B; --muted:#5E6B7A; --line:#D2D8CF;
  --accent:#3D4BD6; --accent-soft:#E3E6FB;
  --good:#1E8A57; --warn:#B57A06; --bad:#C2362C;
  --area-a:#C2362C; --area-c:#E3A600; --area-cs:#3D4BD6;
  --f-display:"LXGW WenKai TC","Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151F; --surface:#18202D; --surface2:#1E2735; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2C3647;
  --accent:#8F99FF; --accent-soft:#262E52; --good:#4CC38A; --warn:#E9B949; --bad:#F07167;
  --area-a:#F07167; --area-c:#E9B949; --area-cs:#8F99FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#18202D; --surface2:#1E2735; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2C3647;
  --accent:#8F99FF; --accent-soft:#262E52; --good:#4CC38A; --warn:#E9B949; --bad:#F07167;
  --area-a:#F07167; --area-c:#E9B949; --area-cs:#8F99FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(30px,6vw,46px);font-weight:700}
h2{font-size:clamp(22px,4vw,30px);font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;transition:transform .12s, background .12s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--surface2)}
.tag.mine{border-color:var(--warn);color:var(--warn)}
.src{font-size:12.5px;color:var(--muted)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top .home{background:none;border:none;font-family:var(--f-display);font-size:20px;font-weight:700;padding:0}
.top .home span{color:var(--accent)}

/* hub */
.hero{display:grid;gap:12px;margin-bottom:26px}
.hero p{max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.file{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,transform .15s}
.file:hover{border-color:var(--ink);transform:translateY(-2px)}
.file .q{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.3}
.file .what{font-size:14px;color:var(--muted)}
.file .lv{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.file .done{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;color:var(--good);border:1.5px solid var(--good);border-radius:5px;padding:0 6px;transform:rotate(6deg)}
.thread{margin-top:28px;background:var(--surface2);border:1px dashed var(--line);border-radius:var(--r);padding:16px 18px}
.thread ol{margin:8px 0 0;padding-left:22px}

/* panels */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.lvhead{display:grid;gap:6px;margin-bottom:18px}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* stamp */
.stamp{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:22px;padding:2px 14px;border:3px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.stamp.good{color:var(--good)} .stamp.warn{color:var(--warn)} .stamp.bad{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.reveal{border-top:1.5px dashed var(--line);margin-top:16px;padding-top:16px;display:grid;gap:10px}
.reveal ul{margin:0;padding-left:20px}

/* swipe game */
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:18px;padding:26px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:6px 6px 0 var(--line)}
.card .txt{font-family:var(--f-display);font-size:clamp(20px,4vw,26px);font-weight:700;line-height:1.4}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;font-weight:700;display:grid;gap:2px;text-align:center}
.choice small{font-weight:400;color:var(--muted);font-size:12px}
.choice:hover{border-color:var(--ink)}
.target{display:grid;place-items:center;margin:4px 0 0}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--surface2)}
.chk b{display:block;font-size:12px;color:var(--muted);font-weight:700}

/* lobby */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.meter{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meter .lab{font-size:12.5px;color:var(--muted);font-weight:700}
.meter .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;transition:width .5s}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt b{font-size:16px}
.opt span{font-size:13.5px;color:var(--muted)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.log{font-size:14px;display:grid;gap:4px;margin-top:14px}
.scene{background:var(--surface2);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px}

/* price */
.pricegrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.pricegrid{grid-template-columns:1fr}}
.chart{width:100%;height:auto;max-width:100%;display:block}
.sl{width:100%;accent-color:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.num .k{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.num .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.lens{display:flex;flex-wrap:wrap;gap:8px}
.lens button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.lens button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.verdict{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:700}
.chal{display:grid;gap:8px}
.chal div{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.chal .box{flex:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:13px;margin-top:3px}
.chal .ok .box{background:var(--good);border-color:var(--good);color:#fff}


/* tutorial */
.tut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.tut{grid-template-columns:1fr}}
.tut .say{display:grid;gap:12px}
.tut .say p{max-width:60ch}
.big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.eq{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.check{border:1.5px dashed var(--accent);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--accent-soft)}
.check .opts{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--accent)}
details.help{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
details.help summary{cursor:pointer;font-weight:700}
details.help dl{margin:10px 0 0;display:grid;gap:8px}
details.help dt{font-weight:700}
details.help dd{margin:0;color:var(--muted);font-size:14.5px}
.primer{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.term{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.term h3{font-size:17px}
.term .eg{font-size:14px;color:var(--muted)}


/* nav */
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav a{font-size:14px;font-weight:700;text-decoration:none;color:var(--muted);border:1.5px solid transparent;border-radius:999px;padding:5px 12px}
.nav a.on{color:var(--ink);border-color:var(--ink)}
.nav a:hover{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.tab.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.chip{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:2px 10px;background:var(--surface)}
.chip.ok{color:var(--good);border-color:var(--good)}
.links{gap:8px;margin-top:4px}
.nbody{display:grid;gap:8px}
.nbody ul{margin:0;padding-left:20px;display:grid;gap:6px}
.readchk{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.route span.step{border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--surface)}
/* judge */
.lensgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.lenscard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2);display:grid;gap:6px;min-width:0}
.lenscard .lh{font-weight:700;font-size:14px;color:var(--muted)}
.lenscard .lv2{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--accent)}
/* flashcards */
.fcard{min-height:260px;border:1.5px solid var(--ink);border-radius:18px;background:var(--surface);box-shadow:6px 6px 0 var(--line);padding:24px 22px;display:grid;align-items:center;cursor:pointer;margin-top:10px}
.fcard.flip{background:var(--surface2)}
.fcard.done{cursor:default;text-align:center}
.ff,.fb{display:grid;gap:12px}
.fq{font-family:var(--f-display);font-size:clamp(21px,4vw,28px);font-weight:700;line-height:1.4}
.fa{font-size:17px;font-weight:500}
.fcard blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 12px;font-size:14.5px;color:var(--muted);font-style:italic}
/* visuals */
.vis{width:100%;height:auto;max-width:100%;display:block;font-family:var(--f-body)}
.viswrap{overflow-x:auto;margin-top:8px}
.viswrap .vis{min-width:560px}
.fo{font-size:12.5px;line-height:1.45;color:var(--ink);display:grid;gap:4px}
.fo p{margin:0}.fo.c{text-align:center}
/* map */
.tablewrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
table.map{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.map th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line)}
table.map td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.map td.c{text-align:center}
table.map tr.nh td{background:var(--surface2)}
table.map a{color:var(--ink)}
.okb{font-size:12px;font-weight:700;color:var(--good);border:1.5px solid var(--good);border-radius:5px;padding:0 6px}

@media (max-width:520px){.choices{grid-template-columns:1fr}.meters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px">
 <form id="gf" style="display:grid;gap:12px;max-width:320px;width:100%;text-align:center">
  <div style="font-family:var(--f-display);font-size:30px;font-weight:700">監管<span style="color:var(--accent)">實驗室</span></div>
  <label for="gp" class="muted">輸入密碼</label>
  <input id="gp" type="password" inputmode="numeric" autocomplete="current-password" style="font-size:22px;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)">
  <button class="btn primary" type="submit">入去</button>
  <p id="ge" style="color:var(--bad);min-height:1.4em"></p>
 </form></div>
<script>(function(){const H='d83036ffb5b49a153bc391fd12b4a10df06bbb200f39fed97c331b03b6833ce7',K='reglab-ok',g=document.getElementById('gate');
 try{if(localStorage.getItem(K)===H){g.remove();return;}}catch(e){}
 document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();
  const v=document.getElementById('gp').value.trim();
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const x=[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('');
  if(x===H){try{localStorage.setItem(K,H)}catch(e){} g.remove();} else document.getElementById('ge').textContent='密碼唔啱，再試一次';});
})();</script>
<div class="wrap">
  <div class="top">
    <button class="home" id="homeBtn" aria-label="返去主頁">監管<span>實驗室</span></button>
    <nav class="nav" id="nav"><a href="#" data-r="">關卡</a><a href="#notes" data-r="notes">讀懂版</a><a href="#cards" data-r="cards">快速卡</a><a href="#visuals" data-r="visuals">圖解</a><a href="#map" data-r="map">進度地圖</a></nav>
  </div>
  <main id="app"></main>
</div>

<script>
(() => {
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('reglab') || '{}'); } catch(e){ return {}; } },
  set(k,v){ try { const o=this.get(); o[k]=v; localStorage.setItem('reglab', JSON.stringify(o)); } catch(e){} }
};
const esc = s => String(s);
const MINE = '<span class="tag mine">例子係我作嘅</span>';

/* ===================== HUB ===================== */
const LEVELS = [
  {id:'swipe', n:'Level 1', q:'算唔算監管？', what:'睇一個做法，判佢係「核心監管」、「邊緣」定「唔算」；再加時估吓研究數據。', note:'筆記 01'},
  {id:'lobby', n:'Level 2', q:'你係游說集團', what:'代表一個行業向政府攞著數。親身睇吓好處點樣到手，又點樣被蝕走、點樣放寬。', note:'筆記 06、02'},
  {id:'families', n:'Level 3', q:'四大家族偵探', what:'13 個個案：每個用公共利益、利益團體、理念定制度解釋最好？仲有四種政治同點解要授權。', note:'筆記 02'},
  {id:'price', n:'Level 4', q:'一個價，兩筆數', what:'先有 6 步入門教學，由一杯咖啡砌到成幅圖；之後拉價格滑桿，睇「浪費咗」同「搬咗位」兩筆數。', note:'筆記 03、07'},
  {id:'judge', n:'Level 5', q:'判案小法官', what:'14 宗案（CECED、工會、超市、國家冠軍……），你先判，再睇三副眼鏡點判。', note:'筆記 03、07'},
  {id:'agency', n:'Level 6', q:'合定拆？', what:'先用日常例子講清五個基本詞；之後你做設計機構嘅人：幾個目標，交畀一個機構定幾個？', note:'筆記 04'},
  {id:'develop', n:'Level 7', q:'新手競爭機構', what:'你係發展中國家新成立嘅競爭機構：定目標、應付五類障礙、搵盟友、諗清楚點樣獨立。', note:'筆記 05'}
];
function hub(){
  const s = store.get();
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">七個關卡＋讀懂版＋232 張卡＋11 幅圖 · 唔使記人名，只要明條邏輯</span>
    <h1>監管係乜、點解有、為咗乜</h1>
    <p class="muted">每一關都係「你先揀，再睇點解」。答錯唔緊要，重點係睇返講解，明白每個答案背後嘅推理。標住 <span class="tag mine">例子係我作嘅</span> 嘅係練習用嘅例子，唔係筆記原文；講解入面嘅道理就跟足筆記。</p>
    <div class="route"><b>建議用法：</b><span class="step">① 讀懂版（一篇）</span>→<span class="step">② 玩對應關卡</span>→<span class="step">③ 嗰篇嘅快速卡</span>→<span class="step">④ 圖解一眼溫</span>→<span class="step">⑤ 進度地圖睇漏咗乜</span></div>
    <p class="muted" style="font-size:14px">成個 folder 嘅筆記共 7 篇 47 節，每一節都至少有讀懂版同快速卡；有推理嘅部分再有關卡同圖。</p>
  </section>
  <div class="grid">
    ${LEVELS.map(l=>`

function price(){
  const st={P:45, merger:false, lens:'eff', done:{a:false,b:false,c:false}, tut:0};
  const MC0=20;
  const calc=(P,MC)=>{ P=Math.max(P,MC); const Q=Math.max(0,100-P); const CS=0.5*Q*(100-P); const PS=(P-MC)*Q; const TW=CS+PS; const A=0.5*(P-MC)*(P-MC); return {P,Q,CS,PS,TW,A}; };
  const baseline=calc(MC0,MC0); // competitive, pre-merger
  function chart(r,MC){
    const W=360,H=300,L=40,B=34,T=12,R=12;
    const x=q=>L+(q/100)*(W-L-R), y=p=>H-B-(p/100)*(H-B-T);
    const {P,Q}=r;
    const csPts=`${x(0)},${y(100)} ${x(0)},${y(P)} ${x(Q)},${y(P)}`;
    const cPts=`${x(0)},${y(MC)} ${x(0)},${y(P)} ${x(Q)},${y(P)} ${x(Q)},${y(MC)}`;
    const aPts=`${x(Q)},${y(P)} ${x(Q)},${y(MC)} ${x(100-MC)},${y(MC)}`;
    const dim=k=>({eff:{cs:.18,c:.18,a:.85},dist:{cs:.25,c:.85,a:.2},con:{cs:.85,c:.3,a:.3}}[st.lens][k]);
    const ticks=[0,20,40,60,80,100];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="需求線、成本線同價格；三塊面積分別係消費者剩餘、搬咗位嘅錢 C、同浪費咗嘅 A">
      ${ticks.map(t=>`<line x1="${x(0)}" x2="${x(100)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`).join('')}
      ${ticks.map(t=>`<text x="${x(t)}" y="${H-B+15}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`).join('')}
      <text x="${x(100)}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--muted)">數量 Q</text>
      <text x="${L+4}" y="${T+8}" font-size="11" fill="var(--muted)">價錢 P</text>
      <polygon points="${csPts}" fill="var(--area-cs)" fill-opacity="${dim('cs')}"/>
      <polygon points="${cPts}" fill="var(--area-c)" fill-opacity="${dim('c')}"/>
      <polygon points="${aPts}" fill="var(--area-a)" fill-opacity="${dim('a')}"/>
      <line x1="${x(0)}" y1="${y(100)}" x2="${x(100)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="2"/>
      <line x1="${x(0)}" y1="${y(MC)}" x2="${x(100)}" y2="${y(MC)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
      ${st.merger?`<line x1="${x(0)}" y1="${y(MC0)}" x2="${x(100)}" y2="${y(MC0)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4"/><text x="${x(100)}" y="${y(MC0)-4}" text-anchor="end" font-size="10" fill="var(--muted)">合併前成本 20</text>`:''}
      <line x1="${x(0)}" y1="${y(P)}" x2="${x(Q)}" y2="${y(P)}" stroke="var(--accent)" stroke-width="2.5"/>
      <circle cx="${x(Q)}" cy="${y(P)}" r="5" fill="var(--accent)"/>
      <text x="${x(78)}" y="${y(30)}" font-size="11" fill="var(--ink)">需求</text>
      <text x="${x(100)}" y="${y(MC)+14}" text-anchor="end" font-size="11" fill="var(--ink)">成本 MC＝${MC}</text>
      ${Q>8?`<text x="${x(Q*0.22)}" y="${y((100+P)/2)+18}" font-size="12" font-weight="700" fill="var(--ink)">CS</text>`:''}
      ${P-MC>6?`<text x="${x(Q/2)}" y="${y((P+MC)/2)+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">C</text>`:''}
      ${P-MC>10?`<text x="${x(Q+(100-MC-Q)/3)}" y="${y(MC+(P-MC)/3)+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">A</text>`:''}
    </svg>`;
  }
  function verdict(r,MC){
    const f=n=>Math.round(n).toLocaleString('en');
    if(st.lens==='eff'){
      return r.A<1? `<b>效率眼鏡：</b>A＝0，冇浪費。價錢等於成本，總福利最大。<br><span class="muted">但要留意將來：利潤咁薄，企業可能冇誘因投資同創新。</span>`
        : `<b>效率眼鏡：</b>呢個價浪費咗 <span class="mono">${f(r.A)}</span>（A）。有啲人肯畀高過成本嘅價，但因為價太高而冇買，呢部分冇人得益。<br><span class="muted">只睇效率嘅人，關心嘅係 A；C 只係錢由一邊搬去另一邊，總數冇變，佢哋話交畀稅制處理。</span>`;
    }
    if(st.lens==='dist'){
      return r.P<=MC? `<b>分配眼鏡：</b>C＝0，冇錢由消費者搬去企業。`
        : `<b>分配眼鏡：</b><span class="mono">${f(r.PS)}</span>（C）由消費者袋搬咗去企業袋。<br><span class="muted">反方嘅講法：管唔管呢個價，本身就係決定 C 落喺邊個袋，所以分配永遠趕唔走；「之後用稅制分返」亦唔一定做得到。</span>`;
    }
    // consumer lens
    const d=r.CS-baseline.CS, t=r.TW-baseline.TW;
    let s=`<b>消費者眼鏡：</b>消費者剩餘 <span class="mono">${f(r.CS)}</span>，比完全競爭（價＝20）時${d<0?'少':'多'}咗 <span class="mono">${f(Math.abs(d))}</span>。`;
    if(st.merger) s+=`<br>同一刻，總福利${t>=0?'升':'跌'}咗 <span class="mono">${f(Math.abs(t))}</span>。${t>0&&d<0?'<br><b>兩個標準分岔咗：</b>只睇總福利嘅監管者會批准呢宗合併；用消費者標準嘅會唔批。':''}`;
    return s;
  }

  /* ---- guided tutorial ---- */
  function tchart(P, show, MC=MC0){
    const W=360,H=300,L=40,B=34,T=12,R=12;
    const x=q=>L+(q/100)*(W-L-R), y=p=>H-B-(p/100)*(H-B-T);
    const Q=100-P; const has=k=>show.includes(k);
    const ticks=[0,20,40,60,80,100];
    let g='';
    g+=ticks.map(t=>`<line x1="${x(0)}" x2="${x(100)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`).join('');
    g+=ticks.map(t=>`<text x="${x(t)}" y="${H-B+15}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`).join('');
    g+=`<text x="${x(100)}" y="${H-4}" text-anchor="end" font-size="11" fill="var(--muted)">排第幾個客（數量 Q）</text><text x="${L+16}" y="${T+8}" font-size="11" fill="var(--muted)">$（價錢 P）</text>`;
    if(has('cs')) g+=`<polygon points="${x(0)},${y(100)} ${x(0)},${y(P)} ${x(Q)},${y(P)}" fill="var(--area-cs)" fill-opacity=".55"/>`;
    if(has('c')) g+=`<polygon points="${x(0)},${y(MC)} ${x(0)},${y(P)} ${x(Q)},${y(P)} ${x(Q)},${y(MC)}" fill="var(--area-c)" fill-opacity=".6"/>`;
    if(has('a')) g+=`<polygon points="${x(Q)},${y(P)} ${x(Q)},${y(MC)} ${x(100-MC)},${y(MC)}" fill="var(--area-a)" fill-opacity=".7"/>`;
    if(has('line')) g+=`<line x1="${x(0)}" y1="${y(100)}" x2="${x(100)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="2"/><text x="${x(58)}" y="${y(50)}" font-size="11" fill="var(--ink)">需求線</text>`;
    if(has('dots')){
      for(let k=0;k<20;k++){ const q=2.5+k*5, wtp=100-q; const buy=has('price')&&wtp>=P; const lost=has('a')&&!buy&&wtp>=MC;
        g+=`<circle cx="${x(q)}" cy="${y(wtp)}" r="4.2" fill="${buy?'var(--accent)':(lost?'var(--area-a)':'var(--surface)')}" stroke="${buy?'var(--accent)':(lost?'var(--area-a)':'var(--muted)')}" stroke-width="1.5"/>`; }
    }
    if(has('mc')) g+=`<line x1="${x(0)}" y1="${y(MC)}" x2="${x(100)}" y2="${y(MC)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${x(100)}" y="${y(MC)+14}" text-anchor="end" font-size="11" fill="var(--ink)">每件成本 ${MC}</text>`;
    if(has('price')) g+=`<line x1="${x(0)}" y1="${y(P)}" x2="${x(100)}" y2="${y(P)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="1 0"/><text x="${x(99)}" y="${y(P)-5}" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)">售價 ${P}</text>`;
    if(has('qline')) g+=`<line x1="${x(Q)}" y1="${y(0)}" x2="${x(Q)}" y2="${y(P)}" stroke="var(--accent)" stroke-dasharray="3 3"/><text x="${x(Q)}" y="${y(0)-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">${Q} 人買</text>`;
    if(has('cs')) g+=`<text x="${x(Q*0.22)}" y="${y((100+P)/2)+18}" font-size="12" font-weight="700" fill="var(--ink)">CS</text>`;
    if(has('c')) g+=`<text x="${x(Q/2)}" y="${y((P+MC)/2)+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">C</text>`;
    if(has('a')) g+=`<text x="${x(Q+(100-MC-Q)/3)}" y="${y(MC+(P-MC)/3)+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">A</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="教學圖">${g}</svg>`;
  }

  function tutorial(){

      <div class="progress"><i style="width:${(k/TUT.length)*100}%"></i></div></div>

        <div class="say"><h2>${t.h}</h2>${t.body}
          <div class="check"><b>考吓自己：${t.check.q}</b>
            <div class="opts" id="tq">${t.check.opts.map((o,j)=>`<button class="opt" data-j="${j}"><b>${o}</b></button>`).join('')}</div>
            <div id="tex"></div></div>
        </div>
      </div>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <div class="row">${k>0?'<button class="btn ghost" id="tb">← 上一步</button>':''}<button class="btn ghost" id="skip">跳過教學，直接玩</button></div>
        <button class="btn primary" id="tn">${k+1<TUT.length?'下一步 →':'開始玩 →'}</button>
      </div>
    </div>`;
    app.querySelectorAll('#tq .opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j, ok=j===t.check.ans;
      app.querySelectorAll('#tq .opt').forEach(x=>x.classList.toggle('picked',x===b));
      $('#tex').innerHTML=`<div class="row"><span class="stamp ${ok?'good':'bad'}">${ok?'啱':'再諗'}</span>${ok?'':`<span>答案：<b>${t.check.opts[t.check.ans]}</b></span>`}</div><p style="margin-top:6px">${t.check.ex}</p>`;
    });
    $('#tn').onclick=()=>{ if(k+1<TUT.length){st.tut++;tutorial();} else {st.tut=null; store.set('priceTut',true); shell();} window.scrollTo(0,0); };
    const tb=$('#tb'); if(tb) tb.onclick=()=>{st.tut--;tutorial();window.scrollTo(0,0);};
    $('#skip').onclick=()=>{st.tut=null; store.set('priceTut',true); shell();};
  }
