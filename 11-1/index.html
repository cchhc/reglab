/* ===================== FLASHCARDS ===================== */
const TYPE_ZH={action:'行動',fact:'事實',definition:'定義',conceptual:'概念',cause:'因果',evaluation:'評價',normative:'主張'};
function cardsPage(arg){
  const [note,sec]=(arg||'').split('-');
  const pool=CARDS_DATA.filter(c=>(!note||c.n===note)&&(!sec||c.s===+sec));
  let mode='unknown', order=[], idx=0, flipped=false;
  function build(){
    const known=store.get().known||{};
    order=pool.filter(c=>mode==='all'||!known[c.id]).map(c=>c.id);
    idx=0; flipped=false;
  }
  function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;flipped=false;render();}
  function render(){
    const known=store.get().known||{};
    const kn=pool.filter(c=>known[c.id]).length;
    const scope=note?`${note} ${NOTES_META[note].t}${sec?` · §${sec} ${NOTES.find(x=>x.k===note+'-'+sec).t}`:''}`:'全部筆記';
    let card='';
    if(!order.length){ card=`<div class="fcard done"><div><h3>呢副卡你已經全部識晒 🎉</h3><p class="muted">轉「全部卡」可以再溫一次。</p></div></div>`; }
    else{
      const c=CARDS[order[idx]];
      card=`<div class="fcard ${flipped?'flip':''}" id="fc" tabindex="0" role="button" aria-label="撳一下反卡">
        ${!flipped?`<div class="ff"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fq">${c.f}</div><span class="muted" style="font-size:13px">撳一下（或者按空白鍵）睇答案</span></div>`
        :`<div class="fb"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fa">${c.b}</div><blockquote>“${c.q}”</blockquote><span class="src">原文出處：${c.loc}</span></div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" id="bad">✗ 未識，等陣再嚟</button><button class="btn primary" id="good">✓ 識咗</button></div>`;
    }
    app.innerHTML=`<div class="lvhead"><span class="eyebrow">快速卡 · ${scope}</span>
      <div class="tabs"><button class="tab ${!note?'on':''}" data-n="">全部</button>${NOTE_ORDER.map(n=>`<button class="tab ${n===note?'on':''}" data-n="${n}">${n} ${NOTES_META[n].t}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="muted">呢副 ${pool.length} 張 · 識咗 ${kn} · 呢輪剩 ${order.length?order.length-idx:0}</span>
      <div class="row"><button class="btn ghost sm" id="mode">${mode==='all'?'只溫未識':'全部卡'}</button><button class="btn ghost sm" id="shuf">洗牌</button><button class="btn ghost sm" id="reset">清除「識咗」</button></div></div>
      <div class="progress"><i style="width:${pool.length?kn/pool.length*100:0}%"></i></div></div>
      ${card}
      <p class="muted" style="margin-top:14px;font-size:13.5px">卡面係我寫嘅問題；卡背係筆記入面嘅原子命題（中文）同原文英文引文，一字不改。卡背會出現人名，你唔使記，專心睇論點就得。</p>`;
    app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.n?'cards-'+b.dataset.n:'cards';});
    $('#mode').onclick=()=>{mode=mode==='all'?'unknown':'all';build();render();};
    $('#shuf').onclick=shuffle;
    $('#reset').onclick=()=>{const k=store.get().known||{};pool.forEach(c=>delete k[c.id]);store.set('known',k);build();render();};
    const fc=$('#fc'); if(fc){ fc.onclick=()=>{flipped=!flipped;render();$('#fc')&&$('#fc').focus();}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click();}}; }
    const g=$('#good'), b=$('#bad');
    if(g) g.onclick=()=>{const k=store.get().known||{};k[order[idx]]=true;store.set('known',k);next(true);};
    if(b) b.onclick=()=>next(false);
  }
  function next(ok){ if(!ok){ order.push(order[idx]); } idx++; flipped=false; if(idx>=order.length){ build(); } render(); }
  build(); render();
}

/* ===================== PROGRESS MAP ===================== */
function mapPage(){
  const st=store.get(), read=st.read||{}, known=st.known||{};
  let tot=0, done=0;
  const rows=NOTE_ORDER.map(n=>{
    const secs=NOTES.filter(x=>x.k.startsWith(n+'-'));
    return `<tr class="nh"><td colspan="5"><b>${n} ${NOTES_META[n].t}</b></td></tr>`+secs.map(x=>{
      const s=+x.k.split('-')[1], cs=cardsIn(n,s), kn=cs.filter(c=>known[c.id]).length;
      const lvDone=!!(st.done&&st.done['l'+n]);
      const ok=read[x.k]&&kn===cs.length&&lvDone; tot++; if(ok) done++;
      return `<tr><td><a href="#notes-${n}" data-sec="${x.k}">§${s} ${x.t}</a></td>
        <td class="c">${read[x.k]?'✓':'—'}</td>
        <td class="c mono">${kn}/${cs.length}</td>
        <td><a class="chip ${lvDone?'ok':''}" href="#lesson-${n}">${LNAME[n]}${lvDone?' ✓':''}</a>
          ${x.vis.map(v=>`<a class="chip" href="#visuals" data-vis="${v}">圖</a>`).join(' ')}</td>
        <td class="c">${ok?'<span class="okb">掌握</span>':''}</td></tr>`}).join('');
  }).join('');
  app.innerHTML=`<div class="lvhead"><span class="eyebrow">進度地圖 · 筆記每一節都喺度</span><h2>${done} / ${tot} 節已經全部做完</h2>
    <p class="muted">一節要「讀懂版已讀」＋「嗰節嘅卡全部識咗」＋「嗰篇嘅課完成」，先算掌握。撳節名會跳去嗰節嘅讀懂版。</p>
    <div class="progress"><i style="width:${done/tot*100}%"></i></div></div>
    <div class="tablewrap"><table class="map"><thead><tr><th>節</th><th>讀懂版</th><th>卡</th><th>課／圖</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  app.querySelectorAll('[data-sec]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.sec;location.hash='notes-'+k.split('-')[0];setTimeout(()=>{const el=document.getElementById(k);if(el)el.scrollIntoView({block:'start'});},60);});
  bindVisLinks();
}

return {visuals,notesPage,cardsPage,mapPage};

function chart(P,MC,opt={}){
  const W=340,H=250,L=34,B=26,T=8,R=8,x=q=>L+(q/100)*(W-L-R),y=p=>H-B-(p/100)*(H-B-T);
  P=Math.max(P,MC); const Q=100-P;
  const show=opt.show||['cs','c','a'];
  let g='';
  [0,20,40,60,80,100].forEach(t=>{g+=`<line x1="${x(0)}" x2="${x(100)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;});
  if(show.includes('cs')) g+=`<polygon points="${x(0)},${y(100)} ${x(0)},${y(P)} ${x(Q)},${y(P)}" fill="var(--cs)" fill-opacity="${opt.dim==='cs'?.15:.5}"/>`;
  if(show.includes('c')&&P>MC) g+=`<polygon points="${x(0)},${y(MC)} ${x(0)},${y(P)} ${x(Q)},${y(P)} ${x(Q)},${y(MC)}" fill="${opt.cColor||'var(--cc)'}" fill-opacity=".65"/>`;
  if(show.includes('a')&&P>MC) g+=`<polygon points="${x(Q)},${y(P)} ${x(Q)},${y(MC)} ${x(100-MC)},${y(MC)}" fill="var(--aa)" fill-opacity=".8"/>`;
  g+=`<line x1="${x(0)}" y1="${y(100)}" x2="${x(100)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="2.2"/>`;
  g+=`<line x1="${x(0)}" y1="${y(MC)}" x2="${x(100)}" y2="${y(MC)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${x(100)}" y="${y(MC)+13}" text-anchor="end" font-size="11" fill="var(--ink)">成本 ${MC}</text>`;
  if(opt.old) g+=`<line x1="${x(0)}" y1="${y(opt.old)}" x2="${x(100)}" y2="${y(opt.old)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${x(100)}" y="${y(opt.old)-4}" text-anchor="end" font-size="10" fill="var(--muted)">合併前成本 ${opt.old}</text>`;
  g+=`<line x1="${x(0)}" y1="${y(P)}" x2="${x(Q)}" y2="${y(P)}" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${x(Q)}" cy="${y(P)}" r="6" fill="var(--accent)"/>`;
  g+=`<text x="${x(Q)+8}" y="${y(P)-6}" font-size="12" font-weight="700" fill="var(--accent)">售價 ${P}</text>`;
  if(show.includes('cs')&&Q>10) g+=`<text x="${x(Q*.2)}" y="${y((100+P)/2)+16}" font-size="13" font-weight="900" fill="var(--ink)">CS</text>`;
  if(show.includes('c')&&P-MC>7) g+=`<text x="${x(Q/2)}" y="${y((P+MC)/2)+5}" text-anchor="middle" font-size="14" font-weight="900" fill="var(--ink)">C</text>`;
  if(show.includes('a')&&P-MC>12) g+=`<text x="${x(Q+(100-MC-Q)/3)}" y="${y(MC+(P-MC)/3)+5}" text-anchor="middle" font-size="13" font-weight="900" fill="var(--ink)">A</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="需求線、成本線同售價">${g}</svg>`;
}
const calc=(P,MC)=>{P=Math.max(P,MC);const Q=100-P;return{Q,CS:.5*Q*(100-P),C:(P-MC)*Q,A:.5*(P-MC)**2,TW:.5*Q*(100-P)+(P-MC)*Q};};

  const cols=['#4B4FD9','#1F9D62','#E5A800','#D2423A'];
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*5,c:cols[Math.floor(Math.random()*4)]}));
  let t=0; (function fr(){x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++t<150) requestAnimationFrame(fr); else c.remove();})();
}
function sub(title,fn,arg){

}
function route(){
  const h=location.hash.replace('#',''); const base=h.split('-')[0], arg=h.slice(base.length+1);

  else if(base==='map') sub('進度地圖','mapPage');
  else if(base==='lesson'){const k=LESSONS.findIndex(l=>l.note===arg); if(k>=0){const st=S(); const ok=k===0||st.done[LESSONS[k-1].id]; ok?play(k):home();} else home();}

}
window.addEventListener('hashchange',route);

})();

<script>const TERMS_DATA=[["反壟斷", "antitrust", "m"], ["利益團體", "interest groups", "n"], ["旋轉門", "revolving door", "m"], ["工作小組", "working group", "m"], ["競爭主管機關", "competition authority", "n"], ["國際法", "international law", "m"], ["事實上", "de facto", "n"], ["市場力量", "market power", "n"], ["一束合約", "nexus of contracts", "m"], ["不完全合約", "incomplete contracts", "m"], ["剩餘控制權", "residual control rights", "n"], ["爭租", "rent-seeking", "m"], ["Medici 惡性循環", "Medici vicious circle", "n"], ["贏家通食", "winner-take-all", "m"], ["鍍金時代", "Gilded Age", "n"], ["進步時代", "Progressive Era", "m"], ["新政", "New Deal", "m"], ["純利份額", "pure profit share", "m"], ["勞動份額", "labour share", "m"], ["網絡效應", "network effects", "m"], ["垂直政治整合", "vertical political integration", "m"], ["政治庇護", "political patronage", "m"], ["產權", "property rights", "m"], ["企業民主", "corporate democracy", "m"], ["資源互相依賴", "resource dependency", "n"], ["內部人", "insiders", "m"], ["信譽", "reputation", "m"], ["對標", "benchmarking", "n"], ["價格上限", "price cap", "m"], ["暴利稅", "windfall tax", "m"], ["卡特爾局", "Bundeskartellamt (BKartA)", "n"], ["揀場", "venue shopping", "n"], ["沉沒成本", "sunk costs", "n"], ["監察", "policing", "n"], ["遵從", "compliance", "n"], ["反向俘虜", "reverse capture", "n"], ["策略意識", "strategic awareness", "n"], ["資本主義多樣性", "varieties of capitalism", "n"], ["和解式遊說", "conciliatory lobbying", "m"], ["公告同評論", "notice and comment", "m"], ["行政程序法", "Administrative Procedure Act (APA)", "m"], ["公益團體", "public interest groups", "m"], ["行業協會", "trade associations", "m"], ["內容分析", "content analysis", "m"], ["做牌", "stacking the deck", "m"], ["火警鐘", "fire alarm", "m"], ["合乎邏輯延伸", "logical outgrowth", "m"], ["協商式規則制定", "negotiated rulemaking", "m"], ["諮詢委員會", "advisory committee", "m"], ["萬應靈丹", "panacea", "m"], ["共識", "consensus", "m"], ["遊說", "lobbying", "m"], ["司法覆核", "judicial review", "n"], ["監管俘虜", "regulatory capture", "n"], ["壟斷", "monopoly", "n"], ["資訊不對稱", "information asymmetry", "m"], ["卡特爾", "cartel", "m"], ["競爭法", "competition law", "m"], ["因地制宜", "context-specific design", "m"], ["監管機構", "regulatory agency", "m"], ["監管者", "regulator", "m"], ["規則制定", "rule-making", "n"], ["酌情權", "discretion", "n"], ["可信承諾", "credible commitment", "n"], ["委託代理理論", "principal–agent theory", "n"], ["民主赤字", "democratic deficit", "n"], ["規模經濟", "economies of scale", "n"], ["問責", "accountability", "n"], ["正當性", "legitimacy", "n"], ["比較優勢", "comparative advantage", "m"], ["分權", "decentralisation", "m"], ["授權", "delegation", "m"], ["私有化", "privatisation", "m"], ["自由化", "liberalisation", "m"], ["統一", "uniformity", "m"], ["規例", "regulation", "n"], ["充公", "expropriation", "n"]];
(function(){
/* English key terms: first time a term shows up on a screen / card / panel, add （English） after it. TERMS is injected at build. */
const T=TERMS_DATA.slice().sort((a,b)=>b[0].length-a[0].length);
const MAP=new Map(T.map(t=>[t[0],t]));
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RE=new RegExp(T.map(t=>esc(t[0])).join('|'),'g');
const DONE=new Map(T.map(t=>[t[0],new RegExp(esc(t[0])+'\\s*[（(]\\s*[A-Za-z]')]));
const SKIP='h1,h2,h3,.brand,.nm,.sub,.pill,.grp,.dot,svg,script,style,textarea,input,blockquote,.src,.en,.tag,.tabs,.mono,.eyebrow,code,#gate,.termsheet';
const BOX='#sc,.sheet .in,.fcard,.panel,section,tr,.node,.lvhead,.course,.crs';
function box(n){const e=n.nodeType===1?n:n.parentElement;return (e&&e.closest(BOX))||document.getElementById('app')||document.body;}
function gloss(root){
  if(!root) return;
  if(root.nodeType===1&&root.closest&&root.closest(SKIP)) return;
  const tw=document.createTreeWalker(root.nodeType===3?root.parentNode:root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(root.nodeType===3&&n!==root) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p||p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
    RE.lastIndex=0; return RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const list=[]; let n; while((n=tw.nextNode())) list.push(n);
  list.forEach(tn=>{
    const c=box(tn); const v=tn.nodeValue; RE.lastIndex=0; let m, cut=[];
    const seen=new Set();
    while((m=RE.exec(v))){const k=m[0]; if(seen.has(k)) continue; seen.add(k);
      const after=v.slice(m.index+k.length);
      if(/^\s*[（(]\s*[A-Za-z]/.test(after)) continue;
      if(DONE.get(k).test(c.textContent)) continue;
      cut.push([m.index+k.length,MAP.get(k)]);}
    if(!cut.length) return;
    // only one gloss per term per box: re-check in order while inserting
    let node=tn, offset=0;
    cut.forEach(([pos,t])=>{
      if(DONE.get(t[0]).test(c.textContent)) return;
      const rest=node.splitText(pos-offset); offset=pos;
      const s=document.createElement('span'); s.className='en'; s.lang='en'; s.textContent='（'+t[1]+'）';
      rest.parentNode.insertBefore(s,rest); node=rest;});
  });
}
function legend(vp){
  if(vp.querySelector('.vterms')) return;
  const svg=vp.querySelector('svg'); if(!svg) return;
  const txt=svg.textContent; RE.lastIndex=0; const found=[]; const seen=new Set(); let m;
  while((m=RE.exec(txt))){const t=MAP.get(m[0]); if(!seen.has(t[1])){seen.add(t[1]);found.push(t);}}
  if(!found.length) return;
  const p=document.createElement('p'); p.className='vterms muted';
  p.innerHTML='<b>英文術語：</b>'+found.map(t=>`${t[0]}<span class="en" lang="en">（${t[1]}）</span>`).join(' · ');
  vp.appendChild(p);
}

   <div id="tl">${rows.map(t=>`<div class="trow"><span lang="en"><b>${t[1]}</b>${t[2]==='m'?' †':''}</span><span>${t[0].replace(/[「」]/g,'')}</span></div>`).join('')}</div>
   <button class="cta" style="width:100%;margin-top:14px" id="tcl">收埋</button></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d) d.remove();}; d.querySelector('#tcl').onclick=()=>d.remove();

}
function menuHook(el){
  const inn=el.querySelector('.in[aria-label="選單"]'); if(!inn||inn.querySelector('#tbtn')) return;
  const opts=inn.querySelector('.opts'); if(!opts) return;
  const b=document.createElement('button'); b.className='opt'; b.id='tbtn'; b.type='button'; b.textContent=`🔤 英文術語表：${T.length} 個`;

function scan(node){
  if(node.nodeType===1){
    if(node.classList&&node.classList.contains('sheet')) menuHook(node);
    (node.matches&&node.matches('.vispanel')?[node]:[...(node.querySelectorAll?node.querySelectorAll('.vispanel'):[])]).forEach(legend);

}

st.textContent='.en{font-size:.84em;font-weight:500;color:var(--muted);font-family:var(--f);letter-spacing:0}.opt .en,.cta .en{color:inherit;opacity:.75}.vterms{font-size:13px;margin:10px 2px 0;line-height:1.7}.trow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}.trow span:last-child{text-align:right;color:var(--muted)}';

const mo=new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.classList&&n.classList.contains('en'))return; scan(n);}));});

})();
