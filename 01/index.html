<script>
const CARDS_DATA=[{"id": 0, "n": "01", "s": 1, "t": "fact", "f": "有人話「監管」呢個概念有咩問題？（研究嘅出發點）", "b": "監管研究文獻普遍認為「監管」呢個概念缺乏共同理解", "q": "The concept of regulation is believed to suffer from a lack of shared understanding.", "loc": "KoopLodge2017 p.95"}, {"id": 1, "n": "01", "s": 1, "t": "definition", "f": "最闊嗰種理解，將監管當成乜？", "b": "Baldwin、Scott 同 Hood 嘅第三種監管理解將監管視為所有社會控制機制，包括無意圖同非國家嘅過程", "q": "all mechanisms of social control – including unintentional and non-state processes", "loc": "Baldwin, Scott & Hood (1998), in KoopLodge2017 p.95"}, {"id": 2, "n": "01", "s": 2, "t": "conceptual", "f": "唔同學科嘅作者喺最抽象層面，同意監管係乜？", "b": "喺抽象層面，各學科作者都同意監管係對個人或機構行為或活動嘅干預", "q": "First, at an abstract level, authors agree that regulation is about intervention in the behavior or activities of individual and/or corporate actors.", "loc": "KoopLodge2017 p.97"}, {"id": 3, "n": "01", "s": 2, "t": "evaluation", "f": "點解有人反對將社會規範同文化都當成監管？", "b": "Black 認為將社會規範同文化納入監管概念會令監管冇邊界，分析價值好低", "q": "provides no boundaries as to where regulation might end, and some other influencing factors take effect, and so provides very little analytical purchase", "loc": "Black (2002), in KoopLodge2017 p.98"}, {"id": 4, "n": "01", "s": 2, "t": "definition", "f": "「直接干預」係乜意思？", "b": "直接干預係訂立或執行直接適用於特定人群目標行為或特徵嘅標準", "q": "the introduction and/or implementation of standards that directly apply to the target behavior or characteristics of a specified population", "loc": "KoopLodge2017 p.98"}, {"id": 5, "n": "01", "s": 2, "t": "definition", "f": "「間接干預」係乜意思？", "b": "間接干預係訂立或執行適用於特定人群目標行為產生嘅環境嘅標準", "q": "the introduction and/or implementation of standards that apply to the context in which the target behavior or characteristics of a specified population are generated", "loc": "KoopLodge2017 p.98"}, {"id": 6, "n": "01", "s": 3, "t": "fact", "f": "最多人引用嘅監管文章入面，有幾多寫明咗定義？", "b": "喺 Koop 同 Lodge 分析嘅最多人引用監管文章入面，只有 14% 寫明咗監管嘅定義", "q": "Explicit definitions are uncommon; only 14 percent include a definition.", "loc": "KoopLodge2017 p.102"}, {"id": 7, "n": "01", "s": 3, "t": "fact", "f": "有幾多篇文章將監管理解為「有意圖」嘅過程？", "b": "Koop 同 Lodge 分析嘅 101 篇文章全部都將監管理解為有意圖嘅過程", "q": "regulation is conceived as an intentional process in all 101 articles", "loc": "KoopLodge2017 p.102"}, {"id": 8, "n": "01", "s": 3, "t": "fact", "f": "文章對「間接干預算唔算監管」嘅態度係點？", "b": "喺 Koop 同 Lodge 嘅樣本入面，只有 41% 文章將間接干預納入監管，另外 55% 冇表態", "q": "Indirect intervention, in contrast, is only included in 41 percent of the articles, while another 55 percent leave that option open.", "loc": "KoopLodge2017 p.103"}, {"id": 9, "n": "01", "s": 3, "t": "fact", "f": "文獻有冇討論監管者同被監管者使唔使係兩個唔同嘅人？", "b": "監管文獻幾乎完全冇討論監管者同被監管者是否需要係分開嘅行為者", "q": "the authors are almost exclusively silent on whether regulator and regulatee need to be separate actors (98%)", "loc": "KoopLodge2017 p.104"}, {"id": 10, "n": "01", "s": 4, "t": "definition", "f": "「本質定義」點樣定義監管？", "b": "按 Koop 同 Lodge 嘅本質定義，監管係對某目標人群活動嘅有意圖干預", "q": "Accordingly, regulation can be defined as the intentional intervention in the activities of a target population.", "loc": "KoopLodge2017 p.104"}, {"id": 11, "n": "01", "s": 4, "t": "conceptual", "f": "最精簡嘅本質定義有咩代價？", "b": "監管嘅最精簡本質定義令監管概念過闊，難以同「政策」概念區分", "q": "However, the minimal definition leads to a rather broad conception of regulation, which makes it hard to distinguish it from the concept of policy.", "loc": "KoopLodge2017 p.104"}, {"id": 12, "n": "01", "s": 4, "t": "definition", "f": "「模式定義」（原型監管）比本質定義多咗乜？", "b": "按 Koop 同 Lodge 嘅模式定義，監管係對目標人群活動嘅有意圖干預，而該干預通常係直接嘅", "q": "regulation can be defined as intentional intervention in the activities of a target population, where the intervention is typically direct", "loc": "KoopLodge2017 p.105"}, {"id": 13, "n": "01", "s": 4, "t": "conceptual", "f": "原型監管通常包唔包稅、資助同強制披露？", "b": "原型監管通常唔包括徵稅、資助同強制披露等管治工具", "q": "typically, regulation does not refer to tools of governance, such as taxation, subsidization, and imposing disclosure requirements", "loc": "KoopLodge2017 p.105"}, {"id": 14, "n": "01", "s": 5, "t": "fact", "f": "研究關注點嘅差異，可唔可以歸咎於學科唔同？", "b": "監管文獻中研究關注點嘅差異唔可以歸因於學科差異", "q": "Fourth, while there is considerable variation in research concerns, this variation cannot be attributed to disciplinary differences.", "loc": "KoopLodge2017 p.95"}, {"id": 15, "n": "01", "s": 5, "t": "fact", "f": "邊個學科最少將間接干預計入監管？", "b": "政治學文章將間接干預納入監管概念嘅次數，顯著少過經濟學、法律同社會學文章", "q": "in political science, indirect intervention is significantly less often included than in the three other fields", "loc": "KoopLodge2017 p.103"}, {"id": 16, "n": "01", "s": 5, "t": "evaluation", "f": "所以，當代監管研究係咪真係「冇共同理解」？", "b": "Koop 同 Lodge 嘅分析唔支持「當代監管研究缺乏共同理解」嘅說法", "q": "All in all, our analysis does not support the portrayal of the contemporary field of regulation as one that lacks a shared understanding.", "loc": "KoopLodge2017 p.106"}, {"id": 17, "n": "02", "s": 1, "t": "conceptual", "f": "解釋監管點樣出現嘅理論，可以用乜分界分兩大類？", "b": "解釋監管嘅理論可以分為強調外在因素（利益團體、主流思想、經濟本質）同強調內在因素（例如機構文化）兩類", "q": "those approaches that emphasize exogenous (external) factors that shape the evolution of regulation (such as the force of interest groups, dominant ideas, or the underlying nature of the economy) and those emphasizing endogenous factors such as institutional cultures", "loc": "BaldwinCaveLodge2012Ch4 p.40"}, {"id": 18, "n": "02", "s": 2, "t": "conceptual", "f": "公共利益理論點樣睇推動監管嘅人？", "b": "公共利益理論將推動監管嘅人視為代表公眾利益行事嘅好心代理人", "q": "Proponents of regulation are thus seen as acting as benevolent agents for the public interest.", "loc": "BaldwinCaveLodge2012Ch4 p.41"}, {"id": 19, "n": "02", "s": 2, "t": "conceptual", "f": "公共利益理論對執法同守法有咩假設？", "b": "公共利益理論假設監管嘅執行同守法都可以冇問題咁做到", "q": "The public interest approach also assumes the possibility of unproblematic enforcement and compliance.", "loc": "BaldwinCaveLodge2012Ch4 p.41"}, {"id": 20, "n": "02", "s": 2, "t": "evaluation", "f": "公共利益理論嘅第一個困難係乜？", "b": "公共利益理論嘅第一個困難係難以搵到一個大家同意嘅公眾利益概念", "q": "A first difficulty is that an agreed conception of the public interest may be hard to identify.", "loc": "BaldwinCaveLodge2012Ch4 p.41"}, {"id": 21, "n": "02", "s": 2, "t": "evaluation", "f": "俘虜論者批評公共利益理論低估咗乜？", "b": "俘虜理論者認為公共利益理論低估咗經濟同政治權力對監管嘅影響", "q": "capture theorists, discussed in more detail below, may suggest that public interest theory understates the degree to which economic and political power influences regulation", "loc": "capture theorists, in BaldwinCaveLodge2012Ch4 p.42"}, {"id": 22, "n": "02", "s": 2, "t": "normative", "f": "有人點樣為公共利益理論辯護，保留一種規範性問法？", "b": "Breyer 主張評估一個監管計劃時，應該問佢合理咁可以追求咩人類目標，而唔理佢點樣出現", "q": "what reasonable human goals a program might sensibly have, regardless of its historical origins", "loc": "Breyer, in BaldwinCaveLodge2012Ch4 p.43"}, {"id": 23, "n": "02", "s": 3, "t": "conceptual", "f": "監管經濟理論對人有咩基本假設？", "b": "監管經濟理論假設參與監管嘅行為者本質上顧住自己，並以最大化自身物質利益為目標", "q": "The economic theory of regulation builds on the assumption that actors are inherently self-regarding and orientated at maximizing their own (material) interest.", "loc": "BaldwinCaveLodge2012Ch4 p.43"}, {"id": 24, "n": "02", "s": 3, "t": "cause", "f": "「俘虜」論嘅中心結論係乜？", "b": "Stigler 認為監管一般係由行業爭取返嚟，並主要為行業利益而設計同運作", "q": "as a rule regulation is acquired by the industry and is designed and operated primarily for its benefit", "loc": "Stigler (1971), in BaldwinCaveLodge2012Ch4 p.43"}, {"id": 25, "n": "02", "s": 3, "t": "cause", "f": "點解會出現一個「監管市場」？", "b": "按正統監管經濟理論，受監管行業有誘因去影響監管者以獲取監管租金，從而形成監管市場", "q": "The regulated industry thus will have an incentive to influence the regulator so as to benefit from a ‘regulatory rent’, and there will be a market for regulation.", "loc": "orthodox economic theory (Stigler; Posner), in BaldwinCaveLodge2012Ch4 p.44"}, {"id": 26, "n": "02", "s": 3, "t": "cause", "f": "集中有組織嘅利益同分散嘅群體，通常邊個贏？", "b": "按正統監管經濟理論，集中而有組織嘅利益通常會犧牲分散群體而勝出", "q": "Compact, organized interests (say, solicitors) will usually win at the expense of a diffused group (say, users of legal services).", "loc": "orthodox economic theory, in BaldwinCaveLodge2012Ch4 p.44"}, {"id": 27, "n": "02", "s": 3, "t": "normative", "f": "「集中贏分散」呢個邏輯，可以點樣用嚟支持監管者偏向消費者？", "b": "Motta 轉述一個論點：因為消費者分散而生產者集中，競爭管理機構可以透過平衡兩組經濟行為者嘅游說力量而發揮作用", "q": "The competition authority might then have a role to play if it contributes to balancing the different lobbying powers of the two groups of economic agents in question.", "loc": "Motta2004 p.20"}, {"id": 28, "n": "02", "s": 4, "t": "cause", "f": "行業攞到壟斷租金之後，點解冇租金可以長存？", "b": "Becker 認為行業攞到嘅壟斷租金會引發反對利益動員，最終冇壟斷租金可以存活", "q": "In the end, no ‘monopoly rent’ will survive.", "loc": "Becker (1983), in BaldwinCaveLodge2012Ch4 p.44"}, {"id": 29, "n": "02", "s": 4, "t": "cause", "f": "監管租金可以點樣被消除？", "b": "Peltzman 認為監管租金可以被監管本身消除", "q": "regulatory rents can be eradicated by regulation itself", "loc": "Peltzman (1989), in BaldwinCaveLodge2012Ch4 p.45"}, {"id": 30, "n": "02", "s": 4, "t": "cause", "f": "「生命周期」論話一個監管制度會點樣變？", "b": "Bernstein 嘅生命周期理論認為監管制度會老化，由最初為公眾利益變成被受監管行業俘虜", "q": "an ageing process in which an initial ‘public interest’ regulatory regime gives way to capture by the regulated industry", "loc": "Bernstein (1955), in BaldwinCaveLodge2012Ch4 p.47"}, {"id": 31, "n": "02", "s": 4, "t": "conceptual", "f": "「創業家政治」係乜情況？", "b": "Wilson 嘅創業家政治指監管喺行業集中反對下，只靠分散利益支持而獲採納", "q": "In this world, regulation is adopted in the face of concentrated industry opposition and is advanced with only the support of diffused interests.", "loc": "Wilson (1980), in BaldwinCaveLodge2012Ch4 p.48"}, {"id": 32, "n": "02", "s": 4, "t": "cause", "f": "環保標準提高，有時係因為邊兩類人結盟？", "b": "Vogel 認為行業同綠色利益之間嘅聯盟促成咗環保標準提高", "q": "coalitions between industry and ‘green interests’ were responsible for raising environmental standards", "loc": "Vogel (1995), in BaldwinCaveLodge2012Ch4 p.48"}, {"id": 33, "n": "02", "s": 4, "t": "evaluation", "f": "對監管經濟理論嘅一個批評：監管者可能出於乜嘢動機？", "b": "Baldwin、Cave 同 Lodge 指出環境監管者實際上可能出於對環境質素嘅利他關懷行事", "q": "Environmental regulators may actually be motivated by altruistic concerns about environmental quality!", "loc": "BaldwinCaveLodge2012Ch4 p.46"}, {"id": 34, "n": "02", "s": 5, "t": "conceptual", "f": "「思想氣候」點樣影響監管？", "b": "「理念重要」分析指出，整體思想氣候會顯著影響邊類監管工具同制度被視為可取", "q": "the wider intellectual climate significantly shapes the type of regulatory instruments and institutions that are regarded as desirable", "loc": "BaldwinCaveLodge2012Ch4 p.50"}, {"id": 35, "n": "02", "s": 5, "t": "conceptual", "f": "面對監管問題，文化理論話有幾多種世界觀？", "b": "文化理論指出有四種互相競爭嘅世界觀，各自對監管問題有唔同診斷同解決方案", "q": "Cultural theory points to four rival worldviews, with their contrasting and competing diagnoses and solutions to regulatory problems.", "loc": "cultural theory (Douglas; Hood), in BaldwinCaveLodge2012Ch4 p.50"}, {"id": 36, "n": "02", "s": 5, "t": "conceptual", "f": "點解有人話要明白監管，就要明白溝通？", "b": "Black 認為監管本質上係溝通過程，因此理解溝通對理解監管過程至關重要", "q": "since regulation is inherently a communicative process, a better understanding of communication is critical for understanding (and arguably advancing) the regulatory process", "loc": "Black (2002), in BaldwinCaveLodge2012Ch4 p.52"}, {"id": 37, "n": "02", "s": 5, "t": "fact", "f": "近年有學者點樣形容當今嘅經濟同政治年代？", "b": "Naidu、Rodrik 同 Zucman 認為當今係一個不平等驚人、政治波動而寡頭化嘅年代", "q": "We live in an age of astonishing inequality, together with volatile and oligarchic politics.", "loc": "NaiduRodrikZucman2020 p.366"}, {"id": 38, "n": "02", "s": 5, "t": "evaluation", "f": "新自由主義係咪現代經濟學嘅一貫應用？", "b": "Naidu、Rodrik 同 Zucman 認為新自由主義唔係現代經濟學嘅一貫應用，而係佢原始而簡化嘅扭曲", "q": "is not the consistent application of modern economics but its primitive, simplistic perversion", "loc": "NaiduRodrikZucman2020 p.367"}, {"id": 39, "n": "02", "s": 5, "t": "conceptual", "f": "現代經濟學對大部分問題嘅答案通常係點？", "b": "Naidu、Rodrik 同 Zucman 認為經濟學幾乎每條問題嘅答案都係「睇情況」，再解釋睇乜同點解", "q": "“it depends,” followed by an exegesis on what it depends on and why", "loc": "NaiduRodrikZucman2020 p.368"}, {"id": 40, "n": "02", "s": 5, "t": "conceptual", "f": "市場同制度係咩關係？", "b": "Naidu、Rodrik 同 Zucman 借 Polanyi 認為市場依賴一大批制度，係嵌入喺制度入面", "q": "Clearly markets rely on a wide range of institutions; they are “embedded” in institutions, as Karl Polanyi would say.", "loc": "Polanyi, in NaiduRodrikZucman2020 p.369"}, {"id": 41, "n": "02", "s": 5, "t": "conceptual", "f": "經濟學唔畀固定答案，咁佢畀乜？", "b": "Naidu、Rodrik 同 Zucman 認為經濟學唔提供固定答案，而係指出唔同制度安排嘅可能後果", "q": "Instead, it highlights the potential consequences of different arrangements.", "loc": "NaiduRodrikZucman2020 p.369"}, {"id": 42, "n": "02", "s": 5, "t": "definition", "f": "「包容」要睇結果嘅乜嘢？", "b": "Naidu、Rodrik 同 Zucman 所講嘅「包容」要求考慮成個結果分佈，而唔止平均數", "q": "the whole distribution of outcomes, not simply the average", "loc": "NaiduRodrikZucman2020 p.366"}, {"id": 43, "n": "02", "s": 5, "t": "normative", "f": "全球經濟整合係目的定手段？", "b": "Naidu、Rodrik 同 Zucman 認為全球經濟整合係手段而唔係目的", "q": "global economic integration is a means and not an end", "loc": "NaiduRodrikZucman2020 p.370"}, {"id": 44, "n": "02", "s": 6, "t": "conceptual", "f": "制度主義者共同同意乜？", "b": "制度主義者一致認為制度結構、安排同社會過程會顯著塑造監管", "q": "structure and arrangements, as well as social processes, significantly shape regulation", "loc": "BaldwinCaveLodge2012Ch4 p.53"}, {"id": 45, "n": "02", "s": 6, "t": "conceptual", "f": "制度設計文獻係回應邊個論點？", "b": "制度設計文獻係對「所有監管都係關於俘虜」呢個論點嘅回應", "q": "This literature represents the response to the argument that all regulation was about capture", "loc": "BaldwinCaveLodge2012Ch4 p.54"}, {"id": 46, "n": "03", "s": 1, "t": "fact", "f": "競爭法歷史上追求嘅目標係咪一致？", "b": "Motta 指出反壟斷同競爭法經常受社會同歷史因素影響，並可能回應非常唔同嘅目標", "q": "antitrust and competition laws are often influenced by social and historical factors, and might respond to quite different objectives", "loc": "Motta2004 p.17"}, {"id": 47, "n": "03", "s": 2, "t": "definition", "f": "一個行業嘅「經濟福利」點計？", "b": "Motta 將一個行業嘅經濟福利定義為總剩餘，即消費者剩餘加生產者剩餘", "q": "In each given industry, welfare is given by total surplus, that is the sum of consumer surplus and producer surplus.", "loc": "Motta2004 p.18"}, {"id": 48, "n": "03", "s": 2, "t": "conceptual", "f": "經濟福利呢個概念點樣處理分配問題？", "b": "Motta 指出經濟福利概念完全唔理收入喺消費者同生產者之間點樣分配", "q": "It is important to notice that this concept of welfare completely overlooks the issue of income distribution among consumers and producers.", "loc": "Motta2004 p.18"}, {"id": 49, "n": "03", "s": 2, "t": "conceptual", "f": "點解福利標準可以唔理分配？", "b": "Motta 認為福利標準唔考慮分配，理據係原則上可以用再分配計劃令消費者同生產者一齊好過或者一齊差過", "q": "the rationale for not considering distributional issues is that in principle it is possible to operate redistribution schemes such that consumers and producers are both either better off or worse off", "loc": "Motta2004 p.18"}, {"id": 50, "n": "03", "s": 2, "t": "cause", "f": "如果長期將價錢壓到邊際成本，將來會點？", "b": "Motta 認為如果競爭管理機構長期將價錢壓到邊際成本，廠商唔再投資，將來嘅福利會因冇新產品同創新而下降", "q": "in such a hypothetical situation future welfare will be reduced, as new products would not be introduced, innovations would not be made", "loc": "Motta2004 p.19"}, {"id": 51, "n": "03", "s": 3, "t": "fact", "f": "咩情況下總福利升、但消費者福利跌？", "b": "Motta 指出一宗大幅減低固定成本嘅合併，可以因利潤增加而提高總福利，同時因加價而降低消費者福利", "q": "a merger that allows the merging firms to decrease significantly their fixed costs might increase total welfare (due to larger profits) while increasing prices and thus decreasing consumer welfare", "loc": "Motta2004 p.19"}, {"id": 52, "n": "03", "s": 3, "t": "evaluation", "f": "實際上管理機構同法院偏向邊個標準？", "b": "Motta 認為好難講競爭管理機構同法院實際上偏向消費者福利定總福利目標", "q": "It is difficult to say whether competition authorities and courts favour in practice a consumer welfare or a total welfare objective.", "loc": "Motta2004 p.19"}, {"id": 53, "n": "03", "s": 3, "t": "fact", "f": "歐盟有啲條文可能表示佢嘅終極目標之一係乜？", "b": "Motta 認為 Art 81(3) EC 同歐盟合併規例嘅效率抗辯條文，可能表示消費者福利係歐盟競爭法嘅終極目標之一", "q": "These provisions might indicate that consumer welfare is among the ultimate objectives of competition law.", "loc": "Motta2004 p.19"}, {"id": 54, "n": "03", "s": 3, "t": "fact", "f": "美國喺合併案上傾向邊個標準？", "b": "Motta 指出美國法院同反壟斷機構起碼喺合併案上傾向消費者福利標準", "q": "In the US, both the courts and the anti-trust agencies seem to tend toward a consumer welfare standard too, at least as far as mergers are concerned.", "loc": "Motta2004 p.20"}, {"id": 55, "n": "03", "s": 3, "t": "fact", "f": "加拿大、澳洲、新西蘭傾向邊個標準？", "b": "Motta 引 Lyons 指加拿大、澳洲同新西蘭嘅競爭管理機構傾向總福利標準", "q": "In other jurisdictions, such as in Canada, Australia and New Zealand, competition authorities seem instead to lean towards a total welfare standard", "loc": "Lyons (2002), in Motta2004 p.20"}, {"id": 56, "n": "03", "s": 4, "t": "normative", "f": "支持消費者福利嘅「政治經濟學」理由係乜？", "b": "Motta 轉述一個政治經濟學論點：因為消費者分散而生產者集中，俾消費者剩餘多過生產者剩餘嘅權重可以幫手將天平拉返向消費者", "q": "attaching a heavier weight to consumer surplus than to producer surplus might help redress the balance towards consumers", "loc": "Motta2004 p.20"}, {"id": 57, "n": "03", "s": 4, "t": "normative", "f": "支持消費者福利嘅「資訊不對稱」理由係乜？", "b": "Besanko 同 Spulber 認為採用只批准提高消費者福利嘅合併嘅消費者福利標準，可以抵銷合併公司對管理機構嘅資訊優勢", "q": "the adoption of a consumer welfare standard (that is, accepting the merger only if it increases consumer welfare, no matter the effects on profits and therefore on total welfare) might counter-balance this asymmetry", "loc": "Besanko and Spulber (1993), in Motta2004 p.21"}, {"id": 58, "n": "03", "s": 4, "t": "normative", "f": "支持消費者福利嘅「簡單」理由係乜？", "b": "Motta 轉述一個論點：消費者福利標準只需評估對價錢嘅影響，所以比總福利標準更易用", "q": "A consumer welfare standard, instead, would not need such an exercise, since it could limit itself to the (relatively) simpler assessment of the effects on prices.", "loc": "Motta2004 p.21"}, {"id": 59, "n": "03", "s": 4, "t": "evaluation", "f": "結論：管理機構應唔應該採用消費者福利目標？", "b": "Motta 認為競爭管理機構採用消費者福利目標並唔明智", "q": "Although these arguments might have some merit, it would not be wise for competition authorities to adopt a consumer welfare objective, for several reasons.", "loc": "Motta2004 p.21"}, {"id": 60, "n": "03", "s": 4, "t": "fact", "f": "反駁一：今日嘅消費者同公司係咩關係？", "b": "Motta 指出喺今日嘅先進經濟，消費者經常直接或者透過退休金同投資基金擁有公司", "q": "in today's advanced economies consumers often own firms (partly or fully), directly or through pension and investment funds", "loc": "Motta2004 p.21"}, {"id": 61, "n": "03", "s": 4, "t": "cause", "f": "反駁三（最重要）：低價低利潤會點？", "b": "Motta 認為較低嘅價錢同利潤會令廠商失去創新、投資同推出新產品嘅誘因", "q": "lower prices and profits would have the effect of depriving firms from the necessary incentives to innovate, invest, and introduce new products", "loc": "Motta2004 p.21"}, {"id": 62, "n": "03", "s": 4, "t": "evaluation", "f": "呢個立場最後偏好邊個標準？", "b": "Motta 同大多數經濟學家一樣，偏好以總福利作為競爭政策嘅標準", "q": "Like most economists, I also prefer the welfare standard.", "loc": "Motta2004 p.22"}, {"id": 63, "n": "03", "s": 5, "t": "evaluation", "f": "人為咁幫唔夠規模嘅細企生存，同福利目標有咩關係？", "b": "Motta 認為人為地幫助未達有效生產規模嘅細企生存，同經濟福利目標相違背", "q": "artificially helping small firms to survive when they are not operating at an efficient scale of production is in contrast with economic welfare objectives", "loc": "Motta2004 p.22"}, {"id": 64, "n": "03", "s": 5, "t": "evaluation", "f": "「促進市場整合」係咩性質嘅目標？", "b": "Motta 認為歐盟競爭政策促進市場整合係一個政治目標，未必同經濟福利一致", "q": "This is a political objective which is not necessarily consistent with economic welfare.", "loc": "Motta2004 p.23"}, {"id": 65, "n": "03", "s": 5, "t": "fact", "f": "德國競爭法背後嘅主要理據係乜？", "b": "Motta 認為保障經濟自由大概係德國競爭法背後嘅主要理據", "q": "to guarantee economic freedom is probably the main rationale behind competition laws in Germany", "loc": "Motta2004 p.24"}, {"id": 66, "n": "03", "s": 5, "t": "evaluation", "f": "競爭法可唔可以有效咁壓通脹？", "b": "Motta 懷疑競爭法可以有效咁用嚟達到壓抑通脹嘅目的", "q": "it seems doubtful that competition law might efficiently be used to attain such purposes", "loc": "Motta2004 p.24"}, {"id": 67, "n": "03", "s": 5, "t": "evaluation", "f": "限制大超市減價去保護細舖頭，會點？", "b": "Motta 認為限制大型連鎖超市以較低價錢銷售嘅能力去保護細舖頭，會損害福利", "q": "Interfering in this process by limiting the ability of larger firms to charge lower prices would damage welfare.", "loc": "Motta2004 p.26"}, {"id": 68, "n": "03", "s": 5, "t": "evaluation", "f": "咩情況下超市低價既唔公平又損福利？", "b": "Motta 認為一間高市佔超市有計劃咁低於成本定價以逼走細對手嘅掠奪性定價，既唔公平又損害福利", "q": "In this case, this practice (which is called predatory) is both unfair and welfare detrimental.", "loc": "Motta2004 p.26"}, {"id": 69, "n": "03", "s": 5, "t": "normative", "f": "邊種「公平」同競爭政策相容？", "b": "Motta 認為事前公平（廠商起步機會相同）同競爭政策相容，因為競爭政策應該保證所有廠商有公平競爭環境", "q": "ex ante equity (that is, the fact that firms have the same initial opportunities in the marketplace) is compatible with competition policy, which should guarantee a level playing field for all the firms", "loc": "Motta2004 p.26"}, {"id": 70, "n": "03", "s": 6, "t": "evaluation", "f": "經濟衰退時容許企業勾結避免倒閉，好唔好？", "b": "Motta 認為容許企業勾結去解決經濟衰退時嘅倒閉問題，好可能係比問題本身更差嘅藥方", "q": "allowing firms to collude to solve the problem is likely to be a remedy worse than the problem itself", "loc": "Motta2004 p.27"}, {"id": 71, "n": "03", "s": 6, "t": "cause", "f": "競爭政策嘅一個政治理由係乜？", "b": "Motta 指出少數公民同群體控制大部分資源時，民主可能會受威脅，呢點係競爭政策嘅政治理由之一", "q": "it might be feared that democracy could be put at risk when a few citizens and groups dominate a large share of resources", "loc": "Motta2004 p.27"}, {"id": 72, "n": "03", "s": 6, "t": "fact", "f": "CECED 案點解協議會被批准？", "b": "喺 CECED 案，歐盟委員會以環境效益為理由，批准咗洗衣機生產商停產最唔慳電型號嘅協議", "q": "the Commission considered that the agreement will benefit society in environmental terms", "loc": "Motta2004 p.28"}, {"id": 73, "n": "03", "s": 6, "t": "normative", "f": "用競爭政策追效率以外嘅目的時，要問咩問題？", "b": "Motta 認為每當競爭政策被用嚟追求效率以外嘅目的，都要問呢個係咪最佳解決方法", "q": "whenever competition policy is used for other purposes than efficiency, one has to wonder whether this is the optimal solution", "loc": "Motta2004 p.28"}, {"id": 74, "n": "03", "s": 6, "t": "evaluation", "f": "有人要扶植「國家冠軍」，呢個立場點回應？", "b": "Motta 認為競爭政策本身就係最好嘅產業政策", "q": "My view is that competition policy is the best possible industrial policy", "loc": "Motta2004 p.29"}, {"id": 75, "n": "03", "s": 7, "t": "definition", "f": "用經濟福利去定義，競爭政策係乜？", "b": "Motta 將競爭政策定義為確保市場競爭唔會受到降低經濟福利嘅限制嘅一套政策同法律", "q": "the set of policies and laws which ensure that competition in the marketplace is not restricted in such a way as to reduce economic welfare", "loc": "Motta2004 p.30"}, {"id": 76, "n": "03", "s": 7, "t": "normative", "f": "政府想追其他目標，應該用乜工具？", "b": "Motta 認為政府要達到經濟效率以外嘅目標，唔應該用競爭政策，而應該用對競爭扭曲最少嘅政策工具", "q": "if a government wanted to achieve them, it should not use competition policy but resort to policy instruments that distort competition as little as possible", "loc": "Motta2004 p.30"}, {"id": 77, "n": "03", "s": 7, "t": "normative", "f": "經濟同其他考慮有衝突，邊個決定優先？", "b": "Motta 認為經濟考慮同其他考慮有衝突時邊樣優先，應該由政客、法官或者社會學家等其他人決定，而唔係經濟學家", "q": "It will be up to others, be they politicians or judges or sociologists, to decide whether to give priority to economic or other considerations when conflicts arise.", "loc": "Motta2004 p.30"}, {"id": 78, "n": "03", "s": 7, "t": "normative", "f": "再分配後果，對監管者嚟講應該係目標定約束？", "b": "Majone 認為監管政策嘅再分配後果，對監管者嚟講應該係政策約束而唔係政策目標", "q": "Regulatory policies, like all public policies, have redistributive consequences … should represent potential policy constraints rather than policy objectives", "loc": "Majone1997 p.162"}, {"id": 79, "n": "04", "s": 1, "t": "conceptual", "f": "Tinbergen 法則講乜？", "b": "Tinbergen 法則認為要成功達到 n 個獨立嘅政策目標，起碼需要同樣數目嘅獨立政策工具", "q": "to successfully achieve 𝑛𝑛 independent policy targets at least the same number of independent policy instruments are required", "loc": "Tinbergen (1952), in Schaeffer2020 p.2"}, {"id": 80, "n": "04", "s": 1, "t": "definition", "f": "經濟政策嘅變數分邊三類？", "b": "Tinbergen 將經濟政策嘅變數分為數據、目標變數同工具三類", "q": "Tinbergen distinguishes three types of variables: (1) Data, (2) Target Variables, and (3) Instruments.", "loc": "Tinbergen (1952), in Schaeffer2020 p.3"}, {"id": 81, "n": "04", "s": 1, "t": "conceptual", "f": "勞動生產力係目標定工具？點解？", "b": "Schaeffer 認為勞動生產力本身唔係目的，而係達到更高工資、更大產量同更強競爭力等目標嘅手段，所以應該當作工具", "q": "In general, labor productivity is not an end in itself but a means to reach targets such as higher wages, greater production, improved competitiveness in the world market, etc.", "loc": "Schaeffer2020 p.4"}, {"id": 82, "n": "04", "s": 2, "t": "definition", "f": "兩個目標「獨立」係乜意思？", "b": "Schaeffer 將兩個政策目標「獨立」定義為兩者可以同時達到", "q": "Independence of policy targets means that both can be achieved simultaneously.", "loc": "Schaeffer2020 p.5"}, {"id": 83, "n": "04", "s": 2, "t": "definition", "f": "一件「中立」嘅工具係點？", "b": "Schaeffer 將「中立」政策工具定義為除咗佢設計要幫助嘅目標之外，對其他所有政策目標都冇任何影響嘅工具", "q": "We define a policy instrument as being neutral if its application has no effect whatsoever of all policy targets other than the one it was designed to help achieve.", "loc": "Schaeffer2020 p.5"}, {"id": 84, "n": "04", "s": 2, "t": "definition", "f": "一件工具同另一個目標「衝突」係點？", "b": "Schaeffer 將一件為目標 A 而設嘅工具定義為同目標 B「衝突」，如果用咗佢會令目標 B 更遠", "q": "An instrument for target A is defined as in conflict or conflicting with target B, if its application moves us further away from this target.", "loc": "Schaeffer2020 p.6"}, {"id": 85, "n": "04", "s": 3, "t": "conceptual", "f": "除咗咩情況，政策都會影響其他目標？", "b": "Schaeffer 認為除非目標獨立而工具中立，否則政策都會影響佢設計目標以外嘅其他目標", "q": "except in the case of independent targets and neutral instruments, policies effects targets beyond those they are designed for", "loc": "Schaeffer2020 p.9"}, {"id": 86, "n": "04", "s": 3, "t": "normative", "f": "溢出越強，會點？", "b": "Schaeffer 認為溢出效應越強，設計同執行兩個目標嘅政策時就越需要協調", "q": "the stronger the spillover effects, the greater the need for coordination in designing and implementing policies for targets A and B", "loc": "Schaeffer2020 p.8"}, {"id": 87, "n": "04", "s": 3, "t": "normative", "f": "工具 X 對目標 Y 影響好大，應該點做？", "b": "Schaeffer 認為工具 X 對目標 Y 影響越大，協調 X 同 Y 政策嘅潛在好處就越大，溢出好大時甚至要合併成一個行政單位", "q": "The greater the influence of an instrument X on target Y, the greater the potential benefits from coordinating the policies for X and Y", "loc": "Schaeffer2020 p.9"}, {"id": 88, "n": "04", "s": 3, "t": "conceptual", "f": "由同一個機構管理唔同政策，協調難唔難？", "b": "Schaeffer 假設由同一個機構管理嘅唔同政策之間，協調可以相對容易做到", "q": "We assume that coordination between different policies administered by the same agency can be accomplished with relative ease.", "loc": "Schaeffer2020 p.12"}, {"id": 89, "n": "04", "s": 3, "t": "conceptual", "f": "目標同工具各自互相垂直，係咪已經夠保證中立？", "b": "Schaeffer 認為目標同工具各自互相垂直都唔足以保證工具中立，除非每件工具亦完全對準佢嘅目標", "q": "having orthogonal targets and orthogonal instruments is not sufficient if each instrument is not also perfectly aligned with its target", "loc": "Schaeffer2020 p.10"}, {"id": 90, "n": "04", "s": 3, "t": "normative", "f": "互相影響嘅政策之間應唔應該協調？幾時最必須？", "b": "Schaeffer 認為互相影響對方目標嘅政策之間永遠都應該考慮協調，喺變化快嘅政策環境更加必須", "q": "coordination among policies that mutually affect each other's policy targets should always be considered and is required in a fast-changing policy environment", "loc": "Schaeffer2020 p.11"}, {"id": 91, "n": "04", "s": 3, "t": "evaluation", "f": "協調幾時最難做？", "b": "Schaeffer 認為政策協調喺最需要嘅時候（即急速變化時）最難做", "q": "The coordinated application of policies is most difficult when it is likely most needed, namely in the case of rapid change", "loc": "Schaeffer2020 p.12"}, {"id": 92, "n": "04", "s": 4, "t": "fact", "f": "自 1952 年以嚟，政策目標嘅數目點變？", "b": "Schaeffer 指出自 Tinbergen 1952 年本書出版以嚟，政策目標變數嘅數目整體係增加咗", "q": "Since the publication of his book, the number of target variables has changed and on balance increased.", "loc": "Schaeffer2020 p.4"}, {"id": 93, "n": "04", "s": 4, "t": "normative", "f": "目標越嚟越多，按法則要點？", "b": "Schaeffer 認為公共政策範圍擴大加上 Tinbergen 法則嘅含意，表示可能需要發展新嘅政策工具", "q": "The growth of the range of public policy combined with implications of the Tinbergen Rule suggest that we may need to develop new policy instruments.", "loc": "Schaeffer2020 p.13"}, {"id": 94, "n": "04", "s": 5, "t": "fact", "f": "歐盟同美國嘅 GDP 差距主要嚟自乜？", "b": "Draghi 報告指出歐盟同美國之間嘅 GDP 差距主要由歐洲生產力增長放緩得更明顯所致", "q": "a wide gap in GDP has opened up between the EU and the US, driven mainly by a more pronounced slowdown in productivity growth in Europe", "loc": "Draghi2024 p.5"}, {"id": 95, "n": "04", "s": 5, "t": "cause", "f": "如果生產力追唔上，歐洲要面對乜取捨？", "b": "Draghi 報告認為歐洲如果唔能夠提升生產力，就唔可以同時成為新科技領袖、氣候責任典範同世界舞台上嘅獨立玩家", "q": "We will not be able to become, at once, a leader in new technologies, a beacon of climate responsibility and an independent player on the world stage.", "loc": "Draghi2024 p.5"}, {"id": 96, "n": "04", "s": 5, "t": "normative", "f": "如果要將基本價值互相取捨，歐盟會點？", "b": "Draghi 報告認為如果歐洲唔再能夠向人民提供佢嘅基本價值，或者要將佢哋互相取捨，歐盟就會失去存在嘅理由", "q": "it will have lost its reason for being", "loc": "Draghi2024 p.5"}, {"id": 97, "n": "04", "s": 5, "t": "normative", "f": "應對挑戰嘅唯一方法係乜？", "b": "Draghi 報告認為應對挑戰嘅唯一方法係增長同提高生產力，同時保住公平同社會共融嘅價值", "q": "The only way to meet this challenge is to grow and become more productive, preserving our values of equity and social inclusion.", "loc": "Draghi2024 p.5"}, {"id": 98, "n": "04", "s": 5, "t": "cause", "f": "唔協調政策，減碳同競爭力會點？", "b": "Draghi 報告認為如果歐洲唔協調政策，減碳可能會同競爭力同增長背道而馳", "q": "But if we fail to coordinate our policies, there is a risk that decarbonisation could run contrary to competitiveness and growth.", "loc": "Draghi2024 p.6"}, {"id": 99, "n": "04", "s": 5, "t": "evaluation", "f": "中國嘅競爭對歐洲邊啲行業構成威脅？", "b": "Draghi 報告認為中國國家資助嘅競爭威脅歐洲嘅清潔科技同汽車業", "q": "But China's state-sponsored competition also represents a threat to our productive clean tech and automotive industries.", "loc": "Draghi2024 p.7"}, {"id": 100, "n": "04", "s": 5, "t": "cause", "f": "監管本身對想擴張嘅創新企業有咩影響？", "b": "Draghi 報告認為想喺歐洲擴張嘅創新企業喺每一個階段都受到唔一致同限制性嘅規例阻礙", "q": "innovative companies that want to scale up in Europe are hindered at every stage by inconsistent and restrictive regulations", "loc": "Draghi2024 p.6"}, {"id": 101, "n": "04", "s": 6, "t": "normative", "f": "將互相競爭嘅任務放喺同一個機構，點解可以好過拆開？", "b": "Carrigan 認為將互相競爭嘅任務放喺同一個機構，可以好過拆開，因為支援目標嘅工作可能需要協調", "q": "assigning competing missions to one organization can be better than separating them, as the underlying tasks supporting the goals may require coordination", "loc": "Carrigan2018JTP p.6"}, {"id": 102, "n": "04", "s": 6, "t": "conceptual", "f": "機構同上司目標一致，結構選擇仲有冇影響？", "b": "Carrigan 認為即使機構同上司對政策目標意見一致，結構選擇都會影響機構行為", "q": "structural choices impact behavior even when agencies and overseers agree on policy objectives", "loc": "Carrigan2018JTP p.6"}, {"id": 103, "n": "04", "s": 6, "t": "cause", "f": "多任務機構唔知上司偏好邊個目標時，會點做？", "b": "Carrigan 嘅模型顯示，多任務機構唔確定政客偏好邊個目標時，會將資源分得較平均去對沖估錯嘅風險", "q": "In the model, when the agency is uncertain about which goal the politician prefers, it hedges by choosing a more equal distribution of resources to guard against the possibility that it is incorrect.", "loc": "Carrigan2018JTP p.26"}, {"id": 104, "n": "04", "s": 6, "t": "cause", "f": "目標含糊係拆開定合埋嘅理由？", "b": "Carrigan 認為目標含糊係將任務拆開交畀唔同機構嘅一個理由", "q": "Ambiguity is therefore an impetus to separate missions.", "loc": "Carrigan2018JTP p.8"}, {"id": 105, "n": "04", "s": 6, "t": "conceptual", "f": "「協調」喺模型入面係指乜能力？", "b": "Carrigan 將協調建模為機構喺任務之間調動資源嘅能力，而呢種能力喺任務被拆開時就冇", "q": "Coordination is modeled through the agency’s ability to move resources between missions, a possibility not available if the goals are separated.", "loc": "Carrigan2018JTP p.8"}, {"id": 106, "n": "04", "s": 6, "t": "evaluation", "f": "多任務機構幾時對政客最有價值？", "b": "Carrigan 認為當兩個目標既唔係強烈衝突、亦唔係高度一致時，多任務機構對政客最有價值", "q": "The result is that the multiple-mission agency is most valuable to the politician when the goals are neither strongly conflicted nor highly congruent.", "loc": "Carrigan2018JTP p.24"}, {"id": 107, "n": "04", "s": 6, "t": "cause", "f": "協調幾時最重要？", "b": "Carrigan 認為協調嘅重要性正正喺目標含糊變得最嚴重嗰陣加強", "q": "it is precisely when ambiguity becomes more debilitating that the importance of coordination intensifies", "loc": "Carrigan2018JTP p.6"}, {"id": 108, "n": "04", "s": 6, "t": "cause", "f": "目標相關度低嘅機構安排，長遠會點？", "b": "Carrigan 預計目標相關度較低嘅機構安排，會隨時間喺拆開同合併任務之間來回擺動", "q": "organizational arrangements where goals are less correlated might be expected to oscillate between separating and combining missions over time", "loc": "Carrigan2018JTP p.27"}, {"id": 109, "n": "04", "s": 6, "t": "evaluation", "f": "拆散或者合併機構，可能帶嚟乜？", "b": "Carrigan 認為拆散多任務機構或者合併分散嘅機構，都可能帶出同樣大但之前隱藏嘅問題", "q": "breaking up multiple-mission agencies or combining fragmented agencies may introduce equally large but previously hidden issues", "loc": "Carrigan2018JTP p.30"}, {"id": 110, "n": "04", "s": 6, "t": "cause", "f": "機構估錯政客偏好時，政客可能點做？", "b": "Carrigan 認為當機構估錯政客偏好時，政客可以刻意製造不確定，令機構冇咁落力追求錯誤嘅目標", "q": "The politician can foster uncertainty to persuade the agency to pursue its misinformed belief with less vigor.", "loc": "Carrigan2018JTP p.26"}, {"id": 111, "n": "04", "s": 7, "t": "fact", "f": "兼顧越多計劃嘅機構，表現點？", "b": "Carrigan 發現要兼顧越多計劃嘅美國聯邦機構，表現越差", "q": "agencies balancing greater numbers of programs perform worse", "loc": "Carrigan2018PAR p.669"}, {"id": 112, "n": "04", "s": 7, "t": "cause", "f": "點解兼顧多計劃嘅機構會表現差？", "b": "Carrigan 認為兼顧多個計劃嘅機構表現差，主要係因為佢哋更大機會要對計劃對象同時採取互相衝突嘅立場", "q": "such organizations struggle largely because they are more likely to be forced to simultaneously adopt conflicting stances toward program targets", "loc": "Carrigan2018PAR p.669"}, {"id": 113, "n": "04", "s": 7, "t": "fact", "f": "有「又扶又管」衝突嘅機構，分數差幾多？", "b": "Carrigan 發現對同一對象既扶持又約束嘅衝突機構，平均分數比冇衝突嘅機構低 11 分", "q": "Conflicted agencies score on average 11 points lower than nonconflicted agencies", "loc": "Carrigan2018PAR p.675"}, {"id": 114, "n": "04", "s": 7, "t": "fact", "f": "計劃數目嘅負面影響，有幾多可以用衝突解釋？", "b": "Carrigan 發現計劃數目對機構表現嘅負面影響，接近 35% 可以用機構被逼處理衝突嘅機會增加去解釋", "q": "close to 35 percent of the negative impact of the number of programs an agency balances on its performance appears to be explained by the increased probability such an agency is forced to balance conflict as a result", "loc": "Carrigan2018PAR p.676"}, {"id": 115, "n": "04", "s": 7, "t": "fact", "f": "衝突機構嘅員工有咩問題？", "b": "Carrigan 發現喺有衝突嘅機構，員工較唔清楚自己嘅工作點樣連到機構嘅目標同優先次序", "q": "in conflicted agencies, personnel are less clear about how their work connects to agency goals and priorities", "loc": "Carrigan2018PAR p.679"}, {"id": 116, "n": "04", "s": 7, "t": "conceptual", "f": "影響表現嘅關鍵係任務數目，定係乜？", "b": "Carrigan 認為影響機構表現嘅唔單止係任務累積，而係互相競爭嘅任務點樣互動", "q": "it is not simply that accumulating missions impedes agency performance but rather how those competing mandates interact that can define whether an agency will struggle to achieve its objectives", "loc": "Carrigan2018PAR p.669"}, {"id": 117, "n": "04", "s": 7, "t": "evaluation", "f": "處理目標衝突嘅補救方法有冇代價？", "b": "Carrigan 認為處理目標衝突嘅所有補救方法都有代價", "q": "All of these remedies have costs.", "loc": "Carrigan2018PAR p.678"}, {"id": 118, "n": "04", "s": 7, "t": "cause", "f": "排優先次序有咩代價？", "b": "Carrigan 認為為衝突目標排優先次序，會令低優先嘅目標被忽略，即使佢對社會福利有重要影響", "q": "Creating a pecking order for the conflicted goals means those assigned lower priority may be neglected despite having important implications for social welfare.", "loc": "Carrigan2018PAR p.678"}, {"id": 119, "n": "04", "s": 7, "t": "cause", "f": "喺機構內部分開職能有咩代價？", "b": "Carrigan 認為將職能分開去減少含糊，可能令分開咗嘅團隊之間出現張力同唔健康嘅競爭", "q": "creating separation between functions to mitigate ambiguity can introduce tension and unhealthy competition between the divided groups", "loc": "Carrigan2018PAR p.678"}, {"id": 120, "n": "05", "s": 1, "t": "fact", "f": "而家全世界有幾多競爭法管轄區？佢哋有咩特點？", "b": "Aydin 同 Büthe 指出今日超過 130 個競爭法管轄區入面，好多都係新加入者", "q": "Many of today's 130 plus competition law jurisdictions are newcomers", "loc": "AydinButhe2016 p.2"}, {"id": 121, "n": "05", "s": 1, "t": "evaluation", "f": "賦權競爭機構有咩風險？", "b": "Aydin 同 Büthe 認為賦權政府機構做影響深遠嘅市場干預，如果權力被濫用或者用得唔稱職，可能令所有人都更差", "q": "At the same time, empowering a government agency to engage in highly consequential market intervention may leave everyone worse off if those powers are abused or exercised incompetently.", "loc": "AydinButhe2016 p.3"}, {"id": 122, "n": "05", "s": 1, "t": "conceptual", "f": "障礙同有利條件嘅影響，取決於乜？", "b": "Aydin 同 Büthe 認為障礙同有利條件對競爭法成效嘅影響，視乎我哋當競爭法同政策嘅目標係乜", "q": "both impediments and conducive conditions are differentially harmful or helpful, depending on what we take to be the goals of competition law and policy", "loc": "AydinButhe2016 p.3"}, {"id": 123, "n": "05", "s": 1, "t": "conceptual", "f": "競爭法有邊六個操作性目標？", "b": "Aydin 同 Büthe 將競爭法同政策嘅操作性目標分為效率、人類發展、私營部門競爭、對國家嘅競爭、競爭文化同經濟及政治自由六個", "q": "namely: (a) efficiency, (b) human development, (c) private sector rivalry, (d) rivalry vis-à-vis the state, (e) a distinctive", "loc": "AydinButhe2016 p.5"}, {"id": 124, "n": "05", "s": 2, "t": "fact", "f": "1970 年代末至 80 年代初，美國競爭法嘅主要操作性目標係乜？", "b": "Aydin 同 Büthe 指出受芝加哥學派影響，最大化消費者福利喺 1970 年代末至 1980 年代初成為美國競爭法同政策嘅主要操作性目標", "q": "maximizing consumer welfare became in the late 1970s and early 1980s the predominant operational goal of competition law and policy in the United States", "loc": "AydinButhe2016 p.5"}, {"id": 125, "n": "05", "s": 2, "t": "fact", "f": "消費者福利後來點樣被取代？", "b": "Aydin 同 Büthe 指出消費者福利好快由口號上嘅終極目標，讓位畀效率成為實際嘅操作性目標", "q": "Consumer welfare as the ultimate, rhetorically emphasized goal, however, quickly gave way to efficiency as the actual operational goal.", "loc": "AydinButhe2016 p.5"}, {"id": 126, "n": "05", "s": 2, "t": "conceptual", "f": "用效率代替消費者福利，靠咩假設？", "b": "Aydin 同 Büthe 認為用效率代替消費者福利雖然簡化分析，但只有喺效率增益會傳返畀消費者嘅假設成立時先有理據", "q": "Efficiency as a proxy for consumer welfare simplifies the required economic analysis, but can only be justified as long as the assumption can be maintained that efficiency gains will be passed on to consumers", "loc": "AydinButhe2016 p.5"}, {"id": 127, "n": "05", "s": 2, "t": "conceptual", "f": "效率目標首先要求打擊乜？", "b": "Aydin 同 Büthe 指出效率作為操作性目標，一般被理解為首先要求打擊卡特爾，尤其係定價同分配市場嘅協議", "q": "It has been widely understood to call, above all, for antitrust enforcement against cartels, especially price-fixing and market-allocating agreements among ostensible competitors.", "loc": "AydinButhe2016 p.6"}, {"id": 128, "n": "05", "s": 2, "t": "fact", "f": "「效率係唯一正當目標」有冇爭議？", "b": "Aydin 同 Büthe 指出芝加哥學派「效率最大化係競爭法唯一正當操作性目標」嘅主張喺好多國家仍然受到爭議", "q": "The Chicago School's claim that efficiency maximization is, or should be, the only legitimate operational goal of competition law and policy remains contested in many countries", "loc": "AydinButhe2016 p.6"}, {"id": 129, "n": "05", "s": 2, "t": "normative", "f": "唔接受「唯一目標」，仲可唔可以接受效率？", "b": "Aydin 同 Büthe 認為唔使接受效率係唯一目標，都可以接受效率係競爭法同政策嘅其中一個操作性目標", "q": "It is not necessary, however, to accept these claims in order to accept efficiency maximization or efficiency gains as one operational goal of competition law and policy.", "loc": "AydinButhe2016 p.7"}, {"id": 130, "n": "05", "s": 3, "t": "normative", "f": "有學者點樣睇發展中國家用競爭法追發展需要？", "b": "有學者主張發展中國家應該可以自由用競爭法同政策去追求佢哋各自嘅經濟同非經濟發展需要", "q": "Accordingly, a number of scholars argue that developing countries should be free to use competition law and policy to pursue their varying economic and non-economic developmental needs.", "loc": "a number of scholars (e.g. Bhattacharjea), in AydinButhe2016 p.7"}, {"id": 131, "n": "05", "s": 3, "t": "evaluation", "f": "增長同發展做競爭機構嘅目標有咩問題？", "b": "Aydin 同 Büthe 認為增長同發展本身通常離具體政策決定太遠，畀唔到競爭機構操作上嘅指引", "q": "Growth and development as such, however, are usually too far removed from specific policymaking decisions to yield operational guidance for competition agencies.", "loc": "AydinButhe2016 p.7"}, {"id": 132, "n": "05", "s": 3, "t": "conceptual", "f": "識別競爭障礙同消除障礙係咪一回事？", "b": "Aydin 同 Büthe 認為識別市場競爭障礙嘅能力，概念上同實務上都應該同消除或減少障礙嘅能力分開", "q": "This ability to identify impediments to market competition should be treated as conceptually and practically distinct from the ability to remove or reduce such impediments.", "loc": "AydinButhe2016 p.9"}, {"id": 133, "n": "05", "s": 3, "t": "evaluation", "f": "「認出疣容易過做手術」呢個比喻講乜？", "b": "Nelson 認為認出問題比做一個冇副作用嘅補救容易", "q": "[i]t may be easier to identify warts than to perform surgery that does not leave scars or have other nasty side effects", "loc": "Nelson, in AydinButhe2016 p.9"}, {"id": 134, "n": "05", "s": 3, "t": "fact", "f": "競爭倡議針對乜？佢喺競爭政策入面嘅地位點？", "b": "Aydin 同 Büthe 指出針對反競爭法律同公共政策嘅競爭倡議，越嚟越被認為係競爭政策一個獨特而非常重要嘅部分", "q": "Competition advocacy targeting anti-competitive laws and public policies is increasingly recognized as a distinct but very important part of competition policy.", "loc": "AydinButhe2016 p.10"}, {"id": 135, "n": "05", "s": 3, "t": "normative", "f": "喺發展中國家，對邊啲部門做倡議特別重要？", "b": "Aydin 同 Büthe 認為喺發展中國家，對立法機關同有立規或市場監管權嘅行政部門做競爭倡議應該特別重要", "q": "In developing countries, advocacy vis-à-vis legislatures and parts of the executive branch with rulemaking or market-regulating powers should therefore be particularly important.", "loc": "AydinButhe2016 p.11"}, {"id": 136, "n": "05", "s": 3, "t": "normative", "f": "如果經濟權力就係政治權力，限制市場集中有咩意義？", "b": "秩序自由主義學者認為如果經濟權力就係政治權力，限制市場集中對政治民主同市場經濟能否共存可能有根本重要性", "q": "if economic power is political power, some restrictions on market concentration may be of fundamental importance for the compatibility of political democracy and a market economy", "loc": "ordo-liberal scholars (Böhm; Eucken), in AydinButhe2016 p.13"}, {"id": 137, "n": "05", "s": 4, "t": "fact", "f": "發展中國家競爭政策最常被提起嘅特徵係乜？", "b": "Aydin 同 Büthe 指出發展中國家競爭政策最常被提及嘅特徵係三個層面嘅資源短缺", "q": "The most commonly noted characteristic of developing countries' competition policies is a shortage of resources on three levels", "loc": "AydinButhe2016 p.15"}, {"id": 138, "n": "05", "s": 4, "t": "evaluation", "f": "競爭機構嘅能力可唔可以喺內部建立？", "b": "Aydin 同 Büthe 認為歐盟嘅經驗顯示競爭機構嘅能力可以（甚至可能必須）喺內部建立", "q": "The EU experience suggests that capacity can (and maybe must) be built internally.", "loc": "AydinButhe2016 p.17"}, {"id": 139, "n": "05", "s": 4, "t": "cause", "f": "唔友善嘅政治法律環境會削弱邊種競爭政策？", "b": "Aydin 同 Büthe 認為唔支持甚至敵對嘅政治法律環境，好可能會削弱以執法為主、追求效率最大化嘅競爭政策", "q": "Having an unsupportive or even hostile political-legal environment is very likely to undermine enforcement-focused, efficiency-maximizing competition policies.", "loc": "AydinButhe2016 p.19"}, {"id": 140, "n": "05", "s": 4, "t": "evaluation", "f": "競爭機構可唔可以解決民主化、司法獨立同貪污問題？", "b": "Aydin 同 Büthe 認為要求即使最有資源嘅競爭機構對民主化、司法獨立同終結貪污作出多過邊際嘅貢獻，都係要求過高", "q": "However, anything more than a marginal contribution to democratizing the political system, increasing judicial independence, and ending corruption is too much to ask of even the most resourceful competition agency.", "loc": "AydinButhe2016 p.19"}, {"id": 141, "n": "05", "s": 4, "t": "fact", "f": "好多發展中國家對市場競爭嘅規範承擔點？", "b": "Aydin 同 Büthe 指出好多發展中國家對市場競爭作為經濟關係基本原則嘅規範承擔都好弱", "q": "Put differently, the normative commitment to market competition as the fundamental principle of economic relations is in many developing countries weak", "loc": "AydinButhe2016 p.20"}, {"id": 142, "n": "05", "s": 4, "t": "evaluation", "f": "缺乏競爭文化，機構可唔可以幫手？", "b": "Aydin 同 Büthe 認為缺乏競爭文化係競爭機構自己可以幫手改善嘅問題", "q": "The good news is that the lack of a competition culture also is a problem that competition agencies can themselves help alleviate.", "loc": "AydinButhe2016 p.21"}, {"id": 143, "n": "05", "s": 4, "t": "cause", "f": "豁免影響嘅經濟比例越大，會點？", "b": "Aydin 同 Büthe 認為一個國家經濟受競爭法豁免影響嘅比例越大，競爭政策就越唔可能有明顯效果", "q": "The larger the share of the country's economy affected by these exemptions, the less likely competition policy is to have a notable effect.", "loc": "AydinButhe2016 p.23"}, {"id": 144, "n": "05", "s": 4, "t": "cause", "f": "市場大細有冇影響？", "b": "Aydin 同 Büthe 認為國內市場嘅大細會影響競爭政策嘅成效", "q": "In sum, size matters.", "loc": "AydinButhe2016 p.24"}, {"id": 145, "n": "05", "s": 5, "t": "cause", "f": "國內盟友有幾重要？", "b": "Aydin 同 Büthe 認為支持競爭機構嘅國內盟友，喺幾個成功例子入面似乎係重要因素", "q": "The presence of domestic allies who are supportive of the competition agency appears to have been an important factor in several successful cases.", "loc": "AydinButhe2016 p.27"}, {"id": 146, "n": "05", "s": 5, "t": "evaluation", "f": "外國支持係咪一定好？", "b": "Aydin 同 Büthe 認為國際同區域組織對競爭機構嘅外國支持係一把雙刃劍", "q": "Foreign support can be a double-edged sword, however.", "loc": "AydinButhe2016 p.29"}, {"id": 147, "n": "05", "s": 5, "t": "cause", "f": "外國支持可能帶嚟咩觀感問題？", "b": "Aydin 同 Büthe 認為外國支持可能加強「競爭法係外國入口貨」嘅觀感，削弱本地對呢啲法律嘅接受", "q": "such foreign support may reinforce the perception of competition law as a foreign import, and undermine local receptiveness to such laws", "loc": "AydinButhe2016 p.29"}, {"id": 148, "n": "05", "s": 5, "t": "normative", "f": "競爭機構對政治精英要唔要自主？", "b": "Aydin 同 Büthe 認為對政治精英有某種形式嘅自主，係競爭機構權力嘅必要元素", "q": "Some form of autonomy from the political elite surely is a necessary element of the competition agency's power.", "loc": "AydinButhe2016 p.31"}, {"id": 149, "n": "05", "s": 5, "t": "normative", "f": "冇政治支持，一個野心大嘅競爭機構做唔做到嘢？", "b": "Aydin 同 Büthe 認為一個要同時挑戰私營精英同國家反競爭做法嘅競爭機構，冇政治支持就唔能夠有效運作", "q": "However, an agency with such an ambitious agenda cannot function effectively without political support.", "loc": "AydinButhe2016 p.31"}, {"id": 150, "n": "05", "s": 5, "t": "normative", "f": "點解競爭機構需要嵌入政治體系？", "b": "Aydin 同 Büthe 認為競爭機構依賴其他政治行為者，製造咗好多反撲機會，所以佢需要嵌入政治體系", "q": "This dependence on other political actors provides ample opportunity for pushback, which creates a need for competition agencies to be embedded in the political system", "loc": "AydinButhe2016 p.31"}, {"id": 151, "n": "05", "s": 5, "t": "normative", "f": "對集中而強大嘅經濟利益，機構要點？", "b": "Aydin 同 Büthe 認為競爭機構要對集中而強大嘅經濟利益有效執法，就必須對呢啲利益保持自主", "q": "Autonomy from concentrated and powerful economic interests is necessary if the competition agency is to effectively enforce the law against such interests.", "loc": "AydinButhe2016 p.31"}, {"id": 152, "n": "05", "s": 5, "t": "normative", "f": "有學者建議發展型國家同規管型國家兩派學者點做？", "b": "Dubash 同 Morgan 建議發展型國家同規管型國家兩派學者多啲對話", "q": "We suggest, then, that more dialogue between developmental state and regulatory state scholars is a productive way forward.", "loc": "DubashMorgan2012 p.274"}, {"id": 153, "n": "05", "s": 6, "t": "evaluation", "f": "有人認為競爭法喺發展中世界整體效果係點？", "b": "Rodriguez 同 Menon 認為喺發展中世界，競爭法同政策到頭來更可能害多過利", "q": "Specifically, Rodriguez and Menon argue that competition law and policy are in the end more likely to do harm than good in the developing world.", "loc": "Rodriguez and Menon (2016), in AydinButhe2016 p.32"}, {"id": 154, "n": "05", "s": 6, "t": "evaluation", "f": "另一種睇法點樣反駁「發展中國家只能二流執行」？", "b": "Fox 反對「發展中國家只能二流咁執行第一世界法律藍本」嘅講法", "q": "But she challenges the idea that developing countries are limited to a second-rate implementation", "loc": "Fox (2016), in AydinButhe2016 p.33"}, {"id": 155, "n": "05", "s": 6, "t": "fact", "f": "中國嘅競爭執法有咩特點？", "b": "Svetiev 同 Wang 認為中國嘅競爭執法公開照顧比成熟管轄區技術官僚範本更廣嘅政策目標", "q": "Chinese competition enforcement is openly sensitive to a broader set of policy goals compared to the legal and technocratic antitrust templates of mature jurisdictions", "loc": "Svetiev and Wang (2016), in AydinButhe2016 p.35"}, {"id": 156, "n": "06", "s": 1, "t": "definition", "f": "監管經濟理論嘅核心任務係解釋乜？", "b": "Stigler 認為監管經濟理論嘅核心任務，係解釋邊個得到監管嘅好處或負擔、監管採取咩形式、同監管對資源分配嘅影響", "q": "The central tasks of the theory of economic regulation are to explain who will receive the benefits or burdens of regulation, what form regulation will take, and the effects of regulation upon the allocation of resources.", "loc": "Stigler1971 p.3"}, {"id": 157, "n": "06", "s": 1, "t": "cause", "f": "經濟理論嘅中心命題係乜？", "b": "Stigler 嘅中心命題係：一般而言，監管係由行業爭取返嚟，並主要為行業利益而設計同運作", "q": "A central thesis of this paper is that, as a rule, regulation is acquired by the industry and is designed and operated primarily for its benefit.", "loc": "Stigler1971 p.3"}, {"id": 158, "n": "06", "s": 1, "t": "conceptual", "f": "呢套理論對政治制度有咩假設？", "b": "Stigler 假設政治制度係理性地設計同使用，係滿足社會成員慾望嘅適當工具", "q": "We assume that political systems are rationally devised and rationally employed, which is to say that they are appropriate instruments for the fulfillment of desires of members of the society.", "loc": "Stigler1971 p.4"}, {"id": 159, "n": "06", "s": 2, "t": "conceptual", "f": "行業可以向國家要幾多種主要政策？", "b": "Stigler 認為一個行業或職業可以向國家爭取嘅主要政策有四種", "q": "The main policies which an industry (or occupation) may seek of the state are four.", "loc": "Stigler1971 p.4"}, {"id": 160, "n": "06", "s": 2, "t": "cause", "f": "點解現金補貼對行業唔係咁吸引？", "b": "Stigler 認為除非可以限制受惠者，否則行業爭取到嘅現金補貼會被越嚟越多嘅新對手攤薄", "q": "unless the list of beneficiaries can be limited by an acceptable device, whatever amount of subsidies the industry can obtain will be dissipated among a growing number of rivals", "loc": "Stigler1971 p.5"}, {"id": 161, "n": "06", "s": 2, "t": "cause", "f": "有足夠政治力量嘅行業，一般會想要乜？", "b": "Stigler 假設任何有足夠政治力量利用國家嘅行業或職業，都會尋求控制入行", "q": "We propose the general hypothesis: every industry or occupation that has enough political power to utilize the state will seek to control entry.", "loc": "Stigler1971 p.5"}, {"id": 162, "n": "06", "s": 2, "t": "conceptual", "f": "行業要嘅第四類政策係乜？", "b": "Stigler 認為行業向國家爭取嘅第四類公共政策係定價", "q": "The fourth class of public policies sought by an industry is directed to price-fixing.", "loc": "Stigler1971 p.6"}, {"id": 163, "n": "06", "s": 2, "t": "cause", "f": "受監管行業入面，細公司嘅影響力會點？", "b": "Stigler 認為政治決定會考慮各公司嘅政治力量，所以受監管行業入面細公司嘅影響力大過喺冇監管市場應有嘅", "q": "The political decisions take account also of the political strength of the various firms, so small firms have a larger influence than they would possess in an unregulated industry.", "loc": "Stigler1971 p.7"}, {"id": 164, "n": "06", "s": 2, "t": "cause", "f": "政治過程會自動令邊啲人加入行業議事？", "b": "Stigler 認為政治過程會自動令有力量嘅外人加入行業嘅議事", "q": "Finally, the political process automatically admits powerful outsiders to the industry's councils.", "loc": "Stigler1971 p.7"}, {"id": 165, "n": "06", "s": 3, "t": "cause", "f": "行業從國家攞到嘅得益，同社會其他人嘅損失比較點？", "b": "Stigler 認為一個行業從國家攞到權力嘅得益，會少過社會其他人因此受到嘅損害", "q": "benefit to the industry will fall short of the damage to the rest of the community", "loc": "Stigler1971 p.10"}, {"id": 166, "n": "06", "s": 3, "t": "conceptual", "f": "政治決定同市場決定有咩根本分別？", "b": "Stigler 認為民主政治過程要求所有人同時作決定，呢點令佢同市場過程根本唔同", "q": "the political process demands simultaneity of decision", "loc": "Stigler1971 p.10"}, {"id": 167, "n": "06", "s": 3, "t": "cause", "f": "政治制度會實現邊啲偏好、忽略邊啲？", "b": "Stigler 認為政治制度會實現多數同好多少數嘅強烈偏好，但忽略多數同少數較弱嘅偏好", "q": "The system is calculated to implement all strongly felt preferences of majorities and many strongly felt preferences of minorities but to disregard the lesser preferences of majorities and minorities.", "loc": "Stigler1971 p.12"}, {"id": 168, "n": "06", "s": 3, "t": "conceptual", "f": "行業要用乜去「買」監管？", "b": "Stigler 認為尋求監管嘅行業要用政黨需要嘅選票同資源去付款", "q": "The industry which seeks regulation must be prepared to pay with the two things a party needs: votes and resources.", "loc": "Stigler1971 p.12"}, {"id": 169, "n": "06", "s": 4, "t": "cause", "f": "點解牌照係有效嘅入行障礙？", "b": "Stigler 認為職業牌照係有效嘅入行障礙，因為冇牌執業係刑事罪", "q": "The license is an effective barrier to entry because occupational practice without the license is a criminal offense.", "loc": "Stigler1971 p.13"}, {"id": 170, "n": "06", "s": 4, "t": "fact", "f": "開始發牌同職業規模定城市化關係較大？", "b": "Stigler 發現職業集中喺大城市嘅程度，比職業規模更同美國各州開始發牌有關", "q": "Urbanization is more strongly associated than size of occupation with licensure.", "loc": "Stigler1971 p.15"}, {"id": 171, "n": "06", "s": 5, "t": "normative", "f": "改革者要先明白乜，先可以用國家推改革？", "b": "Stigler 認為未發展出政治生活嘅基本邏輯之前，改革者冇能力利用國家推行改革", "q": "Until the basic logic of political life is developed, reformers will be ill-equipped to use the state for their reforms", "loc": "Stigler1971 p.18"}, {"id": 172, "n": "06", "s": 5, "t": "normative", "f": "經濟學家應該盡快建立乜理論？", "b": "Stigler 認為經濟學家應該盡快建立政治行為嘅理性理論", "q": "Economists should quickly establish the license to practice on the rational theory of political behavior.", "loc": "Stigler1971 p.18"}, {"id": 173, "n": "06", "s": 6, "t": "conceptual", "f": "監管經濟理論點樣睇政客？", "b": "Peltzman 指出監管經濟理論假設政客同其他人一樣係自利嘅最大化者", "q": "Politicians, like the rest of us, are presumed to be self-interested maximizers.", "loc": "Peltzman1989 p.1"}, {"id": 174, "n": "06", "s": 6, "t": "cause", "f": "俘虜理論點樣總結監管服務生產者嘅方式？", "b": "Jordan 總結俘虜理論為：監管透過製造本來唔會存在嘅卡特爾或者唔壓制壟斷去服務生產者利益", "q": "regulation served the producer interest either by creating cartels where they would otherwise not exist or by failing to suppress monopoly", "loc": "Jordan (1972), in Peltzman1989 p.5"}, {"id": 175, "n": "06", "s": 6, "t": "cause", "f": "原始經濟理論嘅主要結論係乜？", "b": "Stigler 嘅分析結論係生產者利益會贏得監管機構嘅服務", "q": "Thus the main conclusion of Stigler's analysis is that the producer interest will win the bidding for the services of a regulatory agency.", "loc": "Stigler (1971), in Peltzman1989 p.8"}, {"id": 176, "n": "06", "s": 6, "t": "cause", "f": "點解純粹保護生產者通常唔係最佳政治策略？", "b": "Peltzman 認為只要有啲消費者可以為稍為偏離卡特爾均衡提供選票或金錢，純粹保護生產者一般就唔會係主導政治策略", "q": "Thus as long as some consumers can offer some votes or money for a small departure from the cartel equilibrium, pure producer protection will not, in general, be the dominant political strategy.", "loc": "Peltzman1989 p.9"}, {"id": 177, "n": "06", "s": 6, "t": "cause", "f": "無謂損失對低效率監管有咩作用？", "b": "Becker 認為無謂損失會制約低效率嘅監管政策", "q": "Becker's central argument is that in a setup like this deadweight losses are a constraint on inefficient regulatory policies.", "loc": "Becker (1983), in Peltzman1989 p.12"}, {"id": 178, "n": "06", "s": 6, "t": "cause", "f": "邊類群體會從監管得益較多？", "b": "Peltzman 總結監管經濟理論：緊密而有組織嘅群體會比廣泛而分散嘅群體從監管得益更多", "q": "Compact, well-organized groups will tend to benefit more from regulation than broad, diffuse groups.", "loc": "Peltzman1989 p.13"}, {"id": 179, "n": "06", "s": 6, "t": "cause", "f": "點解監管過程對無謂損失好敏感？", "b": "Peltzman 認為因為監管嘅政治回報來自分配財富，監管過程對無謂損失好敏感", "q": "Because the political payoff to regulation arises from distributing wealth, the regulatory process is sensitive to deadweight losses.", "loc": "Peltzman1989 p.13"}, {"id": 180, "n": "06", "s": 7, "t": "conceptual", "f": "放寬監管帶出咩理論問題？", "b": "Peltzman 提出放寬監管係咪決定性咁推翻咗監管經濟理論嘅問題", "q": "Doesn't deregulation then decisively falsify the theory?", "loc": "Peltzman1989 p.2"}, {"id": 181, "n": "06", "s": 7, "t": "fact", "f": "1970 年代初嘅經濟學家有冇預測到放寬監管？", "b": "Peltzman 指出 1970 年代初執業嘅經濟學家，一百個都冇一個預測到隨後嘅大規模放寬監管", "q": "Not one economist in a hundred practicing in the early 1970s predicted the sweeping changes that were soon to happen.", "loc": "Peltzman1989 p.3"}, {"id": 182, "n": "06", "s": 7, "t": "evaluation", "f": "作為「監管點解出現」嘅理論，兩套理論各自有咩偏差？", "b": "Peltzman 認為作為監管出現嘅理論，監管經濟理論高估監管嘅出現，而規範分析當實證理論就低估", "q": "In sum, if the ET overpredicts the incidence of regulation, the NPT underpredicts it.", "loc": "Peltzman1989 p.17"}, {"id": 183, "n": "06", "s": 7, "t": "evaluation", "f": "「監管係為糾正市場失靈」呢套理論，喺解釋放寬監管時間上有咩弱點？", "b": "Peltzman 認為如果理論要求嘅監管退場要等二三十年甚至未發生，規範分析當實證理論就唔算有力", "q": "When the exit required by the theory takes twenty or forty years or has yet to occur, the theory can hardly be deemed powerful.", "loc": "Peltzman1989 p.19"}, {"id": 184, "n": "06", "s": 7, "t": "cause", "f": "導致放寬監管嘅兩股力量入面，邊股喺實證上更重要？", "b": "Peltzman 認為導致放寬監管嘅兩種經濟力量之中，可供再分配財富減少喺實證上更重要", "q": "However, I argue that the second force-decreases in available wealth-is empirically more important.", "loc": "Peltzman1989 p.20"}, {"id": 185, "n": "06", "s": 7, "t": "evaluation", "f": "鐵路同貨車業放寬監管，對理論分別代表乜？", "b": "Peltzman 認為鐵路放寬監管係監管經濟理論嘅勝利，而貨車業放寬監管就係佢嘅慘敗", "q": "If rail deregulation is a victory for the ET, truck deregulation is a resounding defeat.", "loc": "Peltzman1989 p.24"}, {"id": 186, "n": "06", "s": 7, "t": "evaluation", "f": "貨車業嘅放寬點解解釋唔到？", "b": "Peltzman 認為冇辦法用任何現有版本嘅監管經濟理論解釋貨車業大筆租金被政治行動完全取消", "q": "There is simply no way I know of to square the wholesale elimination of these rents by political action with any current version of the ET.", "loc": "Peltzman1989 p.26"}, {"id": 187, "n": "06", "s": 7, "t": "conceptual", "f": "「內生放寬監管」模型入面，放寬監管係咪糾正錯誤？", "b": "Peltzman 認為喺內生放寬監管模型入面，放寬監管唔係遲咗發現嘅政策錯誤得到糾正", "q": "In such a model deregulation is not the correction of some belatedly recognized policy error.", "loc": "Peltzman1989 p.38"}, {"id": 188, "n": "06", "s": 7, "t": "cause", "f": "剩好少財富可以再分配時，理論點睇繼續監管？", "b": "Peltzman 認為如果只剩好少財富可以再分配，監管經濟理論就搵唔到繼續監管嘅理由", "q": "If there is only trivial wealth to redistribute, the ET finds no rationale for continued regulation.", "loc": "Peltzman1989 p.39"}, {"id": 189, "n": "06", "s": 7, "t": "evaluation", "f": "整體嚟講，美國放寬監管案例符唔符合理論？", "b": "Peltzman 認為美國放寬監管案例嘅結果參差，但大致符合監管經濟理論預測嘅模式", "q": "The answers to these questions were mixed, but in the main followed the pattern implied by the ET.", "loc": "Peltzman1989 p.39"}, {"id": 190, "n": "06", "s": 7, "t": "evaluation", "f": "對監管制度範圍同形式嘅分析完成咗未？", "b": "Peltzman 承認對監管制度範圍同形式嘅完整分析仍未寫出嚟", "q": "But so far a full analysis of the scope and form of these institutions remains unwritten.", "loc": "Peltzman1989 p.41"}, {"id": 191, "n": "06", "s": 8, "t": "conceptual", "f": "延伸問題：市場力量同政治力量有咩關係？", "b": "Zingales 提出嘅核心問題係企業喺市場嘅力量可以幾大程度轉化成政治力量", "q": "To what extent can the power firms have in the marketplace be transformed into political power?", "loc": "Zingales2017 p.114"}, {"id": 192, "n": "06", "s": 8, "t": "evaluation", "f": "連不完全合約理論都假設咗乜？", "b": "Zingales 認為不完全合約理論都假設遊戲規則係外生指定同執行嘅", "q": "even the incomplete contracts view is designed for an environment in which the rules of the game are exogenously specified and enforced", "loc": "Zingales2017 p.114"}, {"id": 193, "n": "07", "s": 1, "t": "normative", "f": "競爭法要理性執行，要先決定乜？", "b": "Townley 認為要先決定公共政策目標應唔應該、同埋幾時喺競爭法入面考慮，競爭法先可以理性咁執行", "q": "Competition law cannot be rationally implemented until it has been decided whether public policy objectives should be considered there, and if so when.", "loc": "Townley2009Ch1 p.13"}, {"id": 194, "n": "07", "s": 2, "t": "conceptual", "f": "邊啲福利標準有分配效果？", "b": "Townley 認為所有福利標準（包括總福利）實際上都有分配效果", "q": "Section 2.1 demonstrates that all welfare standards (including total welfare) are (in practice) distributional.", "loc": "Townley2009Ch1 p.16"}, {"id": 195, "n": "07", "s": 2, "t": "cause", "f": "總福利標準表面中立，實際上會點？", "b": "Townley 認為總福利標準形式上好似價值中立，實際上經常將財富由消費者搬去生產者同佢哋嘅擁有人", "q": "even though the total welfare standard formally appears to be value neutral (it values consumer and producer welfare equally), in practice, it often leads to redistribution from consumers to producers (and their owners)", "loc": "Townley2009Ch1 p.19"}, {"id": 196, "n": "07", "s": 2, "t": "evaluation", "f": "消費者福利標準點解喺政治上受歡迎？", "b": "Townley 認為消費者福利標準喺政治上受歡迎，可能係因為佢幫手將天平拉向較弱、較少代表嘅群體", "q": "This may help to explain why the consumer welfare standard is so popular, from a political perspective, as it helps tip the balance in favour of weaker/underrepresented groups.", "loc": "Townley2009Ch1 p.19"}, {"id": 197, "n": "07", "s": 2, "t": "normative", "f": "有人話消費者同生產者之間搬錢冇乜特別，點回應？", "b": "Townley 回應 Bork 時指出，消費者同生產者之間嘅再分配有特別意義，因為所有公民都係消費者，但唔係個個都係生產者", "q": "All citizens are consumers, they are not all producers.", "loc": "Townley2009Ch1 p.20"}, {"id": 198, "n": "07", "s": 3, "t": "evaluation", "f": "食水中毒嘅例子想說明乜？", "b": "Townley 用一個例子質疑總福利標準一定令社會好過：一份會令生產商總剩餘增加一百萬歐元、但即刻令所有食水永久中毒嘅協議，係咪應該鼓勵", "q": "would one encourage an agreement between manufacturers that would increase their total surplus by €1 million, if this were to immediately lead to the irreparable poisoning of all drinking water?", "loc": "Townley2009Ch1 p.21"}, {"id": 199, "n": "07", "s": 3, "t": "conceptual", "f": "「增加社會財富」呢個目標係咪價值中立？", "b": "Townley 認為增加社會經濟財富呢個目標本身就係一個有價值判斷嘅目標", "q": "The objective of increasing society’s economic wealth is itself a value-laden objective.", "loc": "Townley2009Ch1 p.25"}, {"id": 200, "n": "07", "s": 3, "t": "cause", "f": "事後再分配嘅風險會點影響企業？", "b": "Townley 認為事後再分配嘅風險會反過來影響企業一開始嘅投資決定", "q": "the ‘risk’ of later redistribution would feed back into the undertakings’ initial investment decisions", "loc": "Townley2009Ch1 p.28"}, {"id": 201, "n": "07", "s": 3, "t": "evaluation", "f": "再分配係咪次次都做得到？", "b": "Townley 認為再分配唔係次次都做得到或者方便，即係當時唔一定係最好嘅解決方法", "q": "redistribution is not always possible or convenient, in the sense that it does not provide the best solution at that time", "loc": "Townley2009Ch1 p.28"}, {"id": 202, "n": "07", "s": 4, "t": "definition", "f": "「第二級衝突」係乜？", "b": "Townley 將「第二級衝突」界定為兩個目標都可以做到一部分、但唔可以全部做晒嘅情況", "q": "it may be possible to achieve some of A and some of B, but not all of both", "loc": "Townley2009Ch1 p.29"}, {"id": 203, "n": "07", "s": 4, "t": "evaluation", "f": "「排除」嘅好處係乜？邊類人偏好？", "b": "Townley 認為「排除」嘅好處係清晰，亦係將競爭法當成目的本身嘅人所偏好", "q": "exclusion has the advantage of clarity and is favoured by those who see competition law as an end in itself", "loc": "Townley2009Ch1 p.29"}, {"id": 204, "n": "07", "s": 4, "t": "conceptual", "f": "經濟學嘅起點：為非經濟目標去限制競爭係點？", "b": "Townley 指出經濟學嘅起點係：為咗非經濟目標去扭曲或者限制競爭，一般係冇效率嘅方法", "q": "Distorting or restricting competition to realise specific non-economic objectives is normally an inefficient way of achieving the end in question.", "loc": "Townley2009Ch1 p.30"}, {"id": 205, "n": "07", "s": 4, "t": "normative", "f": "唔同政策一定要用獨立規則？", "b": "Townley 認為唔同政策用獨立規則唔一定最好，有時用標準喺同一條條文處理互相衝突嘅公共政策目標更好", "q": "it is not always optimal to use separate rules (with separate goals) for different policies, sometimes it is better to be guided by standards, even conflicting public policy ones, within the same legal provision", "loc": "Townley2009Ch1 p.31"}, {"id": 206, "n": "07", "s": 4, "t": "normative", "f": "可預測性係咪法律制度唯一嘅價值？", "b": "Townley 認為可預測性唔係法律制度唯一嘅價值，作出「啱」嘅決定都重要", "q": "Yet, predictability is not a legal system’s only value … the ‘right’ decision is important too.", "loc": "Townley2009Ch1 p.34"}, {"id": 207, "n": "07", "s": 4, "t": "cause", "f": "完全排除環保同社會因素，會削弱乜？", "b": "Townley 認為如果競爭政策完全唔可以考慮環保同社會因素，推動企業社會責任嘅努力就會被削弱", "q": "If one cannot take environmental and social factors into account in competition policy at all, then the drive for CSR is undermined.", "loc": "Townley2009Ch1 p.36"}, {"id": 208, "n": "07", "s": 4, "t": "evaluation", "f": "「妥協」嘅壞處係乜？", "b": "Townley 認為「妥協」可能令所有互相衝突嘅目標都做唔好", "q": "a potential downside of compromise is that it may mean that none of the conflicting objectives are satisfactorily achieved", "loc": "Townley2009Ch1 p.38"}, {"id": 209, "n": "07", "s": 4, "t": "normative", "f": "機構設計應該跟乜？", "b": "Townley 認為機構設計應該跟從決定內容嘅憲制要求，而唔係倒轉", "q": "institutional design should follow from the constitutional imperative of the decisions’ content, not the other way round", "loc": "Townley2009Ch1 p.39"}, {"id": 210, "n": "07", "s": 4, "t": "cause", "f": "競爭政策納入政治利益有咩風險？", "b": "Townley 認為競爭政策一旦納入唔同政治利益，就有被政治過程俘虜、效用下降嘅風險", "q": "Remember that if competition policy incorporates different political interests it risks becoming captive to the political process, which may reduce its effectiveness.", "loc": "Townley2009Ch1 p.41"}, {"id": 211, "n": "07", "s": 5, "t": "evaluation", "f": "追求單一福利目標，一定令個餅變大？", "b": "Townley 認為冇辦法話喺競爭法追求單一福利目標一定會令個餅變大", "q": "it does not seem possible to say that pursuing a unitary welfare goal in competition law necessarily results in a bigger cake", "loc": "Townley2009Ch1 p.41"}, {"id": 212, "n": "07", "s": 5, "t": "normative", "f": "既然所有標準都搬錢，呢個立場揀邊個標準？點解？", "b": "Townley 認為既然所有經濟福利標準都會再分配，就應該用消費者福利標準，因為佢一般令社會最重要嘅一群得益", "q": "Given that all of the economic welfare standards redistribute, I advocate a consumer welfare standard, which I believe generally benefits the most important segment of society.", "loc": "Townley2009Ch1 p.42"}, {"id": 213, "n": "07", "s": 5, "t": "normative", "f": "如果要納入公共政策目標，考慮過程要點？", "b": "Townley 認為如果競爭政策納入公共政策目標，考慮過程必須盡量理性、透明同公開", "q": "If public policy goals are incorporated into competition policy their consideration must be as rational, transparent and open as possible", "loc": "Townley2009Ch1 p.42"}, {"id": 214, "n": "07", "s": 5, "t": "normative", "f": "第一個過濾器：幾時先用競爭法追公共政策？", "b": "Townley 認為只有喺出現競爭問題嘅時候，先應該用競爭法去達成公共政策目標", "q": "only where there is a competition problem should one use it to achieve public policy goals", "loc": "Townley2009Ch1 p.42"}, {"id": 215, "n": "07", "s": 5, "t": "normative", "f": "第二個過濾器：公共政策得益要點？", "b": "Townley 認為如果公共政策得益唔大可能明顯，公共政策平衡就冇咁有用", "q": "public policy balancing is less helpful where the public policy gain is not likely to be appreciable", "loc": "Townley2009Ch1 p.42"}, {"id": 216, "n": "07", "s": 5, "t": "normative", "f": "對聲稱嘅公共政策效果，應該持咩態度？", "b": "Townley 認為對任何聲稱嘅公共政策效果都應該持懷疑態度", "q": "one should be sceptical about any claimed public policy effects", "loc": "Townley2009Ch1 p.43"}, {"id": 217, "n": "07", "s": 6, "t": "fact", "f": "競爭法最普遍嘅理據係乜？", "b": "Odudu 指出競爭法最普遍嘅理據係用嚟解決某啲配置無效率問題", "q": "The seemingly ubiquitous justification for antitrust laws is that they exist to remedy certain problems of allocative ineﬃciency.", "loc": "Odudu2006 p.605"}, {"id": 218, "n": "07", "s": 6, "t": "cause", "f": "人為減產除咗效率問題，仲有乜後果？", "b": "Odudu 認為人為減產除咗造成配置無效率，仲有分配後果", "q": "Allocative ineﬃciency is not the only consequence of the contrived scarcity of output. There is also a distributional consequence.", "loc": "Odudu2006 p.606"}, {"id": 219, "n": "07", "s": 6, "t": "conceptual", "f": "用同唔用競爭法，各有咩後果？", "b": "Odudu 認為對某個做法用競爭法有分配後果，唔用競爭法同樣都有分配後果", "q": "Applying antitrust to a particular practice has distributional consequences; by the same token, not applying antitrust to a particular practice also has distributional consequences.", "loc": "Odudu2006 p.605"}, {"id": 220, "n": "07", "s": 6, "t": "conceptual", "f": "有人話競爭法畀消費者一種乜權利？", "b": "Lande 認為競爭法賦予消費者一種以競爭價錢購買貨品嘅財產權或者權利", "q": "property right or entitlement to purchase competitively priced goods", "loc": "Lande (1989), in Odudu2006 p.606"}, {"id": 221, "n": "07", "s": 6, "t": "conceptual", "f": "「邊個有權攞 area C」嘅對話，喺邊三個階段出現？", "b": "Odudu 認為關於邊個有權攞取轉移財富嘅「對話」，喺決定競爭法範圍、界定實體違法同決定違法可唔可以被合理化三個階段出現", "q": "The dialogue occurs when determining the scope of antitrust, in defining and characterizing a substantive infringement and in the determination of whether an antitrust infringement can be justified or excused.", "loc": "Odudu2006 p.607"}, {"id": 222, "n": "07", "s": 7, "t": "conceptual", "f": "喺競爭法範圍以外嘅人，等於得到乜？", "b": "Odudu 認為處於競爭法範圍以外嘅人，等於被賦予攞取被轉移財富（area C）嘅權利", "q": "Those lying beyond the scope of antitrust are given a right to the wealth represented by area C.", "loc": "Odudu2006 p.607"}, {"id": 223, "n": "07", "s": 7, "t": "fact", "f": "歐盟法幾時唔適用競爭法？", "b": "Odudu 認為喺歐盟法，當一項活動以理想方式做到足夠嘅再分配，歐盟競爭法就唔適用", "q": "When activity is suﬃciently redistributive in a desirable manner, EC antitrust does not apply.", "loc": "Odudu2006 p.608"}, {"id": 224, "n": "07", "s": 7, "t": "conceptual", "f": "決定某啲人唔受競爭法管，有冇分配後果？", "b": "Odudu 認為決定某啲人或者活動唔受競爭法管，本身就有分配後果", "q": "A decision that certain actors or certain activities are not subject to antitrust has distributional consequences", "loc": "Odudu2006 p.608"}, {"id": 225, "n": "07", "s": 7, "t": "evaluation", "f": "分配係咪實體法嘅主要關注？", "b": "Odudu 認為分配似乎唔係競爭法實體法嘅主要關注", "q": "distribution does not seem to be the primary concern of the substantive law", "loc": "Odudu2006 p.609"}, {"id": 226, "n": "07", "s": 7, "t": "conceptual", "f": "決定違法可唔可以被合理化嗰陣，實際上揀緊乜？", "b": "Odudu 認為決定一項違反競爭法嘅行為可唔可以被合理化時，就係揀緊消費者應唔應該畀多啲錢去資助一個值得做嘅目標", "q": "A choice is then made as to whether consumers should pay more to fund a worthy goal.", "loc": "Odudu2006 p.609"}, {"id": 227, "n": "07", "s": 7, "t": "fact", "f": "Ford/VW 案用咩理由合理化限制競爭？", "b": "喺 Ford/Volkswagen 案，歐盟委員會以有關安排對共同體最窮地區之一嘅基建同就業有極之正面嘅影響為理由，合理化限制競爭", "q": "extremely positive eﬀects on the infrastructure and employment in one of the poorest regions in the Community", "loc": "European Commission, Ford/Volkswagen (1993), in Odudu2006 p.611"}, {"id": 228, "n": "07", "s": 7, "t": "evaluation", "f": "分配考慮喺邊個關口份量可能最大？", "b": "Odudu 認為分配考慮喺決定可唔可以寬免或者合理化違法嗰關，有機會佔更大份量", "q": "Distribution has the potential to weigh more in the decision to excuse or justify an infringement.", "loc": "Odudu2006 p.613"}, {"id": 229, "n": "07", "s": 8, "t": "normative", "f": "用稅制直接補償有咩好處？", "b": "Odudu 認為政治上可能值得設立直接補償制度，透過稅制再分配得益，因為呢個係一個問責而有效嘅分配方法", "q": "It may be politically desirable to institute a direct system of compensation, redistributing the gains through the tax system, which is an accountable and eﬀective way to achieve distributional aims.", "loc": "Odudu2006 p.613"}, {"id": 230, "n": "07", "s": 8, "t": "evaluation", "f": "實際上 area C 會分畀邊個？", "b": "Odudu 認為競爭法實際上唔係畀消費者權利攞被轉移嘅財富，而係將呢筆財富分畀任何一個將佢用喺被視為理想用途嘅一方", "q": "rather than a consumer entitlement to area C, the wealth represented by area C may be allocated to any party that uses the wealth for a purpose deemed desirable", "loc": "Odudu2006 p.613"}, {"id": 231, "n": "07", "s": 8, "t": "conceptual", "f": "點解分配考慮永遠剔唔走？", "b": "Odudu 認為因為競爭法嘅範圍係一個由有政治選民嘅人決定嘅政治問題，分配考慮永遠冇辦法由競爭法剔走", "q": "Since the scope of antitrust is a political question, taken by those with political constituencies and inherently concerned with who gets what from the market and the state, distributive considerations can never be removed from antitrust.", "loc": "Odudu2006 p.613"}];
