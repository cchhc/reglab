{k:'01-1',t:'起點：「監管冇共識」？',lv:['swipe'],vis:[],
 b:`<p>好多書一開頭就話：「監管」呢個概念冇人有共同理解。出處係一種三分法：①訂權威規則再監察執行；②國家駕馭經濟嘅一切努力；③最闊嘅，連<b>無意圖、非國家</b>嘅社會控制都計埋。如果三種都成立，監管就真係好難定義。</p>
 <p>研究嘅做法唔係「我話佢係乜」，而係「睇大家點用」：喺商科、經濟、法律、政治、公共行政、社會學六個學科，搵出標題有 regulat* 而最多人引用嘅文章，逐篇編碼。</p>`},
{k:'01-2',t:'五條爭議問題',lv:['swipe'],vis:['v-target'],
 b:`<p>最抽象嗰層大家有共識：監管係<b>對個人或機構行為嘅干預</b>。分歧喺五條問題：①一定要有意圖？②同稅、資助係咪唔同類？③非國家可唔可以做監管者？④係咪只管經濟活動？⑤監管者同被監管者使唔使係兩個人？</p>
 <p><b>直接 vs 間接</b>係關鍵：直接＝標準直接打落目標行為（室內禁煙，違者罰款）；間接＝標準打落產生行為嘅<b>環境</b>（煙草稅、資助、強制披露）。有人反對將社會規範都計做監管，因為咁樣監管就冇邊界，分析價值好低。</p>`},
{k:'01-3',t:'數據講咩',lv:['swipe'],vis:[],
 b:`<p>真係寫明定義嘅文章好少（只有 14%），所以要由「點用」反推。但有兩樣嘢 101 篇<b>全部一致</b>：監管係<b>有意圖</b>嘅過程，同埋係<b>直接</b>干預。</p>
 <p>間接干預就冇咁一致：41% 包、55% 冇表態。監管者同被監管者使唔使分開，98% 文章完全冇講。<span class="muted">（重點唔係記數字，而係睇到：核心部分其實好有共識，分歧喺邊緣。）</span></p>`},
{k:'01-4',t:'兩個定義：本質 vs 模式（原型）',lv:['swipe'],vis:['v-target'],
 b:`<p><b>本質定義</b>：只留低少咗就唔再叫監管嘅元素，即係「對某目標人群活動嘅<b>有意圖干預</b>」。代價係太闊，同「政策」分唔開。</p>
 <p><b>模式定義（原型監管）</b>：再加「通常係<b>直接</b>嘅」，即係有約束力嘅標準＋監察＋制裁，由公營機構對私營經濟活動行使。佢係一個「放射狀類別」：中心係原型，外圈有間接干預、私營監管者、公營被監管者等。稅、資助、披露通常唔喺核心。</p>
 <p>同「工具箱」式分類（將競爭、溝通等都當監管手段）有張力，但兩者講緊唔同層次：一個講工具，一個講文獻嘅核心用法。</p>`},
{k:'01-5',t:'分歧跟研究問題走，唔係跟學科走',lv:['swipe'],vis:[],
 b:`<p>舊講法話分歧嚟自學科（法律人一套、經濟學者一套）。數據唔支持：研究關注點有差異，但<b>唔可以歸咎於學科</b>。只有少數學科差異，例如政治學比較少將間接干預計入監管。</p>
 <p>結論：當代監管研究<b>唔係</b>冇共同理解。</p>`},
/* ---------- 02 ---------- */
{k:'02-1',t:'四大家族：外因定內因',lv:['families'],vis:['v-families'],
 b:`<p>第一條大分界：有啲解釋強調<b>外在</b>因素（利益團體嘅力量、主流思想、經濟本質），有啲強調<b>內在</b>因素（例如機構文化）。然後分四家：<b>公共利益、利益團體、理念、制度</b>。</p>`},
{k:'02-2',t:'公共利益理論',lv:['families'],vis:['v-families'],
 b:`<p>推動監管嘅人係<b>為公眾利益做事嘅好心代理人</b>；監管用嚟喺市場失靈時攞到公眾想要嘅結果；監管者有專業、冇私心；執法同守法都冇難度。</p>
 <p>四個問題：①「公眾利益」本身難有共識；②監管者未必無私、有能力；③低估咗經濟同政治權力嘅影響；④結果往往令人失望。</p>
 <p>辯護：保留一種<b>規範性問法</b>，唔理一個監管計劃點出現，都問佢「合理應該追乜目標」。呢條問題就係 03、07、04、05 成條「為咗乜」線嘅起點。</p>`},
{k:'02-3',t:'經濟理論同監管俘虜',lv:['lobby','families'],vis:['v-market'],
 b:`<p>掉轉嚟睇：假設人人都<b>顧住自己、追求物質利益</b>。結論係「俘虜」：一般而言，監管係行業自己爭取返嚟、為行業利益而設計同運作。</p>
 <p>機制：有壟斷就有利潤，監管者有權分配呢啲利潤（監管租金），所以行業有誘因影響監管者，形成「監管市場」。而<b>集中、有組織</b>嘅利益通常贏<b>分散</b>嘅群體：律師每人利益大、肯游說；用法律服務嘅市民每人損失細、冇人抗爭。</p>
 <p>同一條邏輯亦可以反過來用：既然消費者分散，競爭機構可以幫手平衡游說力量（見 03 §四）。</p>`},
{k:'02-4',t:'俘虜唔係必然：幾個變奏',lv:['lobby','families'],vis:['v-wilson'],
 b:`<ul><li><b>反對者會動員：</b>行業搶到壟斷租金，就會刺激反對利益起嚟爭，最後冇租金可以長存。</li>
 <li><b>租金會被監管本身蝕走：</b>去到某個位，返去冇監管嘅狀態對行業反而更吸引 → 放寬監管。</li>
 <li><b>生命周期：</b>制度開始時為公眾利益，慢慢老化，最後被行業俘虜（孕育 → 青年 → 成熟 → 老年）。</li>
 <li><b>四種政治（2×2）：</b>按好處同成本係集中定分散分四格；俘虜只係其中一格（好處集中、成本分散）。最有趣係「創業家政治」：行業集中反對，淨係靠分散利益支持，監管都通過到。</li>
 <li><b>結盟：</b>環保標準提高，有時係行業同環保團體結盟嘅結果。</li>
 <li><b>批評：</b>經濟理論漏咗意識形態、道德立場；環保監管者可能真係出於利他。</li></ul>`},
{k:'02-5',t:'理念有力量',lv:['families'],vis:['v-families'],
 b:`<ul><li><b>思想氣候：</b>整體思想氣候決定邊啲監管工具同制度被視為可取（例如列根、戴卓爾年代嘅放寬監管）。</li>
 <li><b>文化理論：</b>四種互相競爭嘅世界觀（層級、平等、個人主義、宿命），各自對監管問題有唔同診斷同藥方；由 grid（行為受規則約束嘅程度）同 group（歸屬群體嘅程度）兩條軸分出嚟。</li>
 <li><b>監管對話：</b>監管本質上係溝通過程，要明白（甚至改善）監管就要明白溝通。</li>
 <li><b>近年例子：</b>有經濟學者話，新自由主義（市場原教旨主義）唔係現代經濟學嘅一貫應用，而係佢簡化嘅扭曲。經濟學幾乎每條問題嘅答案都係「睇情況」；市場「嵌入」喺制度入面；經濟學唔畀固定答案，而係指出唔同制度安排嘅後果；「包容」要睇成個結果分佈，唔止平均數；全球整合係手段唔係目的。呢個係嘗試改變「思想氣候」嘅一例。</li></ul>`},
{k:'02-6',t:'制度理論：制度塑造監管，同「點解要授權」',lv:['families'],vis:['v-families'],
 b:`<p>制度結構、安排同社會過程會顯著塑造監管。呢條線係對「所有監管都係俘虜」嘅回應：與其認命，不如問<b>點樣設計制度去避開俘虜</b>。</p>
 <p>核心問題：<b>點解要將權授畀監管機構？</b>答案圍繞三個概念：<b>資訊不對稱、可信承諾、卸責</b>。另一份讀物逐個檢查：單靠認知因素解釋唔到，決策成本同卸責都有道理，但今日最主要嘅原因係<b>可信承諾</b>。</p>`},
/* ---------- 06 ---------- */
{k:'06-1',t:'問題同中心命題',lv:['lobby'],vis:['v-market'],
 b:`<p>理論嘅任務：解釋<b>邊個</b>得到監管嘅好處或負擔、監管會採取<b>乜形式</b>、同對資源分配有<b>乜影響</b>。中心命題：一般而言，監管係行業爭取返嚟、為行業而設。</p>
 <p>方法上假設政治制度係理性地設計同使用嘅。所以問題唔係「國家點解唔為公眾」，而係「一個行業幾時、點解可以用國家達到自己目的」。</p>`},
{k:'06-2',t:'需求面：行業想由國家攞乜',lv:['lobby'],vis:['v-market'],
 b:`<p>國家獨有嘅資源係<b>強制力</b>。行業可以要四種政策：①直接補貼 ②控制新對手入行 ③影響替代品同互補品（牛油商打壓植物牛油）④定價。</p>
 <p>現金點解唔吸引？除非限制到受惠者，否則補貼會被越嚟越多新對手攤薄。所以一般假說係：<b>有足夠政治力量嘅行業都會想控制入行</b>（例：民航監管機構自 1938 年成立後冇批過一條新幹線）。</p>
 <p>但政治過程會限制行業攞到嘅好處：細公司話事多咗（石油進口配額越細嘅煉油廠比例越高）；程序有成本；有力嘅外人會被拉入議事桌。</p>`},
{k:'06-3',t:'供應面：政治點解偏幫小而強嘅利益',lv:['lobby'],vis:['v-market'],
 b:`<p>行業攞到嘅好處一定<b>少過</b>社會其他人嘅損失，咁民主點解唔否決？因為政治決定同市場唔同：要所有人<b>同時</b>決定，又要包埋唔關事嘅人。結果選民要將酌情權交畀代表，又冇誘因去了解同自己關係唔大嘅議題。</p>
 <p>所以政治渠道好「粗糙」：會實現多數同好多少數嘅<b>強烈</b>偏好，但忽略較弱嘅偏好。賣家係政黨，行業要用政黨最需要嘅兩樣嘢付款：<b>選票同資源</b>（捐獻、籌款、請黨工）。</p>`},
{k:'06-4',t:'證據：職業發牌',lv:['lobby'],vis:[],
 b:`<p>牌照係有效嘅入行障礙，因為<b>冇牌執業係刑事罪</b>。用美國各州首次發牌年份做分析，結果唔算穩健，但<b>城市化</b>（職業集中喺大城市）同發牌嘅關係比職業規模更強。</p>
 <p>持牌職業收入較高、較少受僱於企業（企業有誘因反對發牌）；全國性市場嘅職業（例如大學教師、工程師）多數唔發牌。</p>`},
{k:'06-5',t:'結論：要有政治行為嘅理論',lv:['lobby'],vis:[],
 b:`<p>批評監管機構偏幫行業，就好似批評超市賣餸一樣搞錯重點。要改變佢，唔係向佢說教，而係<b>改變佢背後嘅政治支持</b>。未搞清楚政治生活嘅基本邏輯，改革者就冇能力用國家推改革；所以經濟學家要盡快建立<b>政治行為嘅理性理論</b>。</p>`},
{k:'06-6',t:'由「生產者贏晒」到利益聯盟',lv:['lobby'],vis:['v-market'],
 b:`<p>理論最重要嘅地方：將政治行為放入經濟分析，政客都係<b>自利嘅最大化者</b>。之前流行「監管係為糾正市場失靈」；1960 年代實證研究之後，興起俘虜理論：監管要麼製造卡特爾，要麼唔去壓制壟斷，服務生產者。</p>
 <p>修正：只要有啲消費者肯為少少讓步畀選票或錢，<b>純粹保護生產者就唔係最佳政治策略</b>，政客會將租金分畀唔同群體（交叉補貼）。再加一層：<b>無謂損失</b>會制約低效率嘅監管。</p>
 <p>總結：緊密有組織嘅群體得益較多；因為監管嘅政治回報來自分配財富，監管過程對無謂損失好敏感。</p>`},
{k:'06-7',t:'放寬監管係咪推翻咗理論？',lv:['lobby'],vis:['v-market'],
 b:`<p>1970 年代末，美國鐵路、貨車、航空、長途電訊、股票經紀佣金、銀行存款利率相繼放寬監管，一百個經濟學家都冇一個預測到。如果生產者主導政治，點解會放寬？</p>
 <p>作為「點解會開始監管」嘅理論：利益理論<b>高估</b>監管，「糾正市場失靈」理論<b>低估</b>；後者亦解釋唔到放寬嘅時間（錯咗幾十年先退場）。</p>
 <p>兩股導致放寬嘅力量入面，<b>可分配財富減少</b>喺實證上更重要。鐵路 ✓（需求跌、交叉補貼食晒租金）；航空、經紀、銀行大致 ✓；貨車 ✗（租金仲大、業主工會反對到底都被放寬，現有理論解釋唔到）；長途電訊亦係失敗。</p>
 <p>「內生放寬監管」：監管製造誘因令財富被蝕走，最後回復舊狀態更吸引；放寬唔係遲咗糾正錯誤。整體答案參差但大致跟理論；完整分析仍未寫出嚟。</p>`},
{k:'06-8',t:'延伸：企業嘅政治權力',lv:[],vis:[],
 b:`<p>更闊嘅問題：企業喺市場嘅力量，可以幾大程度變成<b>政治力量</b>？連「不完全合約」理論都假設遊戲規則係外生、固定嘅，但大企業其實有能力影響規則。結果係惡性循環：市場力量帶嚟政治力量，政治力量再保護市場力量。</p>
 <p>同原本嘅俘虜理論比較：原本主要講行業爭取發牌、補貼；呢度擴到版權、反壟斷執法、告監管者、旋轉門同傳媒，並且話要睇<b>政策產出</b>而唔係遊說開支。</p>`},
/* ---------- 03 ---------- */
{k:'03-1',t:'由目標開始',lv:['judge'],vis:['v-spectrum'],
 b:`<p>歷史上，反壟斷同競爭法成日受社會同歷史因素影響，可以回應<b>好唔同嘅目標</b>。所以做法係：先講「經濟福利」，再逐個講其他目標，同埋佢哋同福利目標之間嘅矛盾。</p>`},
{k:'03-2',t:'經濟福利：總剩餘、唔理分配、要睇將來',lv:['price'],vis:['v-welfare'],
 b:`<p>一個行業嘅福利＝<b>總剩餘＝消費者剩餘＋生產者剩餘</b>。價錢越高，消費者蝕嘅通常多過廠商賺嘅，所以壟斷價時福利最低，等於邊際成本時最高。</p>
 <p>呢個概念<b>完全唔理</b>收入點樣分配。理由：原則上可以用再分配計劃令兩邊一齊好過或者一齊差過。</p>
 <p>要睇<b>動態</b>：如果次次逼價錢等於邊際成本，今日福利最高，但廠商收唔返固定成本就唔會投資，將來冇新產品、冇創新。</p>`},
{k:'03-3',t:'消費者福利定總福利：兩把尺幾時分岔',lv:['price'],vis:['v-welfare'],
 b:`<p>大多數情況（例如卡特爾）兩把尺結論一樣。但一宗<b>大幅慳固定成本嘅合併</b>，可以因利潤增加令總福利上升，同時加價令消費者福利下降。</p>
 <p>實際上邊個標準？好難講。歐盟有條文要求消費者分得「公平份額」、效率要「對消費者有利」，可能表示消費者福利係終極目標之一；美國起碼喺合併上傾向消費者福利；加拿大、澳洲、新西蘭就傾向總福利。即係話，唔同地方實際上真係唔同。</p>`},
{k:'03-4',t:'支持消費者福利嘅理由，同反駁',lv:['price','judge'],vis:[],
 b:`<p><b>三個支持理由：</b>①政治經濟學：消費者分散、生產者集中肯游說，多啲權重畀消費者可以拉返平；②資訊不對稱：合併公司比機構更清楚效率，只批准令消費者福利上升嘅合併可以抵銷；③簡單：只要睇價錢。</p>
 <p><b>反駁：</b>①今日消費者經股票、退休金擁有公司，削利潤一樣傷市民；②字面最大化消費者剩餘＝價錢壓到成本，廠商要退出或補貼；③（最重要）低價低利潤令廠商冇誘因創新、投資。所以講消費者福利都要講<b>跨時間</b>嘅，兩把尺分別就唔大。結論：偏好福利標準。</p>`},
{k:'03-5',t:'其他目標逐個拆',lv:['judge'],vis:[],
 b:`<ul><li><b>保護細企：</b>防大企業濫權冇問題；人為咁幫唔夠規模嘅細企生存就同福利相違。</li>
 <li><b>市場整合：</b>歐盟主要目標之一，但係政治目標，未必同福利一致。例：禁止跨國差別定價，壟斷者可能全部收高價、索性放棄低價市場，差距反而更大。</li>
 <li><b>經濟自由：</b>德國競爭法主要理據；但有啲限制（例如轉售價格維持）經濟上有理據，卻一定限制咗零售商自由。</li>
 <li><b>壓通脹：</b>懷疑；拆卡特爾只係一次過降價。</li>
 <li><b>公平：</b>限制大超市減價會損福利；但 70% 市佔超市有計劃低於成本定價逼走對手＝掠奪性定價，既唔公平又損福利。<b>事前公平</b>（起步機會一樣）同競爭政策相容；<b>事後公平</b>（結果一樣）就唔一定。</li></ul>`},
{k:'03-6',t:'社會、政治、環保、策略考慮點樣軟化執法',lv:['judge'],vis:[],
 b:`<ul><li><b>社會：</b>大蕭條時放寬執法容許夾價避免倒閉 → 好可能係比問題更差嘅藥方。</li>
 <li><b>政治：</b>少數人控制大部分資源可能危及民主（戰後拆散德日工業集團）。</li>
 <li><b>環保：</b>CECED 案批准洗衣機商停產最唔慳電型號，因為對社會有環境效益。但要問：係咪最佳方法？可以改用稅或者最低環保標準。</li>
 <li><b>策略：</b>扶植「國家冠軍」。立場：<b>競爭政策本身就係最好嘅產業政策</b>；受保護、受補貼嘅行業好難健康成長。</li></ul>`},
{k:'03-7',t:'定義：競爭政策淨係管福利，其他目標用其他工具',lv:['judge'],vis:['v-spectrum'],
 b:`<p>競爭政策＝確保市場競爭唔會受到<b>降低經濟福利</b>嘅限制嘅一套政策同法律。唔係話其他目標唔重要，而係：想達到其他目標，應該用<b>對競爭扭曲最少</b>嘅工具（同「一個目標一件工具」好接近，見 04）。衝突時邊樣優先，交畀政客、法官等人決定。</p>
 <p>相近睇法：監管政策有再分配後果，但對獨立監管者嚟講，呢啲後果應該係<b>約束，唔係目標</b>（理由：獨立機構只可以喺效率問題上有民主正當性）。有人質疑呢條效率／再分配分界喺發展中國家站唔站得住。另一種睇法就列出六個目標，效率只係其中一個（05）；反方就話分配趕唔走（07）。</p>`},
/* ---------- 07 ---------- */
{k:'07-1',t:'兩條問題：點解同幾時',lv:['judge'],vis:[],
 b:`<p>未答清楚「公共政策目標（環保、細企、就業）應唔應該喺競爭法入面考慮、幾時考慮」，競爭法根本冇辦法理性執行。</p>
 <p>針對嘅講法：用總福利做唯一目標，因為個餅最大；分得唔公平，之後用稅制「再切過」。呢個講法靠兩個前提：①總福利真係令社會好過；②分配可以之後做。只要一個唔成立，福利標準係咪「價值中立」就好重要。</p>`},
{k:'07-2',t:'所有福利標準實際上都會搬錢',lv:['price'],vis:['v-welfare'],
 b:`<p>消費者標準同生產者標準明顯揀咗一邊。總福利形式上一視同仁，但<b>實際上成日將財富由消費者搬去生產者</b>：生產者肯落最多資源打官司；有資訊、分配同時間上嘅優勢；交易本身係生產者為自己利益而做。</p>
 <p>所以消費者標準政治上受歡迎，可能正正因為佢幫手拉向較弱嘅群體。有人話消費者同生產者之間搬錢冇乜特別；回應：<b>所有公民都係消費者，但唔係個個都係生產者</b>。</p>`},
{k:'07-3',t:'「令社會好過啲」有價值判斷；事後再分配靠唔住',lv:['price','judge'],vis:[],
 b:`<p><b>前提①唔穩：</b>一份協議令生產商總剩餘多一百萬歐元，但即刻令所有食水永久中毒，你會唔會鼓勵？所以「增加社會財富」本身已經係有價值判斷嘅目標。將公共政策帶入福利分析有兩種方法：喺福利標準入面調權重（「市場平衡」，例如將環保等外部性內部化），或者直接將公共政策影響同福利影響擺上天秤（「單純平衡」，例如細企、就業）。</p>
 <p><b>前提②唔穩：</b>企業預計之後會被再分配，呢個風險會反過來影響佢哋一開始嘅投資；而且再分配唔係次次做得到、或者唔係當時最好嘅方法，拖得越耐越貴。</p>`},
{k:'07-4',t:'有衝突點算：排除定妥協',lv:['judge'],vis:['v-townley'],
 b:`<p>兩個目標衝突有兩種：只可以揀一個；或者兩個都做到一部分但唔可以全部（「第二級衝突」，主要講呢種）。</p>
 <p><b>排除</b>（淨係理一個，另一個交畀其他法例）：清晰、法律確定，係經濟學嘅起點（為非經濟目標限制競爭通常冇效率）。但：可預測性唔係唯一價值，「啱」嘅決定都重要；重要目標會被完全忽略；仲會封死企業社會責任（企業合作做環保協議可能要罰款）。</p>
 <p><b>妥協</b>（同一條法例入面平衡）：可能樣樣都做唔好；有人話非經濟目標好主觀，但福利標準本身都唔係客觀咁應用。法院話唔處理社會考慮，只會令判決嘅真正基礎「講唔出口、無意識」。機構設計應該跟決定內容嘅要求，唔係倒轉。最後風險：競爭政策包埋政治利益，有被政治過程<b>俘虜</b>嘅危險；經濟史亦顯示政府失靈比市場失靈更頻繁。</p>`},
{k:'07-5',t:'結論：消費者福利，加過濾器',lv:['judge'],vis:['v-townley'],
 b:`<p>冇辦法話單一福利目標一定令個餅變大。既然所有標準都搬錢，就揀<b>消費者福利</b>，因為消費者係社會最重要嘅一群。</p>
 <p>如果要考慮公共政策，要盡量<b>理性、透明、公開</b>，並過濾：①要有競爭問題（消費者福利有損失）先用競爭法追公共政策；②公共政策得益唔夠明顯就唔值得平衡；③立法機關最近已經就嗰個平衡做過決定（或刻意唔做），就少啲平衡。對聲稱嘅公共政策效果要<b>懷疑</b>，最好計到數。</p>`},
{k:'07-6',t:'一幅圖：用唔用競爭法，都係搬緊錢',lv:['price'],vis:['v-welfare','v-odudu'],
 b:`<p>競爭法通常話自己係為解決配置無效率：廠商減產加價，有啲肯畀成本以上嘅人買唔到，呢個損失叫<b>無謂損失（area A）</b>。但仲有分配後果：仲買得起嘅人要畀多咗，呢筆錢由消費者轉去生產者（<b>area C</b>）。</p>
 <p>核心句：<b>用</b>競爭法有分配後果；<b>唔用</b>都有。有人話競爭法畀消費者一種「以競爭價錢買嘢嘅權利」。關於邊個有權攞 area C 嘅「對話」，喺三個階段出現：範圍、實體違法、抗辯。</p>`},
{k:'07-7',t:'三個關口：範圍、實體法、抗辯',lv:['judge'],vis:['v-odudu'],
 b:`<ul><li><b>範圍：</b>放喺競爭法以外，就等於畀佢哋權利攞 area C。工會集體談判概念上係卡特爾，但美國同歐盟都豁免，等於容許財富由僱主轉去僱員。歐盟法：活動以理想方式做足夠再分配（例如社會保障），競爭法就唔適用。</li>
 <li><b>實體法：</b>禁止過高定價好似表示消費者有權攞 C，但呢類案好少，所以分配似乎唔係實體法主角。</li>
 <li><b>抗辯：</b>揀緊「消費者應唔應該畀多啲錢去資助一個值得做嘅目標」。美國嚴格立場唔接受分配理由，但名校按需要分配助學金嘅案都考慮咗社會福利；歐盟容許考慮其他得益：CECED（慳電）、Ford/VW（窮地區嘅基建同就業）。分配喺呢關<b>份量最大</b>。</li></ul>`},
{k:'07-8',t:'分配永遠趕唔走',lv:['judge'],vis:['v-odudu'],
 b:`<p>如果話贏家原則上可以補償輸家，咁政治上可能值得設一個直接補償制度，經稅制再分配，呢個係問責而有效嘅方法。但現實係：area C 唔係歸消費者，而係可以分畀<b>任何一個將錢用喺「理想用途」</b>嘅一方。</p>
 <p>結論：競爭法嘅範圍係一個<b>政治問題</b>，由有選民嘅人決定，本質上關於邊個由市場同國家攞到乜，所以分配考慮<b>永遠剔唔走</b>。重要嘅係承認佢。延伸：同一前提亦用嚟質疑國際競爭網絡將「卓越標準」講成價值中立。</p>`},
/* ---------- 04 ---------- */
{k:'04-1',t:'Tinbergen 法則：目標同工具要分清楚',lv:['agency'],vis:['v-tinbergen'],
 b:`<p>要達到 <b>n 個獨立目標</b>，起碼要 <b>n 件獨立工具</b>。三類變數：<b>數據</b>（影響唔到、只能接受，例如世界市場價格、外國關稅）、<b>目標</b>（想要嘅結果，例如產出、就業）、<b>工具</b>（手段）。</p>
 <p>容易搞亂：勞動生產力睇落似目標，但佢本身唔係目的，而係達到高工資、多產出、強競爭力嘅手段。</p>`},
{k:'04-2',t:'工具嘅性格：中立、互補、衝突',lv:['agency'],vis:['v-tinbergen'],
 b:`<p>兩個目標<b>獨立</b>＝可以同時達到。一件工具<b>中立</b>＝除咗佢要幫嘅目標，對其他目標完全冇影響。為目標 A 設計嘅工具同時推近目標 B ＝<b>互補</b>；推遠 B ＝<b>衝突</b>。</p>
 <p>兩件工具、三種性格，砌出六個情境：兩件都中立最簡單，各自管理就得；有衝突就要用多啲另一件工具去補，成本更高。</p>`},
{k:'04-3',t:'溢出越大越要協調，甚至合併',lv:['agency'],vis:['v-tinbergen'],
 b:`<p>除非目標獨立而工具中立，否則每項政策都會影響佢設計目標以外嘅目標。<b>溢出越強，越要協調</b>；工具 X 對目標 Y 影響越大，協調 X 同 Y 嘅好處越大，甚至值得<b>合併成一個行政單位</b>（假設同一機構入面協調較易）。</p>
 <p>就算目標同工具互相垂直，只要工具冇完全對準目標都唔夠，所以協調好少可以忽略。諷刺嘅係：協調喺<b>最需要嘅時候（變化快）最難做</b>（例：高速增長時嘅水質，受交通、農業、建設幾個部委影響）。</p>`},
{k:'04-4',t:'目標越嚟越多，可能要新工具',lv:[],vis:['v-tinbergen'],
 b:`<p>1952 年列嘅目標只有產出、就業、國際收支、實質工資幾樣；之後整體<b>增加咗</b>，例如環保、性別平等。按法則，目標多咗，工具都要多，所以可能要<b>發展新嘅政策工具</b>。</p>`},
{k:'04-5',t:'一個實例：生產力追唔上，就要喺目標之間揀',lv:['agency'],vis:[],
 b:`<p>歐盟同美國嘅 GDP 差距主要嚟自歐洲生產力增長放緩得更厲害。如果提升唔到生產力，就<b>唔可以一次過</b>做新科技領袖、氣候責任燈塔同世界舞台上獨立嘅玩家。要將基本價值（繁榮、公平、自由、和平、民主）互相取捨，就會失去存在理由；唯一出路係增長、提高生產力，同時保住公平。</p>
 <p>具體衝突：<b>減碳同競爭力</b>唔協調就會背道而馳；依賴中國可能係最平嘅減碳路，但中國國家資助嘅競爭威脅清潔科技同汽車業；<b>監管本身</b>亦阻礙創新企業擴張。用工具語言講：減碳同競爭力係互相衝突嘅工具；而呢度連目標本身都要取捨。</p>`},
{k:'04-6',t:'理論：清晰定協作——合埋都可以係最好',lv:['agency'],vis:['v-carrigan'],
 b:`<p>漏油同樓市爆煲之後，人人話「一身兼多職」係禍根。正式模型嘅答案：<b>唔一定</b>。就算機構同上司對目標冇分歧，結構選擇都會影響行為。</p>
 <p>兩股力：①<b>目標含糊</b>：多任務機構唔知上司最重視邊個，就「對沖」，資源分得平均 → <b>拆開</b>嘅理由。②<b>協調</b>：只有合埋嘅機構可以睇到情況後將資源搬嚟搬去（例：做銀行監管得返嚟嘅資料幫到貨幣政策）→ <b>合埋</b>嘅理由。</p>
 <p>結果：目標<b>既唔強烈衝突、又唔高度一致</b>時，多任務機構最有價值。弔詭：協調最重要嘅時候，正正係含糊最嚴重嘅時候；所以安排可能周而復始咁拆完又合；拆或合都可能帶出之前睇唔到嘅問題。意外結論：機構估錯政客偏好時，政客可能<b>刻意保持含糊</b>，等佢唔好咁落力追錯嘅目標。</p>`},
{k:'04-7',t:'實證：問題唔係任務多，而係又扶又管',lv:['agency'],vis:['v-carrigan'],
 b:`<p>傳統智慧：同時做幾樣嘢一定做唔出成績；漏油後有人話一個機構有三個衝突任務一定要拆。數據（1,062 個計劃、約 150 個美國聯邦機構）：兼顧越多計劃，表現越差。</p>
 <p>但主要原因係：佢哋更大機會要對<b>同一班人同時採取互相衝突嘅立場</b>（又租地畀石油公司，又規管佢哋）。有呢種衝突嘅機構平均低 11 分；計劃數目嘅負面影響，接近 35% 可以用衝突解釋；機制之一係員工唔清楚份工點連到機構目標。</p>
 <p>補救：排先後（低優先目標可能被忽略，雖然對社會福利重要），或者內部分開（兩組之間有張力、唔健康嘅競爭）。<b>所有補救都有代價。</b>研究係橫切面數據，因果要再證。</p>`},
/* ---------- 05 ---------- */
{k:'05-1',t:'先問咩叫成功：六個操作性目標',lv:['develop'],vis:['v-develop'],
 b:`<p>全世界有超過 130 個競爭法管轄區，好多係新手、係發展中國家。競爭法唔一定有益：賦權一個機構做影響深遠嘅干預，如果被濫用或用得唔好，可能<b>令所有人更差</b>。</p>
 <p>障礙同有利條件嘅影響，<b>視乎目標係乜</b>。所以先列六個操作性目標：(a) 效率、(b) 人類發展、(c) 私營部門內嘅競爭、(d) 對國家嘅競爭、(e) 競爭文化、(f) 經濟同政治自由。（同「淨係追福利」嘅立場唔同。）</p>`},
{k:'05-2',t:'效率：由消費者福利去到效率',lv:['develop'],vis:[],
 b:`<p>1970 年代末起，美國競爭法嘅主要操作性目標係最大化消費者福利；但好快消費者福利只係口號，實際操作目標變咗<b>效率</b>。用效率代替消費者福利令分析簡單，但前提係<b>效率增益會傳返畀消費者</b>（呢點同 07「總福利實際上搬錢去生產者」有關）。</p>
 <p>效率目標最清楚嘅要求係打擊卡特爾（定價、分市場）。「效率係唯一正當目標」喺好多國家仍有爭議；但唔使接受「唯一」，都可以接受效率係<b>其中一個</b>目標。</p>`},
{k:'05-3',t:'效率以外：發展、釋放競爭、對國家倡議、自由',lv:['develop'],vis:['v-develop'],
 b:`<ul><li><b>發展：</b>一下子將低效生產者暴露喺高效對手面前等於休克療法，福利制度薄弱時尤其傷；所以有人話發展中國家應該可以用競爭法追發展需要。但增長同發展離具體決策太遠，畀唔到操作指引；較具體嘅建議係集中處理影響窮人嘅行業，或者處理阻住邊緣群體入市嘅不平等。</li>
 <li><b>釋放私營競爭：</b>識別障礙同消除障礙係兩回事（「認出疣容易過做唔留疤嘅手術」）；單係公佈邊啲行業價格過高，已經可以吸引人入市。</li>
 <li><b>對國家嘅競爭同倡議：</b>好多時損害競爭嘅係國家本身（管制、國企優待、政府批出嘅壟斷）；針對反競爭法律同政策嘅<b>倡議</b>越嚟越重要，喺發展中國家對立法機關同有立規權嘅部門做倡議特別重要。</li>
 <li><b>經濟同政治自由：</b>如果經濟權力就係政治權力，限制市場集中對民主同市場經濟能否共存可能有根本重要性（同 03 嘅「政治原因」相通）。</li></ul>`},
{k:'05-4',t:'五類障礙',lv:['develop'],vis:['v-develop'],
 b:`<ul><li><b>資源不足</b>（機構嘅錢、內部專才、法院專業）：但歐盟競爭總司初期人手好少，頭幾年做市場分析、建立支持者，之後先執法 → 能力可以（甚至必須）<b>內部建立</b>。</li>
 <li><b>唔友善嘅政治法律環境</b>（法治弱、司法唔獨立、貪污、獨裁）：好可能拖垮以執法為主、追效率嘅政策；而且要機構去民主化、終結貪污係要求過高。</li>
 <li><b>缺乏競爭文化</b>：精英同大眾對市場競爭嘅承擔都弱，消費者同創業者呢班「天然支持者」唔會形成；好消息係機構可以幫手改善（將倡議擺中心）。</li>
 <li><b>制度未發展嘅市場</b>：產權弱、政府指揮、國企或行業獲豁免；豁免影響嘅經濟比例越大，效果越唔明顯。</li>
 <li><b>地理上細碎嘅市場</b>：市場細、基建差、被山河切開 → 「size matters」。</li></ul>`},
{k:'05-5',t:'有利條件：盟友、國際支持、嵌入式自主',lv:['develop'],vis:['v-develop'],
 b:`<ul><li><b>國內盟友：</b>喺成功例子入面好重要（民主化令消費者同細企有聲音；消費者保護機構提供資料、提集體訴訟）。</li>
 <li><b>國際支持：</b>技術援助、同儕評審、貿易協議嘅競爭條款。但係<b>雙刃劍</b>：可能令人覺得競爭法係「外國入口貨」，削弱本地接受。</li>
 <li><b>嵌入式自主，唔係形式獨立：</b>對政治精英要有某種自主；但一個要同時挑戰私營精英同國家嘅機構，<b>冇政治支持就做唔到嘢</b>（預算、修法、罰款要跟通脹調、其他部門要回應倡議）。呢種依賴製造好多反撲機會，所以要<b>嵌入</b>政治體系；同時對集中強大嘅經濟利益要保持自主先可以有效執法。發展中國家嘅基建監管研究亦用同一概念，建議發展型國家同規管型國家兩派多啲對話。</li></ul>`},
{k:'05-6',t:'分歧：害多過利，定係後發優勢',lv:['develop'],vis:[],
 b:`<p>一種睇法：喺發展中世界，競爭法到頭來<b>好可能害多過利</b>，因為市場制度弱，西方眼中嘅反競爭結構，可能其實係解決制度缺陷嘅辦法。</p>
 <p>另一種睇法：同意發達國家嘅「最佳做法」唔啱發展中國家，但反對話佢哋只可以二流咁執行；新制度<b>冇歷史包袱</b>，反而可以設計啱自己目標嘅制度。中國嘅競爭執法就公開照顧比成熟管轄區更廣嘅政策目標。</p>`}
];

const TYPE_ZH={fact:'事實',definition:'定義',conceptual:'概念',cause:'因果',evaluation:'評價',normative:'主張'};
function cardsPage(arg){
  const [note,sec]=(arg||'').split('-');
  const pool=CARDS_DATA.filter(c=>(!note||c.n===note)&&(!sec||c.s===+sec));
  let mode='unknown', order=[], idx=0, flipped=false;
  function build(){
    const known=store.get().known||{};
    order=pool.filter(c=>mode==='all'||!known[c.id]).map(c=>c.id);
    idx=0; flipped=false;
  }
  function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;flipped=false;render();}
  function render(){
    const known=store.get().known||{};
    const kn=pool.filter(c=>known[c.id]).length;
    const scope=note?`${note} ${NOTES_META[note].t}${sec?` · §${sec} ${NOTES.find(x=>x.k===note+'-'+sec).t}`:''}`:'全部筆記';
    let card='';
    if(!order.length){ card=`<div class="fcard done"><div><h3>呢副卡你已經全部識晒 🎉</h3><p class="muted">轉「全部卡」可以再溫一次。</p></div></div>`; }
    else{
      const c=CARDS_DATA[order[idx]];
      card=`<div class="fcard ${flipped?'flip':''}" id="fc" tabindex="0" role="button" aria-label="撳一下反卡">
        ${!flipped?`<div class="ff"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fq">${c.f}</div><span class="muted" style="font-size:13px">撳一下（或者按空白鍵）睇答案</span></div>`
        :`<div class="fb"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fa">${c.b}</div><blockquote>“${c.q}”</blockquote><span class="src">原文出處：${c.loc}</span></div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" id="bad">✗ 未識，等陣再嚟</button><button class="btn primary" id="good">✓ 識咗</button></div>`;
    }
    app.innerHTML=`<div class="lvhead"><span class="eyebrow">快速卡 · ${scope}</span>
      <div class="tabs"><button class="tab ${!note?'on':''}" data-n="">全部</button>${NOTE_ORDER.map(n=>`<button class="tab ${n===note?'on':''}" data-n="${n}">${n} ${NOTES_META[n].t}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="muted">呢副 ${pool.length} 張 · 識咗 ${kn} · 呢輪剩 ${order.length?order.length-idx:0}</span>
      <div class="row"><button class="btn ghost sm" id="mode">${mode==='all'?'只溫未識':'全部卡'}</button><button class="btn ghost sm" id="shuf">洗牌</button><button class="btn ghost sm" id="reset">清除「識咗」</button></div></div>
      <div class="progress"><i style="width:${pool.length?kn/pool.length*100:0}%"></i></div></div>
      ${card}
      <p class="muted" style="margin-top:14px;font-size:13.5px">卡面係我寫嘅問題；卡背係筆記入面嘅原子命題（中文）同原文英文引文，一字不改。卡背會出現人名，你唔使記，專心睇論點就得。</p>`;
    app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.n?'cards-'+b.dataset.n:'cards';});
    $('#mode').onclick=()=>{mode=mode==='all'?'unknown':'all';build();render();};
    $('#shuf').onclick=shuffle;
    $('#reset').onclick=()=>{const k=store.get().known||{};pool.forEach(c=>delete k[c.id]);store.set('known',k);build();render();};
    const fc=$('#fc'); if(fc){ fc.onclick=()=>{flipped=!flipped;render();$('#fc')&&$('#fc').focus();}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click();}}; }
    const g=$('#good'), b=$('#bad');
    if(g) g.onclick=()=>{const k=store.get().known||{};k[order[idx]]=true;store.set('known',k);next(true);};
    if(b) b.onclick=()=>next(false);
  }
  function next(ok){ if(!ok){ order.push(order[idx]); } idx++; flipped=false; if(idx>=order.length){ build(); } render(); }
  build(); render();
}

function mapPage(){

      const lvDone=!!(st.done&&st.done['l'+n]);
      const ok=read[x.k]&&kn===cs.length&&lvDone; tot++; if(ok) done++;
      return `<tr><td><a href="#notes-${n}" data-sec="${x.k}">§${s} ${x.t}</a></td>
        <td class="c">${read[x.k]?'✓':'—'}</td>
        <td class="c mono">${kn}/${cs.length}</td>

        <td class="c">${ok?'<span class="okb">掌握</span>':''}</td></tr>`}).join('');
  }).join('');
  app.innerHTML=`<div class="lvhead"><span class="eyebrow">進度地圖 · 筆記每一節都喺度</span><h2>${done} / ${tot} 節已經全部做完</h2>

    <div class="progress"><i style="width:${done/tot*100}%"></i></div></div>
    <div class="tablewrap"><table class="map"><thead><tr><th>節</th><th>讀懂版</th><th>卡</th><th>課／圖</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  app.querySelectorAll('[data-sec]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.sec;location.hash='notes-'+k.split('-')[0];setTimeout(()=>{const el=document.getElementById(k);if(el)el.scrollIntoView({block:'start'});},60);});
  bindVisLinks();
}

return {visuals,notesPage,cardsPage,mapPage};

   if(!two&&a===100){ $('#tk',el).textContent='😕 儲錢 100%，但減肥得 50%。一件工具好難兩樣都達標。';

 }

   opts:['由企業流去消費者','由消費者流去企業','兩邊平均'],ans:1,hint:'邊個有最多資源打官司、有最多資訊？',
   ex:'實際上成日將財富由<b>消費者搬去生產者</b>（同佢哋嘅老闆）：生產者肯落最多資源打官司；有資訊、分配同時間上嘅優勢；交易本身係佢哋為自己利益而做。<b>所有福利標準實際上都會搬錢。</b>',deep:'07-2',src:'筆記 07 §二'},
  {type:'mcq',h:'有人話：搬錢就搬錢啫，有乜特別？',lead:'消費者同企業之間搬錢，同兩批企業之間搬錢，點解唔同？',
   opts:['因為消費者一定窮過企業','因為所有公民都係消費者，但唔係個個都係生產者','冇分別'],ans:1,hint:'重點唔係貧富。',
   ex:'回應嘅重點唔係「消費者通常窮啲」，而係消費者係另一類、更重要嘅人：<b>所有公民都係消費者，但唔係個個都係生產者。</b>所以呢個立場揀<b>消費者福利標準</b>。',deep:'07-2',src:'筆記 07 §二、§五'},
  {type:'widget',h:'管定唔管，都係揀緊',lead:'撳上面兩個掣，睇 C 落邊個袋。',w:'pocket',deep:'07-6'},
  {type:'match',h:'分配喺三個關口出現',lead:'將每宗案配對佢喺邊個關口。撳左邊，再撳右邊。',pairs:[
   ['工會集體議價獲豁免','範圍：管唔管'],['禁止過高定價','實體法：違唔違法'],['CECED 慳電協議、Ford/VW 窮地區就業','抗辯：可唔可以合理化']],deep:'07-7',src:'筆記 07 §七'},
  {type:'mcq',h:'邊個關口份量最大？',lead:'三個關口入面，分配考慮喺邊度最有機會加份量？',opts:['範圍','實體法','抗辯'],ans:2,hint:'過高定價案好少見。',
   ex:'喺<b>抗辯</b>關口：決定一項違法可唔可以合理化，就係揀緊「消費者應唔應該畀多啲錢去資助一個值得做嘅目標」。',deep:'07-7',src:'筆記 07 §七'},
  {type:'flips',h:'目標撞埋點算？兩條路',lead:'撳開比較。',items:[
   ['🚧 排除：淨係理一個','清晰、法律確定。但重要目標會被完全忽略，仲會封死企業社會責任。'],
   ['⚖️ 妥協：同一條法例平衡','唔會完全漏咗目標。但可能樣樣都做唔好，亦有被政治過程俘虜嘅風險。']],deep:'07-4',src:'筆記 07 §四'},
  {type:'mcq',h:'中間路線：先過過濾器',lead:'一份企業協議話對環保有益，但完全冇令消費者蝕底（冇競爭問題）。按過濾器，應唔應該用競爭法去「平衡」環保目標？',
   opts:['應該，環保好重要','唔應該：冇競爭問題就唔使用競爭法去追公共政策'],ans:1,hint:'第一個過濾器問乜？',
   ex:'第一個過濾器：<b>要有競爭問題</b>先用競爭法追公共政策。其餘兩個：公共政策得益唔夠明顯就唔值得平衡；立法機關最近已經就嗰個平衡決定過，就少啲平衡。過程要透明，對聲稱嘅好處要懷疑。',deep:'07-5',src:'筆記 07 §五'},
  {type:'mcq',h:'最後：分配可唔可以完全趕走？',lead:'邊個講法最貼近筆記嘅結論？',
   opts:['可以，交晒畀稅制就得','唔可以：競爭法嘅範圍本身係政治問題，關乎邊個攞到乜','視乎法官心情'],ans:1,hint:'「範圍」由邊個決定？',
   ex:'競爭法嘅範圍由有選民嘅人決定，本質上關於邊個由市場同國家攞到乜，所以分配考慮<b>永遠剔唔走</b>。重要嘅係承認佢。',deep:'07-8',src:'筆記 07 §八'},
  {type:'review',h:'快速溫習',ids:[194,195,199,219,228,231]}
 ],take:['「只追總福利」靠兩個前提，兩個都唔穩。','所有福利標準都搬錢；總福利實際上成日搬去企業。','管唔管都係決定 C 歸邊個；抗辯關口份量最大。','中間路線：消費者福利＋過濾器，透明、懷疑。']};
const LESSONS=[L01,L02,L06,L03,L07,L04,L05];
const LNAME={};LESSONS.forEach((l,k)=>{LNAME[l.note]=`第 ${k+1} 課：${l.name}`;});window.__S.LNAME=LNAME;


/* ---------- home ---------- */
const GROUPS={0:'一、監管係乜',1:'二、點解會有監管',3:'三、監管應該追乜目標'};
function home(){
  const st=S();
  const open=k=>k===0||st.done[LESSONS[k-1].id];
  const allDone=LESSONS.every(l=>st.done[l.id]);
  const nodes=LESSONS.map((l,k)=>{const d=st.done[l.id],o=open(k);
    return (GROUPS[k]?`<div class="grp">${GROUPS[k]}</div>`:'')+`<div class="node ${d?'done':o?'open':'locked'}"><button class="dot" data-l="${k}" ${o?'':'disabled'} aria-label="${l.name}">${d?'✓':o?l.icon:'🔒'}</button><div class="nm">${l.name}</div><div class="sub">${l.sub}</div></div>`;}).join('');
  app.innerHTML=`<div class="home">
   <div class="stats"><a href="../" class="brand" style="text-decoration:none;color:inherit" aria-label="返去課程目錄">⌂ 監管實驗室</a><span class="pills"><span class="pill" title="連續學習日數">🔥 ${st.streak}</span><span class="pill" title="經驗值">⭐ ${st.xp}</span><button class="pill" id="menu" aria-label="選單">☰</button></span></div>
   <div class="course"><span class="eyebrow">Regulatory Law · 打底 part · 7 課</span><h1>監管係乜、點解有、為咗乜</h1>
    <p class="muted">成個監管法 vault 嘅打底部分，問三條最基本嘅問題：「監管」究竟指乜；監管點解會出現、點樣變；監管應該追求乜目標。一個故事由頭行到尾：你係一個新入職嘅監管機構分析員。</p>
    <p class="muted" style="font-size:14px;margin-top:8px"><b>用法：</b>玩一課 → 好奇就撳「📖 想深入啲」→ 課尾溫卡 → 有空喺選單睇圖解同進度地圖。</p>
    ${Object.keys(st.done).some(k=>st.done[k])?`<button class="review-btn" id="rev">🔁 溫習已學嘅卡</button>`:''}
    ${allDone?`<p class="okline" style="margin-top:10px">🎉 七課全部完成！去「進度地圖」睇吓仲有邊節未掌握。</p>`:''}</div>
   <div class="path" id="path">${nodes}</div></div>`;
  app.querySelectorAll('.dot[data-l]').forEach(b=>b.onclick=()=>play(+b.dataset.l));
  const r=$('#rev'); if(r) r.onclick=reviewAll;
  $('#menu').onclick=menu;
}
function menu(){
  const d=document.createElement('div'); d.className='sheet';
  d.innerHTML=`<div class="in" role="dialog" aria-label="選單"><div class="grab"></div><h3>選單</h3>
   <div class="opts">${[['notes','📖 讀懂版：47 節逐節講解'],['cards','🃏 快速卡：232 張，全部原子命題'],['visuals','🗺️ 圖解：11 幅'],['map','📊 進度地圖：邊節掌握咗']].map(([h,t])=>`<a class="opt" href="#${h}" style="text-decoration:none;color:inherit">${t}</a>`).join('')}</div>
   <button class="cta" style="width:100%;margin-top:14px" id="cl">收埋</button></div>`;
  document.body.appendChild(d); d.onclick=e=>{if(e.target===d||e.target.closest('a')) d.remove();}; $('#cl',d).onclick=()=>d.remove();
}
/* ---------- player ---------- */
function play(li){
  const L=LESSONS[li]; let i=0, xp=0, first=0, total=0;
  function shell(inner,ready,ctaText){
    const sc=L.screens[i];
    app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="離開">✕</button><div class="bar"><i style="width:${i/L.screens.length*100}%"></i></div><span class="xp">⭐ ${xp}</span></div>
     <div class="screen" id="sc">${inner}</div>
     <div class="foot">${sc.deep?`<button class="deep" id="deep">📖 想深入啲</button>`:''}<button class="cta ${ready?'go':''}" id="cta" ${ready?'':'disabled'}>${ctaText||'繼續'}</button></div>`;
    $('#quit').onclick=()=>{location.hash='';home();};
    if(sc.deep) $('#deep').onclick=()=>drawer(sc.deep);
    $('#cta').onclick=()=>{i++; i>=L.screens.length?finish():render();};
  }
  const ready=()=>{const c=$('#cta');c.disabled=false;c.classList.add('go');};
  function render(){
    const sc=L.screens[i]; const head=`<h2>${sc.h}</h2>${sc.lead?`<p class="lead">${sc.lead}</p>`:''}`;
    if(sc.type==='story'){shell(head+sc.html,true,'開始');return;}
    if(sc.type==='mcq'){
      total++; let tries=0;
      shell(head+`<div class="opts">${sc.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="fb"></div>`,false);
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j; if(b.disabled) return; tries++;
        if(j===sc.ans){b.classList.add('right'); if(tries===1){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp;
          app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('#fb').innerHTML=`<div class="fb ok"><b class="t">${tries===1?'啱！':'啱咗！'}</b><p>${sc.ex}</p><span class="src">出處：${sc.src}</span></div>`; ready();}
        else{b.classList.add('wrong');b.disabled=true;
          if(tries===1) $('#fb').innerHTML=`<div class="fb hint"><b class="t">再諗一諗</b><p>💡 ${sc.hint}</p></div>`;
          else{const r=app.querySelector(`.opt[data-j="${sc.ans}"]`);r.classList.add('right');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
            $('#fb').innerHTML=`<div class="fb no"><b class="t">答案係：${sc.opts[sc.ans]}</b><p>${sc.ex}</p><span class="src">出處：${sc.src}</span></div>`; ready();}}
      }); return;}
    if(sc.type==='widget'){
      total++;
      shell(head+`<div id="w"></div><div id="aft"></div>`,false);
      W[sc.w]($('#w'),ok=>{ if(ok){first++;xp+=10;$('.xp').textContent='⭐ '+xp;} if(sc.after) $('#aft').innerHTML=`<div class="fb ok"><p>${sc.after}</p></div>`; ready();});
      return;}
    if(sc.type==='flips'){
      shell(head+`<div class="flips">${sc.items.map((it,j)=>`<button class="flip" data-j="${j}"><span class="h">${it[0]}</span><span class="b">撳一下睇</span></button>`).join('')}</div>${sc.src?`<span class="src">出處：${sc.src}</span>`:''}`,false);
      const seen=new Set();
      app.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;b.classList.add('open');b.querySelector('.b').innerHTML=sc.items[j][1];seen.add(j);if(seen.size===sc.items.length) ready();});
      return;}
    if(sc.type==='match'){
      total++; let errs=0, sel=null, matched=0;
      const R=sc.pairs.map((p,j)=>({t:p[1],j})).sort(()=>Math.random()-.5);
      shell(head+`<div class="match"><div class="col">${sc.pairs.map((p,j)=>`<button class="mt" data-l="${j}">${p[0]}</button>`).join('')}</div><div class="col">${R.map(r=>`<button class="mt" data-r="${r.j}">${r.t}</button>`).join('')}</div></div><div id="fb"></div>`,false);
      app.querySelectorAll('.mt[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;app.querySelectorAll('.mt[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l;});
      app.querySelectorAll('.mt[data-r]').forEach(b=>b.onclick=()=>{if(sel===null||b.classList.contains('done'))return;
        if(+b.dataset.r===sel){b.classList.add('done');const l=app.querySelector(`.mt[data-l="${sel}"]`);l.classList.remove('sel');l.classList.add('done');sel=null;matched++;
          if(matched===sc.pairs.length){ if(errs===0){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp;
            $('#fb').innerHTML=`<div class="fb ok"><b class="t">全部配啱！</b><span class="src">出處：${sc.src}</span></div>`;ready();}}
        else{errs++;b.classList.add('err');setTimeout(()=>b.classList.remove('err'),320);}});
      return;}
    if(sc.type==='sort'){
      total++; let errs=0, ok=0;
      shell(head+`<div class="sortl">${sc.items.map((it,j)=>`<div class="si" data-j="${j}"><div class="st">${it[0]}</div><div class="sc">${sc.cats.map((c,ci)=>`<button class="sb" data-c="${ci}">${c}</button>`).join('')}</div><div class="sw2"></div></div>`).join('')}</div><span class="src">出處：${sc.src}</span>`,false);
      app.querySelectorAll('.si').forEach(row=>{const j=+row.dataset.j, it=sc.items[j]; let tries=0;
        row.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{ if(row.classList.contains('done')) return; tries++;
          if(+b.dataset.c===it[1]){row.classList.add('done');b.classList.add('right');row.querySelector('.sw2').innerHTML=`<span class="okline">✓ ${it[2]}</span>`;ok++;
            if(ok===sc.items.length){ if(errs===0){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp; ready(); }}
          else{errs++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350);
            if(tries>=2){row.querySelector('.sw2').innerHTML=`<span class="hintline">💡 答案係「${sc.cats[it[1]]}」：${it[2]}</span>`;}
            else row.querySelector('.sw2').innerHTML=`<span class="hintline">💡 再諗吓：睇返上面嘅分類標準。</span>`;}});});
      return;}
    if(sc.type==='review'){
      let k=0, flipped=false;
      const draw=()=>{const c=CARDS[sc.ids[k]];
        shell(head+`<p class="muted" style="font-size:14px">第 ${k+1} / ${sc.ids.length} 張 · 撳卡反轉。卡背係筆記原文，人名唔使記。</p>
         <button class="rcard" id="rc">${!flipped?`<span class="q">${c.f}</span><span class="muted" style="font-size:14px">諗好答案，撳一下</span>`
          :`<span style="font-weight:700">${c.b}</span><blockquote>“${c.q}”</blockquote><span class="src">筆記 ${c.n} §${c.s} · ${c.loc}</span>`}</button>`,
         flipped&&k===sc.ids.length-1, flipped&&k===sc.ids.length-1?'完成':'繼續');
        $('#rc').onclick=()=>{ if(!flipped){flipped=true;draw();if(k<sc.ids.length-1){const c2=$('#cta');c2.disabled=false;c2.classList.add('go');c2.onclick=()=>{k++;flipped=false;draw();};}} };
      }; draw(); return;}
  }
  function finish(){
    const st=S(); const bonus=20; st.xp+=xp+bonus; st.done[L.id]=true; bumpStreak(st); saveAll(st);
    app.innerHTML=`<div class="done-screen"><div><div class="trophy">🏆</div><h2 style="font-size:26px;margin:6px 0">完成「${L.name}」</h2>
      <div class="stat3"><div>⭐ XP<b>+${xp+bonus}</b></div><div>🎯 一次答啱<b>${first}/${total}</b></div><div>🔥 連續<b>${st.streak} 日</b></div></div>
      <div class="take" style="margin:16px auto"><b>帶走呢幾句</b><ul>${L.take.map(t=>`<li>${t}</li>`).join('')}</ul></div>
      ${li+1<LESSONS.length&&L.id!=='rev'?`<button class="cta go" id="nextL" style="width:100%;max-width:520px;margin-bottom:10px">下一課：${LESSONS[li+1].name} →</button>`:''}
      <button class="cta" id="back" style="width:100%;max-width:520px">返去路線圖</button></div></div>`;
    confetti(); $('#back').onclick=()=>{location.hash='';home();}; const nl=$('#nextL'); if(nl) nl.onclick=()=>play(li+1);
  }
  render();
}
function drawer(k){
  const ks=k.split('|').filter(x=>noteBody(x)); if(!ks.length) return;
  const d=document.createElement('div'); d.className='sheet';
  d.innerHTML=`<div class="in" role="dialog" aria-label="深入講解"><div class="grab"></div>${ks.map(x=>{const n=noteBody(x);return `<span class="eyebrow">筆記 ${x.replace('-',' §')} · 讀懂版</span><h3>${n.t}</h3><div class="nb" style="margin-bottom:14px">${n.b}</div>`;}).join('')}
   <button class="cta" style="width:100%;margin-top:14px" id="cl">收埋</button></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d) d.remove();}; $('#cl',d).onclick=()=>d.remove();
}
function reviewAll(){
  const st=S(); const ids=LESSONS.filter(l=>st.done[l.id]).flatMap(l=>l.screens.find(s=>s.type==='review').ids);
  const fake={id:'rev',name:'溫習',screens:[{type:'review',h:'溫習已學嘅卡',ids:ids.sort(()=>Math.random()-.5)}],take:['隔幾日再嚟溫一次，記得更牢。']};
  LESSONS.push(fake); play(LESSONS.length-1); LESSONS.pop();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#4B4FD9','#1F9D62','#E5A800','#D2423A'];
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*5,c:cols[Math.floor(Math.random()*4)]}));
  let t=0; (function fr(){x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++t<150) requestAnimationFrame(fr); else c.remove();})();
}
function sub(title,fn,arg){
  app.innerHTML=`<div class="top"><button class="x" id="bk" aria-label="返回">←</button><b style="flex:1">${title}</b></div><div class="home pg" id="pg"></div>`;
  $('#bk').onclick=()=>{location.hash='';};
  const P=makePages($('#pg')); P[fn](arg);
}
function route(){
  const h=location.hash.replace('#',''); const base=h.split('-')[0], arg=h.slice(base.length+1);
  if(base==='notes') sub('讀懂版','notesPage',arg||null);
  else if(base==='cards') sub('快速卡','cardsPage',arg||'');
  else if(base==='visuals') sub('圖解','visuals');
  else if(base==='map') sub('進度地圖','mapPage');
  else if(base==='lesson'){const k=LESSONS.findIndex(l=>l.note===arg); if(k>=0){const st=S(); const ok=k===0||st.done[LESSONS[k-1].id]; ok?play(k):home();} else home();}
  else home();
}
window.addEventListener('hashchange',route);
window.__RL={NOTES,CARDS_DATA,LESSONS};
route();
})();

<script>const TERMS_DATA=[["監管俘虜", "regulatory capture", "n"], ["俘虜理論", "capture theory", "n"], ["監管經濟理論", "economic theory of regulation", "n"], ["公共利益理論", "public interest theory", "m"], ["放寬監管", "deregulation", "n"], ["內生放寬監管", "endogenous deregulation", "n"], ["職業發牌", "occupational licensing", "n"], ["本質定義", "essence-based definition", "n"], ["模式定義", "pattern-based definition", "n"], ["原型監管", "prototype regulation", "n"], ["放射狀類別", "radial category", "n"], ["生命周期", "life cycle", "n"], ["多數政治", "majoritarian politics", "n"], ["創業家政治", "entrepreneurial politics", "n"], ["客戶政治", "client politics", "m"], ["文化理論", "cultural theory", "n"], ["個人主義", "individualism", "n"], ["監管對話", "regulatory conversations", "n"], ["政治經濟學", "political economy", "n"], ["集中利益", "concentrated interests", "n"], ["分散利益", "diffuse interests", "n"], ["嵌入式自主", "embedded autonomy", "n"], ["芝加哥學派", "Chicago School", "n"], ["秩序自由主義", "ordoliberalism", "n"], ["國家冠軍", "national champions", "n"], ["掠奪性定價", "predatory pricing", "n"], ["轉售價格維持", "resale price maintenance", "n"], ["無謂損失", "deadweight loss", "n"], ["消費者剩餘", "consumer surplus", "n"], ["生產者剩餘", "producer surplus", "n"], ["總剩餘", "total surplus", "n"], ["總福利", "total welfare", "n"], ["經濟福利", "economic welfare", "n"], ["消費者福利", "consumer welfare", "m"], ["福利標準", "welfare standard", "m"], ["配置無效率", "allocative inefficiency", "n"], ["目標變數", "target variables", "n"], ["勞動生產力", "labour productivity", "n"], ["目標含糊", "goal ambiguity", "n"], ["溢出效應", "spillover effects", "n"], ["企業社會責任", "corporate social responsibility (CSR)", "n"], ["市場失靈", "market failure", "n"], ["壟斷", "monopoly", "n"], ["外部性", "externalities", "n"], ["資訊不對稱", "information asymmetry", "m"], ["交叉補貼", "cross-subsidy", "m"], ["卡特爾", "cartel", "m"], ["競爭法", "competition law", "m"], ["競爭政策", "competition policy", "m"], ["反壟斷", "antitrust", "m"], ["倡議", "advocacy", "n"], ["取捨", "trade-offs", "n"], ["因地制宜", "context-specific design", "m"], ["發展中國家", "developing countries", "n"], ["規管型國家", "regulatory state", "n"], ["監管機構", "regulatory agency", "m"], ["監管者", "regulator", "m"], ["監管政策", "regulatory policy", "m"], ["「監管」", "regulation", "n"], ["『監管』", "regulation", "n"], ["發展型國家", "developmental state", "n"], ["再分配", "redistribution", "n"], ["市場監管", "market regulation", "n"], ["酌情權", "discretion", "n"], ["實證理論", "positive theory", "n"], ["可信承諾", "credible commitment", "n"], ["卸責", "blame avoidance", "n"], ["國際競爭網絡", "International Competition Network (ICN)", "n"], ["公平競爭環境", "level playing field", "n"], ["問責", "accountability", "n"], ["正當性", "legitimacy", "n"], ["包容", "inclusiveness", "n"], ["技術官僚", "technocratic", "n"], ["豁免", "exemption", "m"], ["授權", "delegation", "m"], ["勾結", "collusion", "m"], ["規例", "regulation", "n"]];
(function(){
/* English key terms: first time a term shows up on a screen / card / panel, add （English） after it. TERMS is injected at build. */
const T=TERMS_DATA.slice().sort((a,b)=>b[0].length-a[0].length);
const MAP=new Map(T.map(t=>[t[0],t]));
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RE=new RegExp(T.map(t=>esc(t[0])).join('|'),'g');
const DONE=new Map(T.map(t=>[t[0],new RegExp(esc(t[0])+'\\s*[（(]\\s*[A-Za-z]')]));
const SKIP='h1,h2,h3,.brand,.nm,.sub,.pill,.grp,.dot,svg,script,style,textarea,input,blockquote,.src,.en,.tag,.tabs,.mono,.eyebrow,code,#gate,.termsheet';
const BOX='#sc,.sheet .in,.fcard,.panel,section,tr,.node,.lvhead,.course,.crs';
function box(n){const e=n.nodeType===1?n:n.parentElement;return (e&&e.closest(BOX))||document.getElementById('app')||document.body;}
function gloss(root){
  if(!root) return;
  if(root.nodeType===1&&root.closest&&root.closest(SKIP)) return;
  const tw=document.createTreeWalker(root.nodeType===3?root.parentNode:root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(root.nodeType===3&&n!==root) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p||p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
    RE.lastIndex=0; return RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const list=[]; let n; while((n=tw.nextNode())) list.push(n);
  list.forEach(tn=>{
    const c=box(tn); const v=tn.nodeValue; RE.lastIndex=0; let m, cut=[];
    const seen=new Set();
    while((m=RE.exec(v))){const k=m[0]; if(seen.has(k)) continue; seen.add(k);
      const after=v.slice(m.index+k.length);
      if(/^\s*[（(]\s*[A-Za-z]/.test(after)) continue;
      if(DONE.get(k).test(c.textContent)) continue;
      cut.push([m.index+k.length,MAP.get(k)]);}
    if(!cut.length) return;
    // only one gloss per term per box: re-check in order while inserting
    let node=tn, offset=0;
    cut.forEach(([pos,t])=>{
      if(DONE.get(t[0]).test(c.textContent)) return;
      const rest=node.splitText(pos-offset); offset=pos;
      const s=document.createElement('span'); s.className='en'; s.lang='en'; s.textContent='（'+t[1]+'）';
      rest.parentNode.insertBefore(s,rest); node=rest;});
  });
}
function legend(vp){
  if(vp.querySelector('.vterms')) return;
  const svg=vp.querySelector('svg'); if(!svg) return;
  const txt=svg.textContent; RE.lastIndex=0; const found=[]; const seen=new Set(); let m;
  while((m=RE.exec(txt))){const t=MAP.get(m[0]); if(!seen.has(t[1])){seen.add(t[1]);found.push(t);}}
  if(!found.length) return;
  const p=document.createElement('p'); p.className='vterms muted';
  p.innerHTML='<b>英文術語：</b>'+found.map(t=>`${t[0]}<span class="en" lang="en">（${t[1]}）</span>`).join(' · ');
  vp.appendChild(p);
}
function sheet(){
  const d=document.createElement('div'); d.className='sheet termsheet';
  const rows=T.slice().sort((a,b)=>a[1].localeCompare(b[1],'en',{sensitivity:'base'}));
  d.innerHTML=`<div class="in" role="dialog" aria-label="英文術語表"><div class="grab"></div><h3>🔤 英文術語表</h3>
   <p class="muted" style="font-size:14px">呢個課程用到嘅術語，按英文排。做 research 時用英文搵。<b>†</b>＝筆記冇寫英文，英文係我加嘅標準譯法。</p>
   <input id="tq" type="search" placeholder="搵中文或者英文" aria-label="搵術語" style="width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 10px">
   <div id="tl">${rows.map(t=>`<div class="trow"><span lang="en"><b>${t[1]}</b>${t[2]==='m'?' †':''}</span><span>${t[0].replace(/[「」]/g,'')}</span></div>`).join('')}</div>
   <button class="cta" style="width:100%;margin-top:14px" id="tcl">收埋</button></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d) d.remove();}; d.querySelector('#tcl').onclick=()=>d.remove();
  d.querySelector('#tq').oninput=e=>{const q=e.target.value.trim().toLowerCase();d.querySelectorAll('.trow').forEach(r=>{r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none';});};
}
function menuHook(el){
  const inn=el.querySelector('.in[aria-label="選單"]'); if(!inn||inn.querySelector('#tbtn')) return;
  const opts=inn.querySelector('.opts'); if(!opts) return;
  const b=document.createElement('button'); b.className='opt'; b.id='tbtn'; b.type='button'; b.textContent=`🔤 英文術語表：${T.length} 個`;
  b.onclick=()=>{el.remove(); sheet();}; opts.appendChild(b);
}
function scan(node){
  if(node.nodeType===1){
    if(node.classList&&node.classList.contains('sheet')) menuHook(node);
    (node.matches&&node.matches('.vispanel')?[node]:[...(node.querySelectorAll?node.querySelectorAll('.vispanel'):[])]).forEach(legend);
  }
  gloss(node);
}
const st=document.createElement('style');
st.textContent='.en{font-size:.84em;font-weight:500;color:var(--muted);font-family:var(--f);letter-spacing:0}.opt .en,.cta .en{color:inherit;opacity:.75}.vterms{font-size:13px;margin:10px 2px 0;line-height:1.7}.trow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}.trow span:last-child{text-align:right;color:var(--muted)}';
document.head.appendChild(st);
const mo=new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.classList&&n.classList.contains('en'))return; scan(n);}));});
mo.observe(document.body,{childList:true,subtree:true});
scan(document.body);
window.__TERMS=T;
})();
</script>
