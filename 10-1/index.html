{k:"01-1",t:"由「走向法律」到「走向非正式」",lv:[],vis:[],b:`<p>Roger 由一個轉變講起。二十世紀國家簽咗好多有法律約束力嘅國際協議，又成立咗聯合國、世界銀行、歐盟呢類正式國際組織去監察同執行；呢個「走向法律」改變咗全球治理嘅版圖。不過由 1970、80 年代開始，每年簽嘅條約少咗，新正式組織亦開少咗。合作冇停，而係轉咗形：法律化放慢嘅同時，出現咗一個「走向非正式」，好多機構喺傳統國際法範圍以外成立。</p>
 <p>2008 年金融海嘯就係例子：G20 變成協調中心，但佢冇常設秘書處、喺國際法上亦冇正式地位。FSB、BCBS、IOSCO 都差唔多。氣候、私隱、保安等範疇都有同類組織。</p>
 <p>Roger 自己整咗一套數據，證明呢個唔係錯覺：今日非正式組織最多佔現存國際組織三分之一；二戰剛完嗰陣只係得 5% 至 10%。而推動呢件事嘅主要係北美同歐洲嘅先進工業國。</p>`},
{k:"01-2",t:"正式同非正式國際組織點分：法律基礎係最根本",lv:[],vis:["v-roger"],b:`<p>正式同非正式組織都係「國際組織」：有成員國、基本結構、共同目標同產出，所以可以拎嚟比較。分別有兩個。第一個係秘書處：正式組織差唔多一定有，非正式組織好多時冇。但呢個只係傾向，唔係硬規則。第二個先至係最根本：正式組織由有法律約束力嘅國際協議成立，非正式組織就由諒解備忘錄（MOU）、「君子協定」呢類冇約束力嘅文書成立。</p>
 <p>點解要理呢個分別？文獻一般講「功能特性」（functional properties）：Eilstrup-Sangiovanni、Vabulas 同 Snidal 等人認為非正式機構快啲、靈活啲、保密啲。Roger 補充第二樣：「國內含義」（domestic implications）。喺國內開一個正式組織，要過好多政治、法律同預算關卡；非正式就低門檻得多。佢話呢啲國內含義喺解釋國家（同國家入面嘅人）點解想開呢類組織時，同功能特性一樣重要。</p>
 <p class="muted"><b>筆記嘅例子：</b>幾間公司想合作：簽正式合約，要經董事會、法務同財務批，但出咗事可以告；如果只係幾個部門主管飲茶定個「默契」，快、靈活、唔使問上頭，但冇得強制執行。Roger 嘅重點係：揀邊樣，好多時唔係因為邊樣最啱件事，而係因為「上頭批唔批到」同「主管想唔想俾上頭插手」。</p>`},
{k:"01-3",t:"Roger 嘅兩步理論：國內偏好，再加國際議價",lv:[],vis:["v-roger"],b:`<p>Roger 嘅中心命題：有管治需求嘅時候，非正式組織會被揀中——條件係決策者喺國內面對重大阻力，或者由獨立機構帶頭成立新機構，因為非正式有助保住佢哋嘅政策自主。</p>
 <p><b>第一步：國內偏好。</b> 起點係國家唔係一個整體。佢引 Macey：唔係國家決定合作，而係國家入面嘅監管者、官僚同政客。Roger 簡化成兩類人。政治機構（例如部委）傾向正式合作，因為可以展示領導、鎖定政策。獨立機構就傾向非正式，因為可以保住自主、靠專業權威做決定。</p>
 <p>呢兩個「基本偏好」會因條件而掉轉。政客面對國內強烈反對，正式合作就難搞、政治機會成本上升——於是轉用非正式。相反，如果獨立機構要同其他更政治化嘅國內角色分享決策（代表團被「政治化」），就更可能走正式路線。</p>
 <p><b>第二步：國際議價。</b> 國內偏好只講到國家想要乜，唔講到最後出咩。國家之間意見唔同，就睇議價能力。Roger 話想要非正式嘅國家有議價優勢，因為佢哋嘅選擇本身就貼近現狀，容易「頂住唔簽」。</p>`},
{k:"01-4",t:"點解越嚟越多：政治兩極化同規管型國家",lv:[],vis:["v-roger"],b:`<p>上面係「靜態」理論：某一刻點揀。Roger 再推出「動態」解釋：走向非正式主要歸因於先進工業國國內兩個長期轉變——政治兩極化，同規管型國家嘅出現。兩極化令國會僵持、國內阻力增加，政客就搵非正式出路。規管型國家就帶嚟大量獨立機構；佢哋越嚟越普遍，隨住全球化更深入參與國際事務，同時想保住自主。呢度同 Part 2 講嘅規管型國家接得上：Majone 解釋國家點樣由積極國家轉做靠獨立機構立規則（見 由積極國家到規管型國家）；Roger 就話呢班獨立機構行出國際時，會偏好非正式。</p>`},
{k:"01-5",t:"其他解釋：功能論同權力論",lv:[],vis:[],b:`<p>文獻上有兩套主流解釋。功能論（functionalist）假設國家按問題設計機構：當非正式係解決某個問題嘅最佳方法，國家就會揀佢。權力論（power-based）就話：強國想要非正式、保持最大彈性；弱國想要正式、綁得實啲。Roger 話兩套都有部分道理，但單靠佢哋解釋唔晒；佢自己嘅理論其實係補充，唔係取代。</p>`},
{k:"01-6",t:"利害：非正式好唔好，同「錯配」問題",lv:[],vis:[],b:`<p>點解要分清邊套理論啱？因為政策含義唔同。樂觀派例如奧巴馬政府嘅 Jake Sullivan 認為非正式合作機制更適合處理今日分散而複雜嘅跨國挑戰。悲觀派就擔心非正式會削弱全球治理嘅效能同問責。</p>
 <p>Roger 嘅推論：如果功能論啱，非正式化大概係對新問題嘅有效回應；但如果推動非正式嘅係權力、衝突或者國內政治，咁問題嘅性質同組織嘅形式之間就冇必然關係。佢嘅個案顯示：好多非正式組織成功，係「雖然」非正式，而唔係「因為」非正式。宏觀數據亦顯示非正式組織比正式組織更大機會「錯配」——而且錯配嘅比例隨非正式組織增加而上升。Guidi、Tavares 同 Townley（2022）就引用 Roger 書中嘅數字（約 46% 非正式組織錯配），見 ICN 入面邊個話事 › 謎題。</p>`},
{k:"01-7",t:"ICN 個案預告：美歐分歧同美國嘅否決權",lv:[],vis:[],b:`<p>本書第 7 章研究 2001 年成立嘅國際競爭網絡（International Competition Network, ICN），呢度只係預告。1990 年代反壟斷問題越嚟越跨國，歐美嘅獨立機構都覺得要有國際組織；佢哋起初都想要非正式，但後來就法律設計意見分歧。歐盟委員會轉而推動將競爭問題放入 WTO，Roger 話好大程度係因為當時反壟斷問題被政治化——即係第三節講嘅「代表團政治化就會走向正式」。美國嗰邊冇咁政治化，繼續偏好非正式；入 WTO 要美國同意，結果美國頂住，競爭議題喺多哈回合早期被剔走，美國支持嘅非正式方案（ICN）就成為全球反壟斷領域唯一企得住嘅機構。ICN 入面嘅權力分佈，見 ICN 入面邊個話事。</p>`},
{k:"04-1",t:"跨政府網絡係乜（Transgovernmental networks）",lv:[],vis:[],b:`<p>Raustiala（2002）研究嘅係「跨政府」合作：唔係外交部同外交部之間簽條約，而係各國專責嘅本地官員直接打交道。佢哋最常用嘅工具係監管機構之間嘅諒解備忘錄（MOU）：法律上冇約束力嘅軟法，但好多監管者覺得有效又靈活。國際證監會組織（IOSCO）就係一個例子：佢唔係傳統國際組織，因為冇一個成員係國家。</p>
 <p>呢點同 ICN 只准競爭主管機關做成員一樣，見 ICN 入面邊個話事 › 謎題；Roger（2020）就以法律基礎（冇約束力文書）去界定非正式國際組織，見 走向非正式 › 正式同非正式點分。</p>`},
{k:"04-2",t:"點解會興起：監管擴張、互相依存、科技同執法",lv:[],vis:[],b:`<p>Raustiala 話推動監管網絡發展嘅有三大因素；而喺佢研究嘅證券、競爭同環境三個範疇，執法上嘅挑戰係最主要嘅動力。網絡唔係平均分佈：佢哋集中喺有複雜行政體系嘅富裕工業國之間。Roger（2020）亦話走向非正式主要由北美同歐洲嘅先進工業國推動，見 走向非正式 › 由走向法律到走向非正式。</p>`},
{k:"04-3",t:"監管權力點分佈，決定揀網絡定揀條約",lv:[],vis:["v-raus"],b:`<p>Raustiala 用「監管權力」嘅分佈去解釋國家揀網絡定揀條約：權力高度唔對稱，條約同國際組織就被迴避；權力高度分散，條約同國際組織就興旺。三個範疇剛好唔同：環境分散、競爭大致係兩強、證券差唔多一家獨大。Roger（2020）嘅權力論亦話強國偏好有彈性嘅非正式安排，見 走向非正式 › 功能論同權力論。</p>`},
{k:"04-4",t:"監管輸出同趨同（Regulatory export）",lv:[],vis:["v-raus"],b:`<p>網絡唔止交換資訊，仲會輸出監管模式。美國證監會（SEC）一貫係將其他司法管轄區拉埋美國模式，而唔係改美國模式。不過網絡推動改變，主要靠說服而唔係命令。對弱國嚟講，引入強國嘅監管模式可以當係攞齊網絡好處嘅「入場費」。結果，網絡帶嚟嘅劃一好可能跟主要經濟強國嘅偏好行。</p>
 <p>呢點同 Guidi、Tavares 同 Townley（2022）話 ICN 不成比例咁有利北美同歐洲競爭主管機關嘅講法方向一致，見 ICN › 邊個有影響力。</p>`},
{k:"04-5",t:"網絡同條約：補充，唔係取代",lv:[],vis:["v-raus"],b:`<p>Raustiala 唔覺得網絡會取代條約。網絡可以提升本地監管能力，從而降低守約成本、改善條約遵守；網絡最普遍嘅地方，正正係條約同國際組織政治上行唔通嘅地方，所以佢哋係填補空隙。佢嘅總結：跨政府合作係國際法嘅重要發展，比較大機會係補充、而唔係取代條約同國際組織。</p>`},
{k:"04-6",t:"批評同限制：正當性同能力",lv:[],vis:[],b:`<p>網絡亦有人批評。Raustiala 引 Picciotto：各國官員喺次國家層面直接嘅國際接觸，長期缺乏正當性。佢自己亦指出，Franck 嘅正當性理論著重形式、程序同規範，同跨政府合作嘅性質有深層矛盾。而且網絡因為非正式同靈活，做唔到監管者想要嘅所有嘢，甚至做唔到一份強而有力嘅多邊協議做得到嘅嘢。ICN 嘅正當性分析，見 ICN 嘅正當性 › 輸入正當性。</p>`},
{k:"05-1",t:"問題：技術唔確定下嘅國際政策協調",lv:[],vis:[],b:`<p>Haas（1992）嘅起點：全球問題嘅技術唔確定性同複雜性越嚟越大，令國際政策協調越嚟越需要、亦越嚟越難。特刊作者認為，控制知識同資訊本身就係權力嘅一個重要面向。</p>`},
{k:"05-2",t:"乜嘢係知識社群：四樣共同嘢",lv:[],vis:["v-haas"],b:`<p>Haas 嘅定義：知識社群係一個由專業人士組成嘅網絡，喺某個領域有公認嘅專長，並且對同政策相關嘅知識有權威性嘅說法。成員有四樣共同嘢。第一，共同嘅規範同原則信念；第二，共同嘅因果信念；第三，共同嘅有效性標準；第四，共同嘅政策事業。</p>
 <p class="muted"><b>筆記嘅例子：</b>一班喺唔同國家政府同大學做事嘅氣候科學家：佢哋都相信要保護環境（原則信念）、都相信排放導致暖化（因果信念）、都用同一套同儕評審標準判斷研究（有效性標準）、都想推減排政策（政策事業）。佢哋就算唔同國籍，都會講同一套嘢。</p>`},
{k:"05-3",t:"知識社群點樣發揮影響",lv:[],vis:["v-haas"],b:`<p>決策者最有可能喺唔確定嘅情況下搵知識社群；而且往往要一場危機或者衝擊，先克服到制度慣性。知識社群如果喺國家行政機關同國際秘書處鞏固到官僚權力，就可以將影響制度化；咁樣，就算系統性權力集中已經唔足以迫各國協調，已建立嘅合作模式都可以維持。不過，知識社群嘅影響會唔會帶嚟政策協調，要睇佢哋嘅因果信念有冇顯示需要協調。</p>`},
{k:"05-4",t:"知識社群同利益團體有咩唔同",lv:[],vis:["v-haas"],b:`<p>知識社群唔係另一種利益團體。如果有反常現象動搖咗佢哋嘅因果信念，佢哋會退出政策辯論，利益團體就唔會。佢哋共同嘅信念，亦會抵銷要佢哋迎合高層決策者既有利益嘅壓力。</p>
 <p>Guidi、Tavares 同 Townley（2022）將知識社群概念用喺 ICN：網絡成員會偏幫所屬知識社群嘅諗法，而將本國利益放埋一邊，見 ICN › 邊個有影響力。</p>`},
{k:"05-5",t:"限制同隱憂：權力、政治同民主",lv:[],vis:["v-haas"],b:`<p>Haas 冇話專家話晒事。國家行為喺幾大程度上反映呢啲網絡嘅偏好，仍然好受國際權力分佈制約。就算有科學家參與、披上客觀同價值中立嘅外衣，政策選擇喺分配後果上仍然好政治。Haas 亦引 Dickson、Laird 同 Sclove 等學者指出，專門群體影響力越嚟越大，可能對民主同參與有嚴重負面影響。</p>`},
{k:"05-6",t:"點樣研究知識社群",lv:[],vis:[],b:`<p>最後 Haas 提出研究知識社群影響嘅步驟。</p>`},
{k:"02-1",t:"謎題：點解要另起爐灶，同 ICN 係乜",lv:[],vis:["v-icn"],b:`<p>文章由一個謎題開始：明明 OECD 同 UNCTAD 已經有討論國際競爭政策，點解各地 NCA 仲要用自己嘅時間同資源開一個新網絡？。點解大企業又肯出錢出力？</p>
 <p>ICN 嘅特點係只有 NCA 可以做成員，國家唔可以。ICN 自稱嘅使命係倡導全世界採用「卓越」嘅競爭政策標準同程序——並形容自己係一個以項目為本、靠共識、非正式嘅網絡。</p>
 <p>三位作者話，揀咗開一個 NCA 網絡、而唔用 OECD 呢類正常政府間組織，係 ICN 嘅「原罪」：佢不成比例咁有利於「訂規則嘅人」，主要係北美同歐洲先進工業國嘅 NCA。佢哋引 Roger（2020）解釋點解會揀非正式：如果帶頭成立國際組織嘅係獨立（非多數決）機構，結果就較大機會係非正式機構；Roger 計出近 46% 非正式國際組織同問題錯配，而錯配嘅國際組織有 74% 係非正式。Roger 自己點講，見 走向非正式 › 錯配問題。</p>`},
{k:"02-2",t:"兩面擋箭牌：共識同唔具約束力",lv:[],vis:["v-icn"],b:`<p>有人會話 ICN 唔使擔心正當性，理由有兩個。第一，工作成果要經 ICN 內部共識先算正式立場——即係冇 NCA 反對先得。第二，成果唔具約束力，國家可以揀做唔做。作者話兩樣喺形式上都啱，但實際上都唔大可能保護到新興 NCA（尤其佢哋嘅國家）抵抗更有權力嘅一方。</p>
 <p>點解要緊？因為同「競爭政策純粹技術、只講效率」嘅常識相反，競爭政策同執法涉及大量再分配選擇。叫專家「淨係理效率」，結果就會偏幫某一班人；輸家係喺 ICN 冇乜聲氣嘅國家（特別係發展中國家）、消費者、小企業，同被忽略咗嘅環境等政策利益。呢點同 Townley（2009）同 Odudu（2006）「福利標準都會搬錢」一致，見 福利標準都有分配效果。</p>`},
{k:"02-3",t:"ICN 入面邊個有影響力：富裕國家嘅 NCA",lv:[],vis:["v-icn"],b:`<p>作者話分析網絡唔可以淨係睇正式決策程序：網絡成日被描繪成中立，但同所有制度一樣，網絡係政治性嘅。</p>
 <p><b>「專家論證」偏幫大機構。</b> 國家之間通常靠政治議價（甚至武力），監管者就著重「專家論證」。呢度嘅「專家論證」係指近二十年 NCA 流行嘅經濟學範式。有兩個原因令佢特別有利於資源充足嘅大 NCA：第一，「技術」焦點有利於喺呢方面最強嘅一方；第二，一個冇國家喺入面嘅網絡更能保住 NCA 嘅自主、增加佢哋嘅權力。作者直言 ICN 追求「卓越標準」被包裝成價值中立，但其實唔係。</p>
 <p><b>領導位置集中。</b> 2018 年問卷顯示 86% 回應者認為督導小組（Steering Group）成員對 ICN 議程有更大影響力。督導小組成員由卸任成員推薦，加上「親近偏見」（affinity bias），結果成員主要喺大約二十個司法管轄區之間輪流。工作小組主席亦一樣：十四個主席入面歐盟同北美佔八個。富裕 NCA 仲提供培訓同支援，新興 NCA 覺得有用，但作者話呢個亦好似木馬屠城——將「訂規則嘅人」嘅諗法帶入資源最少嘅 NCA。</p>
 <p><b>NCA 同自己國家之間嘅楔子。</b> 網絡會將成員社會化：好多時網絡成員會用佢哋嘅專業知識，偏幫自己所屬「知識社群」（epistemic community）嘅諗法，而將本國利益放埋一邊。而國家又唔准入 ICN 保護自己嘅利益。</p>
 <p class="muted"><b>筆記嘅例子：</b>一個「國際足球規例委員會」只准各地裁判會加入，唔准各地足總加入。表面上人人一票、要全體同意先通過；但主席、秘書同起草小組幾乎全部嚟自歐洲大聯賽，佢哋又請細聯賽嘅裁判去培訓。最後通過嘅「最佳做法」好自然似大聯賽嘅做法，而細聯賽嘅足總（真正要埋單嘅人）連入房講句嘢都唔得。</p>`},
{k:"02-4",t:"非政府顧問（NGA）：律師行同大企業",lv:[],vis:["v-icn"],b:`<p>ICN 仲容許非政府顧問（non-governmental advisors, NGA）入到核心：大企業、律師行同學者。問卷顯示最多嘅 NGA 係律師行、大企業同學者。</p>
 <p>ICN 話 NGA 為所有持份者嘅整體利益工作；作者話呢個講法最好都只係天真。佢哋引 Wils（2019）：喺各種 NGA 入面，代表大企業觀點同利益嘅聲音差唔多必然最大。例子：2004 年有發展中國家 NCA 提議研究濫用支配地位（abuse of dominance），被拒；Jenny 報告話有代表懷疑，係因為商界 NGA 唔想競爭機關被鼓勵去追大跨國公司。呢種影響力同 Wils 喺第 3 週講嘅「獨立係為咗防俘虜」可以對照，見 歐盟競爭主管機關嘅獨立 › 防止俘虜。</p>`},
{k:"02-5",t:"ICN 點樣影響成員：唔具約束力都有壓力",lv:[],vis:["v-icn"],b:`<p>ICN 冇立規則嘅職能，成員亦冇條約下「有約必守」（pacta sunt servanda）嘅義務，落唔落實由成員自己決定。但作者話：ICN 係非正式、成果唔具法律約束力，呢件事本身講唔到幾多佢實際上有幾大能力令成員採用佢嘅成果。而且 ICN 已經由製作成果轉向推動落實。</p>
 <p>點樣施壓？跨國網絡主要靠兩個機制：自我規管，同提升國家遵從嘅能力。自我規管即係令聲譽變得重要：網絡社會化成員、密切監察，唔跟嘅就要解釋或者就範。能力建設就係培訓同技術援助。再長遠啲，仲有「第二層效應」：律師喺法庭、說客喺政治辯論引用 ICN 文件，去移動辯論嘅正當邊界、界定乜嘢先算「最佳做法」。呢點同軟法點樣生效嘅討論接得上，見 軟法點樣生效。</p>`},
{k:"02-6",t:"NGA 點解同點樣爭影響力：四個機制（Townley、Guidi 同 Tavares 2022）",lv:[],vis:["v-icn"],b:`<p>第 6 週核心閱讀 Townley、Guidi 同 Tavares（2022）喺 <i>Utilities Law Review</i> 嘅短文，將上面第四節嘅非政府顧問（NGA）問題講深一層：點解大企業同律師行要入 ICN，入咗之後點樣有影響。佢哋開宗明義話，文章探討大型跨國企業同佢哋嘅律師點樣影響國際競爭政策。NGA 唔係成員——但實際上，歐美跨國企業同代表佢哋嘅律師聲音不成比例。作者估律師行喺度會保護客戶（同自己）嘅利益，代價可能係消費者同有關國家嘅經濟。消費者組織同經濟學家各只佔大約 6%。</p>
 <p><b>點解要爭？</b> 因為競爭政策同執法喺唔同持份者同國家之間大量再分配。ICN 講乜，會影響好多競爭主管機關點樣解釋同執行措辭寬鬆嘅競爭法；有利嘅監管制度可以大大提高企業盈利。所以跨國企業同律師唔止爭個別好處，仲想改「遊戲規則」。呢個講法同 Zingales 嘅「企業影響遊戲規則」一致，見 企業嘅政治權力 › 不完全合約同爭租。</p>
 <p><b>點樣爭？</b> 四個機制：</p>
 <ol>
 <li><b>知識社群同規則嘅技術性</b>：NCA 同 NGA 嘅人屬於同一個專家社群（見 知識社群（Haas））。大企業壓倒性咁在場、冇乜制衡，好可能扭曲討論咩議題、點樣權衡。</li>
 <li><b>在場本身已經係權力</b>：NGA 冇正式控制權、唔投票——但佢哋幫手揀議題，超過 56% 參與起草或審閱。所以冇「法律」權力，但在場好可能畀到佢哋事實上嘅權力。</li>
 <li><b>早入局</b>：作者借 Lall（金融監管）嘅講法，規則由議程、規劃、討論文件、諮詢到通過分幾個階段，越早參與影響越大。歐美 NGA 傾向提議自己本來已經跟緊嘅規則。問卷顯示 77% NGA 認為早期參與起草重要或者非常重要。</li>
 <li><b>旋轉門</b>：即係監管機構職員之前或之後喺被監管企業做嘢。兩個過程：NCA 職員預期將來去律師行或企業搵工，可能（有意或無意）遷就 NGA 論點；企業又借調員工入資源不足嘅 NCA，作者直頭話呢個係資助 NCA。51% 問卷回應者認為曾喺 NCA 做過嘢對成為有影響力嘅 NGA 重要。旋轉門同俘虜嘅關係見 監管俘虜。</li>
 </ol>
 <p>結論重申 ICN 嘅「卓越標準」唔係價值中立。容易嘅議題（例如正當程序）已經做完，剩低嘅數碼等議題分配性更明顯，富裕國家 NGA 之間都有分歧，所以 NGA 返去搵共同點：推動落實 ICN 現有成果。呢點同第五節「ICN 由製作成果轉向推動落實」接得上。國內層面嘅版本（美國諮詢偏幫商界）見 公眾諮詢係咪偏幫商界。</p>`},
{k:"03-1",t:"評正當性嘅方法：每個國家用自己嘅民主模式",lv:[],vis:["v-legit"],b:`<p>作者認為每個國家都應該透過自己對民主嘅理解去評估 ICN 同佢嘅成果。由於用 ICN 成果嘅國家好多、民主版本各有唔同，佢哋覺得提供一套國家可以自己用嘅工具箱更有用。佢哋叫呢個做 Morgan 同 Yeung 所講嘅「中層」理論。</p>
 <p>工具箱有兩類正當性。輸入正當性（input legitimacy）問授權同參與；效能同效率就係兩種「輸出正當性」（output legitimacy），可以喺某程度上補償輸入正當性嘅不足——唔同國家接受唔同嘅平衡。呢套分類同 BHR vault 嘅 輸入、過程同輸出正當性 一致；Townley（2018）喺國內層面就話競爭法好難用輸出正當性補返輸入正當性，見 Townley 嘅結論。</p>`},
{k:"03-2",t:"輸入正當性：越權、唔係國家成立、冇政治時刻",lv:[],vis:["v-legit"],b:`<p><b>授權嚟源。</b> 第一條要問：成立同加入 ICN 嘅 NCA 有冇喺自己權力範圍內行事？作者認為葡萄牙 NCA 冇問題，但英國同歐盟（DG COMP）嘅 NCA 越權。對比：葡萄牙法例畀佢嘅 NCA 一個一般而明確嘅法律授權，參加國際組織唔使再問國會或者政府。歐盟就唔同：如果 ICN 成果算國際協議，要跟《歐盟運作條約》第 218 條嘅程序（委員會建議、理事會授權同締結、諮詢歐洲議會）；作者話 DG COMP「同意」ICN 建議做法嘅程序遠遠達唔到第 218 條嘅標準。</p>
 <p><b>組織性質。</b> ICN 有時自稱「國際組織」，但同 OECD 同 UNCTAD 唔同，ICN 唔係由國家自己成立，而係由 NCA 成立。最令人擔心嘅係，連成立嗰陣都冇一個由更廣泛國家利益揀呢條路嘅「政治時刻」。</p>
 <p><b>兩種民主模式。</b> 審議民主（deliberative democracy）要受影響嘅人平等參與；作者話用審議民主去合理化 ICN 唔具說服力——因為參與者主要係非多數決嘅 NCA，大部分持份者冇代表，美歐聲音又大得多。自由民主（liberal democracy）模式就要民選政客直接或間接控制競爭政策；各國對「NCA 應該有幾自由」睇法唔同，所以答案亦唔同。</p>`},
{k:"03-3",t:"效能：點解而家量度唔到",lv:[],vis:["v-legit"],b:`<p>好多評論者話 ICN 好成功，ICN 自己亦以成果數量做證據。作者話如果要睇成果質素，起點係：而家根本冇辦法量度 ICN 成果嘅效能。原因之一係 ICN 嘅目標之間同目標入面都有張力（例如消費者福利本身要喺唔同消費者之間取捨），而要理性咁平衡互相衝突嘅目標，就需要一個總目標；ICN 冇定，甚至好少承認有衝突。</p>
 <p>第二，ICN 可能專揀容易達成共識嘅題目。佢哋引 Gerber：喺支配企業行為同縱向限制呢啲重大實體範疇，冇乜證據顯示 ICN 推進咗趨同。第三，ICN 自稱「以結果為本」，但好少花力氣檢查自己活動嘅實證結果。所以作者建議：喺新興 NCA 未能大致平等咁參與議程之前，ICN 或者應該少啲推落實。</p>`},
{k:"03-4",t:"效率：資訊交流高效，但同 OECD 同 UNCTAD 重疊",lv:[],vis:["v-legit"],b:`<p>效率有好多面，最優結構通常係取捨嘅結果。正面嚟講，網絡（尤其 ICN）係資訊交流嘅高效渠道——不過對唔識呢套競爭「語言」、或者關心競爭政策更廣影響嘅人嚟講，ICN 就唔高效。</p>
 <p>負面嚟講，ICN 同 OECD 同 UNCTAD 好多重疊。作者嘅兩難：如果 ICN 得出同 OECD 或 UNCTAD 一樣嘅結論，就要問咁做有冇效率同效能；如果結論唔同，就要問佢正唔正當。更根本嘅係：ICN 究竟想做「知情分歧」（informed divergence）定係「協調統一」（harmonisation）都未講清，咁就評估唔到佢有幾高效。</p>`},
{k:"03-5",t:"結論：Rodrik 三難，同國家可以點做",lv:[],vis:["v-legit"],b:`<p>作者用 Rodrik 嘅「三難」（trilemma）收尾：民主、國家自決同經濟全球化三樣冇辦法同時最大化。佢哋話 ICN 強烈偏向經濟全球化（推廣統一嘅競爭規則），但好少理國家特色，而且暫時亦唔容許民主控制。結論：ICN 增加國與國之間嘅相互依存，但冇讓國家民主機構參與、冇向所有受影響嘅人開放、亦冇妥善吸納所有成員嘅意見，作者認為係唔理想。</p>
 <p>國家可以點做？可以要求更多透明，喺用 ICN 成果之前做政治審查；甚至可以將 ICN 成員由 NCA 改為國家，以加強政治監督。作者亦提醒：呢類要求可能影響 ICN 嘅存續同效能。</p>`},
{k:"06-1",t:"規管權由政府交畀私營國際機構（Focal institutions）",lv:[],vis:["v-tbt"],b:`<p>Büthe 同 Mattli（2011）指出一個明顯趨勢：政府將規管權力委託畀單一一個國際私營機構，而公營同私營行動者都當呢個機構係該範疇全球規管嘅理所當然場地。佢哋叫呢類機構做「焦點機構」。</p>`},
{k:"06-2",t:"點解會私營化同國際化，同私營標準點樣有約束力",lv:[],vis:["v-tbt"],b:`<p>原因之一係政府缺乏所需嘅專長、資源或者靈活性；企業同私人行動者亦推動私營治理，覺得比政府規管更有效率、更具成本效益。例子係 ISO 同 IEC：國家同政府本身唔可以做成員，最適合理解為由中央協調嘅全球網絡。呢點同 IOSCO 冇國家成員、ICN 只准 NCA 做成員可以對照，見 跨政府網絡 › 跨政府網絡係乜。</p>
 <p>私營標準點解有實際約束力？WTO《技術性貿易壁壘協定》（TBT Agreement）要求所有成員國用國際標準做國內法律同規例嘅技術基礎；用咗國際標準嘅規例，會被可推翻噉推定符合該國嘅 WTO 義務。即係話，私營機構寫嘅標準，透過一份條約同國內法接上。</p>`},
{k:"06-3",t:"有得有失：分配衝突同冇公共監督",lv:[],vis:[],b:`<p>例如財務報告標準國際統一有可觀好處，但會令某啲人承擔重大成本，所以引發分配衝突。而且呢啲全球私營規管者主要靠私營持份者自願供款，唔受公共監督，寫具體規則嘅專家小組亦唔使保存會議紀錄。</p>`},
{k:"06-4",t:"標準制定其實係政治",lv:[],vis:[],b:`<p>作者嘅核心講法：全球規則制定嘅用語係技術性，但本質係政治性。專業知識唔係一套關於乜嘢行得通嘅唯一正確信念。各國嘅國內標準機構，某程度上構成咗全球規管者嘅制度骨幹。</p>
 <p>呢點同 Guidi、Tavares 同 Townley（2022）話 ICN 將「卓越標準」包裝成價值中立嘅批評一致，見 ICN › 邊個有影響力；Haas（1992）亦話披上客觀外衣嘅政策選擇仍然好政治，見 知識社群 › 限制同隱憂。</p>`},
{k:"06-5",t:"邊個贏：制度互補性（Institutional complementarity）",lv:[],vis:["v-tbt"],b:`<p>邊個喺私營標準制定入面贏？技術專長同財政資源係必要、但唔係充分條件。作者嘅答案係制度互補性：喺層級分明、協調良好嘅國內體制入面運作嘅企業較大機會贏，因為佢哋嘅體制同只得單一焦點規管者嘅全球結構更配合。一國喺全球私營治理嘅影響力，好大程度取決於佢嘅國內制度同國際層面嘅制度結構有幾互補。</p>`},
{k:"07-1",t:"由規範轉去實證：點樣睇全球監管嘅正當性",lv:[],vis:[],b:`<p>Kerwer（2005）主張研究全球監管嘅民主正當性要行「實證轉向」：問題唔係分析者覺得正唔正當，而係參與嘅行動者覺得。佢嘅結論係，信評機構個案顯示全球治理嘅正當性問題唔止喺正式嘅非多數決監管者（NMRs），仲伸延到非正式嘅，而且有時搵唔到解決辦法。</p>`},
{k:"07-2",t:"延伸委託代理框架：內部問責同外部問責",lv:[],vis:["v-cra"],b:`<p>Kerwer 延伸委託代理框架。內部問責靠授權同資助；外部問責就唔同，委託人喺層級上唔高過代理人。佢亦借 Majone 嘅「委託人—受託人關係」：委託人授權非多數決監管者代佢行事，用嚟發出可信承諾嘅訊號（Majone 嘅可信承諾，見 獨立監管機構嘅正當性 › 點解授權）。外部問責比內部問責更容易有爭議；只集中講內部問責，會忽略更普遍、更重要嘅外部問責問題。</p>`},
{k:"07-3",t:"信評機構點樣變成強制性監管者",lv:[],vis:["v-cra"],b:`<p>信評機構評估信用嘅準則，實際上就係進入金融市場嘅准入規則。佢哋喺資本市場取得壟斷地位，所以變得具強制性。公營監管機構喺規管入面用評級，其實係用控制權換取成效，結果令信評機構變成「準公共監管者」。</p>`},
{k:"07-4",t:"問責缺口點解收唔埋",lv:[],vis:["v-cra"],b:`<p>問責缺口有幾個源頭。由借款人俾錢做評級係一種反常，因為真正用家係投資者；美國監管機構同信評機構嘅關係，較似委託人—受託人關係；信評機構對疏忽嘅法律責任申索差唔多完全免疫。所以持份者雖然見到問責缺口，但冇足夠權力收埋佢。</p>
 <p>Scott（2000）亦話問責係一張網而唔係一條直線，見 規管型國家入面嘅問責 › 延伸問責。</p>`},
{k:"07-5",t:"出路：減輕影響，同推廣到其他非多數決監管者",lv:[],vis:[],b:`<p>Kerwer 主張，與其加強信評機構嘅問責或者完全廢除佢哋，不如盡量減輕佢哋嘅不良影響。佢認為，凡係全球監管用非多數決監管者，都好可能出現類似嘅問責問題。</p>`},
{k:"08-1",t:"點解 AfCFTA 要有競爭政策合作",lv:[],vis:[],b:`<p>Kigwiru（2020）先交代背景：到 2020 年 1 月，54 個非洲國家有 37 個已經制定競爭法。AfCFTA 帶嚟嘅競爭壓力可能誘使成員國同企業做反競爭行為，所以佢認為競爭政策合作係建立有競爭力嘅大陸市場嘅不可或缺工具。而且大多數發展中國家（尤其非洲）冇執法權去追究國際卡特爾。</p>`},
{k:"08-2",t:"區域模式：自願定強制",lv:[],vis:["v-afcfta"],b:`<p>區域競爭制度有兩種合作方式：自願同強制。COMESA、EAC、WAEMU、ECOWAS 同 CEMAC 採用強制模式，要求成員國執行區域競爭法。</p>`},
{k:"08-3",t:"量身訂造定照搬外國模式",lv:[],vis:[],b:`<p>文獻顯示非洲喺國家同區域層面採納競爭法，好大程度係受外部影響。Kigwiru 引 Fox 同 Bakhoum：世界標準嘅競爭法同政策唔啱需要同市場結構都唔同嘅貧窮及發展中國家。所以佢明確表示唔主張將 NAFTA、TPP 呢類模式照搬入 AfCFTA。</p>
 <p>可以對照 Guidi、Tavares 同 Townley（2022）話 ICN 嘅「原罪」有利北美同歐洲競爭主管機關，見 ICN 入面邊個話事 › 謎題；以及 Aydin 同 Büthe（2016）講發展中國家競爭法嘅目標同障礙，見 目標要唔要因地制宜。</p>`},
{k:"08-4",t:"區域會籍重疊同「保留既有成果」原則",lv:[],vis:[],b:`<p>AfCFTA 以區域經濟共同體（RECs）做 building blocks，但同時要處理多重會籍重疊，兩者之間有衝突。Kigwiru 引 Erasmus：保留既有成果（preservation of acquis）原則冇成為推動自由貿易嘅前瞻機制，反而變成保護現狀嘅限制性工具。</p>`},
{k:"08-5",t:"軟法定硬法：法律形式、爭議解決同機構",lv:[],vis:["v-afcfta"],b:`<p>法律形式方面，AfCFTA Framework Agreement 第 4(c) 條用「cooperate」一字，顯示 AfCFTA 大有可能對大陸競爭政策採軟法。喺大陸層面設強制併購審查呢種硬法做法，雖然為咗法律確定性，但以目前嚟講太進取。大多數自由貿易協定處理競爭爭議都用非約束性機制。如果以軟法合作，喺 AfCFTA 秘書處設一個競爭政策工作小組或委員會係較可取嘅選擇。</p>`}
];

/* ===================== FLASHCARDS ===================== */
const TYPE_ZH={action:'行動',fact:'事實',definition:'定義',conceptual:'概念',cause:'因果',evaluation:'評價',normative:'主張'};
function cardsPage(arg){
  const [note,sec]=(arg||'').split('-');
  const pool=CARDS_DATA.filter(c=>(!note||c.n===note)&&(!sec||c.s===+sec));
  let mode='unknown', order=[], idx=0, flipped=false;
  function build(){
    const known=store.get().known||{};
    order=pool.filter(c=>mode==='all'||!known[c.id]).map(c=>c.id);
    idx=0; flipped=false;
  }
  function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;flipped=false;render();}
  function render(){
    const known=store.get().known||{};
    const kn=pool.filter(c=>known[c.id]).length;
    const scope=note?`${note} ${NOTES_META[note].t}${sec?` · §${sec} ${NOTES.find(x=>x.k===note+'-'+sec).t}`:''}`:'全部筆記';
    let card='';
    if(!order.length){ card=`<div class="fcard done"><div><h3>呢副卡你已經全部識晒 🎉</h3><p class="muted">轉「全部卡」可以再溫一次。</p></div></div>`; }
    else{
      const c=CARDS[order[idx]];
      card=`<div class="fcard ${flipped?'flip':''}" id="fc" tabindex="0" role="button" aria-label="撳一下反卡">
        ${!flipped?`<div class="ff"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fq">${c.f}</div><span class="muted" style="font-size:13px">撳一下（或者按空白鍵）睇答案</span></div>`
        :`<div class="fb"><span class="tag">${TYPE_ZH[c.t]} · 筆記 ${c.n} §${c.s}</span><div class="fa">${c.b}</div><blockquote>“${c.q}”</blockquote><span class="src">原文出處：${c.loc}</span></div>`}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" id="bad">✗ 未識，等陣再嚟</button><button class="btn primary" id="good">✓ 識咗</button></div>`;
    }
    app.innerHTML=`<div class="lvhead"><span class="eyebrow">快速卡 · ${scope}</span>
      <div class="tabs"><button class="tab ${!note?'on':''}" data-n="">全部</button>${NOTE_ORDER.map(n=>`<button class="tab ${n===note?'on':''}" data-n="${n}">${n} ${NOTES_META[n].t}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><span class="muted">呢副 ${pool.length} 張 · 識咗 ${kn} · 呢輪剩 ${order.length?order.length-idx:0}</span>
      <div class="row"><button class="btn ghost sm" id="mode">${mode==='all'?'只溫未識':'全部卡'}</button><button class="btn ghost sm" id="shuf">洗牌</button><button class="btn ghost sm" id="reset">清除「識咗」</button></div></div>
      <div class="progress"><i style="width:${pool.length?kn/pool.length*100:0}%"></i></div></div>
      ${card}
      <p class="muted" style="margin-top:14px;font-size:13.5px">卡面係我寫嘅問題；卡背係筆記入面嘅原子命題（中文）同原文英文引文，一字不改。卡背會出現人名，你唔使記，專心睇論點就得。</p>`;
    app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.n?'cards-'+b.dataset.n:'cards';});
    $('#mode').onclick=()=>{mode=mode==='all'?'unknown':'all';build();render();};
    $('#shuf').onclick=shuffle;
    $('#reset').onclick=()=>{const k=store.get().known||{};pool.forEach(c=>delete k[c.id]);store.set('known',k);build();render();};
    const fc=$('#fc'); if(fc){ fc.onclick=()=>{flipped=!flipped;render();$('#fc')&&$('#fc').focus();}; fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click();}}; }
    const g=$('#good'), b=$('#bad');
    if(g) g.onclick=()=>{const k=store.get().known||{};k[order[idx]]=true;store.set('known',k);next(true);};
    if(b) b.onclick=()=>next(false);
  }
  function next(ok){ if(!ok){ order.push(order[idx]); } idx++; flipped=false; if(idx>=order.length){ build(); } render(); }
  build(); render();
}

/* ===================== PROGRESS MAP ===================== */
function mapPage(){
  const st=store.get(), read=st.read||{}, known=st.known||{};
  let tot=0, done=0;
  const rows=NOTE_ORDER.map(n=>{
    const secs=NOTES.filter(x=>x.k.startsWith(n+'-'));
    return `<tr class="nh"><td colspan="5"><b>${n} ${NOTES_META[n].t}</b></td></tr>`+secs.map(x=>{
      const s=+x.k.split('-')[1], cs=cardsIn(n,s), kn=cs.filter(c=>known[c.id]).length;
      const lvDone=!!(st.done&&st.done['l'+n]);
      const ok=read[x.k]&&kn===cs.length&&lvDone; tot++; if(ok) done++;
      return `<tr><td><a href="#notes-${n}" data-sec="${x.k}">§${s} ${x.t}</a></td>
        <td class="c">${read[x.k]?'✓':'—'}</td>
        <td class="c mono">${kn}/${cs.length}</td>
        <td><a class="chip ${lvDone?'ok':''}" href="#lesson-${n}">${LNAME[n]}${lvDone?' ✓':''}</a>
          ${x.vis.map(v=>`<a class="chip" href="#visuals" data-vis="${v}">圖</a>`).join(' ')}</td>
        <td class="c">${ok?'<span class="okb">掌握</span>':''}</td></tr>`}).join('');
  }).join('');
  app.innerHTML=`<div class="lvhead"><span class="eyebrow">進度地圖 · 筆記每一節都喺度</span><h2>${done} / ${tot} 節已經全部做完</h2>
    <p class="muted">一節要「讀懂版已讀」＋「嗰節嘅卡全部識咗」＋「嗰篇嘅課完成」，先算掌握。撳節名會跳去嗰節嘅讀懂版。</p>
    <div class="progress"><i style="width:${done/tot*100}%"></i></div></div>
    <div class="tablewrap"><table class="map"><thead><tr><th>節</th><th>讀懂版</th><th>卡</th><th>課／圖</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  app.querySelectorAll('[data-sec]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.sec;location.hash='notes-'+k.split('-')[0];setTimeout(()=>{const el=document.getElementById(k);if(el)el.scrollIntoView({block:'start'});},60);});
  bindVisLinks();
}

return {visuals,notesPage,cardsPage,mapPage};

/* ---------- shared chart ---------- */
function chart(P,MC,opt={}){
  const W=340,H=250,L=34,B=26,T=8,R=8,x=q=>L+(q/100)*(W-L-R),y=p=>H-B-(p/100)*(H-B-T);
  P=Math.max(P,MC); const Q=100-P;
  const show=opt.show||['cs','c','a'];
  let g='';
  [0,20,40,60,80,100].forEach(t=>{g+=`<line x1="${x(0)}" x2="${x(100)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;});
  if(show.includes('cs')) g+=`<polygon points="${x(0)},${y(100)} ${x(0)},${y(P)} ${x(Q)},${y(P)}" fill="var(--cs)" fill-opacity="${opt.dim==='cs'?.15:.5}"/>`;
  if(show.includes('c')&&P>MC) g+=`<polygon points="${x(0)},${y(MC)} ${x(0)},${y(P)} ${x(Q)},${y(P)} ${x(Q)},${y(MC)}" fill="${opt.cColor||'var(--cc)'}" fill-opacity=".65"/>`;
  if(show.includes('a')&&P>MC) g+=`<polygon points="${x(Q)},${y(P)} ${x(Q)},${y(MC)} ${x(100-MC)},${y(MC)}" fill="var(--aa)" fill-opacity=".8"/>`;
  g+=`<line x1="${x(0)}" y1="${y(100)}" x2="${x(100)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="2.2"/>`;
  g+=`<line x1="${x(0)}" y1="${y(MC)}" x2="${x(100)}" y2="${y(MC)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${x(100)}" y="${y(MC)+13}" text-anchor="end" font-size="11" fill="var(--ink)">成本 ${MC}</text>`;
  if(opt.old) g+=`<line x1="${x(0)}" y1="${y(opt.old)}" x2="${x(100)}" y2="${y(opt.old)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${x(100)}" y="${y(opt.old)-4}" text-anchor="end" font-size="10" fill="var(--muted)">合併前成本 ${opt.old}</text>`;
  g+=`<line x1="${x(0)}" y1="${y(P)}" x2="${x(Q)}" y2="${y(P)}" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${x(Q)}" cy="${y(P)}" r="6" fill="var(--accent)"/>`;
  g+=`<text x="${x(Q)+8}" y="${y(P)-6}" font-size="12" font-weight="700" fill="var(--accent)">售價 ${P}</text>`;
  if(show.includes('cs')&&Q>10) g+=`<text x="${x(Q*.2)}" y="${y((100+P)/2)+16}" font-size="13" font-weight="900" fill="var(--ink)">CS</text>`;
  if(show.includes('c')&&P-MC>7) g+=`<text x="${x(Q/2)}" y="${y((P+MC)/2)+5}" text-anchor="middle" font-size="14" font-weight="900" fill="var(--ink)">C</text>`;
  if(show.includes('a')&&P-MC>12) g+=`<text x="${x(Q+(100-MC-Q)/3)}" y="${y(MC+(P-MC)/3)+5}" text-anchor="middle" font-size="13" font-weight="900" fill="var(--ink)">A</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="需求線、成本線同售價">${g}</svg>`;
}
const calc=(P,MC)=>{P=Math.max(P,MC);const Q=100-P;return{Q,CS:.5*Q*(100-P),C:(P-MC)*Q,A:.5*(P-MC)**2,TW:.5*Q*(100-P)+(P-MC)*Q};};
const f=n=>Math.round(n).toLocaleString('en');

function home(){

  const allDone=LESSONS.every(l=>st.done[l.id]);
  const nodes=LESSONS.map((l,k)=>{const d=st.done[l.id],o=open(k);
    return (GROUPS[k]?`<div class="grp">${GROUPS[k]}</div>`:'')+`<div class="node ${d?'done':o?'open':'locked'}"><button class="dot" data-l="${k}" ${o?'':'disabled'} aria-label="${l.name}">${d?'✓':o?l.icon:'🔒'}</button><div class="nm">${l.name}</div><div class="sub">${l.sub}</div></div>`;}).join('');
  app.innerHTML=`<div class="home">
   <div class="stats"><a href="../" class="brand" style="text-decoration:none;color:inherit" aria-label="返去課程目錄">⌂ 國際規則 · 1</a><span class="pills"><span class="pill" title="連續學習日數">🔥 ${st.streak}</span><span class="pill" title="經驗值">⭐ ${st.xp}</span><button class="pill" id="menu" aria-label="選單">☰</button></span></div>

    <p class="muted">跟 7FFLL582 第 4 週（Rule-making by international bodies）：國家點解越嚟越多用非正式國際組織（Roger）、監管者之間嘅跨政府網絡（Raustiala）、專家網絡（Haas）、國際競爭網絡（ICN）入面邊個話事同佢正唔正當（Guidi、Tavares 同 Townley）、私營標準制定者（Büthe 同 Mattli）、信用評級機構嘅問責（Kerwer）同非洲大陸自由貿易區（Kigwiru）。大問題：國際規則制定係乜形式？點解會有？用唔同機構立規則有咩利弊（效率、效能、正當性）？故事接住規管型國家 Part 3：你而家係海島國競爭局嘅國際事務主管。Part 2（第 5 週）講歐盟點樣單方面將規則推出歐洲。</p>

    ${allDone?`<p class="okline" style="margin-top:10px">🎉 第 4 週八課全部完成！之後可以去 Part 2（第 5 週）。去「進度地圖」睇吓仲有邊節未掌握。</p>`:''}</div>

/* ---------- player ---------- */
function play(li){
  const L=LESSONS[li]; let i=0, xp=0, first=0, total=0;
  function shell(inner,ready,ctaText){
    const sc=L.screens[i];
    app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="離開">✕</button><div class="bar"><i style="width:${i/L.screens.length*100}%"></i></div><span class="xp">⭐ ${xp}</span></div>
     <div class="screen" id="sc">${inner}</div>
     <div class="foot">${sc.deep?`<button class="deep" id="deep">📖 想深入啲</button>`:''}<button class="cta ${ready?'go':''}" id="cta" ${ready?'':'disabled'}>${ctaText||'繼續'}</button></div>`;
    $('#quit').onclick=()=>{location.hash='';home();};
    if(sc.deep) $('#deep').onclick=()=>drawer(sc.deep);
    $('#cta').onclick=()=>{i++; i>=L.screens.length?finish():render();};
  }
  const ready=()=>{const c=$('#cta');c.disabled=false;c.classList.add('go');};
  function render(){
    const sc=L.screens[i]; const head=`<h2>${sc.h}</h2>${sc.lead?`<p class="lead">${sc.lead}</p>`:''}`;
    if(sc.type==='story'){shell(head+sc.html,true,'開始');return;}
    if(sc.type==='mcq'){
      total++; let tries=0;
      shell(head+`<div class="opts">${sc.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="fb"></div>`,false);
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j; if(b.disabled) return; tries++;
        if(j===sc.ans){b.classList.add('right'); if(tries===1){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp;
          app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
          $('#fb').innerHTML=`<div class="fb ok"><b class="t">${tries===1?'啱！':'啱咗！'}</b><p>${sc.ex}</p><span class="src">出處：${sc.src}</span></div>`; ready();}
        else{b.classList.add('wrong');b.disabled=true;
          if(tries===1) $('#fb').innerHTML=`<div class="fb hint"><b class="t">再諗一諗</b><p>💡 ${sc.hint}</p></div>`;
          else{const r=app.querySelector(`.opt[data-j="${sc.ans}"]`);r.classList.add('right');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
            $('#fb').innerHTML=`<div class="fb no"><b class="t">答案係：${sc.opts[sc.ans]}</b><p>${sc.ex}</p><span class="src">出處：${sc.src}</span></div>`; ready();}}
      }); return;}
    if(sc.type==='widget'){
      total++;
      shell(head+`<div id="w"></div><div id="aft"></div>`,false);
      W[sc.w]($('#w'),ok=>{ if(ok){first++;xp+=10;$('.xp').textContent='⭐ '+xp;} if(sc.after) $('#aft').innerHTML=`<div class="fb ok"><p>${sc.after}</p></div>`; ready();});
      return;}
    if(sc.type==='flips'){
      shell(head+`<div class="flips">${sc.items.map((it,j)=>`<button class="flip" data-j="${j}"><span class="h">${it[0]}</span><span class="b">撳一下睇</span></button>`).join('')}</div>${sc.src?`<span class="src">出處：${sc.src}</span>`:''}`,false);
      const seen=new Set();
      app.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;b.classList.add('open');b.querySelector('.b').innerHTML=sc.items[j][1];seen.add(j);if(seen.size===sc.items.length) ready();});
      return;}
    if(sc.type==='match'){
      total++; let errs=0, sel=null, matched=0;
      const R=sc.pairs.map((p,j)=>({t:p[1],j})).sort(()=>Math.random()-.5);
      shell(head+`<div class="match"><div class="col">${sc.pairs.map((p,j)=>`<button class="mt" data-l="${j}">${p[0]}</button>`).join('')}</div><div class="col">${R.map(r=>`<button class="mt" data-r="${r.j}">${r.t}</button>`).join('')}</div></div><div id="fb"></div>`,false);
      app.querySelectorAll('.mt[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;app.querySelectorAll('.mt[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l;});
      app.querySelectorAll('.mt[data-r]').forEach(b=>b.onclick=()=>{if(sel===null||b.classList.contains('done'))return;
        if(+b.dataset.r===sel){b.classList.add('done');const l=app.querySelector(`.mt[data-l="${sel}"]`);l.classList.remove('sel');l.classList.add('done');sel=null;matched++;
          if(matched===sc.pairs.length){ if(errs===0){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp;
            $('#fb').innerHTML=`<div class="fb ok"><b class="t">全部配啱！</b><span class="src">出處：${sc.src}</span></div>`;ready();}}
        else{errs++;b.classList.add('err');setTimeout(()=>b.classList.remove('err'),320);}});
      return;}
    if(sc.type==='sort'){
      total++; let errs=0, ok=0;
      shell(head+`<div class="sortl">${sc.items.map((it,j)=>`<div class="si" data-j="${j}"><div class="st">${it[0]}</div><div class="sc">${sc.cats.map((c,ci)=>`<button class="sb" data-c="${ci}">${c}</button>`).join('')}</div><div class="sw2"></div></div>`).join('')}</div><span class="src">出處：${sc.src}</span>`,false);
      app.querySelectorAll('.si').forEach(row=>{const j=+row.dataset.j, it=sc.items[j]; let tries=0;
        row.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{ if(row.classList.contains('done')) return; tries++;
          if(+b.dataset.c===it[1]){row.classList.add('done');b.classList.add('right');row.querySelector('.sw2').innerHTML=`<span class="okline">✓ ${it[2]}</span>`;ok++;
            if(ok===sc.items.length){ if(errs===0){first++;xp+=10;}else xp+=5; $('.xp').textContent='⭐ '+xp; ready(); }}
          else{errs++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350);
            if(tries>=2){row.querySelector('.sw2').innerHTML=`<span class="hintline">💡 答案係「${sc.cats[it[1]]}」：${it[2]}</span>`;}
            else row.querySelector('.sw2').innerHTML=`<span class="hintline">💡 再諗吓：睇返上面嘅分類標準。</span>`;}});});
      return;}
    if(sc.type==='review'){
      let k=0, flipped=false;
      const draw=()=>{const c=CARDS[sc.ids[k]];
        shell(head+`<p class="muted" style="font-size:14px">第 ${k+1} / ${sc.ids.length} 張 · 撳卡反轉。卡背係筆記原文，人名唔使記。</p>

  let t=0; (function fr(){x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});

(function(){
/* English key terms: first time a term shows up on a screen / card / panel, add （English） after it. TERMS is injected at build. */
const T=TERMS_DATA.slice().sort((a,b)=>b[0].length-a[0].length);
const MAP=new Map(T.map(t=>[t[0],t]));
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RE=new RegExp(T.map(t=>esc(t[0])).join('|'),'g');
const DONE=new Map(T.map(t=>[t[0],new RegExp(esc(t[0])+'\\s*[（(]\\s*[A-Za-z]')]));
const SKIP='h1,h2,h3,.brand,.nm,.sub,.pill,.grp,.dot,svg,script,style,textarea,input,blockquote,.src,.en,.tag,.tabs,.mono,.eyebrow,code,#gate,.termsheet';
const BOX='#sc,.sheet .in,.fcard,.panel,section,tr,.node,.lvhead,.course,.crs';
function box(n){const e=n.nodeType===1?n:n.parentElement;return (e&&e.closest(BOX))||document.getElementById('app')||document.body;}
function gloss(root){
  if(!root) return;
  if(root.nodeType===1&&root.closest&&root.closest(SKIP)) return;
  const tw=document.createTreeWalker(root.nodeType===3?root.parentNode:root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(root.nodeType===3&&n!==root) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p||p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
    RE.lastIndex=0; return RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const list=[]; let n; while((n=tw.nextNode())) list.push(n);
  list.forEach(tn=>{
    const c=box(tn); const v=tn.nodeValue; RE.lastIndex=0; let m, cut=[];
    const seen=new Set();
    while((m=RE.exec(v))){const k=m[0]; if(seen.has(k)) continue; seen.add(k);
      const after=v.slice(m.index+k.length);
      if(/^\s*[（(]\s*[A-Za-z]/.test(after)) continue;
      if(DONE.get(k).test(c.textContent)) continue;
      cut.push([m.index+k.length,MAP.get(k)]);}
    if(!cut.length) return;
    // only one gloss per term per box: re-check in order while inserting
    let node=tn, offset=0;
    cut.forEach(([pos,t])=>{
      if(DONE.get(t[0]).test(c.textContent)) return;
      const rest=node.splitText(pos-offset); offset=pos;
