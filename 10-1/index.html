<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<title>國際規則制定 Part 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: mobile-first full-screen lesson player — one idea per screen, Continue pinned to the bottom; a course path is home. */
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --ink:#141A26; --muted:#5D6779; --line:#D9DEE8; --soft:#E9ECF3;
  --accent:#4B4FD9; --accent-ink:#FFFFFF; --accent-soft:#E6E7FB;
  --good:#1F9D62; --good-soft:#DFF4EA; --bad:#D2423A; --bad-soft:#FBE6E4; --warn:#B7790A;
  --cs:#4B4FD9; --cc:#E5A800; --aa:#D2423A;
  --f:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --card:#181E2A; --ink:#EAEDF4; --muted:#9AA4B6; --line:#2B3446; --soft:#202838;
  --accent:#8C90FF; --accent-ink:#0F131B; --accent-soft:#272B52; --good:#4FCB8D; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3A1F1D; --warn:#E9B949;
  --cs:#8C90FF; --cc:#E9B949; --aa:#F2766D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --card:#181E2A; --ink:#EAEDF4; --muted:#9AA4B6; --line:#2B3446; --soft:#202838;
  --accent:#8C90FF; --accent-ink:#0F131B; --accent-soft:#272B52; --good:#4FCB8D; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3A1F1D; --warn:#E9B949;
  --cs:#8C90FF; --cc:#E9B949; --aa:#F2766D; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{overflow:hidden;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mine{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle}

/* ---------- home / path ---------- */
.home{flex:1;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:.02em}
.pills{display:flex;gap:8px}
.pill{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.course{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line);margin-bottom:22px}
.course h1{font-size:24px;line-height:1.3;margin:4px 0 6px;font-weight:900;text-wrap:balance}
.course p{margin:0}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:10px 0 20px}
.path svg.line{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:220px}
.node:nth-child(odd){transform:translateX(-60px)} .node:nth-child(even){transform:translateX(60px)}
.dot{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;background:var(--soft);color:var(--muted);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.node.open .dot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.node.done .dot{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 6px 0 color-mix(in srgb,var(--good) 60%,#000)}
.node.open .dot{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.node .nm{font-weight:700;text-align:center;font-size:15.5px;line-height:1.35}
.node .sub{font-size:13px;color:var(--muted);text-align:center}
.node.locked{opacity:.55}
.review-btn{width:100%;margin-top:6px;background:var(--card);border:1.5px dashed var(--accent);color:var(--accent);border-radius:16px;padding:14px;font-weight:700}

/* ---------- lesson player ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .35s}
.xp{font-weight:900;font-size:15px;color:var(--warn);min-width:52px;text-align:right}
.screen{flex:1;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.screen h2{font-size:23px;line-height:1.35;margin:4px 0 0;font-weight:900;text-wrap:balance}
.screen p{margin:0}
.lead{font-size:17.5px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.big{font-size:44px;line-height:1}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:6px;animation:in .2s ease}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.hint{background:var(--accent-soft)}
.fb b.t{font-size:17px}
.src{font-size:12.5px;color:var(--muted)}
.foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;border-top:1px solid var(--line);background:var(--bg)}
.cta{flex:1;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:15px;font-weight:900;font-size:17px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.cta:disabled{background:var(--soft);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.cta.go{background:var(--good);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.deep{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0 14px;font-weight:700;font-size:14px;color:var(--muted);box-shadow:0 5px 0 var(--line)}
/* drawer */
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;max-height:78%;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 8px;font-size:19px}
.sheet .nb{display:grid;gap:8px;font-size:15.5px}.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px}
/* widgets */
.wid{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.barrow{display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center;font-size:14.5px}
.barrow .track{height:22px;background:var(--soft);border-radius:8px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:8px;transition:width .2s}
.chart{width:100%;height:auto;display:block}
.task{font-weight:700;color:var(--accent);font-size:15px;display:flex;gap:8px;align-items:center}
.task.ok{color:var(--good)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--soft);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.nums b{display:block;font-family:var(--mono);font-size:19px;color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.tog{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:15px;color:var(--muted)}
.tog button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.flips{display:grid;gap:10px}
.flip{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 4px 0 var(--line);display:grid;gap:4px}
.flip .h{font-weight:900}.flip .b{color:var(--muted);font-size:15px}
.flip.open{border-color:var(--accent)}
.flip.open .b{color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700;font-size:15px;text-align:left;box-shadow:0 4px 0 var(--line)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--good);background:var(--good-soft);opacity:.8}
.mt.err{animation:shake .3s;border-color:var(--bad)}
.rcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;min-height:210px;display:grid;align-content:center;gap:10px;box-shadow:0 5px 0 var(--line);text-align:left}
.rcard .q{font-size:21px;font-weight:900;line-height:1.4}
.rcard blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 10px;font-size:14px;color:var(--muted);font-style:italic}
/* complete */
.done-screen{flex:1;display:grid;place-items:center;text-align:center;padding:24px;gap:10px}
.done-screen .trophy{font-size:72px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.stat3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700}
.stat3 b{display:block;font-size:24px}
.take{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:6px;max-width:520px}
.take ul{margin:0;padding-left:20px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
/* sort screen */
.sortl{display:grid;gap:12px}
.si{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.si.done{border-color:var(--good)}
.si .st{font-weight:700}
.si .sc{display:flex;flex-wrap:wrap;gap:8px}
.sb{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14.5px;background:var(--bg);min-height:44px}
.sb.right{border-color:var(--good);background:var(--good-soft)}
.sb.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.si.done .sb:not(.right){opacity:.4}
.okline{color:var(--good);font-weight:700;font-size:14.5px}
.hintline{color:var(--accent);font-weight:700;font-size:14.5px}
.grp{z-index:1;font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.06em;background:var(--bg);padding:2px 10px;border-radius:8px}
button.pill{cursor:pointer}
/* sub pages (reading notes, cards, visuals, map) */
.pg{--surface:var(--card);--surface2:var(--soft);--area-cs:var(--cs);--area-c:var(--cc);--area-a:var(--aa);--f-display:var(--f);--r:16px}
.pg h2{font-size:22px;line-height:1.35;margin:4px 0;font-weight:900;text-wrap:balance}
.pg h3{font-size:18px;margin:0;line-height:1.35}
.pg p{margin:0}
.pg .lvhead{display:grid;gap:8px;margin-bottom:14px}
.pg .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.pg .stack{display:flex;flex-direction:column;gap:12px}
.pg .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pg .tabs{display:flex;flex-wrap:wrap;gap:6px}
.pg .tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700;min-height:36px}
.pg .tab.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pg .chip{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px;background:var(--card)}
.pg .chip.ok{color:var(--good);border-color:var(--good)}
.pg .links{gap:8px;margin-top:6px}
.pg .nbody{display:grid;gap:8px;font-size:16px}
.pg .nbody ul{margin:0;padding-left:20px;display:grid;gap:6px}
.pg .readchk{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.pg .readchk input{width:22px;height:22px}
.pg .tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--soft)}
.pg .btn{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.pg .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pg .btn.ghost{border-color:var(--line)}
.pg .btn.sm{padding:5px 12px;font-size:13.5px;min-height:36px}
.pg .progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.pg .progress i{display:block;height:100%;background:var(--good)}
.pg .fcard{min-height:240px;border:2px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:22px 18px;display:grid;align-items:center;cursor:pointer;margin-top:10px}
.pg .fcard.flip{border-color:var(--accent)}
.pg .fcard.done{cursor:default;text-align:center}
.pg .ff,.pg .fcard .fb{display:grid;gap:12px;background:none;padding:0;animation:none;border-radius:0}
.pg .fq{font-size:21px;font-weight:900;line-height:1.4}
.pg .fa{font-size:16.5px;font-weight:600}
.pg .fcard blockquote{margin:0;border-left:3px solid var(--accent);padding:2px 10px;font-size:14px;color:var(--muted);font-style:italic}
.pg .vis{width:100%;height:auto;display:block;font-family:var(--f)}
.pg .viswrap{overflow-x:auto;margin-top:8px}
.pg .viswrap .vis{min-width:560px}
.pg .fo{font-size:12.5px;line-height:1.45;color:var(--ink);display:grid;gap:4px}
.pg .fo p{margin:0}.pg .fo.c{text-align:center}
.pg .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
.pg table.map{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.pg table.map th{text-align:left;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line)}
.pg table.map td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.pg table.map td.c{text-align:center}
.pg table.map tr.nh td{background:var(--soft)}
.pg table.map a{color:var(--ink)}
.pg .okb{font-size:12px;font-weight:700;color:var(--good);border:1.5px solid var(--good);border-radius:5px;padding:0 6px}
.pg .mono{font-family:var(--mono)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px">
 <form id="gf" style="display:grid;gap:12px;max-width:320px;width:100%;text-align:center">
  <div style="font-size:30px;font-weight:900">國際規則 · 1</div>
  <label for="gp" class="muted">輸入密碼</label>
  <input id="gp" type="password" inputmode="numeric" autocomplete="current-password" style="font-size:22px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)">
  <button class="cta go" type="submit">入去</button>
  <p id="ge" style="color:var(--bad);min-height:1.4em"></p>
 </form></div>
<script>(function(){const H='d83036ffb5b49a153bc391fd12b4a10df06bbb200f39fed97c331b03b6833ce7',K='reglab-ok',g=document.getElementById('gate');
 try{if(localStorage.getItem(K)===H){g.remove();return;}}catch(e){}
 document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();
  const v=document.getElementById('gp').value.trim();
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const x=[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('');
  if(x===H){try{localStorage.setItem(K,H)}catch(e){} g.remove();} else document.getElementById('ge').textContent='密碼唔啱，再試一次';});
})();</script>

<script>
const CARDS_DATA=[{"id": 0, "n": "01", "s": 1, "t": "fact", "f": "二十世紀嘅「走向法律」對全球治理有咩影響？", "b": "Roger 認為二十世紀嘅「走向法律」用大量有約束力嘅協議改變咗全球治理嘅版圖", "q": "This “move to law” transformed the terrain of global governance, entangling political actors in a vast legal web.", "loc": "Roger2020 p.1"}, {"id": 1, "n": "01", "s": 1, "t": "fact", "f": "國際法律化放慢嘅同時，出現咗咩新趨勢？", "b": "Roger 認為國際法律化放慢嘅同時出現咗「走向非正式」，好多機構喺傳統國際法範圍以外成立", "q": "as legalization slowed, a corresponding move to informality occurred, as a range of institutions were established beyond the traditional boundaries of international law", "loc": "Roger2020 p.1"}, {"id": 2, "n": "01", "s": 1, "t": "fact", "f": "G20 同正式國際組織比，欠咗啲乜？", "b": "Roger 指出 G20 冇常設秘書處、喺國際法上亦冇正式地位", "q": "it has no permanent secretariat and no formal status under international law", "loc": "Roger2020 p.2"}, {"id": 3, "n": "01", "s": 1, "t": "fact", "f": "今日非正式國際組織最多佔現存國際組織幾多？", "b": "Roger 嘅數據顯示非正式國際組織最多佔現存國際組織三分之一", "q": "they constitute as much as a third of all the currently active international organizations", "loc": "Roger2020 p.8"}, {"id": 4, "n": "01", "s": 1, "t": "fact", "f": "二戰剛完嗰陣，非正式國際組織佔幾多？", "b": "Roger 嘅數據顯示二戰結束時非正式國際組織只佔當時國際組織嘅 5% 至 10%", "q": "At the end of World War II, there were only a few informal organizations, constituting between 5 and 10 percent of all the international bodies active at that point.", "loc": "Roger2020 p.8"}, {"id": 5, "n": "01", "s": 1, "t": "fact", "f": "走向非正式主要由邊啲國家推動？", "b": "Roger 嘅數據顯示走向非正式主要由北美同歐洲嘅先進工業國推動", "q": "this phenomenon has largely been driven by advanced industrial states in North … America and Europe", "loc": "Roger2020 p.8"}, {"id": 6, "n": "01", "s": 2, "t": "fact", "f": "秘書處點樣分開正式同非正式組織？係唔係硬規則？", "b": "Roger 認為正式國際組織差唔多一定有秘書處，而非正式國際組織好多時冇", "q": "formal ones almost always have secretariats while informal ones frequently do not", "loc": "Roger2020 p.6"}, {"id": 7, "n": "01", "s": 2, "t": "definition", "f": "Roger 用乜嘢做最根本嘅標準分正式同非正式國際組織？", "b": "Roger 以法律基礎區分正式同非正式國際組織：前者由有法律約束力嘅國際協議成立，後者由冇約束力嘅文書成立", "q": "whereas formal organizations are constituted by legally binding international agreements, informal bodies are constituted by nonbinding instruments", "loc": "Roger2020 p.6"}, {"id": 8, "n": "01", "s": 2, "t": "evaluation", "f": "文獻一般話非正式機構有咩「功能特性」？", "b": "Eilstrup-Sangiovanni、Vabulas 同 Snidal 等學者認為非正式國際機構比正式機構快、靈活同保密", "q": "informal institutions are thought to be inter alia faster, more flexible, and more confidential than their formal counterparts", "loc": "**Eilstrup-Sangiovanni; Vabulas & Snidal; Sauer**, in Roger2020 p.7"}, {"id": 9, "n": "01", "s": 2, "t": "fact", "f": "點解喺國內開一個正式國際組織咁難？", "b": "Roger 認為喺國內成立正式國際組織要過較大嘅政治、法律同預算關卡", "q": "Establishing a formal organization, for instance, can be a very demanding process domestically, raising bigger political, legal, and budgetary hurdles.", "loc": "Roger2020 p.7"}, {"id": 10, "n": "01", "s": 2, "t": "conceptual", "f": "Roger 話除咗功能特性，仲有乜同樣重要？", "b": "Roger 認為正式同非正式組織嘅國內含義，喺解釋點解國家想成立佢哋時，同功能特性一樣重要", "q": "these contrasting domestic implications can be just as significant as the functional properties of these institutions when it comes to explaining why states, and actors within states, want to create them", "loc": "Roger2020 p.7"}, {"id": 11, "n": "01", "s": 3, "t": "cause", "f": "Roger 嘅中心命題：幾時國家會揀非正式組織？", "b": "Roger 認為有管治需求、而且決策者面對國內阻力或者由獨立機構帶頭時，國家會揀非正式國際組織", "q": "Informal organizations, I argue, are preferred when there is demand for governance", "loc": "Roger2020 p.4"}, {"id": 12, "n": "01", "s": 3, "t": "cause", "f": "獨立機構帶頭成立新國際機構時，點解傾向非正式？", "b": "Roger 認為獨立機構帶頭成立新國際機構時傾向非正式，因為非正式有助保住佢哋嘅政策自主", "q": "or independent agencies play a leading role in the creation of new institutions, since informality helps to preserve their", "loc": "Roger2020 p.4"}, {"id": 13, "n": "01", "s": 3, "t": "conceptual", "f": "Macey 話決定國際合作嘅係邊個？", "b": "Macey 認為決定國際合作嘅唔係國家本身，而係國家入面嘅監管者、官僚同政客", "q": "nations do not decide to cooperate or forge international agreements, rather the regulators, bureaucrats, and politicians within nations do", "loc": "**Macey**, in Roger2020 p.9"}, {"id": 14, "n": "01", "s": 3, "t": "cause", "f": "政治機構（例如部委）點解傾向正式合作？", "b": "Roger 認為政治機構傾向正式國際合作，因為正式合作有助掌權者展示領導同鎖定政策偏好", "q": "Political institutions, I argue, tend to prefer formal cooperation that helps those in charge to demonstrate leadership and lock in their policy preferences more effectively.", "loc": "Roger2020 p.9"}, {"id": 15, "n": "01", "s": 3, "t": "cause", "f": "獨立機構點解傾向非正式合作？", "b": "Roger 認為獨立機構傾向非正式國際合作，因為非正式合作更能保住佢哋嘅自主、俾佢哋靠專業權威做決定", "q": "Independent agencies, by contrast, often prefer informal cooperation that preserves their autonomy more effectively and allows decisions to be made on the basis of an agency’s … expert authority", "loc": "Roger2020 p.10"}, {"id": 16, "n": "01", "s": 3, "t": "cause", "f": "政客面對國內強烈反對，正式合作會點？", "b": "Roger 認為政客面對國內強烈反對時，正式國際合作會變難、政治機會成本會上升", "q": "When politicians face significant domestic opposition, legalized cooperation becomes more difficult, and political opportunity costs rise.", "loc": "Roger2020 p.10"}, {"id": 17, "n": "01", "s": 3, "t": "cause", "f": "獨立機構嘅代表團被政治化，會推向邊個方向？", "b": "Roger 認為獨立機構嘅國家代表團被政治化時，國家走正式國際合作嘅機會會上升", "q": "the probability that formal cooperation will be pursued should rise", "loc": "Roger2020 p.10"}, {"id": 18, "n": "01", "s": 3, "t": "cause", "f": "國際議價入面，想要非正式嘅國家點解有優勢？", "b": "Roger 認為喺國際議價入面，想要非正式組織嘅國家有優勢，因為佢哋嘅偏好貼近現狀", "q": "states preferring informality may have a bargaining advantage, since their preference is by nature much closer to the prevailing status quo", "loc": "Roger2020 p.11"}, {"id": 19, "n": "01", "s": 4, "t": "cause", "f": "Roger 話走向非正式嘅兩個長期國內原因係乜？", "b": "Roger 認為走向非正式主要歸因於先進工業國嘅政治兩極化同規管型國家嘅出現", "q": "the growth of political polarization, which is pervasive today but has grown steadily since the 1970s, and the complex … transformations associated with the emergence of the regulatory state over roughly the same period", "loc": "Roger2020 p.5"}, {"id": 20, "n": "01", "s": 4, "t": "fact", "f": "獨立機構越嚟越普遍、又行出國際，佢哋想保住乜？", "b": "Roger 認為獨立機構越嚟越普遍，並隨全球化更深入參與國際事務，同時想保住自主", "q": "These bodies have become … increasingly common and, with globalization, have become more deeply involved in international affairs, aiming to preserve their autonomy while doing so.", "loc": "Roger2020 p.12"}, {"id": 21, "n": "01", "s": 5, "t": "conceptual", "f": "功能論點解釋國家揀非正式？", "b": "Roger 概括功能論：國家會喺非正式組織係解決特定問題嘅最佳方法時揀非正式", "q": "States are assumed to behave instrumentally and, on average, are predicted to create informal organizations when they offer an optimal solution to the particular problem states confront", "loc": "Roger2020 p.12"}, {"id": 22, "n": "01", "s": 5, "t": "conceptual", "f": "權力論話強國同弱國各自偏好乜？", "b": "Roger 概括權力論：強國偏好有最大彈性嘅非正式安排，弱國偏好更有約束力嘅正式安排", "q": "Powerful states are hypothesized to prefer informal solutions that enable maximum flexibility while less powerful states prefer formal ones that more effectively bind.", "loc": "Roger2020 p.13"}, {"id": 23, "n": "01", "s": 5, "t": "conceptual", "f": "Roger 嘅理論同功能論、權力論係咩關係？", "b": "Roger 認為自己以國內政治為本嘅理論同功能論、權力論係互相補充", "q": "it is actually complementary to such accounts", "loc": "Roger2020 p.13"}, {"id": 24, "n": "01", "s": 6, "t": "evaluation", "f": "樂觀派（例如 Jake Sullivan）點睇非正式合作？", "b": "Jake Sullivan 認為非正式合作機制更適合處理今日分散而複雜嘅跨國挑戰", "q": "better suited to handle the diffuse and complex nature of transnational challenges today", "loc": "**Sullivan**, in Roger2020 p.14"}, {"id": 25, "n": "01", "s": 6, "t": "evaluation", "f": "悲觀派擔心非正式化會削弱乜？", "b": "Herz 同 Ribeiro Hoffmann 一派擔心非正式化會削弱全球治理嘅效能同問責", "q": "Some fear that informality actually undermines the effectiveness and accountability of global governance.", "loc": "**Herz & Ribeiro Hoffmann**, in Roger2020 p.14"}, {"id": 26, "n": "01", "s": 6, "t": "conceptual", "f": "如果非正式化由權力或國內政治推動，問題同組織形式之間有咩關係？", "b": "Roger 認為如果非正式化由權力或國內政治推動，國家面對嘅問題同國際組織嘅形式之間就冇必然關係", "q": "then there would be no necessary relationship between the kind of problem states face and the form of an organization", "loc": "Roger2020 p.15"}, {"id": 27, "n": "01", "s": 6, "t": "evaluation", "f": "好多非正式組織成功，係「因為」定「雖然」非正式？", "b": "Roger 認為好多非正式國際組織成功係雖然非正式、而唔係因為非正式", "q": "Many informal organizations appear to have thrived despite their informality, not because of it.", "loc": "Roger2020 p.15"}, {"id": 28, "n": "01", "s": 6, "t": "fact", "f": "非正式組織同正式組織比，邊個更大機會同問題錯配？", "b": "Roger 嘅數據顯示非正式國際組織比正式國際組織更大機會同佢哋要處理嘅問題錯配", "q": "they appear to be much more likely to be mismatched than their formal counterparts are", "loc": "Roger2020 p.15"}, {"id": 29, "n": "01", "s": 6, "t": "fact", "f": "非正式組織越多，錯配嘅比例有咩趨勢？", "b": "Roger 嘅數據顯示隨住非正式國際組織增加，錯配國際組織嘅比例似乎上升緊", "q": "as informal organizations have grown in number, … the share of “mismatched” international organizations appears to be rising", "loc": "Roger2020 p.15"}, {"id": 30, "n": "01", "s": 7, "t": "fact", "f": "1990 年代歐美競爭機構對國際組織嘅取態有咩變化？", "b": "Roger 指出 1990 年代歐美獨立競爭機構都同意需要國際組織，起初偏好非正式，後來就法律設計出現分歧", "q": "These agencies agreed that an international organization was needed but, despite an initial preference for informality, eventually disagreed over its legal design.", "loc": "Roger2020 p.19"}, {"id": 31, "n": "01", "s": 7, "t": "cause", "f": "歐盟委員會點解轉而推動將反壟斷放入 WTO？", "b": "Roger 認為歐盟委員會轉而推動將全球反壟斷放入 WTO，好大程度係因為當時反壟斷問題被政治化", "q": "In large part, I argue, this was due to the politicization of antitrust issues during this time.", "loc": "Roger2020 p.19"}, {"id": 32, "n": "01", "s": 7, "t": "fact", "f": "WTO 方案失敗後，邊個機構成為全球反壟斷唯一剩低嘅機構？", "b": "Roger 指出歐盟委員會嘅 WTO 方案失敗後，美國支持嘅非正式方案 ICN 成為全球反壟斷領域唯一剩低嘅機構", "q": "the informal alternative embraced by the United States … was the only institution left standing in the field of global antitrust", "loc": "Roger2020 p.19"}, {"id": 33, "n": "04", "s": 1, "t": "definition", "f": "「跨政府」合作同傳統外交有咩唔同？", "b": "Raustiala 將「跨政府（transgovernmental）」界定為各國專責嘅本地官員直接互相打交道，而且外交部通常好少監督", "q": "they involve specialized domestic officials directly interacting with each other, often with minimal supervision by foreign ministries", "loc": "Raustiala2002 p.5"}, {"id": 34, "n": "04", "s": 1, "t": "definition", "f": "監管機構之間嘅 MOU 有冇法律約束力？監管者點睇佢？", "b": "Raustiala 認為監管機構之間嘅諒解備忘錄（MOU）係軟法協議：法律上冇約束力，但好多監管者覺得佢哋好有效、又靈活得多", "q": "MOUs are soft law agreements: non-binding as a legal matter but, at least in the view of many regulators, highly effective and far more flexible.", "loc": "Raustiala2002 p.22"}, {"id": 35, "n": "04", "s": 1, "t": "fact", "f": "IOSCO 點解唔算傳統國際組織？", "b": "Raustiala 指出國際證監會組織（IOSCO）唔係傳統國際組織，因為佢冇一個成員係國家", "q": "IOSCO is not a traditional international organization—no members are states.", "loc": "Raustiala2002 p.31"}, {"id": 36, "n": "04", "s": 2, "t": "cause", "f": "推動監管網絡發展嘅三大因素係乜？", "b": "Raustiala 認為推動監管網絡發展嘅三大因素係本地監管擴張、經濟互相依存加深同埋科技創新", "q": "three chief factors are driving the evolution of regulatory networks: the expansion of domestic regulation, increased economic interdependence, and technological innovation", "loc": "Raustiala2002 p.7"}, {"id": 37, "n": "04", "s": 2, "t": "cause", "f": "喺證券、競爭、環境三個範疇，最主要推動跨政府網絡嘅係乜？", "b": "Raustiala 認為執法上嘅挑戰係推動跨政府網絡興起嘅最主要動力", "q": "enforcement challenges constitute the primary driver behind the rise of networks", "loc": "Raustiala2002 p.51"}, {"id": 38, "n": "04", "s": 2, "t": "fact", "f": "跨政府網絡集中喺邊啲國家之間？", "b": "Raustiala 指出跨政府網絡集中喺有複雜行政體系嘅富裕工業化國家之間", "q": "Networks are concentrated among the wealthier, more industrialized states that possess complex administrative states.", "loc": "Raustiala2002 p.16"}, {"id": 39, "n": "04", "s": 3, "t": "evaluation", "f": "監管權力唔對稱同分散，各自會點影響條約同國際組織？", "b": "Raustiala 認為監管權力高度唔對稱嗰陣，各國會避開條約同國際組織（liberal internationalism）；權力高度分散嗰陣，條約同國際組織就會興旺", "q": "When power is highly asymmetric, liberal internationalism is shunned; when it is highly diffuse, it flourishes.", "loc": "Raustiala2002 p.8"}, {"id": 40, "n": "04", "s": 3, "t": "evaluation", "f": "環境、競爭、證券三個範疇嘅監管權力點分佈？", "b": "Raustiala 認為環境監管嘅權力好分散、競爭法大致係兩強（美國同歐盟）、證券法就差唔多由美國一家獨大", "q": "Regulatory power is diffused in the environmental arena; largely duopolistic in the competition arena; and nearly monopolistic in securities law.", "loc": "Raustiala2002 p.27"}, {"id": 41, "n": "04", "s": 4, "t": "fact", "f": "美國證監會（SEC）喺網絡入面一貫點做？", "b": "Raustiala 指出美國證監會（SEC）一貫做法係將其他司法管轄區拉埋美國模式，而唔係改美國模式", "q": "The SEC’s unwavering approach is to bring other jurisdictions to the U.S. model, not to modify the U.S. model.", "loc": "Raustiala2002 p.35"}, {"id": 42, "n": "04", "s": 4, "t": "evaluation", "f": "跨政府網絡主要靠乜推動監管改變？", "b": "Raustiala 認為跨政府網絡推動監管改變，主要靠說服而唔係靠命令", "q": "when networks promote regulatory change, change occurs more through persuasion than command", "loc": "Raustiala2002 p.51"}, {"id": 43, "n": "04", "s": 4, "t": "conceptual", "f": "對弱國嚟講，引入強國監管模式可以當係乜？", "b": "Raustiala 認為對弱國嚟講，引入強國嘅監管模式可以當係攞齊跨政府網絡所有好處嘅「入場費」（price of admission）", "q": "For weak states the import of regulation can be thought of as “a price of admission” to the fullest range of benefits provided by the network.", "loc": "Raustiala2002 p.67"}, {"id": 44, "n": "04", "s": 4, "t": "evaluation", "f": "跨政府網絡帶嚟嘅監管劃一，好可能跟邊個嘅偏好行？", "b": "Raustiala 認為跨政府網絡帶嚟嘅監管劃一，好可能會跟主要經濟強國嘅偏好行", "q": "This uniformity, however, is likely to be in line with the preferences of the dominant economic powers.", "loc": "Raustiala2002 p.91"}, {"id": 45, "n": "04", "s": 5, "t": "cause", "f": "跨政府網絡點樣改善條約遵守？", "b": "Raustiala 認為跨政府網絡可以透過提升本地監管能力去改善國家遵守條約嘅情況，因為能力提升通常會降低守約喺國內嘅成本", "q": "networks may improve treaty compliance by improving domestic regulatory capacity; improved capacity should often lower the domestic costs of compliance", "loc": "Raustiala2002 p.78"}, {"id": 46, "n": "04", "s": 5, "t": "evaluation", "f": "點解話跨政府網絡係「填補空隙」？", "b": "Raustiala 認為跨政府網絡最普遍嘅領域，正正係條約同國際組織喺政治上行唔通嘅領域，所以網絡係填補空隙（gap filling）", "q": "The gap filling dynamic reflects that networks are most prevalent in those areas in which liberal internationalism is politically infeasible.", "loc": "Raustiala2002 p.88"}, {"id": 47, "n": "04", "s": 5, "t": "evaluation", "f": "Raustiala 總結：跨政府網絡同條約係咩關係？", "b": "Raustiala 總結認為跨政府合作係國際法嘅重要發展，比較大機會係補充、而唔係取代條約同國際組織（liberal internationalism）", "q": "Transgovernmental cooperation is a significant development in international law, one more likely to supplement liberal internationalism than supplant it.", "loc": "Raustiala2002 p.92"}, {"id": 48, "n": "04", "s": 6, "t": "evaluation", "f": "Picciotto 點評次國家官員之間嘅國際接觸？", "b": "Picciotto 認為各國官員喺次國家層面直接嘅國際接觸，長期缺乏正當性", "q": "a chronic lack of legitimacy plagues direct international contacts at the sub-state level among national officials and administrators", "loc": "**Picciotto**, in Raustiala2002 p.25"}, {"id": 49, "n": "04", "s": 6, "t": "evaluation", "f": "Franck 嘅正當性理論同跨政府合作有咩矛盾？", "b": "Raustiala 認為 Franck 嘅正當性理論（legitimacy theory）著重形式、程序同規範，同跨政府合作嘅性質有深層矛盾", "q": "the formal, procedural, and normative thrust of legitimacy theory is deeply in tension with the nature of cooperation embodied in transgovernmentalism", "loc": "Raustiala2002 p.82"}, {"id": 50, "n": "04", "s": 6, "t": "evaluation", "f": "跨政府網絡因為非正式同靈活，有咩做唔到？", "b": "Raustiala 承認跨政府網絡因為非正式同靈活，做唔到監管者想要嘅所有嘢，甚至做唔到一份強而有力嘅多邊協議做得到嘅嘢", "q": "they cannot, given their informal and flexible nature, achieve everything that regulators might desire or even what a strong multilateral agreement could", "loc": "Raustiala2002 p.50"}, {"id": 51, "n": "05", "s": 1, "t": "cause", "f": "全球問題嘅技術唔確定性同複雜性，對國際政策協調有咩影響？", "b": "Haas 認為，全球問題嘅技術唔確定性（uncertainty）同複雜性越嚟越大，令國際政策協調（international policy coordination）唔單止越嚟越有需要，亦都越嚟越難做", "q": "The growing technical uncertainties and complexities of problems of global concern have made international policy coordination not only increasingly necessary but also increasingly difficult.", "loc": "Haas1992 p.1"}, {"id": 52, "n": "05", "s": 1, "t": "conceptual", "f": "Haas 同特刊作者點睇控制知識同資訊？", "b": "Haas 同特刊作者認為，控制知識同資訊（control over knowledge and information）本身就係權力（power）嘅一個重要面向", "q": "We argue that control over knowledge and information is an important dimension of power", "loc": "Haas1992 p.2"}, {"id": 53, "n": "05", "s": 2, "t": "definition", "f": "知識社群係乜？", "b": "Haas 將知識社群（epistemic community）定義為：一個由專業人士組成嘅網絡，佢哋喺某個領域有公認嘅專長同能力，並且對嗰個領域或議題（issue-area）同政策相關嘅知識有權威性嘅說法", "q": "An epistemic community is a network of professionals with recognized expertise and competence in a particular domain and an authoritative claim to policy-relevant knowledge within that domain or issue-area", "loc": "Haas1992 p.3"}, {"id": 54, "n": "05", "s": 2, "t": "definition", "f": "知識社群第一樣共同嘢係乜？", "b": "Haas 講，知識社群第一樣共同嘢係一套共同嘅規範性同原則性信念（normative and principled beliefs），為成員嘅社會行動提供以價值為本嘅理由", "q": "(1) a shared set of normative and principled beliefs, which provide a value-based rationale for the social action of community members", "loc": "Haas1992 p.3"}, {"id": 55, "n": "05", "s": 2, "t": "definition", "f": "知識社群第二樣共同嘢係乜？", "b": "Haas 講，知識社群第二樣共同嘢係共同嘅因果信念（causal beliefs），嚟自佢哋對導致該領域核心問題嘅做法嘅分析", "q": "(2) shared causal beliefs, which are derived from their analysis of practices leading or contributing to a central set of problems in their domain", "loc": "Haas1992 p.3"}, {"id": 56, "n": "05", "s": 2, "t": "definition", "f": "知識社群第三樣共同嘢係乜？", "b": "Haas 講，知識社群第三樣共同嘢係共同嘅有效性標準（notions of validity）：即係一套主體間（intersubjective）、由內部界定、用嚟衡量同驗證專業知識嘅準則", "q": "(3) shared notions of validity … that is, intersubjective, internally defined criteria for weighing and validating knowledge in the domain of their expertise", "loc": "Haas1992 p.3"}, {"id": 57, "n": "05", "s": 2, "t": "definition", "f": "知識社群第四樣共同嘢係乜？", "b": "Haas 講，知識社群第四樣共同嘢係一個共同嘅政策事業（common policy enterprise）：即係圍繞一組問題、佢哋專業能力所針對嘅共同做法", "q": "(4) a common policy enterprise-that is, a set of common practices associated with a set of problems to which their professional competence is directed", "loc": "Haas1992 p.3"}, {"id": 58, "n": "05", "s": 3, "t": "cause", "f": "決策者最有可能喺乜嘢情況下搵知識社群？", "b": "Haas 認為，決策者最有可能喺唔確定（conditions of uncertainty）嘅情況下轉向知識社群求助", "q": "Decision makers are most likely to turn to epistemic communities under conditions of uncertainty.", "loc": "Haas1992 p.21"}, {"id": 59, "n": "05", "s": 3, "t": "cause", "f": "決策者通常要經歷乜先會克服制度慣性、主動搵知識社群？", "b": "Haas 認為，決策者往往要經歷一場危機或者衝擊（crisis or shock），先至會克服制度慣性（institutional inertia），主動搵知識社群幫手", "q": "it often takes a crisis or shock to overcome institutional inertia and habit and spur them to seek help from an epistemic community", "loc": "Haas1992 p.14"}, {"id": 60, "n": "05", "s": 3, "t": "cause", "f": "知識社群點樣將影響制度化？", "b": "Haas 認為，知識社群如果喺國家行政機關同國際秘書處（international secretariats）入面鞏固到官僚權力，就有機會將佢哋嘅影響制度化，並將觀點滲入更廣泛嘅國際政治", "q": "To the extent to which an epistemic community consolidates bureaucratic power within national administrations and international secretariats, it stands to institutionalize its influence and insinuate its views into broader international politics.", "loc": "Haas1992 p.4"}, {"id": 61, "n": "05", "s": 3, "t": "cause", "f": "系統性權力集中唔夠迫各國協調時，合作點解仍然可以維持？", "b": "Haas 認為，喺知識社群幫手建立嘅制度持續影響之下，某議題已建立嘅合作模式，即使系統性權力集中（systemic power concentrations）已經唔足以迫各國協調，都可以繼續維持", "q": "established patterns of cooperation in a given issue-area may persist even though systemic power concentrations may no longer be sufficient to compel countries to coordinate their behavior", "loc": "Haas1992 p.4"}, {"id": 62, "n": "05", "s": 3, "t": "cause", "f": "知識社群嘅影響會唔會帶嚟政策協調，取決於乜？", "b": "Haas 認為，知識社群嘅影響會唔會帶嚟政策協調，取決於佢哋嘅因果信念有冇顯示需要協調", "q": "whether epistemic influence leads to policy coordination is a function of whether the causal beliefs of epistemic communities demonstrate the need for it", "loc": "Haas1992 p.30"}, {"id": 63, "n": "05", "s": 4, "t": "conceptual", "f": "因果信念被反常現象動搖時，知識社群同利益團體反應有咩唔同？", "b": "Haas 認為，知識社群同利益團體（interest groups）唔同：如果有反常現象動搖咗佢哋嘅因果信念，佢哋會退出政策辯論，利益團體就唔會", "q": "If confronted with anomalies that undermined their causal beliefs, they would withdraw from the policy debate, unlike interest groups.", "loc": "Haas1992 p.18"}, {"id": 64, "n": "05", "s": 4, "t": "cause", "f": "知識社群嘅共同信念點樣幫佢哋頂住迎合高層嘅壓力？", "b": "Haas 認為，知識社群成員共同嘅因果信念同原則信念，會抵銷甚至壓過要佢哋提供迎合高層決策者既有政治利益嘅意見嘅壓力", "q": "would offset or outweigh the pressures for them to offer alternative advice which is more consistent with the preexisting political interests or preferences of high-level policymakers", "loc": "Haas1992 p.20"}, {"id": 65, "n": "05", "s": 5, "t": "evaluation", "f": "國家行為反映知識網絡偏好嘅程度，受乜制約？", "b": "Haas 認為，國家行為喺幾大程度上反映呢啲跨國知識網絡嘅偏好，仍然好受國際權力分佈（distribution of power）所制約", "q": "the extent to which state behavior reflects the preferences of these networks remains strongly conditioned by the distribution of power internationally", "loc": "Haas1992 p.7"}, {"id": 66, "n": "05", "s": 5, "t": "evaluation", "f": "有科學家參與、披上客觀外衣，政策選擇係咪就唔政治？", "b": "Haas 認為，就算指出有科學家參與、披上客觀同價值中立嘅外衣，政策選擇喺分配後果（allocative consequences）上仍然高度政治化", "q": "Despite the veneer of objectivity and value neutrality achieved by pointing to the input of scientists, policy choices remain highly political in their allocative consequences", "loc": "Haas1992 p.11"}, {"id": 67, "n": "05", "s": 5, "t": "normative", "f": "專門群體影響力越嚟越大，對邊啲政治價值有負面影響？", "b": "Haas 引述 Dickson、Laird 同 Sclove 等學者指出，知識社群呢類專門群體影響力越嚟越大，可能對民主同參與（democracy and participation）呢啲根深蒂固嘅政治價值有嚴重負面影響", "q": "the increasing influence of specialized groups such as epistemic communities may have serious negative implications for such deep-seated political values as democracy and participation", "loc": "**Dickson; Laird; Sclove**, in Haas1992 p.24"}, {"id": 68, "n": "05", "s": 6, "t": "action", "f": "研究知識社群嘅影響要做邊幾步？", "b": "Haas 建議，研究知識社群影響要做幾步：識別成員、確定佢哋嘅原則同因果信念、追蹤佢哋嘅活動同對決策者嘅影響、識別因佢哋影響而被排除嘅其他可行結果，同埋檢驗其他解釋", "q": "identifying community membership, determining the community members' principled and causal beliefs, tracing their activities and demonstrating their influence on decision makers at various points in time, identifying alternative credible outcomes that were foreclosed as a result of their influence, and exploring alternative explanations for the actions of decision makers", "loc": "Haas1992 p.34"}, {"id": 69, "n": "02", "s": 1, "t": "fact", "f": "Guidi、Tavares 同 Townley 提出咩謎題？", "b": "Guidi、Tavares 同 Townley 提出嘅謎題係：OECD 同 UNCTAD 已經討論緊國際競爭政策，點解各地競爭主管機關仲要另開國際網絡", "q": "Why would NCAs want to spend their own time and resources establishing an international network when they were already discussing international competition policy and enforcement in both the OECD and UNCTAD?", "loc": "GuidiTavaresTownley2022 p.1"}, {"id": 70, "n": "02", "s": 1, "t": "fact", "f": "邊個可以做 ICN 成員？國家可唔可以？", "b": "Guidi、Tavares 同 Townley 指出只有競爭主管機關可以做 ICN 成員，國家唔可以", "q": "Only NCAs can be ICN members (not their states).", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 71, "n": "02", "s": 1, "t": "fact", "f": "ICN 自稱嘅使命係乜？", "b": "ICN 自稱嘅使命係倡導全世界採用卓越嘅競爭政策標準同程序", "q": "[T]o advocate the adoption of superior standards and procedures in competition policy around the world", "loc": "**ICN**, in GuidiTavaresTownley2022 p.1"}, {"id": 72, "n": "02", "s": 1, "t": "definition", "f": "ICN 點樣形容自己？", "b": "ICN 形容自己係由已發展同發展中國家反壟斷機構組成、以項目為本、靠共識嘅非正式網絡", "q": "project-oriented, consensus-based, informal network of antitrust agencies from developed and developing countries", "loc": "**ICN**, in GuidiTavaresTownley2022 p.2"}, {"id": 73, "n": "02", "s": 1, "t": "evaluation", "f": "ICN 嘅「原罪」係乜？有利邊個？", "b": "Guidi、Tavares 同 Townley 認為 ICN 揀做 NCA 網絡而唔做政府間組織呢個「原罪」，不成比例咁有利於北美同歐洲先進工業國嘅競爭主管機關", "q": "We will see how this “original sin” disproportionately benefits the rulemakers, principally NCAs from advanced industrialised states in North America and Europe", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 74, "n": "02", "s": 1, "t": "cause", "f": "由獨立（非多數決）機構推動成立嘅國際組織，較大機會係正式定非正式？", "b": "Roger 嘅研究顯示由獨立（非多數決）機構推動成立嘅國際組織較大機會係非正式機構", "q": "If independent (non-majoritarian) actors drive the creation of international organisations, it is more likely that informal institutions will result", "loc": "**Roger**, in GuidiTavaresTownley2022 p.5"}, {"id": 75, "n": "02", "s": 1, "t": "fact", "f": "Roger 計出幾多非正式國際組織錯配？錯配嘅又有幾多係非正式？", "b": "Roger 計出近 46% 非正式國際組織同所處理嘅問題錯配，而錯配國際組織有 74% 係非正式", "q": "He calculates that almost 46% of informal international … organisations are not well matched. Furthermore, 74% of mismatched international organisations are informal.", "loc": "**Roger**, in GuidiTavaresTownley2022 p.5"}, {"id": 76, "n": "02", "s": 2, "t": "fact", "f": "ICN 嘅第一面「擋箭牌」係乜？", "b": "Guidi、Tavares 同 Townley 指出，ICN 工作成果要經 ICN 內部共識同意先算正式立場，呢點常被用嚟證明唔使擔心 ICN 正當性", "q": "First, work products are only accepted as official ICN statements once they have been agreed by consensus within the ICN", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 77, "n": "02", "s": 2, "t": "fact", "f": "ICN 嘅第二面「擋箭牌」係乜？", "b": "Guidi、Tavares 同 Townley 指出，ICN 工作成果唔具約束力，呢點亦常被用嚟證明唔使擔心 ICN 正當性", "q": "Secondly, ICN work products are not binding.", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 78, "n": "02", "s": 2, "t": "evaluation", "f": "共識規則同唔具約束力，實際上保護唔保護到新興競爭機關？", "b": "Guidi、Tavares 同 Townley 認為共識規則同成果唔具約束力實際上都保護唔到新興競爭主管機關同佢哋嘅國家", "q": "While both are formally true, we argue that, in practice, neither rule is likely to effectively protect newer NCAs (and especially their states) against the more powerful actors", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 79, "n": "02", "s": 2, "t": "conceptual", "f": "競爭政策係咪純粹技術、只講效率？", "b": "Guidi、Tavares 同 Townley 認為競爭政策同執法涉及大量再分配選擇", "q": "competition policy and enforcement demand many highly (re)distributive choices", "loc": "GuidiTavaresTownley2022 p.2"}, {"id": 80, "n": "02", "s": 3, "t": "conceptual", "f": "網絡係唔係中立？", "b": "Guidi、Tavares 同 Townley 認為網絡同所有制度一樣係政治性嘅，雖然成日被描繪成中立", "q": "Networks are often portrayed neutrally, but (like all institutions) networks are political.", "loc": "GuidiTavaresTownley2022 p.3"}, {"id": 81, "n": "02", "s": 3, "t": "conceptual", "f": "國家同監管者各自點樣談判？", "b": "Guidi、Tavares 同 Townley 認為國家通常靠政治議價（或武力）談判，而監管者著重專家論證", "q": "States normally negotiate through political bargaining (or force), whereas “regulators” tend to focus upon “expert argument.”", "loc": "GuidiTavaresTownley2022 p.4"}, {"id": 82, "n": "02", "s": 3, "t": "cause", "f": "ICN 嘅技術焦點有利邊個？", "b": "Guidi、Tavares 同 Townley 認為 ICN 嘅技術焦點有利於技術上最強嘅大型競爭主管機關", "q": "First, a “technical” focus favours those that are particularly strong in this approach.", "loc": "GuidiTavaresTownley2022 p.4"}, {"id": 83, "n": "02", "s": 3, "t": "cause", "f": "冇國家參與嘅網絡對競爭機關有咩好處？", "b": "Guidi、Tavares 同 Townley 認為一個冇國家參與嘅網絡更能保住競爭主管機關嘅自主、增加佢哋嘅權力", "q": "Secondly, a network without states more effectively preserves NCAs’ autonomy, enhancing their power (NCAs are often independent).", "loc": "GuidiTavaresTownley2022 p.4"}, {"id": 84, "n": "02", "s": 3, "t": "evaluation", "f": "ICN 嘅「卓越標準」係咪價值中立？", "b": "Guidi、Tavares 同 Townley 認為 ICN 追求卓越標準同程序被包裝成價值中立，但其實唔係", "q": "The ICN’s hunt for “Superior standards and procedures” is dressed up as value-neutral. It is not.", "loc": "GuidiTavaresTownley2022 p.4"}, {"id": 85, "n": "02", "s": 3, "t": "fact", "f": "2018 年問卷：幾多回應者覺得督導小組成員對議程影響更大？", "b": "Guidi、Tavares 同 Townley 嘅 2018 年問卷顯示 86% 回應者認為 ICN 督導小組成員對 ICN 議程有更大影響力", "q": "Eighty-six per cent of respondents answered that members of the Steering Group have more influence than other members on the ICN agenda.", "loc": "GuidiTavaresTownley2022 p.5"}, {"id": 86, "n": "02", "s": 3, "t": "fact", "f": "ICN 督導小組成員主要喺幾多個司法管轄區之間輪流？", "b": "Guidi、Tavares 同 Townley 指出 ICN 督導小組成員主要喺大約二十個司法管轄區之間輪流", "q": "Steering Group membership largely rotates between people from the same twenty or so jurisdictions", "loc": "GuidiTavaresTownley2022 p.6"}, {"id": 87, "n": "02", "s": 3, "t": "fact", "f": "ICN 十四個工作小組主席入面，歐盟同北美佔幾多？", "b": "Guidi、Tavares 同 Townley 指出 ICN 十四個工作小組主席入面歐盟同北美佔八個（57%）", "q": "we see the power of the EU and North America with eight chairs (out of fourteen, this is 57%)", "loc": "GuidiTavaresTownley2022 p.6"}, {"id": 88, "n": "02", "s": 3, "t": "evaluation", "f": "富裕競爭機關畀新興機關嘅培訓，點解好似木馬屠城？", "b": "Guidi、Tavares 同 Townley 認為富裕競爭主管機關畀新興機關嘅培訓同支援有用，但亦好似木馬屠城", "q": "Younger NCAs often find this support helpful, but it is also like a Trojan horse", "loc": "GuidiTavaresTownley2022 p.6"}, {"id": 89, "n": "02", "s": 3, "t": "cause", "f": "網絡成員好多時偏幫乜，而將本國利益放埋一邊？", "b": "Guidi、Tavares 同 Townley 認為網絡成員好多時用專業知識偏幫所屬知識社群嘅諗法，而將本國利益放埋一邊", "q": "network actors use their specialist knowledge to favour ideas from their epistemic community and marginalise their own national interests", "loc": "GuidiTavaresTownley2022 p.7"}, {"id": 90, "n": "02", "s": 3, "t": "fact", "f": "國家可唔可以入 ICN 保護自己嘅利益？", "b": "Guidi、Tavares 同 Townley 指出國家唔准入 ICN 保護自己嘅利益", "q": "And states are not allowed inside the ICN to defend their own interests.", "loc": "GuidiTavaresTownley2022 p.7"}, {"id": 91, "n": "02", "s": 4, "t": "fact", "f": "ICN 最多嘅非政府顧問係邊類？比例係幾多？", "b": "Guidi、Tavares 同 Townley 嘅問卷顯示 ICN 最多嘅非政府顧問係律師行（54%）、大企業（14%）同學者（14%）", "q": "Our survey supports the idea of the predominance of law firms (54%), big businesses (14%) and academics (14%) among the most represented NGAs.", "loc": "GuidiTavaresTownley2022 p.7"}, {"id": 92, "n": "02", "s": 4, "t": "cause", "f": "Wils 話 ICN 非政府顧問入面，邊類聲音最終最大？", "b": "Wils 認為喺 ICN 各類非政府顧問入面，代表大企業觀點同利益嘅聲音最終會最大", "q": "among the different NGAs, those representing (directly or indirectly) the views and interests of big business will end up being most vocal", "loc": "**Wils**, in GuidiTavaresTownley2022 p.8"}, {"id": 93, "n": "02", "s": 4, "t": "fact", "f": "ICN 2004 年拒絕研究濫用支配地位，有代表懷疑係點解？", "b": "Jenny 報告有代表懷疑 ICN 2004 年拒絕研究濫用支配地位，係因為商界非政府顧問唔願意", "q": "Some delegates suspected that the refusal of the ICN to take up the issue of abuse of dominance was due to the reluctance of business-related NGAs", "loc": "**Jenny**, in GuidiTavaresTownley2022 p.8"}, {"id": 94, "n": "02", "s": 5, "t": "conceptual", "f": "ICN 係非正式、成果唔具約束力，可唔可以話明佢影響力細？", "b": "Guidi、Tavares 同 Townley 認為 ICN 係非正式網絡、成果唔具法律約束力，呢件事講唔到佢實際上有幾大能力影響成員採用成果", "q": "the mere fact that the ICN is an informal network and that its working products are not legally binding does not tell us much about its capacity to influence its members to adopt them, in fact", "loc": "GuidiTavaresTownley2022 p.9"}, {"id": 95, "n": "02", "s": 5, "t": "fact", "f": "ICN 嘅工作重點近年由乜轉向乜？", "b": "Guidi、Tavares 同 Townley 指出 ICN 已經由製作工作成果轉向推動成員落實", "q": "the ICN has shifted its focus from the production of work products (which still takes place) towards pushing their implementation", "loc": "GuidiTavaresTownley2022 p.9"}, {"id": 96, "n": "02", "s": 5, "t": "cause", "f": "跨國網絡主要靠邊兩個機制影響成員？", "b": "Guidi、Tavares 同 Townley 認為跨國網絡主要靠自我規管同提升國家遵從能力兩個機制去影響成員", "q": "Transnational networks principally influence through two main mechanisms: self-regulation and improving the capacity of states to comply.", "loc": "GuidiTavaresTownley2022 p.9"}, {"id": 97, "n": "02", "s": 5, "t": "cause", "f": "律師同說客引用 ICN 文件，有咩「第二層效應」？", "b": "Guidi、Tavares 同 Townley 認為 ICN 文件被律師同說客引用，可以移動辯論嘅正當邊界、界定乜嘢係最佳做法", "q": "to move the legitimate parameters of the debate, to define “best practice.”", "loc": "GuidiTavaresTownley2022 p.10"}, {"id": 98, "n": "02", "s": 6, "t": "fact", "f": "非政府顧問係唔係 ICN 成員？", "b": "Townley、Guidi 同 Tavares 指出非政府顧問同國際組織唔係 ICN 成員", "q": "Unlike NCAs, NGAs and international organisations are not ICN members.", "loc": "TownleyGuidiTavares2022ULR p.137"}, {"id": 99, "n": "02", "s": 6, "t": "evaluation", "f": "邊個喺 ICN 實際上有不成比例嘅聲音？", "b": "Townley、Guidi 同 Tavares 認為歐美跨國企業同代表佢哋嘅律師喺 ICN 實際上有不成比例嘅聲音", "q": "major EU and US multinationals, and the lawyers that represent them, seem to have a disproportionate voice, in fact", "loc": "TownleyGuidiTavares2022ULR p.137"}, {"id": 100, "n": "02", "s": 6, "t": "fact", "f": "消費者組織同經濟學家各佔 ICN 非政府顧問幾多？", "b": "Townley、Guidi 同 Tavares 嘅問卷顯示消費者組織同經濟學家各只佔 ICN 非政府顧問大約 6%", "q": "Consumer organisations and economists are less present (around 6 per cent each).", "loc": "TownleyGuidiTavares2022ULR p.137"}, {"id": 101, "n": "02", "s": 6, "t": "cause", "f": "跨國企業同律師利用 ICN 影響力想達到乜？", "b": "Townley、Guidi 同 Tavares 認為跨國企業同律師利用 ICN 嘅影響力去改變遊戲規則、令將來對自己有利", "q": "They can also use it to change the ‘rules of the game’, to stack the deck in their favour for the future.", "loc": "TownleyGuidiTavares2022ULR p.138"}, {"id": 102, "n": "02", "s": 6, "t": "conceptual", "f": "非政府顧問影響 ICN 嘅四個機制係乜？", "b": "Townley、Guidi 同 Tavares 提出非政府顧問影響 ICN 嘅四個機制：知識社群同規則技術性、在場、早入局、旋轉門", "q": "epistemic community and the technical nature of rules; presence is something; getting in early; and revolving doors", "loc": "TownleyGuidiTavares2022ULR p.138"}, {"id": 103, "n": "02", "s": 6, "t": "cause", "f": "大企業喺 ICN 討論壓倒性在場、冇乜制衡，有咩風險？", "b": "Townley、Guidi 同 Tavares 認為大企業喺 ICN 討論中壓倒性在場而缺乏制衡，好可能扭曲討論嘅議題", "q": "The overwhelming presence of big business (and the highlighting of their interests, with little counterweight) in these conversations is likely to distort the types of issues discussed", "loc": "TownleyGuidiTavares2022ULR p.138"}, {"id": 104, "n": "02", "s": 6, "t": "fact", "f": "幾多非政府顧問參與過 ICN 文件嘅起草或審閱？", "b": "ICN 資料顯示超過 56% 非政府顧問參與過 ICN 文件嘅起草或審閱", "q": "Over 56 per cent of NGAs said they were involved in drafting (on why this matters see below) or reviewing.", "loc": "**ICN**, in TownleyGuidiTavares2022ULR p.139"}, {"id": 105, "n": "02", "s": 6, "t": "evaluation", "f": "非政府顧問冇法律權力，點解仍然可能有權力？", "b": "Townley、Guidi 同 Tavares 認為非政府顧問喺 ICN 冇法律權力，但在場好可能畀佢哋事實上嘅權力", "q": "NGAs’ presence likely gives them power, in fact", "loc": "TownleyGuidiTavares2022ULR p.139"}, {"id": 106, "n": "02", "s": 6, "t": "fact", "f": "幾多非政府顧問覺得早期參與起草重要？", "b": "Townley、Guidi 同 Tavares 嘅問卷顯示 77% 非政府顧問認為早期參與起草重要或非常重要", "q": "77 per cent of our NGA respondents considered being involved in drafting at early stages as either ‘important’ or ‘very important’", "loc": "TownleyGuidiTavares2022ULR p.139"}, {"id": 107, "n": "02", "s": 6, "t": "cause", "f": "「旋轉門」點樣影響競爭機關職員？", "b": "Townley、Guidi 同 Tavares 認為競爭主管機關職員預期離職後嘅工作機會，可能令佢哋有意無意遷就非政府顧問嘅論點", "q": "This might incentivise them (whether this is intentional or not) to seek out and show deference to NGAs’ arguments, in their NCA work.", "loc": "TownleyGuidiTavares2022ULR p.140"}, {"id": 108, "n": "02", "s": 6, "t": "evaluation", "f": "作者點評 ICN 嘅「卓越標準同程序」？", "b": "Townley、Guidi 同 Tavares 認為 ICN 嘅「卓越標準同程序」被包裝成價值中立，但其實唔係", "q": "‘Superior standards and procedures’ are dressed up as value neutral. They are not.", "loc": "TownleyGuidiTavares2022ULR p.140"}, {"id": 109, "n": "02", "s": 6, "t": "fact", "f": "ICN 嘅新角力場係乜？", "b": "Townley、Guidi 同 Tavares 指出將 ICN 重新聚焦落實現有工作成果，正成為新嘅角力場", "q": "(Re)focusing the ICN on the implementation of its existing work products is becoming the new battleground.", "loc": "TownleyGuidiTavares2022ULR p.140"}, {"id": 110, "n": "03", "s": 1, "t": "normative", "f": "評 ICN 正當性，作者主張定一個標準定畀一套工具箱？", "b": "Guidi、Tavares 同 Townley 認為與其定一個正當性標準，不如畀國家一套工具箱，由佢哋自己評估 ICN 嘅正當性", "q": "we consider it more useful to provide states (and others) with a toolbox that they can use to make their own legitimacy assessments", "loc": "GuidiTavaresTownley2022 p.10"}, {"id": 111, "n": "03", "s": 1, "t": "conceptual", "f": "效能同效率屬於邊種正當性？可唔可以補償輸入正當性？", "b": "Guidi、Tavares 同 Townley 認為效能同效率係兩種輸出正當性，可以喺某程度上補償輸入正當性嘅不足", "q": "Effectiveness and efficiency are two kinds of “output legitimacy” that might be able to compensate, to some degree, for a lack of “input legitimacy.”", "loc": "GuidiTavaresTownley2022 p.14"}, {"id": 112, "n": "03", "s": 2, "t": "evaluation", "f": "邊啲競爭機關成立或加入 ICN 時越權？", "b": "Guidi、Tavares 同 Townley 認為英國同歐盟（DG COMP）嘅競爭主管機關成立或加入 ICN 時越權", "q": "we believe that the NCAs from the UK and the EU (DG COMP) acted outside of their powers", "loc": "GuidiTavaresTownley2022 p.10"}, {"id": 113, "n": "03", "s": 2, "t": "fact", "f": "葡萄牙競爭機關點解唔越權？", "b": "Guidi、Tavares 同 Townley 指出葡萄牙法例畀葡萄牙競爭主管機關一般而明確嘅授權，參加國際組織唔使國會或政府另外批准", "q": "These provisions give the Portuguese NCA a general, explicit legal mandate to join and participate in international bodies without any need for further, specific authorisation either from the national Parliament or the national government.", "loc": "GuidiTavaresTownley2022 p.11"}, {"id": 114, "n": "03", "s": 2, "t": "evaluation", "f": "DG COMP「同意」ICN 建議做法嘅程序，達唔達到 TFEU 第 218 條？", "b": "Guidi、Tavares 同 Townley 認為 DG COMP「同意」ICN 建議做法嘅程序遠遠達唔到《歐盟運作條約》第 218 條嘅標準", "q": "The procedures that DG COMP has followed in “agreeing” the ICN recommended practices so far fall far short of the Article 218 TFEU standards", "loc": "GuidiTavaresTownley2022 p.12"}, {"id": 115, "n": "03", "s": 2, "t": "fact", "f": "ICN 同 OECD、UNCTAD 喺成立方式上有咩唔同？", "b": "Guidi、Tavares 同 Townley 指出同 OECD 同 UNCTAD 唔同，ICN 唔係由國家成立，而係由競爭主管機關成立", "q": "unlike the OECD and UNCTAD, the ICN was not created by states themselves (but by NCAs)", "loc": "GuidiTavaresTownley2022 p.10"}, {"id": 116, "n": "03", "s": 2, "t": "evaluation", "f": "ICN 最令人擔心嘅輸入正當性問題係乜？", "b": "Guidi、Tavares 同 Townley 認為 ICN 最令人擔心嘅係連成立時都冇由更廣泛國家利益揀呢條路嘅政治時刻", "q": "What is particularly concerning, though, with the ICN is the lack of a general “political moment,” even at its inception, where wider state interests elected this course", "loc": "GuidiTavaresTownley2022 p.12"}, {"id": 117, "n": "03", "s": 2, "t": "evaluation", "f": "可唔可以用審議民主合理化 ICN？", "b": "Guidi、Tavares 同 Townley 認為用審議民主去合理化 ICN 唔具說服力", "q": "However, a deliberative democracy justification for the ICN is unconvincing.", "loc": "GuidiTavaresTownley2022 p.11"}, {"id": 118, "n": "03", "s": 3, "t": "evaluation", "f": "而家量唔量度到 ICN 成果嘅效能？", "b": "Guidi、Tavares 同 Townley 認為而家冇辦法量度 ICN 工作成果嘅效能", "q": "Our starting point is that measuring the effectiveness of ICN work products is currently impossible.", "loc": "GuidiTavaresTownley2022 p.14"}, {"id": 119, "n": "03", "s": 3, "t": "normative", "f": "要理性咁平衡互相衝突嘅目標，需要乜？", "b": "Guidi、Tavares 同 Townley 認為要理性咁平衡互相衝突嘅目標，就需要一個總目標（meta goal）", "q": "A meta goal is necessary in order to rationally balance conflicting goals.", "loc": "GuidiTavaresTownley2022 p.15"}, {"id": 120, "n": "03", "s": 3, "t": "evaluation", "f": "Gerber 話喺邊啲重大實體範疇，ICN 冇乜推進趨同？", "b": "Gerber 認為喺支配企業行為同縱向限制等重大實體範疇，冇乜證據顯示 ICN 推進咗趨同", "q": "In many major substantive areas such as dominant firm conduct and vertical restrictions, there is little evidence that they have made great strides towards convergence", "loc": "**Gerber**, in GuidiTavaresTownley2022 p.15"}, {"id": 121, "n": "03", "s": 3, "t": "evaluation", "f": "ICN 自稱「以結果為本」，有冇檢查自己活動嘅實證結果？", "b": "Guidi、Tavares 同 Townley 認為 ICN 好少花力氣檢查自己活動嘅實證結果", "q": "the ICN spends very little effort in actually checking the empirical results of its activities", "loc": "GuidiTavaresTownley2022 p.16"}, {"id": 122, "n": "03", "s": 4, "t": "evaluation", "f": "ICN 喺效率上嘅正面係乜？", "b": "Guidi、Tavares 同 Townley 認為網絡（尤其 ICN）係資訊交流嘅高效渠道", "q": "Networks in general, and the ICN in particular, are highly efficient conduits for information sharing.", "loc": "GuidiTavaresTownley2022 p.17"}, {"id": 123, "n": "03", "s": 4, "t": "evaluation", "f": "如果 ICN 得出同 OECD 或 UNCTAD 一樣嘅結論，會惹來咩懷疑？", "b": "Guidi、Tavares 同 Townley 認為如果 ICN 得出同 OECD 或 UNCTAD 一樣嘅結論，就有理由懷疑佢嘅效率同效能", "q": "If the ICN comes to the same conclusions as the OECD or UNCTAD, one wonders whether this is efficient and effective.", "loc": "GuidiTavaresTownley2022 p.17"}, {"id": 124, "n": "03", "s": 4, "t": "conceptual", "f": "點解評估唔到 ICN 嘅效率？", "b": "Guidi、Tavares 同 Townley 認為唔清楚 ICN 想做知情分歧定協調統一，就評估唔到佢嘅效率", "q": "If we do not know precisely what the ICN is trying to achieve (informed divergence or harmonisation), we cannot assess how efficiently it is achieving that end.", "loc": "GuidiTavaresTownley2022 p.18"}, {"id": 125, "n": "03", "s": 5, "t": "conceptual", "f": "Rodrik 嘅三難係乜？", "b": "Rodrik 認為民主、國家自決同經濟全球化三樣冇辦法同時最大化", "q": "Recalling Rodrik’s trilemma, it is impossible to maximise democracy, national determination, and economic globalisation at the same time.", "loc": "**Rodrik**, in GuidiTavaresTownley2022 p.18"}, {"id": 126, "n": "03", "s": 5, "t": "evaluation", "f": "ICN 喺三難入面忽略咗邊兩樣？", "b": "Guidi、Tavares 同 Townley 認為 ICN 好少理國家特色，而且暫時唔容許民主控制", "q": "it gives little weight to national peculiarities, and so far it does not allow for democratic control either", "loc": "GuidiTavaresTownley2022 p.18"}, {"id": 127, "n": "03", "s": 5, "t": "normative", "f": "作者點評 ICN 增加相互依存嘅方式？", "b": "Guidi、Tavares 同 Townley 認為 ICN 喺冇國家民主機構參與、冇向受影響者開放、冇妥善吸納所有成員意見嘅情況下增加相互依存，係唔理想", "q": "That the ICN increases interdependence without involving national democratic actors, without being open to all those affected by its work, and without incorporating properly the input from all its members is, we argue, undesirable.", "loc": "GuidiTavaresTownley2022 p.19"}, {"id": 128, "n": "03", "s": 5, "t": "action", "f": "作者提議國家可以點樣加強對 ICN 嘅政治監督？", "b": "Guidi、Tavares 同 Townley 提出國家甚至可以將 ICN 成員由競爭主管機關改為國家，以加強政治監督", "q": "They might even introduce more political oversight into the ICN (by insisting on a reformulation of its membership from NCAs to states).", "loc": "GuidiTavaresTownley2022 p.19"}, {"id": 129, "n": "06", "s": 1, "t": "fact", "f": "Büthe 同 Mattli 指出規管權力有咩明顯趨勢？", "b": "Büthe 同 Mattli 指出，而家有一個好明顯嘅趨勢：政府將規管權力（regulatory authority）委託畀單一一個國際私營機構，而公營同私營行動者都當呢個機構係該範疇做全球規管嘅理所當然嘅場地", "q": "the delegation of regulatory authority from governments to a single international private-sector body that, for its area of expertise, is viewed by both public and private actors as the obvious forum for global regulation", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 130, "n": "06", "s": 1, "t": "definition", "f": "「焦點機構」係乜？", "b": "Büthe 同 Mattli 將喺某個範疇做全球規則制定嘅嗰個私營機構，叫做「焦點機構」（focal institution）", "q": "such a private body is what we call the focal institution for global rule-making", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 131, "n": "06", "s": 2, "t": "cause", "f": "規管點解同時私營化同國際化？（政府方面）", "b": "Büthe 同 Mattli 認為，規管同時私營化同國際化，部分原因係政府缺乏所需嘅技術專長、財政資源或者靈活性，應付唔到越嚟越複雜同緊急嘅規管工作", "q": "This simultaneous privatization and internationalization of governance is driven, in part, by governments’ lack of requisite technical expertise, financial resources, or flexibility to deal expeditiously with ever more complex and urgent regulatory tasks.", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 132, "n": "06", "s": 2, "t": "cause", "f": "企業點解推動私營治理？", "b": "Büthe 同 Mattli 指出，企業同其他私人行動者成日推動私營治理（private governance），因為佢哋覺得咁樣比政府規管更有效率噉訂出更具成本效益嘅規則", "q": "Firms and other private actors also often push for private governance, which they see as leading to more cost-effective rules more efficiently than government regulation.", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 133, "n": "06", "s": 2, "t": "fact", "f": "ISO 同 IEC 有咩特別？最適合點理解？", "b": "Büthe 同 Mattli 形容，ISO 同 IEC 呢類組織唔准國家同政府本身做成員，最適合理解為由中央協調嘅全球網絡", "q": "These organizations, in which states and governments as such cannot be members, are best described as centrally coordinated global networks", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 134, "n": "06", "s": 2, "t": "fact", "f": "WTO TBT 協定要求成員國點樣用國際標準？", "b": "Büthe 同 Mattli 指出，WTO 嘅《技術性貿易壁壘協定》（TBT Agreement）要求所有成員國用國際標準做本國法律同規例嘅技術基礎", "q": "This agreement obliges all member states of the World Trade Organization (WTO) to use international standards as the technical basis of domestic laws and regulations", "loc": "ButheMattli2011Ch1 p.6"}, {"id": 135, "n": "06", "s": 2, "t": "fact", "f": "用咗國際標準嘅規例，喺 WTO 下有咩法律效果？", "b": "Büthe 同 Mattli 指出，用咗國際標準嘅規例，會被可推翻噉推定（rebuttably presumed）符合該國喺 WTO 下嘅義務", "q": "Regulations that use international standards are rebuttably presumed to be consistent with the country’s WTO obligations", "loc": "ButheMattli2011Ch1 p.6"}, {"id": 136, "n": "06", "s": 3, "t": "evaluation", "f": "財務報告標準國際統一，點解會引發分配衝突？", "b": "Büthe 同 Mattli 認為，財務報告標準國際統一有可觀好處，但會令某啲人承擔重大成本，所以會引發分配衝突（distributional conflicts）", "q": "the international harmonization of financial standards promises substantial benefits but also will bring significant costs for some and hence distributional conflicts", "loc": "ButheMattli2011Ch1 p.5"}, {"id": 137, "n": "06", "s": 3, "t": "fact", "f": "全球私營規管者嘅資金同監督有咩問題？", "b": "Büthe 同 Mattli 指出，呢啲全球私營規管者主要靠私營持份者自願供款，唔受公共監督（public oversight），而寫具體規則嘅專家小組亦唔需要保存會議紀錄", "q": "Financed mostly by voluntary contributions from private-sector stakeholders, they are not subject to public oversight, and the writing of specific rules is in the hands of groups of experts who are not required to keep records of their proceedings.", "loc": "ButheMattli2011Ch1 p.10"}, {"id": 138, "n": "06", "s": 4, "t": "evaluation", "f": "全球規則制定係技術定政治？", "b": "Büthe 同 Mattli 認為，全球規則制定嘅用語係技術性，但本質係政治性", "q": "The language accompanying these processes is technical; the essence of global rule-making, however, is political.", "loc": "ButheMattli2011Ch1 p.12"}, {"id": 139, "n": "06", "s": 4, "t": "conceptual", "f": "專業知識係唔係一套唯一正確嘅信念？", "b": "Büthe 同 Mattli 認為，專業知識（expertise）唔係一套關於乜嘢行得通、乜嘢行唔通嘅唯一正確信念", "q": "expertise is not a single correct set of beliefs about what works or does not", "loc": "ButheMattli2011Ch1 p.11"}, {"id": 140, "n": "06", "s": 4, "t": "fact", "f": "各國國內標準機構喺全球私營規管入面擔當乜角色？", "b": "Büthe 同 Mattli 指出，各國嘅國內標準機構喺某程度上構成咗全球規管者嘅制度骨幹（institutional backbone）", "q": "they form the institutional backbone of the global regulators", "loc": "ButheMattli2011Ch1 p.12"}, {"id": 141, "n": "06", "s": 5, "t": "cause", "f": "技術專長同財政資源，係唔係贏嘅充分條件？", "b": "Büthe 同 Mattli 認為，技術專長同財政資源係成功參與全球私營標準制定嘅必要條件，但唔係充分條件", "q": "technical expertise and financial resources are necessary but not sufficient conditions for successful involvement in global private-sector standardization", "loc": "ButheMattli2011Ch1 p.12"}, {"id": 142, "n": "06", "s": 5, "t": "cause", "f": "邊類企業較大機會喺全球私營標準制定入面贏？點解？", "b": "Büthe 同 Mattli 認為，喺層級分明、協調良好嘅國內體制入面運作嘅企業較大機會贏，因為佢哋嘅體制同只得單一焦點規管者嘅全球結構更自然咁配合", "q": "We argue that firms operating in a hierarchical and coordinated domestic system are likely to win because their system fits more naturally with the global structure, where a single regulator is the clear focal point.", "loc": "ButheMattli2011Ch1 p.13"}, {"id": 143, "n": "06", "s": 5, "t": "cause", "f": "一國喺全球私營治理嘅影響力取決於乜？", "b": "Büthe 同 Mattli 認為，一國喺全球私營治理入面嘅影響力，好大程度取決於佢嘅國內制度同國際層面現行制度結構有幾互補", "q": "influence in global private governance is significantly a function of how complementary a country’s domestic institutions are with the prevailing institutional structure at the international level", "loc": "ButheMattli2011Ch1 p.13"}, {"id": 144, "n": "07", "s": 1, "t": "conceptual", "f": "Kerwer 嘅「實證轉向」係乜意思？", "b": "Kerwer 認為，研究全球監管嘅民主正當性（democratic legitimacy）應該行「實證轉向」（empirical turn）：問題唔係按分析者自己嘅標準，而係按參與嘅行動者嘅標準，去睇一種監管形式係咪正當", "q": "the question is not whether a form of regulation is legitimate according to the criteria of the analyst but rather according to the participant actors", "loc": "Kerwer2005 p.454"}, {"id": 145, "n": "07", "s": 1, "t": "evaluation", "f": "信評機構個案顯示正當性問題伸延到邊度？", "b": "Kerwer 認為，信用評級機構（credit rating agencies, CRAs）嘅個案顯示，全球治理嘅正當性問題唔止出現喺正式嘅非多數決監管者（formal NMRs），仲伸延到非正式嘅非多數決監管者（informal NMRs），而且解決方法有時好難搵", "q": "CRAs suggest that the legitimacy problems of global governance extend beyond formal NMRs to informal NMRs and that solutions sometimes are elusive.", "loc": "Kerwer2005 p.453"}, {"id": 146, "n": "07", "s": 2, "t": "definition", "f": "外部問責同內部問責有咩分別？", "b": "Kerwer 將外部問責關係（external accountability relationship）界定為：委託人（principal）喺層級上唔高過代理人（agent）嘅問責關係，同靠授權同資助建立嘅內部問責唔同", "q": "Such external accountability relationships differ in that the principal is not hierarchically superior to the agent.", "loc": "Kerwer2005 p.457"}, {"id": 147, "n": "07", "s": 2, "t": "definition", "f": "Majone 嘅「委託人—受託人關係」係乜？", "b": "Majone 認為，當委託人授權一個非多數決監管者（NMR）代佢行事、用嚟發出可信承諾（credible commitment）嘅訊號，就成立咗「委託人—受託人關係」（principal–trustee relationship）", "q": "A principal–trustee relationship is established, whenever the principal authorizes an NMR to act on its behalf in order to signal a credible commitment (Majone).", "loc": "**Majone**, in Kerwer2005 p.457"}, {"id": 148, "n": "07", "s": 2, "t": "evaluation", "f": "點解外部問責比內部問責更容易有爭議？", "b": "Kerwer 認為，外部問責關係（external accountability）比內部問責關係更容易受到爭議（contested），因為邊個算委託人、委託人有乜制裁手段都唔清楚", "q": "external accountability relationships are likely to be much more contested than internal accountability relationships", "loc": "Kerwer2005 p.458"}, {"id": 149, "n": "07", "s": 2, "t": "evaluation", "f": "只講內部問責會忽略咗乜？", "b": "Kerwer 認為，只集中討論全球監管嘅內部問責問題，會忽略咗更普遍、更重要嘅外部問責問題", "q": "the focus on internal accountability problems of global regulation neglects the widespread and more important external accountability problems", "loc": "Kerwer2005 p.459"}, {"id": 150, "n": "07", "s": 3, "t": "conceptual", "f": "信評機構嘅評估準則實際上係乜？", "b": "Kerwer 認為，信用評級機構（CRAs）評估信用質素（creditworthiness）用嘅準則，實際上就係進入金融市場嘅准入規則（access rules）", "q": "The criteria CRAs use to evaluate creditworthiness are in effect access rules for financial markets.", "loc": "Kerwer2005 p.462"}, {"id": 151, "n": "07", "s": 3, "t": "cause", "f": "信評機構點解變成具強制性嘅監管者？", "b": "Kerwer 認為，信用評級機構（CRAs）因為喺資本市場取得咗壟斷地位（monopoly position），所以變成具強制性（coercive）嘅監管者", "q": "Furthermore, CRAs have become coercive by having acquired a monopoly position in capital markets (Cantor and Packer).", "loc": "Kerwer2005 p.462"}, {"id": 152, "n": "07", "s": 3, "t": "cause", "f": "公營監管機構喺規管入面用評級，其實係用乜換乜？", "b": "Kerwer 認為，公營金融監管機構喺規管入面使用信用評級（regulatory use of ratings），其實係用控制權換取成效（trading control for effectiveness）", "q": "The answer is that they are actually trading control for effectiveness.", "loc": "Kerwer2005 p.463"}, {"id": 153, "n": "07", "s": 3, "t": "evaluation", "f": "監管機構用評級，令信評機構變成乜？", "b": "Kerwer 認為，監管機構喺規管入面使用信用評級機構（CRAs）嘅評級，會令信用評級機構變成「準公共監管者」（quasipublic regulators）", "q": "The regulatory use of CRAs turns them into quasipublic regulators.", "loc": "Kerwer2005 p.464"}, {"id": 154, "n": "07", "s": 4, "t": "evaluation", "f": "由借款人俾錢做評級，點解係反常？", "b": "Kerwer 認為，由借款人（borrowers）俾錢做評級係一種反常（anomaly），因為呢個資訊產品真正嘅用家係投資者（investors）", "q": "The fact that the borrowers pay for ratings is an anomaly, as the real consumers of this information product are the investors", "loc": "Kerwer2005 p.468"}, {"id": 155, "n": "07", "s": 4, "t": "conceptual", "f": "美國監管機構同信評機構嘅關係較似邊種關係？", "b": "Kerwer 認為，美國監管機構同信用評級機構（CRAs）之間嘅關係，較適合形容為委託人—受託人關係（principal–trustee relationship），而唔係一般嘅委託代理關係", "q": "The relationship between the regulatory agencies and the CRAs can better be described as a principal–trustee relationship.", "loc": "Kerwer2005 p.469"}, {"id": 156, "n": "07", "s": 4, "t": "fact", "f": "信評機構對疏忽嘅法律責任申索有幾大保障？", "b": "Kerwer 指出，信用評級機構（CRAs）對於疏忽行為嘅法律責任申索（liability claims）差唔多完全免疫", "q": "CRAs are, however, virtually immune to liability claims (Husisian).", "loc": "Kerwer2005 p.469"}, {"id": 157, "n": "07", "s": 4, "t": "cause", "f": "持份者點解收唔埋問責缺口？", "b": "Kerwer 認為，持份者（stakeholders）收唔埋佢哋發現嘅問責缺口（accountability gap），原因係佢哋冇足夠權力令信用評級機構（CRAs）問責", "q": "Stakeholders cannot close the accountability gap they have identified, because they do not have the power to hold CRAs accountable.", "loc": "Kerwer2005 p.470"}, {"id": 158, "n": "07", "s": 5, "t": "normative", "f": "Kerwer 主張點樣處理信評機構？", "b": "Kerwer 主張，與其加強信用評級機構（CRAs）嘅問責或者完全廢除佢哋，不如盡可能減輕（mitigate）信用評級機構帶嚟嘅不良影響", "q": "abolishing them entirely is to mitigate the adverse impact of CRAs wherever possible", "loc": "Kerwer2005 p.472"}, {"id": 159, "n": "07", "s": 5, "t": "evaluation", "f": "Kerwer 點樣將信評機構個案推廣？", "b": "Kerwer 認為，凡係全球監管使用非多數決監管者（nonmajoritarian regulators, NMRs），都好可能出現同信用評級機構（CRAs）類似嘅問責問題", "q": "Wherever global regulation uses NMRs, similar accountability problems are likely to arise.", "loc": "Kerwer2005 p.472"}, {"id": 160, "n": "08", "s": 1, "t": "fact", "f": "到 2020 年 1 月，幾多個非洲國家有競爭法？", "b": "Kigwiru 指出，到 2020 年 1 月，54 個非洲國家入面有 37 個已經制定咗競爭法，仲有 17 個未有", "q": "By January 2020, more than half (37 out of 54) of the African countries have enacted competition laws while only 17 countries had not done so.", "loc": "Kigwiru2020 p.103"}, {"id": 161, "n": "08", "s": 1, "t": "cause", "f": "AfCFTA 帶嚟嘅競爭壓力可能引致乜？", "b": "Kigwiru 認為，AfCFTA 帶嚟嘅競爭壓力（competitive pressures）可以誘使成員國同企業做反競爭行為，破壞 AfCFTA 嘅精神", "q": "competitive pressures can provide an inducement for the Member States and business to engage in anti-competitive conduct and thwart the spirit of the AfCFTA", "loc": "Kigwiru2020 p.107"}, {"id": 162, "n": "08", "s": 1, "t": "evaluation", "f": "Kigwiru 點評 AfCFTA 之下嘅競爭政策合作？", "b": "Kigwiru 認為，AfCFTA 之下嘅競爭政策合作係建立一個有競爭力嘅大陸市場嘅不可或缺工具", "q": "Cooperation on competition policy under the AfCFTA, therefore, remains an integral tool in enhancing a competitive continental market.", "loc": "Kigwiru2020 p.107"}, {"id": 163, "n": "08", "s": 1, "t": "fact", "f": "大多數發展中國家（尤其非洲）有冇權力追究國際卡特爾？", "b": "Kigwiru 指出，大多數情況下，發展中國家（尤其非洲）冇執法權力去追究國際卡特爾（international cartels）", "q": "In most cases, developing countries, especially in Africa, have no enforcement power to pursue international cartels.", "loc": "Kigwiru2020 p.110"}, {"id": 164, "n": "08", "s": 2, "t": "definition", "f": "區域競爭制度嘅兩種合作方式係乜？", "b": "Kigwiru 將區域競爭制度採用嘅合作方式分做兩種：自願模式（voluntary）同強制模式（mandatory）", "q": "They are two approaches to cooperation adopted by regional competition regimes: voluntary or mandatory.", "loc": "Kigwiru2020 p.104"}, {"id": 165, "n": "08", "s": 2, "t": "fact", "f": "COMESA、EAC、WAEMU、ECOWAS 同 CEMAC 採用邊種模式？", "b": "Kigwiru 指出，COMESA、EAC、WAEMU、ECOWAS 同 CEMAC 採用強制模式，要求成員國執行區域競爭法", "q": "COMESA, EAC, WAEMU, ECOWAS and CEMAC adopt the mandatory model which obligates the Member States to enforce the regional competition law.", "loc": "Kigwiru2020 p.105"}, {"id": 166, "n": "08", "s": 3, "t": "fact", "f": "非洲採納競爭法，好大程度受乜影響？", "b": "Kigwiru 指出，學術文獻顯示非洲喺國家同區域層面採納競爭法，好大程度上係受外部影響", "q": "Scholarly literature shows that the adoption of competition law in Africa at both national and regional level was to a large extend externally influenced.", "loc": "Kigwiru2020 p.111"}, {"id": 167, "n": "08", "s": 3, "t": "evaluation", "f": "Fox 同 Bakhoum 點睇「世界標準」競爭法？", "b": "Fox 同 Bakhoum 認為（Kigwiru 引述），世界標準嘅競爭法同政策唔啱需要同市場結構都唔同嘅貧窮及發展中國家", "q": "the world standard of competition law and policy does not fit in poor and developing countries with distinct needs and market structures", "loc": "**Fox & Bakhoum**, in Kigwiru2020 p.111"}, {"id": 168, "n": "08", "s": 3, "t": "normative", "f": "Kigwiru 主唔主張將 NAFTA、TPP 模式照搬入 AfCFTA？", "b": "Kigwiru 明確表示，佢唔主張將 NAFTA、TPP 呢類 FTA 競爭條文模式照搬（transplant）入 AfCFTA", "q": "However, this paper does not propose that these models be transplanted into the AfCFTA.", "loc": "Kigwiru2020 p.108"}, {"id": 169, "n": "08", "s": 4, "t": "evaluation", "f": "以 RECs 做 building blocks，同時要處理會籍重疊，有咩問題？", "b": "Kigwiru 認為，保留 RECs 做 AfCFTA 嘅 building blocks，同時又要解決多重會籍重疊，兩者之間有衝突", "q": "There is a conflict between maintaining the RECs as the building blocks of the AfCFTA and at the same time resolving the challenge of multiple overlaps.", "loc": "Kigwiru2020 p.113"}, {"id": 170, "n": "08", "s": 4, "t": "evaluation", "f": "Erasmus 點評「保留既有成果」原則？", "b": "Erasmus 認為（Kigwiru 引述），preservation of acquis 原則冇成為推動自由貿易嘅前瞻機制，反而變成保護現狀嘅限制性工具", "q": "instead of being a forward-looking modality for enhancing free trade, the principle of preservation of acquis has now become a restrictive protector of the status quo", "loc": "**Erasmus**, in Kigwiru2020 p.113"}, {"id": 171, "n": "08", "s": 5, "t": "evaluation", "f": "Framework Agreement 第 4(c) 條用「cooperate」一字，顯示乜？", "b": "Kigwiru 認為，AfCFTA Framework Agreement 第 4(c) 條用「cooperate」呢個字，顯示 AfCFTA 大有可能對大陸競爭政策採軟法（soft law）而唔係硬法", "q": "connotes that, the AfCFTA is likely to adopt a soft approach model to continental competition policy rather than hard law", "loc": "Kigwiru2020 p.116"}, {"id": 172, "n": "08", "s": 5, "t": "evaluation", "f": "喺大陸層面設強制併購審查，Kigwiru 點評？", "b": "Kigwiru 認為，喺大陸層面設立強制併購審查呢種硬法做法雖然為咗法律確定性，但以目前嚟講太過進取（overambitious）", "q": "This hard law approach to merger regulation seeks to ensure legal certainty; however, it is overambitious at the moment.", "loc": "Kigwiru2020 p.116"}, {"id": 173, "n": "08", "s": 5, "t": "fact", "f": "大多數 FTA 點樣處理競爭相關爭議？", "b": "Kigwiru 指出，大多數 FTA 處理競爭相關爭議時都採用非約束性（non-binding）爭議解決機制", "q": "most FTAs adopt a non-binding dispute resolution mechanism when it comes to competition-related disputes", "loc": "Kigwiru2020 p.120"}, {"id": 174, "n": "08", "s": 5, "t": "normative", "f": "如果以軟法合作，Kigwiru 建議設乜？", "b": "Kigwiru 認為，如果成員國以軟法方式合作，喺 AfCFTA 秘書處設一個競爭政策工作小組或委員會係較可取嘅選擇", "q": "then a working group or a committee on competition policy based at the AfCFTA Secretariat will be a preferable option", "loc": "Kigwiru2020 p.121"}];

const NOTES_META={"01": {"t": "走向非正式（Roger）", "q": "國家點解越嚟越多用非正式國際組織？", "read": "走向法律到走向非正式；正式同非正式點分；兩步理論；兩極化同規管型國家；功能論同權力論；錯配；ICN 預告。"}, "04": {"t": "跨政府網絡（Raustiala）", "q": "監管者之間嘅網絡點解興起、點樣運作，同條約係咩關係？", "read": "跨政府網絡同 MOU；三大因素同執法；權力分佈；監管輸出；補充唔取代；正當性同能力。"}, "05": {"t": "知識社群（Haas）", "q": "專家網絡點樣影響國際政策協調？", "read": "技術唔確定；四樣共同嘢；幾時同點樣有影響；同利益團體唔同；限制；點研究。"}, "02": {"t": "ICN 入面邊個話事", "q": "ICN 入面邊個有影響力？唔具約束力嘅成果點樣施壓？", "read": "謎題同原罪；兩面擋箭牌；富裕 NCA；NGA；唔具約束力都有壓力；NGA 四個機制。"}, "03": {"t": "ICN 嘅正當性、效能同效率", "q": "ICN 正唔正當、有冇效、有冇效率？", "read": "工具箱；輸入正當性；效能量唔到；效率同重疊；Rodrik 三難同國家可以點做。"}, "06": {"t": "私營全球規管者（Büthe 同 Mattli）", "q": "規則制定點解私營化同國際化？邊個贏？", "read": "焦點機構；點解私營化、TBT 協定；分配衝突；標準制定係政治；制度互補性。"}, "07": {"t": "信評機構嘅問責（Kerwer）", "q": "全球監管者（信評機構）點樣問責？", "read": "實證轉向；內部同外部問責；點樣變成強制性監管者；問責缺口；出路。"}, "08": {"t": "AfCFTA 競爭合作（Kigwiru）", "q": "非洲大陸自由貿易區點樣做競爭政策合作？", "read": "點解要合作；自願定強制；唔照搬；會籍重疊；軟法定硬法。"}};
